<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1405px;height:526px;background:#FFFFFF;" width="1405px" height="526px" viewBox="0 0 1405 526" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="638.178" y="23.563" fill="#000" font-size="14" textLength="122.145" font-weight="700" font-family="Helvetica">MCP architecture</text><text x="641.336" y="38.564" fill="#777" font-size="12" textLength="115.828" font-weight="700" font-family="Helvetica">L'architecture MCP</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0001" data-source-line="20"><rect x="611.5" y="64.459" width="561.318" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="621.5" y="88.99" fill="#000" font-size="15" textLength="35.493" font-weight="700" font-family="Helvetica">MCP</text><text x="621.5" y="103.265" fill="#777" font-size="11" textLength="24.997" font-family="Helvetica">MCP</text><text x="621.5" y="120.449" fill="#000" font-size="15" textLength="541.318" font-family="Helvetica">An open-source standard for connecting AI applications to external systems</text><text x="621.5" y="134.724" fill="#777" font-size="11" textLength="449.072" font-family="Helvetica">Une norme open source pour connecter les applications d'IA à des systèmes externes</text><text x="621.5" y="151.908" fill="#000" font-size="15" textLength="491.067" font-family="Helvetica">Shifts tool definitions and execution from your server to MCP servers</text><text x="621.5" y="166.183" fill="#777" font-size="11" textLength="446.87" font-family="Helvetica">Déplace la définition et l'exécution des outils de votre serveur vers des serveurs MCP</text></g><!--entity CL--><g class="entity" data-qualified-name="CL" id="ent0002" data-source-line="21"><rect x="395.5" y="230.459" width="487.38" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="405.5" y="254.99" fill="#000" font-size="15" textLength="81.372" font-weight="700" font-family="Helvetica">MCP client</text><text x="405.5" y="269.265" fill="#777" font-size="11" textLength="58.33" font-family="Helvetica">Client MCP</text><text x="405.5" y="286.449" fill="#000" font-size="15" textLength="467.38" font-family="Helvetica">The communication bridge between your server and MCP servers</text><text x="405.5" y="300.724" fill="#777" font-size="11" textLength="349.046" font-family="Helvetica">Le pont de communication entre votre serveur et les serveurs MCP</text><text x="405.5" y="317.908" fill="#000" font-size="15" textLength="372.766" font-family="Helvetica">Handles the message exchange and protocol details</text><text x="405.5" y="332.183" fill="#777" font-size="11" textLength="290.152" font-family="Helvetica">Gère l'échange de messages et les détails du protocole</text></g><!--entity TA--><g class="entity" data-qualified-name="TA" id="ent0003" data-source-line="22"><rect x="6" y="396.459" width="394.414" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="420.99" fill="#000" font-size="15" textLength="141.958" font-weight="700" font-family="Helvetica">Transport agnostic</text><text x="16" y="435.265" fill="#777" font-size="11" textLength="131.979" font-family="Helvetica">Indépendant du transport</text><text x="16" y="452.449" fill="#000" font-size="15" textLength="374.414" font-family="Helvetica">Most common: same machine, standard input/output</text><text x="16" y="466.724" fill="#777" font-size="11" textLength="309.934" font-family="Helvetica">Le plus courant : la même machine, l'entrée/sortie standard</text><text x="16" y="483.908" fill="#000" font-size="15" textLength="353.086" font-family="Helvetica">Also HTTP, WebSockets, other network protocols</text><text x="16" y="498.183" fill="#777" font-size="11" textLength="279.281" font-family="Helvetica">Aussi HTTP, WebSockets, d'autres protocoles réseau</text></g><!--entity MT--><g class="entity" data-qualified-name="MT" id="ent0004" data-source-line="23"><rect x="418.5" y="396.459" width="479.265" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="428.5" y="420.99" fill="#000" font-size="15" textLength="113.525" font-weight="700" font-family="Helvetica">Message types</text><text x="428.5" y="435.265" fill="#777" font-size="11" textLength="104.376" font-family="Helvetica">Types de messages</text><text x="428.5" y="452.449" fill="#000" font-size="15" textLength="437.761" font-family="Helvetica">ListToolsRequest/ListToolsResult: what tools do you provide?</text><text x="428.5" y="466.724" fill="#777" font-size="11" textLength="326.847" font-family="Helvetica">ListToolsRequest/ListToolsResult : « Quels outils fournis-tu ? »</text><text x="428.5" y="483.908" fill="#000" font-size="15" textLength="459.265" font-family="Helvetica">CallToolRequest/CallToolResult: run a tool with given arguments</text><text x="428.5" y="498.183" fill="#777" font-size="11" textLength="403.181" font-family="Helvetica">CallToolRequest/CallToolResult : exécute un outil avec les arguments fournis</text></g><!--entity SV--><g class="entity" data-qualified-name="SV" id="ent0005" data-source-line="24"><rect x="900.5" y="214.459" width="488.545" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="910.5" y="238.99" fill="#000" font-size="15" textLength="87.656" font-weight="700" font-family="Helvetica">MCP server</text><text x="910.5" y="253.265" fill="#777" font-size="11" textLength="68.943" font-family="Helvetica">Serveur MCP</text><text x="910.5" y="270.449" fill="#000" font-size="15" textLength="468.545" font-family="Helvetica">Access to data or functionality implemented by an outside service</text><text x="910.5" y="284.724" fill="#777" font-size="11" textLength="338.083" font-family="Helvetica">L'accès aux données ou aux fonctionnalités d'un service externe</text><text x="910.5" y="301.908" fill="#000" font-size="15" textLength="272.6" font-family="Helvetica">Exposes tools, resources and prompts</text><text x="910.5" y="316.183" fill="#777" font-size="11" textLength="259.225" font-family="Helvetica">Expose des outils, des ressources et des prompts</text><text x="910.5" y="333.367" fill="#000" font-size="15" textLength="306.584" font-family="Helvetica">Runs the tool and makes the actual API call</text><text x="910.5" y="347.642" fill="#777" font-size="11" textLength="260.831" font-family="Helvetica">Exécute l'outil et effectue lui-même l'appel à l'API</text></g><!--entity TU--><g class="entity" data-qualified-name="TU" id="ent0006" data-source-line="25"><rect x="934.5" y="396.459" width="420.54" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="944.5" y="420.99" fill="#000" font-size="15" textLength="64.834" font-weight="700" font-family="Helvetica">Tool use</text><text x="944.5" y="435.265" fill="#777" font-size="11" textLength="92.807" font-family="Helvetica">Utilisation d'outils</text><text x="944.5" y="452.449" fill="#000" font-size="15" textLength="400.54" font-family="Helvetica">How Claude calls the tools: Claude decides it needs one</text><text x="944.5" y="466.724" fill="#777" font-size="11" textLength="375.885" font-family="Helvetica">La façon dont Claude appelle les outils : Claude décide qu'il en a besoin</text><text x="944.5" y="483.908" fill="#000" font-size="15" textLength="398.24" font-family="Helvetica">Complementary to MCP servers, but a different concept</text><text x="944.5" y="498.183" fill="#777" font-size="11" textLength="324.473" font-family="Helvetica">Complémentaire des serveurs MCP, mais un concept différent</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="725.601,230.322,735.329,228.783,729.797,227.603,730.977,222.07,725.601,230.322" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M805.286,178.669 C779.538,195.359 755.537,210.917 729.797,227.603" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk8" data-link-type="dependency"><polygon points="1033.809,214.383,1028.433,206.131,1029.613,211.663,1024.081,212.844,1033.809,214.383" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M978.714,178.669 C996.452,190.167 1011.155,199.698 1029.613,211.663" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="352.069,396.387,361.901,396.963,356.749,394.627,359.084,389.475,352.069,396.387" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M489.868,344.554 C445.357,361.297 401.256,377.886 356.749,394.627" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="651.481,396.193,654.419,386.793,650.906,391.227,646.472,387.714,651.481,396.193" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M645.539,344.898 C647.46,361.484 648.986,374.652 650.906,391.227" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="1145,396.199,1149,387.199,1145,391.199,1141,387.199,1145,396.199" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1145,360.869 C1145,372.711 1145,379.822 1145,391.199" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plant
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1856px;height:526px;background:#FFFFFF;" width="1856px" height="526px" viewBox="0 0 1856 526" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="863.678" y="23.563" fill="#000" font-size="14" textLength="122.145" font-weight="700" font-family="Helvetica">MCP architecture</text><text x="866.836" y="38.564" fill="#777" font-size="12" textLength="115.828" font-weight="700" font-family="Helvetica">L'architecture MCP</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0001" data-source-line="20"><rect x="620.5" y="64.459" width="561.318" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="630.5" y="88.99" fill="#000" font-size="15" textLength="35.493" font-weight="700" font-family="Helvetica">MCP</text><text x="630.5" y="103.265" fill="#777" font-size="11" textLength="24.997" font-family="Helvetica">MCP</text><text x="630.5" y="120.449" fill="#000" font-size="15" textLength="541.318" font-family="Helvetica">An open-source standard for connecting AI applications to external systems</text><text x="630.5" y="134.724" fill="#777" font-size="11" textLength="449.072" font-family="Helvetica">Une norme open source pour connecter les applications d'IA à des systèmes externes</text><text x="630.5" y="151.908" fill="#000" font-size="15" textLength="491.067" font-family="Helvetica">Shifts tool definitions and execution from your server to MCP servers</text><text x="630.5" y="166.183" fill="#777" font-size="11" textLength="446.87" font-family="Helvetica">Déplace la définition et l'exécution des outils de votre serveur vers des serveurs MCP</text></g><!--entity CL--><g class="entity" data-qualified-name="CL" id="ent0002" data-source-line="21"><rect x="404.5" y="230.459" width="487.38" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="414.5" y="254.99" fill="#000" font-size="15" textLength="81.372" font-weight="700" font-family="Helvetica">MCP client</text><text x="414.5" y="269.265" fill="#777" font-size="11" textLength="58.33" font-family="Helvetica">Client MCP</text><text x="414.5" y="286.449" fill="#000" font-size="15" textLength="467.38" font-family="Helvetica">The communication bridge between your server and MCP servers</text><text x="414.5" y="300.724" fill="#777" font-size="11" textLength="349.046" font-family="Helvetica">Le pont de communication entre votre serveur et les serveurs MCP</text><text x="414.5" y="317.908" fill="#000" font-size="15" textLength="372.766" font-family="Helvetica">Handles the message exchange and protocol details</text><text x="414.5" y="332.183" fill="#777" font-size="11" textLength="290.152" font-family="Helvetica">Gère l'échange de messages et les détails du protocole</text></g><!--entity TA--><g class="entity" data-qualified-name="TA" id="ent0003" data-source-line="22"><rect x="6" y="396.459" width="394.414" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="420.99" fill="#000" font-size="15" textLength="141.958" font-weight="700" font-family="Helvetica">Transport agnostic</text><text x="16" y="435.265" fill="#777" font-size="11" textLength="131.979" font-family="Helvetica">Indépendant du transport</text><text x="16" y="452.449" fill="#000" font-size="15" textLength="374.414" font-family="Helvetica">Most common: same machine, standard input/output</text><text x="16" y="466.724" fill="#777" font-size="11" textLength="309.934" font-family="Helvetica">Le plus courant : la même machine, l'entrée/sortie standard</text><text x="16" y="483.908" fill="#000" font-size="15" textLength="353.086" font-family="Helvetica">Also HTTP, WebSockets, other network protocols</text><text x="16" y="498.183" fill="#777" font-size="11" textLength="279.281" font-family="Helvetica">Aussi HTTP, WebSockets, d'autres protocoles réseau</text></g><!--entity MT--><g class="entity" data-qualified-name="MT" id="ent0004" data-source-line="23"><rect x="418.5" y="396.459" width="479.265" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="428.5" y="420.99" fill="#000" font-size="15" textLength="113.525" font-weight="700" font-family="Helvetica">Message types</text><text x="428.5" y="435.265" fill="#777" font-size="11" textLength="104.376" font-family="Helvetica">Types de messages</text><text x="428.5" y="452.449" fill="#000" font-size="15" textLength="437.761" font-family="Helvetica">ListToolsRequest/ListToolsResult: what tools do you provide?</text><text x="428.5" y="466.724" fill="#777" font-size="11" textLength="326.847" font-family="Helvetica">ListToolsRequest/ListToolsResult : « Quels outils fournis-tu ? »</text><text x="428.5" y="483.908" fill="#000" font-size="15" textLength="459.265" font-family="Helvetica">CallToolRequest/CallToolResult: run a tool with given arguments</text><text x="428.5" y="498.183" fill="#777" font-size="11" textLength="403.181" font-family="Helvetica">CallToolRequest/CallToolResult : exécute un outil avec les arguments fournis</text></g><!--entity SV--><g class="entity" data-qualified-name="SV" id="ent0005" data-source-line="24"><rect x="909.5" y="214.459" width="488.545" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="919.5" y="238.99" fill="#000" font-size="15" textLength="87.656" font-weight="700" font-family="Helvetica">MCP server</text><text x="919.5" y="253.265" fill="#777" font-size="11" textLength="68.943" font-family="Helvetica">Serveur MCP</text><text x="919.5" y="270.449" fill="#000" font-size="15" textLength="468.545" font-family="Helvetica">Access to data or functionality implemented by an outside service</text><text x="919.5" y="284.724" fill="#777" font-size="11" textLength="338.083" font-family="Helvetica">L'accès aux données ou aux fonctionnalités d'un service externe</text><text x="919.5" y="301.908" fill="#000" font-size="15" textLength="272.6" font-family="Helvetica">Exposes tools, resources and prompts</text><text x="919.5" y="316.183" fill="#777" font-size="11" textLength="259.225" font-family="Helvetica">Expose des outils, des ressources et des prompts</text><text x="919.5" y="333.367" fill="#000" font-size="15" textLength="306.584" font-family="Helvetica">Runs the tool and makes the actual API call</text><text x="919.5" y="347.642" fill="#777" font-size="11" textLength="260.831" font-family="Helvetica">Exécute l'outil et effectue lui-même l'appel à l'API</text></g><!--entity TU--><g class="entity" data-qualified-name="TU" id="ent0006" data-source-line="25"><rect x="934.5" y="396.459" width="420.54" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="944.5" y="420.99" fill="#000" font-size="15" textLength="64.834" font-weight="700" font-family="Helvetica">Tool use</text><text x="944.5" y="435.265" fill="#777" font-size="11" textLength="92.807" font-family="Helvetica">Utilisation d'outils</text><text x="944.5" y="452.449" fill="#000" font-size="15" textLength="400.54" font-family="Helvetica">How Claude calls the tools: Claude decides it needs one</text><text x="944.5" y="466.724" fill="#777" font-size="11" textLength="375.885" font-family="Helvetica">La façon dont Claude appelle les outils : Claude décide qu'il en a besoin</text><text x="944.5" y="483.908" fill="#000" font-size="15" textLength="398.24" font-family="Helvetica">Complementary to MCP servers, but a different concept</text><text x="944.5" y="498.183" fill="#777" font-size="11" textLength="324.473" font-family="Helvetica">Complémentaire des serveurs MCP, mais un concept différent</text></g><!--entity SDK--><g class="entity" data-qualified-name="SDK" id="ent0007" data-source-line="26"><rect x="1373.5" y="396.459" width="466.719" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1383.5" y="420.99" fill="#000" font-size="15" textLength="128.32" font-weight="700" font-family="Helvetica">MCP Python SDK</text><text x="1383.5" y="435.265" fill="#777" font-size="11" textLength="106.219" font-family="Helvetica">SDK Python de MCP</text><text x="1383.5" y="452.449" fill="#000" font-size="15" textLength="446.719" font-family="Helvetica">Define tools with decorators, no JSON schema written by hand</text><text x="1383.5" y="466.724" fill="#777" font-size="11" textLength="387.261" font-family="Helvetica">Définir des outils avec des décorateurs, sans schéma JSON écrit à la main</text><text x="1383.5" y="483.908" fill="#000" font-size="15" textLength="428.818" font-family="Helvetica">Generates the schema from type hints and field descriptions</text><text x="1383.5" y="498.183" fill="#777" font-size="11" textLength="420.621" font-family="Helvetica">Génère le schéma à partir des indications de type et des descriptions de champs</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="734.601,230.322,744.329,228.783,738.797,227.603,739.977,222.07,734.601,230.322" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M814.286,178.669 C788.538,195.359 764.537,210.917 738.797,227.603" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="1042.809,214.383,1037.433,206.131,1038.613,211.663,1033.081,212.844,1042.809,214.383" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M987.714,178.669 C1005.452,190.167 1020.155,199.698 1038.613,211.663" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="355.146,396.387,364.974,397.028,359.838,394.658,362.208,389.522,355.146,396.387" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M495.79,344.554 C450.36,361.297 405.264,377.917 359.838,394.658" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="654.569,396.193,658.014,386.967,654.265,391.203,650.029,387.454,654.569,396.193" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M651.441,344.898 C652.453,361.484 653.254,374.628 654.265,391.203" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="1148.087,396.199,1152.575,387.431,1148.361,391.206,1144.587,386.993,1148.087,396.199" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1150.026,360.869 C1149.376,372.711 1148.986,379.83 1148.361,391.206" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="1452.274,396.443,1445.173,389.618,1447.572,394.741,1442.45,397.141,1452.274,396.443" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1353.022,360.511 C1386.279,372.551 1415.636,383.179 1447.572,394.741" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src XLTDKnj74BthLtJCGJ4bZC5nEQ4eNB84XXWSOWdxuikmsq9JpCwiPsOHSYh_9RUOv2VaPlsnl9dTbGJIshfeFsPUl-xNqztRfdUiKxQSqaJwCPqheVt5sMc7NCPUQ45AJ4tXwKTjwBKL-VX6VYRDd7Bw-4dhXzoAgso-gDhJQhbhgNDXHKOfZqIX_97H_gt8c8vPtR2NYLXQuyOYDHEfhsWabEEbDzOKEkqPgzdIpkxIYwwrPj8pobZQU1v_oxiu0OqhnVH7Y-YLiN2mMdiKVtWQ20taPwQTvwq_M_lEJnKVjExlF9DQPaNsGQQ8pEwpfs7XThMovQ
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2907px;height:708px;background:#FFFFFF;" width="2907px" height="708px" viewBox="0 0 2907 708" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1388.928" y="23.563" fill="#000" font-size="14" textLength="122.145" font-weight="700" font-family="Helvetica">MCP architecture</text><text x="1392.086" y="38.564" fill="#777" font-size="12" textLength="115.828" font-weight="700" font-family="Helvetica">L'architecture MCP</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0001" data-source-line="20"><rect x="1250.5" y="64.459" width="561.318" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1260.5" y="88.99" fill="#000" font-size="15" textLength="35.493" font-weight="700" font-family="Helvetica">MCP</text><text x="1260.5" y="103.265" fill="#777" font-size="11" textLength="24.997" font-family="Helvetica">MCP</text><text x="1260.5" y="120.449" fill="#000" font-size="15" textLength="541.318" font-family="Helvetica">An open-source standard for connecting AI applications to external systems</text><text x="1260.5" y="134.724" fill="#777" font-size="11" textLength="449.072" font-family="Helvetica">Une norme open source pour connecter les applications d'IA à des systèmes externes</text><text x="1260.5" y="151.908" fill="#000" font-size="15" textLength="491.067" font-family="Helvetica">Shifts tool definitions and execution from your server to MCP servers</text><text x="1260.5" y="166.183" fill="#777" font-size="11" textLength="446.87" font-family="Helvetica">Déplace la définition et l'exécution des outils de votre serveur vers des serveurs MCP</text></g><!--entity CL--><g class="entity" data-qualified-name="CL" id="ent0002" data-source-line="21"><rect x="671.5" y="230.459" width="487.38" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="681.5" y="254.99" fill="#000" font-size="15" textLength="81.372" font-weight="700" font-family="Helvetica">MCP client</text><text x="681.5" y="269.265" fill="#777" font-size="11" textLength="58.33" font-family="Helvetica">Client MCP</text><text x="681.5" y="286.449" fill="#000" font-size="15" textLength="467.38" font-family="Helvetica">The communication bridge between your server and MCP servers</text><text x="681.5" y="300.724" fill="#777" font-size="11" textLength="349.046" font-family="Helvetica">Le pont de communication entre votre serveur et les serveurs MCP</text><text x="681.5" y="317.908" fill="#000" font-size="15" textLength="372.766" font-family="Helvetica">Handles the message exchange and protocol details</text><text x="681.5" y="332.183" fill="#777" font-size="11" textLength="290.152" font-family="Helvetica">Gère l'échange de messages et les détails du protocole</text></g><!--entity TA--><g class="entity" data-qualified-name="TA" id="ent0003" data-source-line="22"><rect x="6" y="412.459" width="394.414" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="436.99" fill="#000" font-size="15" textLength="141.958" font-weight="700" font-family="Helvetica">Transport agnostic</text><text x="16" y="451.265" fill="#777" font-size="11" textLength="131.979" font-family="Helvetica">Indépendant du transport</text><text x="16" y="468.449" fill="#000" font-size="15" textLength="374.414" font-family="Helvetica">Most common: same machine, standard input/output</text><text x="16" y="482.724" fill="#777" font-size="11" textLength="309.934" font-family="Helvetica">Le plus courant : la même machine, l'entrée/sortie standard</text><text x="16" y="499.908" fill="#000" font-size="15" textLength="353.086" font-family="Helvetica">Also HTTP, WebSockets, other network protocols</text><text x="16" y="514.183" fill="#777" font-size="11" textLength="279.281" font-family="Helvetica">Aussi HTTP, WebSockets, d'autres protocoles réseau</text></g><!--entity MT--><g class="entity" data-qualified-name="MT" id="ent0004" data-source-line="23"><rect x="418.5" y="412.459" width="479.265" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="428.5" y="436.99" fill="#000" font-size="15" textLength="113.525" font-weight="700" font-family="Helvetica">Message types</text><text x="428.5" y="451.265" fill="#777" font-size="11" textLength="104.376" font-family="Helvetica">Types de messages</text><text x="428.5" y="468.449" fill="#000" font-size="15" textLength="437.761" font-family="Helvetica">ListToolsRequest/ListToolsResult: what tools do you provide?</text><text x="428.5" y="482.724" fill="#777" font-size="11" textLength="326.847" font-family="Helvetica">ListToolsRequest/ListToolsResult : « Quels outils fournis-tu ? »</text><text x="428.5" y="499.908" fill="#000" font-size="15" textLength="459.265" font-family="Helvetica">CallToolRequest/CallToolResult: run a tool with given arguments</text><text x="428.5" y="514.183" fill="#777" font-size="11" textLength="403.181" font-family="Helvetica">CallToolRequest/CallToolResult : exécute un outil avec les arguments fournis</text></g><!--entity SV--><g class="entity" data-qualified-name="SV" id="ent0005" data-source-line="24"><rect x="1645.5" y="214.459" width="488.545" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1655.5" y="238.99" fill="#000" font-size="15" textLength="87.656" font-weight="700" font-family="Helvetica">MCP server</text><text x="1655.5" y="253.265" fill="#777" font-size="11" textLength="68.943" font-family="Helvetica">Serveur MCP</text><text x="1655.5" y="270.449" fill="#000" font-size="15" textLength="468.545" font-family="Helvetica">Access to data or functionality implemented by an outside service</text><text x="1655.5" y="284.724" fill="#777" font-size="11" textLength="338.083" font-family="Helvetica">L'accès aux données ou aux fonctionnalités d'un service externe</text><text x="1655.5" y="301.908" fill="#000" font-size="15" textLength="272.6" font-family="Helvetica">Exposes tools, resources and prompts</text><text x="1655.5" y="316.183" fill="#777" font-size="11" textLength="259.225" font-family="Helvetica">Expose des outils, des ressources et des prompts</text><text x="1655.5" y="333.367" fill="#000" font-size="15" textLength="306.584" font-family="Helvetica">Runs the tool and makes the actual API call</text><text x="1655.5" y="347.642" fill="#777" font-size="11" textLength="260.831" font-family="Helvetica">Exécute l'outil et effectue lui-même l'appel à l'API</text></g><!--entity TU--><g class="entity" data-qualified-name="TU" id="ent0006" data-source-line="25"><rect x="1448.5" y="412.459" width="420.54" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1458.5" y="436.99" fill="#000" font-size="15" textLength="64.834" font-weight="700" font-family="Helvetica">Tool use</text><text x="1458.5" y="451.265" fill="#777" font-size="11" textLength="92.807" font-family="Helvetica">Utilisation d'outils</text><text x="1458.5" y="468.449" fill="#000" font-size="15" textLength="400.54" font-family="Helvetica">How Claude calls the tools: Claude decides it needs one</text><text x="1458.5" y="482.724" fill="#777" font-size="11" textLength="375.885" font-family="Helvetica">La façon dont Claude appelle les outils : Claude décide qu'il en a besoin</text><text x="1458.5" y="499.908" fill="#000" font-size="15" textLength="398.24" font-family="Helvetica">Complementary to MCP servers, but a different concept</text><text x="1458.5" y="514.183" fill="#777" font-size="11" textLength="324.473" font-family="Helvetica">Complémentaire des serveurs MCP, mais un concept différent</text></g><!--entity SDK--><g class="entity" data-qualified-name="SDK" id="ent0007" data-source-line="26"><rect x="1887.5" y="412.459" width="466.719" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1897.5" y="436.99" fill="#000" font-size="15" textLength="128.32" font-weight="700" font-family="Helvetica">MCP Python SDK</text><text x="1897.5" y="451.265" fill="#777" font-size="11" textLength="106.219" font-family="Helvetica">SDK Python de MCP</text><text x="1897.5" y="468.449" fill="#000" font-size="15" textLength="446.719" font-family="Helvetica">Define tools with decorators, no JSON schema written by hand</text><text x="1897.5" y="482.724" fill="#777" font-size="11" textLength="387.261" font-family="Helvetica">Définir des outils avec des décorateurs, sans schéma JSON écrit à la main</text><text x="1897.5" y="499.908" fill="#000" font-size="15" textLength="428.818" font-family="Helvetica">Generates the schema from type hints and field descriptions</text><text x="1897.5" y="514.183" fill="#777" font-size="11" textLength="420.621" font-family="Helvetica">Génère le schéma à partir des indications de type et des descriptions de champs</text></g><!--entity CS--><g class="entity" data-qualified-name="CS" id="ent0008" data-source-line="27"><rect x="916" y="412.459" width="514.458" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="926" y="436.99" fill="#000" font-size="15" textLength="105.535" font-weight="700" font-family="Helvetica">Client session</text><text x="926" y="451.265" fill="#777" font-size="11" textLength="72.424" font-family="Helvetica">Session client</text><text x="926" y="468.449" fill="#000" font-size="15" textLength="494.458" font-family="Helvetica">The actual connection to an MCP server, part of the MCP Python SDK</text><text x="926" y="482.724" fill="#777" font-size="11" textLength="437.352" font-family="Helvetica">La connexion proprement dite à un serveur MCP, fournie par le SDK Python de MCP</text><text x="926" y="499.908" fill="#000" font-size="15" textLength="424.204" font-family="Helvetica">Wrapped in your own class, written to handle all its cleanup</text><text x="926" y="514.183" fill="#777" font-size="11" textLength="387.771" font-family="Helvetica">Encapsulée dans votre propre classe, écrite pour gérer tout son nettoyage</text></g><!--entity INS--><g class="entity" data-qualified-name="INS" id="ent0009" data-source-line="28"><rect x="1892.5" y="578.459" width="457.117" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1902.5" y="602.99" fill="#000" font-size="15" textLength="110.786" font-weight="700" font-family="Helvetica">MCP Inspector</text><text x="1902.5" y="617.265" fill="#777" font-size="11" textLength="77.118" font-family="Helvetica">MCP Inspector</text><text x="1902.5" y="634.449" fill="#000" font-size="15" textLength="437.117" font-family="Helvetica">Tests an MCP server in the browser, without a full application</text><text x="1902.5" y="648.724" fill="#777" font-size="11" textLength="357.86" font-family="Helvetica">Teste un serveur MCP dans le navigateur, sans application complète</text><text x="1902.5" y="665.908" fill="#000" font-size="15" textLength="428.079" font-family="Helvetica">Run with mcp dev; keeps the server state between tool calls</text><text x="1902.5" y="680.183" fill="#777" font-size="11" textLength="395.184" font-family="Helvetica">Se lance avec mcp dev ; conserve l'état du serveur entre les appels d'outils</text></g><!--entity RS--><g class="entity" data-qualified-name="RS" id="ent0010" data-source-line="29"><rect x="2373" y="396.459" width="518.032" height="145.836" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2383" y="420.99" fill="#000" font-size="15" textLength="70.891" font-weight="700" font-family="Helvetica">Resource</text><text x="2383" y="435.265" fill="#777" font-size="11" textLength="55.043" font-family="Helvetica">Ressource</text><text x="2383" y="452.449" fill="#000" font-size="15" textLength="360.571" font-family="Helvetica">Exposes data to clients, like a GET request handler</text><text x="2383" y="466.724" fill="#777" font-size="11" textLength="386.047" font-family="Helvetica">Expose des données aux clients, comme un gestionnaire de requêtes GET</text><text x="2383" y="483.908" fill="#000" font-size="15" textLength="394.387" font-family="Helvetica">Direct (a static URI) or templated (parameters in its URI)</text><text x="2383" y="498.183" fill="#777" font-size="11" textLength="370.632" font-family="Helvetica">Directe (un URI statique) ou paramétrée (des paramètres dans son URI)</text><text x="2383" y="515.367" fill="#000" font-size="15" textLength="498.032" font-family="Helvetica">Read with a ReadResourceRequest, returned in a ReadResourceResult</text><text x="2383" y="529.642" fill="#777" font-size="11" textLength="393.755" font-family="Helvetica">Lue par une ReadResourceRequest, renvoyée dans un ReadResourceResult</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="1125.35,230.457,1135.076,232.007,1130.182,229.17,1133.018,224.276,1125.35,230.457" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1320.3,178.554 C1257.325,195.32 1193.134,212.41 1130.182,229.17" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="1732.342,214.437,1725.818,207.059,1727.794,212.359,1722.494,214.336,1732.342,214.437" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1653.794,178.554 C1679.074,190.103 1701.478,200.338 1727.794,212.359" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk13" data-link-type="dependency"><polygon points="356.436,412.457,366.231,413.481,361.191,410.913,363.
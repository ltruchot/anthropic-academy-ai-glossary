<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2461px;height:509px;background:#FFFFFF;" width="2461px" height="509px" viewBox="0 0 2461 509" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1182.197" y="23.563" fill="#000" font-size="14" textLength="89.605" font-weight="700" font-family="Helvetica">Built-in tools</text><text x="1183.254" y="38.564" fill="#777" font-size="12" textLength="87.492" font-weight="700" font-family="Helvetica">Outils intégrés</text></g><!--cluster CLIENT--><g class="cluster" data-qualified-name="CLIENT" id="ent0002" data-source-line="23"><rect x="1564" y="178.459" width="889" height="307" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="1965.723" y="194.99" fill="#000" font-size="15" textLength="85.554" font-weight="700" font-family="Helvetica">Client tools</text><text x="1975.64" y="209.265" fill="#777" font-size="11" textLength="65.721" font-weight="700" font-family="Helvetica">Outils client</text><text x="1910.176" y="226.449" fill="#000" font-size="15" textLength="196.648" font-weight="700" font-family="Helvetica">Run where your code runs</text><text x="1901.051" y="240.724" fill="#777" font-size="11" textLength="214.897" font-weight="700" font-family="Helvetica">S'exécutent là où s'exécute votre code</text></g><!--cluster SERVER--><g class="cluster" data-qualified-name="SERVER" id="ent0006" data-source-line="29"><rect x="14" y="178.459" width="1066" height="307" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="501.421" y="194.99" fill="#000" font-size="15" textLength="91.157" font-weight="700" font-family="Helvetica">Server tools</text><text x="508.411" y="209.265" fill="#777" font-size="11" textLength="77.177" font-weight="700" font-family="Helvetica">Outils serveur</text><text x="375.818" y="226.449" fill="#000" font-size="15" textLength="342.363" font-weight="700" font-family="Helvetica">Declared in your tools array, run by Anthropic</text><text x="387.137" y="240.724" fill="#777" font-size="11" textLength="319.725" font-weight="700" font-family="Helvetica">Déclarés dans votre tableau tools, exécutés par Anthropic</text></g><!--entity BUILTIN--><g class="entity" data-qualified-name="BUILTIN" id="ent0001" data-source-line="20"><rect x="899.5" y="56.459" width="547.19" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="909.5" y="80.99" fill="#000" font-size="15" textLength="96.006" font-weight="700" font-family="Helvetica">Built-in tools</text><text x="909.5" y="95.265" fill="#777" font-size="11" textLength="75.389" font-family="Helvetica">Outils intégrés</text><text x="909.5" y="112.449" fill="#000" font-size="15" textLength="216.057" font-family="Helvetica">Anthropic ships them pre-built</text><text x="909.5" y="126.724" fill="#777" font-size="11" textLength="189.675" font-family="Helvetica">Anthropic les fournit prêts à l'emploi</text><text x="909.5" y="143.908" fill="#000" font-size="15" textLength="527.19" font-family="Helvetica">You don't write the code, you don't host the sandbox: you declare the tool</text><text x="909.5" y="158.183" fill="#777" font-size="11" textLength="446.494" font-family="Helvetica">Vous n'écrivez pas le code, vous n'hébergez pas le bac à sable : vous déclarez l'outil</text></g><!--entity MANAGED--><g class="entity" data-qualified-name="MANAGED" id="ent0011" data-source-line="36"><rect x="1096" y="386.459" width="451.88" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1106" y="410.99" fill="#000" font-size="15" textLength="267.144" font-weight="700" font-family="Helvetica">Hosted by Anthropic, all the way up</text><text x="1106" y="425.265" fill="#777" font-size="11" textLength="195.873" font-family="Helvetica">Hébergé par Anthropic, jusqu'au bout</text><text x="1106" y="442.449" fill="#000" font-size="15" textLength="431.88" font-family="Helvetica">Managed agents apply it to the entire agent, not just one tool</text><text x="1106" y="456.724" fill="#777" font-size="11" textLength="339.201" font-family="Helvetica">Les agents gérés l'appliquent à tout l'agent, et pas à un seul outil</text></g><!--entity MEMORY--><g class="entity" data-qualified-name="CLIENT.MEMORY" id="ent0003" data-source-line="24"><rect x="1614.5" y="267.459" width="372.603" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1624.5" y="291.99" fill="#000" font-size="15" textLength="61.318" font-weight="700" font-family="Helvetica">Memory</text><text x="1624.5" y="306.265" fill="#777" font-size="11" textLength="60.989" font-family="Helvetica">La mémoire</text><text x="1624.5" y="323.449" fill="#000" font-size="15" textLength="352.603" font-family="Helvetica">Claude reads and writes memory across sessions</text><text x="1624.5" y="337.724" fill="#777" font-size="11" textLength="301.705" font-family="Helvetica">Claude lit et écrit dans la mémoire, d'une session à l'autre</text></g><!--entity BASH--><g class="entity" data-qualified-name="CLIENT.BASH" id="ent0004" data-source-line="25"><rect x="2005.5" y="267.459" width="430.83" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2015.5" y="291.99" fill="#000" font-size="15" textLength="36.899" font-weight="700" font-family="Helvetica">Bash</text><text x="2015.5" y="306.265" fill="#777" font-size="11" textLength="25.685" font-family="Helvetica">Bash</text><text x="2015.5" y="323.449" fill="#000" font-size="15" textLength="410.83" font-family="Helvetica">A persistent bash shell so Claude can execute commands</text><text x="2015.5" y="337.724" fill="#777" font-size="11" textLength="393.196" font-family="Helvetica">Un shell bash persistant, pour que Claude puisse exécuter des commandes</text></g><!--entity SDK--><g class="entity" data-qualified-name="CLIENT.SDK" id="ent0005" data-source-line="26"><rect x="1601.5" y="386.459" width="398.86" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1611.5" y="410.99" fill="#000" font-size="15" textLength="200.999" font-weight="700" font-family="Helvetica">Shipped in the Claude SDK</text><text x="1611.5" y="425.265" fill="#777" font-size="11" textLength="137.393" font-family="Helvetica">Inclus dans le SDK Claude</text><text x="1611.5" y="442.449" fill="#000" font-size="15" textLength="378.86" font-family="Helvetica">The SDK gives you the schema and a sensible runner</text><text x="1611.5" y="456.724" fill="#777" font-size="11" textLength="265.337" font-family="Helvetica">Le SDK vous fournit le schéma et un runner adapté</text></g><!--entity SEARCH--><g class="entity" data-qualified-name="SERVER.SEARCH" id="ent0007" data-source-line="30"><rect x="183.5" y="267.459" width="394.816" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="193.5" y="291.99" fill="#000" font-size="15" textLength="89.319" font-weight="700" font-family="Helvetica">Web search</text><text x="193.5" y="306.265" fill="#777" font-size="11" textLength="93.833" font-family="Helvetica">La recherche web</text><text x="193.5" y="323.449" fill="#000" font-size="15" textLength="361.267" font-family="Helvetica">Searches the internet, returns results with citations</text><text x="193.5" y="337.724" fill="#777" font-size="11" textLength="374.816" font-family="Helvetica">Cherche sur Internet, renvoie des résultats accompagnés de références</text></g><!--entity CODE--><g class="entity" data-qualified-name="SERVER.CODE" id="ent0008" data-source-line="31"><rect x="784" y="267.459" width="280.024" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="794" y="291.99" fill="#000" font-size="15" textLength="117.708" font-weight="700" font-family="Helvetica">Code execution</text><text x="794" y="306.265" fill="#777" font-size="11" textLength="105.859" font-family="Helvetica">L'exécution de code</text><text x="794" y="323.449" fill="#000" font-size="15" textLength="260.024" font-family="Helvetica">Writes and runs Python in a sandbox</text><text x="794" y="337.724" fill="#777" font-size="11" textLength="244.186" font-family="Helvetica">Écrit et exécute du Python dans un bac à sable</text></g><!--entity FETCH--><g class="entity" data-qualified-name="SERVER.FETCH" id="ent0009" data-source-line="32"><rect x="30" y="386.459" width="250.376" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40" y="410.99" fill="#000" font-size="15" textLength="77.322" font-weight="700" font-family="Helvetica">Web fetch</text><text x="40" y="425.265" fill="#777" font-size="11" textLength="106.901" font-family="Helvetica">La récupération web</text><text x="40" y="442.449" fill="#000" font-size="15" textLength="230.376" font-family="Helvetica">Retrieves full content from URLs</text><text x="40" y="456.724" fill="#777" font-size="11" textLength="227.826" font-family="Helvetica">Récupère le contenu complet à partir d'URL</text></g><!--entity RESPONSE--><g class="entity" data-qualified-name="SERVER.RESPONSE" id="ent0010" data-source-line="33"><rect x="298" y="386.459" width="765.95" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="308" y="410.99" fill="#000" font-size="15" textLength="105.33" font-weight="700" font-family="Helvetica">No agent loop</text><text x="308" y="425.265" fill="#777" font-size="11" textLength="116.467" font-family="Helvetica">Pas de boucle d'agent</text><text x="308" y="442.449" fill="#000" font-size="15" textLength="745.95" font-family="Helvetica">The result comes back inside the same response: a server_tool_use block, a tool result block, text blocks</text><text x="308" y="456.724" fill="#777" font-size="11" textLength="589.617" font-family="Helvetica">Le résultat revient dans la même réponse : un bloc server_tool_use, un bloc de résultat d'outil, des blocs de texte</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="775.236,178.218,784.401,174.611,778.744,174.655,778.7,168.998,775.236,178.218" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M899.311,134.4 C871.236,139.136 845.164,144.998 823.609,152.252 C812.831,155.879 803.181,159.855 794.975,164.211 C790.872,166.389 787.13,168.663 783.788,171.036 C782.117,172.223 780.545,173.435 779.079,174.671 C778.346,175.29 777.639,175.915 776.959,176.546 C776.619,176.862 776.286,177.179 775.959,177.498 C775.796,177.657 775.634,177.817 775.474,177.977 C775.395,178.057 778.823,174.575 778.744,174.655" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-link-type="dependency"><polygon points="1563.866,296.706,1557.399,289.278,1559.334,294.593,1554.019,296.528,1563.866,296.706" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1293.314,170.557 C1346.689,195.444 1409.472,224.718 1463.342,249.835 C1490.277,262.394 1514.984,273.914 1535.172,283.327 C1545.267,288.034 1554.231,292.214 1561.78,295.734 C1562.252,295.954 1562.719,296.171 1563.179,296.386 C1563.41,296.493 1559.107,294.487 1559.334,294.593" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0011" id="lnk14" data-link-type="dependency"><polygon points="1095.922,388.192,1087.602,382.922,1090.976,387.463,1086.435,390.837,1095.922,388.192" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1080.708,386.018 C1081.833,386.159 1082.931,386.306 1084,386.459 C1087.942,387.024 1086.972,386.872 10
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2337px;height:456px;background:#FFFFFF;" width="2337px" height="456px" viewBox="0 0 2337 456" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1122.231" y="20.78" fill="#000" font-size="14" textLength="85.538" font-weight="700" font-family="Helvetica">Built-in tools</text><text x="1122.991" y="33.24" fill="#777" font-size="12" textLength="84.018" font-weight="700" font-family="Helvetica">Outils intégrés</text></g><!--cluster CLIENT--><g class="cluster" data-qualified-name="CLIENT" id="ent0002" data-source-line="23"><rect x="1488" y="157" width="841" height="275" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="1867.667" y="170.55" fill="#000" font-size="15" textLength="81.665" font-weight="700" font-family="Helvetica">Client tools</text><text x="1877.023" y="182.47" fill="#777" font-size="11" textLength="62.955" font-weight="700" font-family="Helvetica">Outils client</text><text x="1813.9" y="196.55" fill="#000" font-size="15" textLength="189.199" font-weight="700" font-family="Helvetica">Run where your code runs</text><text x="1807.762" y="208.47" fill="#777" font-size="11" textLength="201.475" font-weight="700" font-family="Helvetica">S'exécutent là où s'exécute votre code</text></g><!--cluster SERVER--><g class="cluster" data-qualified-name="SERVER" id="ent0006" data-source-line="29"><rect x="14" y="157" width="1018" height="275" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="479.648" y="170.55" fill="#000" font-size="15" textLength="86.704" font-weight="700" font-family="Helvetica">Server tools</text><text x="486.012" y="182.47" fill="#777" font-size="11" textLength="73.976" font-weight="700" font-family="Helvetica">Outils serveur</text><text x="359.216" y="196.55" fill="#000" font-size="15" textLength="327.568" font-weight="700" font-family="Helvetica">Declared in your tools array, run by Anthropic</text><text x="371.089" y="208.47" fill="#777" font-size="11" textLength="303.821" font-weight="700" font-family="Helvetica">Déclarés dans votre tableau tools, exécutés par Anthropic</text></g><!--entity BUILTIN--><g class="entity" data-qualified-name="BUILTIN" id="ent0001" data-source-line="20"><rect x="851.5" y="51" width="506.885" height="98" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="861.5" y="72.55" fill="#000" font-size="15" textLength="91.648" font-weight="700" font-family="Helvetica">Built-in tools</text><text x="861.5" y="84.47" fill="#777" font-size="11" textLength="70.308" font-family="Helvetica">Outils intégrés</text><text x="861.5" y="98.55" fill="#000" font-size="15" textLength="198.428" font-family="Helvetica">Anthropic ships them pre-built</text><text x="861.5" y="110.47" fill="#777" font-size="11" textLength="173.905" font-family="Helvetica">Anthropic les fournit prêts à l'emploi</text><text x="861.5" y="124.55" fill="#000" font-size="15" textLength="486.885" font-family="Helvetica">You don't write the code, you don't host the sandbox: you declare the tool</text><text x="861.5" y="136.47" fill="#777" font-size="11" textLength="448.653" font-family="Helvetica">Vous n'écrivez pas le code, vous n'hébergez pas l'environnement isolé : vous déclarez l'outil</text></g><!--entity MANAGED--><g class="entity" data-qualified-name="MANAGED" id="ent0011" data-source-line="36"><rect x="1048.5" y="344" width="422.781" height="72" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1058.5" y="365.55" fill="#000" font-size="15" textLength="254.194" font-weight="700" font-family="Helvetica">Hosted by Anthropic, all the way up</text><text x="1058.5" y="377.47" fill="#777" font-size="11" textLength="181.887" font-family="Helvetica">Hébergé par Anthropic, jusqu'au bout</text><text x="1058.5" y="391.55" fill="#000" font-size="15" textLength="402.781" font-family="Helvetica">Managed agents apply it to the entire agent, not just one tool</text><text x="1058.5" y="403.47" fill="#777" font-size="11" textLength="315.477" font-family="Helvetica">Les agents gérés l'appliquent à tout l'agent, et pas à un seul outil</text></g><!--entity MEMORY--><g class="entity" data-qualified-name="CLIENT.MEMORY" id="ent0003" data-source-line="24"><rect x="1538.5" y="236" width="350.967" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1548.5" y="257.55" fill="#000" font-size="15" textLength="57.517" font-weight="700" font-family="Helvetica">Memory</text><text x="1548.5" y="269.47" fill="#777" font-size="11" textLength="58.078" font-family="Helvetica">La mémoire</text><text x="1548.5" y="283.55" fill="#000" font-size="15" textLength="330.967" font-family="Helvetica">Claude reads and writes memory across sessions</text><text x="1548.5" y="295.47" fill="#777" font-size="11" textLength="251.211" font-family="Helvetica">Claude lit et écrit la mémoire d'une session à l'autre</text></g><!--entity BASH--><g class="entity" data-qualified-name="CLIENT.BASH" id="ent0004" data-source-line="25"><rect x="1907.5" y="236" width="405.21" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1917.5" y="257.55" fill="#000" font-size="15" textLength="36.68" font-weight="700" font-family="Helvetica">Bash</text><text x="1917.5" y="269.47" fill="#777" font-size="11" textLength="25.072" font-family="Helvetica">Bash</text><text x="1917.5" y="283.55" fill="#000" font-size="15" textLength="385.21" font-family="Helvetica">A persistent bash shell so Claude can execute commands</text><text x="1917.5" y="295.47" fill="#777" font-size="11" textLength="368.709" font-family="Helvetica">Un shell bash persistant, pour que Claude puisse exécuter des commandes</text></g><!--entity SDK--><g class="entity" data-qualified-name="CLIENT.SDK" id="ent0005" data-source-line="26"><rect x="1524.5" y="344" width="378.535" height="72" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1534.5" y="365.55" fill="#000" font-size="15" textLength="193.345" font-weight="700" font-family="Helvetica">Shipped in the Claude SDK</text><text x="1534.5" y="377.47" fill="#777" font-size="11" textLength="130.851" font-family="Helvetica">Inclus dans le SDK Claude</text><text x="1534.5" y="391.55" fill="#000" font-size="15" textLength="358.535" font-family="Helvetica">The SDK gives you the schema and a sensible runner</text><text x="1534.5" y="403.47" fill="#777" font-size="11" textLength="250.094" font-family="Helvetica">Le SDK vous fournit le schéma et un runner adapté</text></g><!--entity SEARCH--><g class="entity" data-qualified-name="SERVER.SEARCH" id="ent0007" data-source-line="30"><rect x="166" y="236" width="369.744" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="176" y="257.55" fill="#000" font-size="15" textLength="84.199" font-weight="700" font-family="Helvetica">Web search</text><text x="176" y="269.47" fill="#777" font-size="11" textLength="87.441" font-family="Helvetica">La recherche web</text><text x="176" y="283.55" fill="#000" font-size="15" textLength="335.991" font-family="Helvetica">Searches the internet, returns results with citations</text><text x="176" y="295.47" fill="#777" font-size="11" textLength="349.744" font-family="Helvetica">Cherche sur Internet, renvoie des résultats accompagnés de références</text></g><!--entity CODE--><g class="entity" data-qualified-name="SERVER.CODE" id="ent0008" data-source-line="31"><rect x="724" y="236" width="292.11" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="734" y="257.55" fill="#000" font-size="15" textLength="111.687" font-weight="700" font-family="Helvetica">Code execution</text><text x="734" y="269.47" fill="#777" font-size="11" textLength="97.507" font-family="Helvetica">L'exécution de code</text><text x="734" y="283.55" fill="#000" font-size="15" textLength="245.134" font-family="Helvetica">Writes and runs Python in a sandbox</text><text x="734" y="295.47" fill="#777" font-size="11" textLength="272.11" font-family="Helvetica">Écrit et exécute du Python dans un environnement isolé</text></g><!--entity FETCH--><g class="entity" data-qualified-name="SERVER.FETCH" id="ent0009" data-source-line="32"><rect x="30" y="344" width="250" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40" y="365.55" fill="#000" font-size="15" textLength="71.667" font-weight="700" font-family="Helvetica">Web fetch</text><text x="40" y="377.47" fill="#777" font-size="11" textLength="99.677" font-family="Helvetica">La récupération web</text><text x="40" y="391.55" fill="#000" font-size="15" textLength="215.911" font-family="Helvetica">Retrieves full content from URLs</text><text x="40" y="403.47" fill="#777" font-size="11" textLength="176.365" font-family="Helvetica">Récupère le contenu complet d'URL</text></g><!--entity RESPONSE--><g class="entity" data-qualified-name="SERVER.RESPONSE" id="ent0010" data-source-line="33"><rect x="298.5" y="344" width="717.009" height="72" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="308.5" y="365.55" fill="#000" font-size="15" textLength="99.99" font-weight="700" font-family="Helvetica">No agent loop</text><text x="308.5" y="377.47" fill="#777" font-size="11" textLength="108.518" font-family="Helvetica">Pas de boucle d'agent</text><text x="308.5" y="391.55" fill="#000" font-size="15" textLength="697.009" font-family="Helvetica">The result comes back inside the same response: a server_tool_use block, a tool result block, text blocks</text><text x="308.5" y="403.47" fill="#777" font-size="11" textLength="550.585" font-family="Helvetica">Le résultat revient dans la même réponse : un bloc server_tool_use, un bloc de résultat d'outil, des blocs de texte</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="715.255,156.748,724.482,153.305,718.825,153.248,718.882,147.592,715.255,156.748" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M851.446,113.962 C820.946,118.075 792.238,123.461 768.453,130.505 C756.56,134.027 745.899,137.964 736.859,142.364 C732.34,144.564 728.226,146.879 724.566,149.317 C722.736,150.535 721.02,151.784 719.424,153.065 C718.626,153.705 717.857,154.353 717.12,155.009 C716.751,155.337 716.39,155.666 716.037,155.998 C715.86,156.164 715.685,156.331 715.512,156.498 C715.426,156.581 718.911,153.165 718.825,153.248" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-link-type="dependency"><polygon points="1487.957,260.957,1481.194,253.798,1483.343,259.03,1478.11,261.179,1487.957,260.957" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1219.998,149.034 C1272.418,170.929 1334.568,196.888 1388.029,219.218 C1414.759,230.383 1439.317,240.641 1459.4,249.029 C1469.441,253.224 1478.364,256.951 1485.88,260.09 C1486.35,260.286 1486.814,260.48 1487.273,260.672 C1487.502,260.767 1483.116,258.936 1483.343,259.03" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0011" id="lnk14" data-link-type="dependency"><polygon points="1048.401,345.688,1040.032,340.495,1043.448,345.004,1038.939,348.42,1048.401,345.688" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1032.578,343.57 C1033.747,343.708 1034.888,343.851 1036,344 C1040.096,344.549 1039.28,344.429 1043.448,345.004" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src bLVTRbf74BxdAQRn1Oq5JkqqIeeiIpRWsAh_14wYI9
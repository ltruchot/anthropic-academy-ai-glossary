<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1588px;height:415px;background:#FFFFFF;" width="1588px" height="415px" viewBox="0 0 1588 415" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="772.21" y="20.78" fill="#000" font-size="14" textLength="36.579" font-weight="700" font-family="Helvetica">Skills</text><text x="774.823" y="33.24" fill="#777" font-size="12" textLength="31.354" font-weight="700" font-family="Helvetica">Skills</text></g><!--entity SKILLS--><g class="entity" data-qualified-name="SKILLS" id="ent0001" data-source-line="20"><rect x="540" y="59" width="496.045" height="98" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="550" y="80.55" fill="#000" font-size="15" textLength="39.192" font-weight="700" font-family="Helvetica">Skills</text><text x="550" y="92.47" fill="#777" font-size="11" textLength="25.668" font-family="Helvetica">Skills</text><text x="550" y="106.55" fill="#000" font-size="15" textLength="476.045" font-family="Helvetica">Folders of instructions, scripts, and resources Claude loads dynamically</text><text x="550" y="118.47" fill="#777" font-size="11" textLength="445.382" font-family="Helvetica">Des dossiers d'instructions, de scripts et de ressources que Claude charge dynamiquement</text><text x="550" y="132.55" fill="#000" font-size="15" textLength="182.593" font-family="Helvetica">At the core: a SKILL.md file</text><text x="550" y="144.47" fill="#777" font-size="11" textLength="147.334" font-family="Helvetica">Au cœur : un fichier SKILL.md</text></g><!--entity VSSKILLS--><g class="entity" data-qualified-name="VSSKILLS" id="ent0002" data-source-line="23"><rect x="6" y="206" width="358.169" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="227.55" fill="#000" font-size="15" textLength="39.192" font-weight="700" font-family="Helvetica">Skills</text><text x="16" y="239.47" fill="#777" font-size="11" textLength="46.46" font-family="Helvetica">Les Skills</text><text x="16" y="253.55" fill="#000" font-size="15" textLength="275.171" font-family="Helvetica">Teach a procedure: how you want it done</text><text x="16" y="265.47" fill="#777" font-size="11" textLength="338.169" font-family="Helvetica">Apprennent une procédure : la façon dont vous voulez que ce soit fait</text></g><!--entity VSTOOLS--><g class="entity" data-qualified-name="VSTOOLS" id="ent0003" data-source-line="24"><rect x="382.5" y="206" width="399.424" height="72" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="392.5" y="227.55" fill="#000" font-size="15" textLength="39.998" font-weight="700" font-family="Helvetica">Tools</text><text x="392.5" y="239.47" fill="#777" font-size="11" textLength="46.471" font-family="Helvetica">Les outils</text><text x="392.5" y="253.55" fill="#000" font-size="15" textLength="379.424" font-family="Helvetica">Connect Claude to data and actions: what Claude can do</text><text x="392.5" y="265.47" fill="#777" font-size="11" textLength="378.539" font-family="Helvetica">Connectent Claude à des données et à des actions : ce que Claude peut faire</text></g><!--entity LOAD--><g class="entity" data-qualified-name="LOAD" id="ent0004" data-source-line="26"><rect x="800" y="193" width="387.705" height="98" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="810" y="214.55" fill="#000" font-size="15" textLength="143.379" font-weight="700" font-family="Helvetica">Progressive loading</text><text x="810" y="226.47" fill="#777" font-size="11" textLength="111.885" font-family="Helvetica">Chargement progressif</text><text x="810" y="240.55" fill="#000" font-size="15" textLength="272.659" font-family="Helvetica">At startup: only the name and description</text><text x="810" y="252.47" fill="#777" font-size="11" textLength="220.725" font-family="Helvetica">Au démarrage : seuls le nom et la description</text><text x="810" y="266.55" fill="#000" font-size="15" textLength="367.705" font-family="Helvetica">The full Skill loads when the agent decides it is relevant</text><text x="810" y="278.47" fill="#777" font-size="11" textLength="278.502" font-family="Helvetica">Le Skill complet se charge quand l'agent le juge pertinent</text></g><!--entity ATTACH--><g class="entity" data-qualified-name="ATTACH" id="ent0005" data-source-line="28"><rect x="1206" y="193" width="366.025" height="98" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1216" y="214.55" fill="#000" font-size="15" textLength="220.049" font-weight="700" font-family="Helvetica">Upload once, attach to any call</text><text x="1216" y="226.47" fill="#777" font-size="11" textLength="188.944" font-family="Helvetica">Importer une fois, attacher à tout appel</text><text x="1216" y="240.55" fill="#000" font-size="15" textLength="346.025" font-family="Helvetica">Uploaded once to your workspace, referenced by ID</text><text x="1216" y="252.47" fill="#777" font-size="11" textLength="334.458" font-family="Helvetica">Importé une seule fois dans votre espace de travail, référencé par ID</text><text x="1216" y="266.55" fill="#000" font-size="15" textLength="303.464" font-family="Helvetica">container.skills: a list, so Skills can be layered</text><text x="1216" y="278.47" fill="#777" font-size="11" textLength="276.364" font-family="Helvetica">container.skills : une liste, donc des Skills superposables</text></g><!--entity CODE--><g class="entity" data-qualified-name="CODE" id="ent0006" data-source-line="30"><rect x="1238" y="327" width="302.487" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1248" y="348.55" fill="#000" font-size="15" textLength="216.731" font-weight="700" font-family="Helvetica">Pairs well with code execution</text><text x="1248" y="360.47" fill="#777" font-size="11" textLength="176.65" font-family="Helvetica">S'associe bien à l'exécution de code</text><text x="1248" y="374.55" fill="#000" font-size="15" textLength="269.29" font-family="Helvetica">A procedure can run scripts in a terminal</text><text x="1248" y="386.47" fill="#777" font-size="11" textLength="282.487" font-family="Helvetica">Une procédure peut exécuter des scripts dans un terminal</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="636.878,205.836,646.613,204.348,641.088,203.138,642.297,197.612,636.878,205.836" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M713.047,157.028 C687.853,173.172 664.446,188.171 641.088,203.138" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="319.541,205.98,329.237,207.708,324.396,204.782,327.321,199.941,319.541,205.98" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M541.298,157.011 C486.133,168.315 427.983,180.676 374,193 C356.342,197.031 342.665,200.276 324.396,204.782" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="918.757,192.786,913.337,184.563,914.547,190.089,909.021,191.298,918.757,192.786" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M862.953,157.028 C881.13,168.675 896.358,178.433 914.547,190.089" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="1205.861,195.031,1197.991,189.109,1200.989,193.907,1196.192,196.904,1205.861,195.031" fill="#555" style="stroke:
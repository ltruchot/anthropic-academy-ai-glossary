<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1392px;height:872px;background:#FFFFFF;" width="1392px" height="872px" viewBox="0 0 1392 872" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="604.347" y="23.563" fill="#000" font-size="14" textLength="176.306" font-weight="700" font-family="Helvetica">Choosing the right model</text><text x="627.06" y="38.564" fill="#777" font-size="12" textLength="130.881" font-weight="700" font-family="Helvetica">Choisir le bon modèle</text></g><!--cluster TIERS--><g class="cluster" data-qualified-name="TIERS" id="ent0002" data-source-line="22"><rect x="14" y="178.459" width="400" height="670" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="178.174" y="194.99" fill="#000" font-size="15" textLength="71.653" font-weight="700" font-family="Helvetica">Four tiers</text><text x="170.561" y="209.265" fill="#777" font-size="11" textLength="86.877" font-weight="700" font-family="Helvetica">Quatre gammes</text></g><!--entity MT--><g class="entity" data-qualified-name="MT" id="ent0001" data-source-line="20"><rect x="168.5" y="56.459" width="442.637" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="178.5" y="80.99" fill="#000" font-size="15" textLength="84.36" font-weight="700" font-family="Helvetica">Model tiers</text><text x="178.5" y="95.265" fill="#777" font-size="11" textLength="109.839" font-family="Helvetica">Gammes de modèles</text><text x="178.5" y="112.449" fill="#000" font-size="15" textLength="351.006" font-family="Helvetica">Chosen with the model parameter in your API call</text><text x="178.5" y="126.724" fill="#777" font-size="11" textLength="276.316" font-family="Helvetica">Choisies avec le paramètre model de votre appel API</text><text x="178.5" y="143.908" fill="#000" font-size="15" textLength="422.637" font-family="Helvetica">The right model: the cheapest one whose output you'd ship</text><text x="178.5" y="158.183" fill="#777" font-size="11" textLength="314.521" font-family="Helvetica">Le bon modèle : le moins cher dont vous livreriez la réponse</text></g><!--entity EV--><g class="entity" data-qualified-name="EV" id="ent0007" data-source-line="29"><rect x="430.5" y="386.459" width="436.682" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="440.5" y="410.99" fill="#000" font-size="15" textLength="78.376" font-weight="700" font-family="Helvetica">Evaluation</text><text x="440.5" y="425.265" fill="#777" font-size="11" textLength="54.039" font-family="Helvetica">Évaluation</text><text x="440.5" y="442.449" fill="#000" font-size="15" textLength="416.682" font-family="Helvetica">Before production code: 20 or 30 representative examples</text><text x="440.5" y="456.724" fill="#777" font-size="11" textLength="332.535" font-family="Helvetica">Avant le code de production : 20 ou 30 exemples représentatifs</text><text x="440.5" y="473.908" fill="#000" font-size="15" textLength="347.593" font-family="Helvetica">Haiku first, then Sonnet, Opus only when needed</text><text x="440.5" y="488.183" fill="#777" font-size="11" textLength="303.198" font-family="Helvetica">Haiku d'abord, puis Sonnet, Opus seulement si nécessaire</text><text x="440.5" y="505.367" fill="#000" font-size="15" textLength="362.798" font-family="Helvetica">Input and output tokens (response.usage): your bill</text><text x="440.5" y="519.642" fill="#777" font-size="11" textLength="317.63" font-family="Helvetica">Tokens d'entrée et de sortie (response.usage) : votre facture</text></g><!--entity APP--><g class="entity" data-qualified-name="APP" id="ent0008" data-source-line="31"><rect x="886" y="402.459" width="498.387" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="896" y="426.99" fill="#000" font-size="15" textLength="92.395" font-weight="700" font-family="Helvetica">In a real app</text><text x="896" y="441.265" fill="#777" font-size="11" textLength="137.854" font-family="Helvetica">Dans une vraie application</text><text x="896" y="458.449" fill="#000" font-size="15" textLength="458.958" font-family="Helvetica">Different kinds of work to different models, in the same endpoint</text><text x="896" y="472.724" fill="#777" font-size="11" textLength="478.387" font-family="Helvetica">Différents types de tâches vers différents modèles, au sein d'un même point de terminaison</text><text x="896" y="489.908" fill="#000" font-size="15" textLength="297.078" font-family="Helvetica">One queue, three models, picked per task</text><text x="896" y="504.183" fill="#777" font-size="11" textLength="284.979" font-family="Helvetica">Une file d'attente, trois modèles, choisis selon la tâche</text></g><!--entity FA--><g class="entity" data-qualified-name="TIERS.FA" id="ent0003" data-source-line="23"><rect x="71.5" y="236.459" width="285.444" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="81.5" y="260.99" fill="#000" font-size="15" textLength="39.338" font-family="Helvetica">Fable</text><text x="81.5" y="275.265" fill="#777" font-size="11" textLength="28.848" font-family="Helvetica">Fable</text><text x="81.5" y="292.449" fill="#000" font-size="15" textLength="265.444" font-family="Helvetica">Above Opus, significantly higher cost</text><text x="81.5" y="306.724" fill="#777" font-size="11" textLength="264.661" font-family="Helvetica">Au-dessus d'Opus, d'un coût nettement plus élevé</text><text x="81.5" y="323.908" fill="#000" font-size="15" textLength="182.131" font-family="Helvetica">Your toughest challenges</text><text x="81.5" y="338.183" fill="#777" font-size="11" textLength="124.744" font-family="Helvetica">Vos défis les plus ardus</text></g><!--entity OP--><g class="entity" data-qualified-name="TIERS.OP" id="ent0004" data-source-line="24"><rect x="30.5" y="402.459" width="366.897" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40.5" y="426.99" fill="#000" font-size="15" textLength="37.441" font-family="Helvetica">Opus</text><text x="40.5" y="441.265" fill="#777" font-size="11" textLength="27.457" font-family="Helvetica">Opus</text><text x="40.5" y="458.449" fill="#000" font-size="15" textLength="238.521" font-family="Helvetica">Slowest, highest cost of the three</text><text x="40.5" y="472.724" fill="#777" font-size="11" textLength="204.193" font-family="Helvetica">Le plus lent et le plus coûteux des trois</text><text x="40.5" y="489.908" fill="#000" font-size="15" textLength="346.897" font-family="Helvetica">Hard problems: deep reasoning, nuanced writing</text><text x="40.5" y="504.183" fill="#777" font-size="11" textLength="346.887" font-family="Helvetica">Problèmes difficiles : raisonnement approfondi, rédaction nuancée</text></g><!--entity SO--><g class="entity" data-qualified-name="TIERS.SO" id="ent0005" data-source-line="25"><rect x="58.5" y="568.459" width="311.277" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="68.5" y="592.99" fill="#000" font-size="15" textLength="49.995" font-family="Helvetica">Sonnet</text><text x="68.5" y="607.265" fill="#777" font-size="11" textLength="36.663" font-family="Helvetica">Sonnet</text><text x="68.5" y="624.449" fill="#000" font-size="15" textLength="291.277" font-family="Helvetica">The sweet spot: intelligence, speed, cost</text><text x="68.5" y="638.724" fill="#777" font-size="11" textLength="216.718" font-family="Helvetica">Le juste milieu : intelligence, vitesse, coût</text><text x="68.5" y="655.908" fill="#000" font-size="15" textLength="238.74" font-family="Helvetica">Daily work: most production work</text><text x="68.5" y="670.183" fill="#777" font-size="11" textLength="283.599" font-family="Helvetica">Travail quotidien : la plupart des usages en production</text></g><!--entity HA--><g class="entity" data-qualified-name="TIERS.HA" id="ent0006" data-source-line="26"><rect x="57" y="718.459" width="314.001" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="67" y="742.99" fill="#000" font-size="15" textLength="40.305" font-family="Helvetica">Haiku</text><text x="67" y="757.265" fill="#777" font-size="11" textLength="29.557" font-family="Helvetica">Haiku</text><text x="67" y="774.449" fill="#000" font-size="15" textLength="141.79" font-family="Helvetica">Fastest, lowest cost</text><text x="67" y="788.724" fill="#777" font-size="11" textLength="168.76" font-family="Helvetica">Le plus rapide, le moins coûteux</text><text x="67" y="805.908" fill="#000" font-size="15" textLength="294.001" font-family="Helvetica">Volume: classification, extraction, routing</text><text x="67" y="820.183" fill="#777" font-size="11" textLength="222.122" font-family="Helvetica">Volume : classification, extraction, routage</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-link-type="dependency"><polygon points="390,178.297,394,169.297,390,173.297,386,169.297,390,178.297" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M390,170.779 C390,173.249 390,170.758 390,173.297" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="535.202,386.401,529.738,378.207,530.977,383.726,525.458,384.966,535.202,386.401" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M414.196,309.78 C414.33,309.865 414.466,309.951 414.601,310.037 C414.873,310.208 415.146,310.382 415.421,310.556 C415.971,310.904 416.529,311.257 417.094,311.615 C418.223,312.33 419.381,313.063 420.566,313.814 C430.05,319.819 441.284
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1338px;height:620px;background:#FFFFFF;" width="1338px" height="620px" viewBox="0 0 1338 620" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="605.829" y="23.563" fill="#000" font-size="14" textLength="119.342" font-weight="700" font-family="Helvetica">What is thinking?</text><text x="582.194" y="38.564" fill="#777" font-size="12" textLength="166.611" font-weight="700" font-family="Helvetica">Qu'est-ce que la réflexion ?</text></g><!--cluster OPUS--><g class="cluster" data-qualified-name="OPUS" id="ent0002" data-source-line="22"><rect x="846" y="229.459" width="476" height="367.5" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="1031.137" y="245.99" fill="#000" font-size="15" textLength="105.725" font-weight="700" font-family="Helvetica">With Opus 4.7</text><text x="1043.803" y="260.265" fill="#777" font-size="11" textLength="80.395" font-weight="700" font-family="Helvetica">Avec Opus 4.7</text></g><!--entity EXT--><g class="entity" data-qualified-name="EXT" id="ent0001" data-source-line="20"><rect x="465" y="56.459" width="399.629" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="475" y="80.99" fill="#000" font-size="15" textLength="134.751" font-weight="700" font-family="Helvetica">Extended thinking</text><text x="475" y="95.265" fill="#777" font-size="11" textLength="94.44" font-family="Helvetica">Réflexion étendue</text><text x="475" y="112.449" fill="#000" font-size="15" textLength="379.629" font-family="Helvetica">Claude reasons step by step before its final response</text><text x="475" y="126.724" fill="#777" font-size="11" textLength="294.239" font-family="Helvetica">Claude raisonne étape par étape avant sa réponse finale</text><text x="475" y="143.908" fill="#000" font-size="15" textLength="317.124" font-family="Helvetica">Internal reasoning tokens: a chain of thought</text><text x="475" y="158.183" fill="#777" font-size="11" textLength="317.63" font-family="Helvetica">Des tokens de raisonnement internes : une chaîne de pensée</text><text x="475" y="175.367" fill="#000" font-size="15" textLength="337.617" font-family="Helvetica">The reasoning is visible, alongside the final text</text><text x="475" y="189.642" fill="#777" font-size="11" textLength="240.679" font-family="Helvetica">Le raisonnement est visible, avec le texte final</text></g><!--entity USE--><g class="entity" data-qualified-name="USE" id="ent0005" data-source-line="27"><rect x="6" y="264.959" width="476.167" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="289.49" fill="#000" font-size="15" textLength="42.927" font-weight="700" font-family="Helvetica">Use it</text><text x="16" y="303.765" fill="#777" font-size="11" textLength="44.338" font-family="Helvetica">L'utiliser</text><text x="16" y="320.949" fill="#000" font-size="15" textLength="423.186" font-family="Helvetica">Math, multi-step logic, code debugging, regulatory analysis</text><text x="16" y="335.224" fill="#777" font-size="11" textLength="456.167" font-family="Helvetica">Mathématiques, logique en plusieurs étapes, débogage de code, analyse réglementaire</text><text x="16" y="352.408" fill="#000" font-size="15" textLength="232.039" font-family="Helvetica">Trade-offs or comparing options</text><text x="16" y="366.683" fill="#777" font-size="11" textLength="242.075" font-family="Helvetica">Des compromis ou une comparaison d'options</text><text x="16" y="383.867" fill="#000" font-size="15" textLength="336.27" font-family="Helvetica">In production: an agent that connects problems</text><text x="16" y="398.142" fill="#777" font-size="11" textLength="301.313" font-family="Helvetica">En production : un agent qui relie les problèmes entre eux</text></g><!--entity SKIP--><g class="entity" data-qualified-name="SKIP" id="ent0006" data-source-line="29"><rect x="500" y="280.959" width="329.521" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="510" y="305.49" fill="#000" font-size="15" textLength="46.245" font-weight="700" font-family="Helvetica">Skip it</text><text x="510" y="319.765" fill="#777" font-size="11" textLength="91.754" font-family="Helvetica">La laisser de côté</text><text x="510" y="336.949" fill="#000" font-size="15" textLength="309.521" font-family="Helvetica">Simple classification, extraction, boilerplate</text><text x="510" y="351.224" fill="#777" font-size="11" textLength="241.372" font-family="Helvetica">Classification simple, extraction, code répétitif</text><text x="510" y="368.408" fill="#000" font-size="15" textLength="198.992" font-family="Helvetica">It just adds latency and cost</text><text x="510" y="382.683" fill="#777" font-size="11" textLength="235.984" font-family="Helvetica">Elle ne fait qu'ajouter de la latence et du coût</text></g><!--entity ADAPT--><g class="entity" data-qualified-name="OPUS.ADAPT" id="ent0003" data-source-line="23"><rect x="896.5" y="287.459" width="409.297" height="101.067" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="906.5" y="311.99" fill="#000" font-size="15" textLength="130.774" font-weight="700" font-family="Helvetica">Adaptive thinking</text><text x="906.5" y="326.265" fill="#777" font-size="11" textLength="106.321" font-family="Helvetica">Réflexion adaptative</text><text x="906.5" y="343.449" fill="#000" font-size="15" textLength="206.213" font-family="Helvetica">thinking: {"type": "adaptive"}</text><text x="906.5" y="361.599" fill="#000" font-size="15" textLength="389.297" font-family="Helvetica">No token budget: Claude decides when and how much</text><text x="906.5" y="375.873" fill="#777" font-size="11" textLength="371.508" font-family="Helvetica">Pas de budget de tokens : Claude décide quand, et dans quelle mesure</text></g><!--entity EFFORT--><g class="entity" data-qualified-name="OPUS.EFFORT" id="ent0004" data-source-line="24"><rect x="911.5" y="479.959" width="378.806" height="101.067" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="921.5" y="504.49" fill="#000" font-size="15" textLength="123.779" font-weight="700" font-family="Helvetica">Effort parameter</text><text x="921.5" y="518.765" fill="#777" font-size="11" textLength="85.707" font-family="Helvetica">Paramètre effort</text><text x="921.5" y="535.949" fill="#000" font-size="15" textLength="358.806" font-family="Helvetica">Inside output_config, not next to the thinking block</text><text x="921.5" y="550.224" fill="#777" font-size="11" textLength="261.524" font-family="Helvetica">Dans output_config, et non à côté du bloc thinking</text><text x="921.5" y="567.408" fill="#000" font-size="15" textLength="280.327" font-family="Helvetica">low, medium, high (default), xhigh, max</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="845.972,239.611,844.767,229.836,843.397,235.325,837.909,233.955,845.972,239.611" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M812.899,202.703 C822.503,210.858 831.366,219.766 839,229.459 C840.442,231.29 841.817,233.186 843.128,235.136 C843.784,236.111 844.424,237.1 845.047,238.101 C845.359,238.601 843.093,234.818 843.397,235.325" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="1101,479.822,1105,470.822,1101,474.822,1097,470.822,1101,479.822" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1101,388.513 C1101,416.625 1101,446.697 1101,474.822" style="stroke:#555;stroke-width:1;" fill="none"/><text x="1113.225" y="443.553" fill="#000" font-size="13" textLength="84.259" font-family="Helvetica">dial the depth</text><text x="1103" y="457.345" fill="#777" font-size="11" textLength="104.709" font-family="Helvetica">régler la profondeur</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="391.002,264.855,400.844,264.483,395.491,262.653,397.321,257.3,391.002,264.855" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M518.05,202.538 C476.894,222.725 436.65,242.464 395.491,262.653" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk10" data-link-type="dependency"><polygon points="665,280.72,669,271.72,665,275.72,661,271.72,665,280.72" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M665,202.683 C665,228.27 665,251.66 665,275.72" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src bLPDSnf74BtpAphM0Li1MS9soQ5Kk2G4ZYksfGYhb8EgKiDkx-v8ipFh-K1Wb_vBZkQIKsuvyiVICom80QkgS65sf_jrJ_VhDrk72vGnwZRSi163vWtJK0WchSl5ddzeMZDAmMPStdAPxXNq7fwR72sJh0rImNlDYcp4lu54Z35-iLVxgT0ipHa8Db7EGcbSgnb2A9XcESIOC2TiNqdxcUK8lw8OeUKHMx4n6OlL7SM4X0c3ApjQEHbtbPQeuQ2rid6ijRhhAg4qxBm9lrKlZ2YDL21yhm6SA4sdBctxuKTlVK83_WtXu4tjldPax4HWf_ROynENF7Vv5Ozj1grN-zxmPMbPizoIsLN6B72phDgxQtba2BPzqEeSHJvcU-VmyB3pkwkZiSq8uQj3AXVesJGHEEPAmhkZby6oG-3aIjWFQJpRtUsDhUzRl8onkxiCSl0eoCK3vcpgdHokGL_Bhc0kHYeHCqeQC1OB64xAVqoKHk3MGC8b4sHb2hB2YdWBBCO9Iw8FoWe4Qi9YIKIJH8jmt80q1zvCwuEqgESXVMAU2rRTeZHjO11bZ4jG2LL0kJIp5UcSeYcTO2Mh72a37k1flmsE4YN0sT_qJsO5cS-ccmbzoN0b5-hmY1i-5DW09fHC3ITVcvNd0OlZggm-hgL2D5Z16c44r6RlNsAjPV8Cc87U7rzWfzlldfoUhf7ZYXCrpmfduFNUOIKnZdsOXTMs06VdbmCQZb_wR_kl0_KV1JcEMM7v2FyN0vbtOjvjexOBc3PyFxhyUN-_rUhOIO6BTHiMArO6NZpVNylFQjvZ6BeuHTk6aeGnHjGI0tSPxJ4PGwRk87THLf7fEGiicQFuLScS1y3Pr2FIl19Q0xmHetqQNq5LoT4uZTjAUNnwV4xTEkcUlkgUh5Uobz24
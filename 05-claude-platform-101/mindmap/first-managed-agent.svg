<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:779px;height:1070px;background:#FFFFFF;" width="779px" height="1070px" viewBox="0 0 779 1070" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="267.697" y="23.563" fill="#000" font-size="14" textLength="236.605" font-weight="700" font-family="Helvetica">Building your first managed agent</text><text x="292.903" y="38.564" fill="#777" font-size="12" textLength="186.193" font-weight="700" font-family="Helvetica">Créer votre premier agent géré</text></g><!--entity MA--><g class="entity" data-qualified-name="MA" id="ent0001" data-source-line="20"><rect x="186" y="64.459" width="422.158" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="196" y="88.99" fill="#000" font-size="15" textLength="124.753" font-weight="700" font-family="Helvetica">Managed agents</text><text x="196" y="103.265" fill="#777" font-size="11" textLength="69.266" font-family="Helvetica">Agents gérés</text><text x="196" y="120.449" fill="#000" font-size="15" textLength="402.158" font-family="Helvetica">The agent loop, run for you on Anthropic's infrastructure</text><text x="196" y="134.724" fill="#777" font-size="11" textLength="366.421" font-family="Helvetica">La boucle d'agent, exécutée pour vous sur l'infrastructure d'Anthropic</text><text x="196" y="151.908" fill="#000" font-size="15" textLength="291.628" font-family="Helvetica">Enabled by default for every API account</text><text x="196" y="166.183" fill="#777" font-size="11" textLength="227.079" font-family="Helvetica">Activés par défaut pour chaque compte API</text></g><!--entity AGENT--><g class="entity" data-qualified-name="AGENT" id="ent0002" data-source-line="22"><rect x="47" y="245.959" width="334.033" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="57" y="270.49" fill="#000" font-size="15" textLength="59.985" font-weight="700" font-family="Helvetica">1. Agent</text><text x="57" y="284.765" fill="#777" font-size="11" textLength="38.951" font-family="Helvetica">L'agent</text><text x="57" y="301.949" fill="#000" font-size="15" textLength="314.033" font-family="Helvetica">The persona: model, system prompt, toolset</text><text x="57" y="316.224" fill="#777" font-size="11" textLength="295.458" font-family="Helvetica">Le persona : modèle, prompt système, ensemble d'outils</text><text x="57" y="333.408" fill="#000" font-size="15" textLength="195.945" font-family="Helvetica">Reusable across many runs</text><text x="57" y="347.683" fill="#777" font-size="11" textLength="192.253" font-family="Helvetica">Réutilisable d'une exécution à l'autre</text></g><!--entity ENV--><g class="entity" data-qualified-name="ENV" id="ent0003" data-source-line="24"><rect x="6" y="427.459" width="415.94" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="451.99" fill="#000" font-size="15" textLength="112.881" font-weight="700" font-family="Helvetica">2. Environment</text><text x="16" y="466.265" fill="#777" font-size="11" textLength="87.57" font-family="Helvetica">L'environnement</text><text x="16" y="483.449" fill="#000" font-size="15" textLength="395.94" font-family="Helvetica">Where the agent runs: cloud or local, networking config</text><text x="16" y="497.724" fill="#777" font-size="11" textLength="304.358" font-family="Helvetica">Où l'agent s'exécute : cloud ou local, configuration réseau</text><text x="16" y="514.908" fill="#000" font-size="15" textLength="281.975" font-family="Helvetica">The sandbox where the file gets written</text><text x="16" y="529.183" fill="#777" font-size="11" textLength="185.12" font-family="Helvetica">Le bac à sable où le fichier est écrit</text></g><!--entity SESSION--><g class="entity" data-qualified-name="SESSION" id="ent0004" data-source-line="26"><rect x="39" y="577.459" width="350.022" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="49" y="601.99" fill="#000" font-size="15" textLength="77.717" font-weight="700" font-family="Helvetica">3. Session</text><text x="49" y="616.265" fill="#777" font-size="11" textLength="55.081" font-family="Helvetica">La session</text><text x="49" y="633.449" fill="#000" font-size="15" textLength="330.022" font-family="Helvetica">A single run of an agent inside an environment</text><text x="49" y="647.724" fill="#777" font-size="11" textLength="297.795" font-family="Helvetica">Une exécution unique d'un agent dans un environnement</text><text x="49" y="664.908" fill="#000" font-size="15" textLength="115.92" font-family="Helvetica">The unit of work</text><text x="49" y="679.183" fill="#777" font-size="11" textLength="86.501" font-family="Helvetica">L'unité de travail</text></g><!--entity EVENTS--><g class="entity" data-qualified-name="EVENTS" id="ent0005" data-source-line="28"><rect x="18" y="727.459" width="391.704" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="28" y="751.99" fill="#000" font-size="15" textLength="69.858" font-weight="700" font-family="Helvetica">4. Events</text><text x="28" y="766.265" fill="#777" font-size="11" textLength="85.406" font-family="Helvetica">Les événements</text><text x="28" y="783.449" fill="#000" font-size="15" textLength="234.778" font-family="Helvetica">The messages flowing in and out</text><text x="28" y="797.724" fill="#777" font-size="11" textLength="205.439" font-family="Helvetica">Les messages qui entrent et qui sortent</text><text x="28" y="814.908" fill="#000" font-size="15" textLength="371.704" font-family="Helvetica">Sending events and reading events, not a while loop</text><text x="28" y="829.183" fill="#777" font-size="11" textLength="274.672" font-family="Helvetica">Envoyer et lire des événements, pas de boucle while</text></g><!--entity STREAM--><g class="entity" data-qualified-name="STREAM" id="ent0006" data-source-line="30"><rect x="48.5" y="877.459" width="330.759" height="177.295" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="58.5" y="901.99" fill="#000" font-size="15" textLength="98.115" font-weight="700" font-family="Helvetica">Event stream</text><text x="58.5" y="916.265" fill="#777" font-size="11" textLength="112.336" font-family="Helvetica">Le flux d'événements</text><text x="58.5" y="933.449" fill="#000" font-size="15" textLength="310.759" font-family="Helvetica">Open it before sending the kickoff message</text><text x="58.5" y="947.724" fill="#777" font-size="11" textLength="263.538" font-family="Helvetica">L'ouvrir avant d'envoyer le message de lancement</text><text x="58.5" y="964.908" fill="#000" font-size="15" textLength="210.776" font-family="Helvetica">agent.message: Claude's text</text><text x="58.5" y="979.183" fill="#777" font-size="11" textLength="183.75" font-family="Helvetica">agent.message : le texte de Claude</text><text x="58.5" y="996.367" fill="#000" font-size="15" textLength="284.414" font-family="Helvetica">agent.tool_use: what tool Claude picked</text><text x="58.5" y="1010.642" fill="#777" font-size="11" textLength="207.985" font-family="Helvetica">agent.tool_use : l'outil choisi par Claude</text><text x="58.5" y="1027.826" fill="#000" font-size="15" textLength="264.976" font-family="Helvetica">session.status_idle: the agent is done</text><text x="58.5" y="1042.101" fill="#777" font-size="11" textLength="194.955" font-family="Helvetica">session.status_idle : l'agent a terminé</text></g><!--entity TRADE--><g class="entity" data-qualified-name="TRADE" id="ent0007" data-source-line="32"><rect x="399" y="214.459" width="363.96" height="177.295" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="409" y="238.99" fill="#000" font-size="15" textLength="72.173" font-weight="700" font-family="Helvetica">The trade</text><text x="409" y="253.265" fill="#777" font-size="11" textLength="73.82" font-family="Helvetica">Le compromis</text><text x="409" y="270.449" fill="#000" font-size="15" textLength="343.96" font-family="Helvetica">Delegate the loop, the sandbox, the resumability</text><text x="409" y="284.724" fill="#777" font-size="11" textLength="295.62" font-family="Helvetica">Déléguer la boucle, le bac à sable, la capacité de reprise</text><text x="409" y="301.908" fill="#000" font-size="15" textLength="343.132" font-family="Helvetica">When the loop would run too long, do too much,</text><text x="409" y="320.058" fill="#000" font-size="15" textLength="192.964" font-family="Helvetica">or need to survive a hiccup</text><text x="409" y="334.332" fill="#777" font-size="11" textLength="316.545" font-family="Helvetica">Quand la boucle tournerait trop longtemps, aurait trop à faire</text><text x="409" y="347.642" fill="#777" font-size="11" textLength="167.052" font-family="Helvetica">ou devrait survivre à un incident</text><text x="409" y="364.826" fill="#000" font-size="15" textLength="207.576" font-family="Helvetica">A manual loop for full control</text><text x="409" y="379.101" fill="#777" font-size="11" textLength="226.059" font-family="Helvetica">Une boucle manuelle pour un contrôle total</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="271.345,245.71,280.571,242.264,274.915,242.209,274.97,236.553,271.345,245.71" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M339.85,178.516 C318.037,199.912 296.746,220.795 274.915,242.209" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="214,427.356,218,418.356,214,422.356,210,418.356,214,427.356" fill="#555" style="strok
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1371px;height:627px;background:#FFFFFF;" width="1371px" height="627px" viewBox="0 0 1371 627" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="666.445" y="20.78" fill="#000" font-size="14" textLength="31.11" font-weight="700" font-family="Helvetica">MCP</text><text x="668.667" y="33.24" fill="#777" font-size="12" textLength="26.666" font-weight="700" font-family="Helvetica">MCP</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0001" data-source-line="20"><rect x="397.5" y="59" width="323.486" height="98" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="407.5" y="80.55" fill="#000" font-size="15" textLength="33.333" font-weight="700" font-family="Helvetica">MCP</text><text x="407.5" y="92.47" fill="#777" font-size="11" textLength="24.444" font-family="Helvetica">MCP</text><text x="407.5" y="106.55" fill="#000" font-size="15" textLength="262.617" font-family="Helvetica">Connects Claude to third-party services</text><text x="407.5" y="118.47" fill="#777" font-size="11" textLength="182.204" font-family="Helvetica">Connecte Claude à des services tiers</text><text x="407.5" y="132.55" fill="#000" font-size="15" textLength="303.486" font-family="Helvetica">The service provider maintains the integration</text><text x="407.5" y="144.47" fill="#777" font-size="11" textLength="229.555" font-family="Helvetica">Le fournisseur du service maintient l'intégration</text></g><!--entity VSMCP--><g class="entity" data-qualified-name="VSMCP" id="ent0002" data-source-line="23"><rect x="6" y="219" width="250" height="72" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="240.55" fill="#000" font-size="15" textLength="33.333" font-weight="700" font-family="Helvetica">MCP</text><text x="16" y="252.47" fill="#777" font-size="11" textLength="24.444" font-family="Helvetica">MCP</text><text x="16" y="266.55" fill="#000" font-size="15" textLength="137.93" font-family="Helvetica">Everyone else's stuff</text><text x="16" y="278.47" fill="#777" font-size="11" textLength="157.131" font-family="Helvetica">Les systèmes de tous les autres</text></g><!--entity VSSKILLS--><g class="entity" data-qualified-name="VSSKILLS" id="ent0003" data-source-line="24"><rect x="274" y="219" width="250" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="284" y="240.55" fill="#000" font-size="15" textLength="39.192" font-weight="700" font-family="Helvetica">Skills</text><text x="284" y="252.47" fill="#777" font-size="11" textLength="46.46" font-family="Helvetica">Les Skills</text><text x="284" y="266.55" fill="#000" font-size="15" textLength="104.216" font-family="Helvetica">Your processes</text><text x="284" y="278.47" fill="#777" font-size="11" textLength="77.043" font-family="Helvetica">Vos procédures</text></g><!--entity VSTOOLS--><g class="entity" data-qualified-name="VSTOOLS" id="ent0004" data-source-line="25"><rect x="542" y="219" width="354.387" height="72" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="552" y="240.55" fill="#000" font-size="15" textLength="39.998" font-weight="700" font-family="Helvetica">Tools</text><text x="552" y="252.47" fill="#777" font-size="11" textLength="46.471" font-family="Helvetica">Les outils</text><text x="552" y="266.55" fill="#000" font-size="15" textLength="334.387" font-family="Helvetica">Your stuff: you own the code and the maintenance</text><text x="552" y="278.47" fill="#777" font-size="11" textLength="283.712" font-family="Helvetica">Vos systèmes : le code et la maintenance vous reviennent</text></g><!--entity SERVER--><g class="entity" data-qualified-name="SERVER" id="ent0005" data-source-line="27"><rect x="914.5" y="193" width="439.392" height="124" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="924.5" y="214.55" fill="#000" font-size="15" textLength="143.438" font-weight="700" font-family="Helvetica">A server per service</text><text x="924.5" y="226.47" fill="#777" font-size="11" textLength="110.65" font-family="Helvetica">Un serveur par service</text><text x="924.5" y="240.55" fill="#000" font-size="15" textLength="261.841" font-family="Helvetica">Asana, Slack, Google each publish one</text><text x="924.5" y="252.47" fill="#777" font-size="11" textLength="216.482" font-family="Helvetica">Asana, Slack, Google en publient chacun un</text><text x="924.5" y="266.55" fill="#000" font-size="15" textLength="419.392" font-family="Helvetica">Tools, descriptions, schemas, authentication, standard protocol</text><text x="924.5" y="278.47" fill="#777" font-size="11" textLength="320.391" font-family="Helvetica">Outils, descriptions, schémas, authentification, protocole standard</text><text x="924.5" y="292.55" fill="#000" font-size="15" textLength="349.409" font-family="Helvetica">Their API changes: they update, you change nothing</text><text x="924.5" y="304.47" fill="#777" font-size="11" textLength="282.498" font-family="Helvetica">Leur API change : ils mettent à jour, vous ne changez rien</text></g><!--entity CONN--><g class="entity" data-qualified-name="CONN" id="ent0006" data-source-line="29"><rect x="913" y="353" width="441.89" height="124" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="923" y="374.55" fill="#000" font-size="15" textLength="82.493" font-weight="700" font-family="Helvetica">Connection</text><text x="923" y="386.47" fill="#777" font-size="11" textLength="52.594" font-family="Helvetica">Connexion</text><text x="923" y="400.55" fill="#000" font-size="15" textLength="341.843" font-family="Helvetica">mcp_servers: type, URL, name, optional auth token</text><text x="923" y="412.47" fill="#777" font-size="11" textLength="310.863" font-family="Helvetica">mcp_servers : type, URL, nom, token d'authentification facultatif</text><text x="923" y="426.55" fill="#000" font-size="15" textLength="421.89" font-family="Helvetica">mcp_toolset in tools: which tools Claude can use (all by default)</text><text x="923" y="438.47" fill="#777" font-size="11" textLength="299.6" font-family="Helvetica">mcp_toolset dans tools : les outils utilisables (tous par défaut)</text><text x="923" y="452.55" fill="#000" font-size="15" textLength="317.637" font-family="Helvetica">No tool schema to write: Claude discovers them</text><text x="923" y="464.47" fill="#777" font-size="11" textLength="253.403" font-family="Helvetica">Aucun schéma d'outil à écrire : Claude les découvre</text></g><!--entity SCOPE--><g class="entity" data-qualified-name="SCOPE" id="ent0007" data-source-line="31"><rect x="922" y="513" width="423.564" height="98" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="932" y="534.55" fill="#000" font-size="15" textLength="101.667" font-weight="700" font-family="Helvetica">Scope it down</text><text x="932" y="546.47" fill="#777" font-size="11" textLength="93.194" font-family="Helvetica">Restreindre l'accès</text><text x="932" y="560.55" fill="#000" font-size="15" textLength="403.564" font-family="Helvetica">Disable everything by default, enable specific tools in configs</text><text x="932" y="572.47" fill="#777" font-size="11" textLength="313.049" font-family="Helvetica">Tout désactiver par défaut, activer des outils précis dans configs</text><text x="932" y="586.55" fill="#000" font-size="15" textLength="155.068" font-family="Helvetica">A server kept read-only</text><text x="932" y="598.47" fill="#777" font-size="11" textLength="165.704" font-family="Helvetica">Un serveur gardé en lecture seule</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="680.372,218.993,676.389,209.986,676.667,215.636,671.017,215.914,680.372,218.993" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M612.278,157.283 C634.55,177.467 656.239,197.123 676.667,215.636" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="437.628,218.993,446.983,215.914,441.333,215.636,441.611,209.986,437.628,218.993" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M505.722,157.283 C483.45,177.467 461.761,197.123 441.333,215.636" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="202.851,218.915,212.699,218.826,207.401,216.843,209.384,211.545,202.851,218.915" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M397.391,150.502 C353.98,162.914 307.343,177.412 265,193 C244.491,200.55 227.285,207.789 207.401,216.843" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="914.334,195.383,906.608,189.276,909.491,194.143,904.623,197.026,914.334,195.383" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M720.691,147.47 C778.867,161.518 844.946,177.714 905,193 C908.09,193.787 906.359,193.341 909.491,194.143" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="1134,352.815,1138,343.815,1134,347.815,1130,343.815,1134,352.815" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1134,317.087 C1134,328.81 1134,336.089 1134,347.815" style="stroke:#555;stroke-width:1
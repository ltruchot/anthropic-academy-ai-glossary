<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1096px;height:711px;background:#FFFFFF;" width="1096px" height="711px" viewBox="0 0 1096 711" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="483.5" y="23.563" fill="#000" font-size="14" textLength="122.001" font-weight="700" font-family="Helvetica">Your first API call</text><text x="472.884" y="38.564" fill="#777" font-size="12" textLength="143.232" font-weight="700" font-family="Helvetica">Votre premier appel API</text></g><!--cluster SETUP--><g class="cluster" data-qualified-name="SETUP" id="ent0001" data-source-line="20"><rect x="284" y="64.459" width="796" height="220" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="643.672" y="80.99" fill="#000" font-size="15" textLength="76.655" font-weight="700" font-family="Helvetica">Get set up</text><text x="643.83" y="95.265" fill="#777" font-size="11" textLength="76.339" font-weight="700" font-family="Helvetica">Mise en place</text></g><!--entity CALL--><g class="entity" data-qualified-name="CALL" id="ent0004" data-source-line="25"><rect x="105.5" y="304.459" width="405.356" height="208.754" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="115.5" y="328.99" fill="#000" font-size="15" textLength="128.394" font-weight="700" font-family="Helvetica">messages.create</text><text x="115.5" y="343.265" fill="#777" font-size="11" textLength="88.999" font-family="Helvetica">messages.create</text><text x="115.5" y="360.449" fill="#000" font-size="15" textLength="209.326" font-family="Helvetica">Every API call goes through it</text><text x="115.5" y="374.724" fill="#777" font-size="11" textLength="206.126" font-family="Helvetica">Tout appel API passe par cette fonction</text><text x="115.5" y="391.908" fill="#000" font-size="15" textLength="343.22" font-family="Helvetica">model: which Claude model handles the request</text><text x="115.5" y="406.183" fill="#777" font-size="11" textLength="237.408" font-family="Helvetica">model : le modèle Claude qui traite la requête</text><text x="115.5" y="423.367" fill="#000" font-size="15" textLength="372.642" font-family="Helvetica">max_tokens: a cap on how long the response can be</text><text x="115.5" y="437.642" fill="#777" font-size="11" textLength="256.942" font-family="Helvetica">max_tokens : la longueur maximale de la réponse</text><text x="115.5" y="454.826" fill="#000" font-size="15" textLength="379.49" font-family="Helvetica">messages: user or assistant roles, like a conversation</text><text x="115.5" y="469.101" fill="#777" font-size="11" textLength="339.458" font-family="Helvetica">messages : des rôles user ou assistant, comme une conversation</text><text x="115.5" y="486.285" fill="#000" font-size="15" textLength="385.356" font-family="Helvetica">system: the system prompt, shapes Claude's behavior</text><text x="115.5" y="500.56" fill="#777" font-size="11" textLength="359.53" font-family="Helvetica">system : le prompt système, qui façonne le comportement de Claude</text></g><!--entity RESP--><g class="entity" data-qualified-name="RESP" id="ent0005" data-source-line="27"><rect x="6" y="549.459" width="284.097" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="573.99" fill="#000" font-size="15" textLength="135.117" font-weight="700" font-family="Helvetica">Response content</text><text x="16" y="588.265" fill="#777" font-size="11" textLength="118.384" font-family="Helvetica">Contenu de la réponse</text><text x="16" y="605.449" fill="#000" font-size="15" textLength="218.342" font-family="Helvetica">An array of blocks, not a string</text><text x="16" y="619.724" fill="#777" font-size="11" textLength="264.097" font-family="Helvetica">Un tableau de blocs, pas une chaîne de caractères</text><text x="16" y="636.908" fill="#000" font-size="15" textLength="169.219" font-family="Helvetica">Text, tool calls, thinking</text><text x="16" y="651.183" fill="#777" font-size="11" textLength="164.108" font-family="Helvetica">Texte, appels d'outils, réflexion</text><text x="16" y="668.367" fill="#000" font-size="15" textLength="243.604" font-family="Helvetica">Loop and check each block's type</text><text x="16" y="682.642" fill="#777" font-size="11" textLength="255.218" font-family="Helvetica">Parcourir les blocs en vérifiant le type de chacun</text></g><!--entity PROD--><g class="entity" data-qualified-name="PROD" id="ent0006" data-source-line="29"><rect x="308.5" y="565.459" width="319.216" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="318.5" y="589.99" fill="#000" font-size="15" textLength="167.314" font-weight="700" font-family="Helvetica">From script to product</text><text x="318.5" y="604.265" fill="#777" font-size="11" textLength="102.609" font-family="Helvetica">Du script au produit</text><text x="318.5" y="621.449" fill="#000" font-size="15" textLength="299.216" font-family="Helvetica">The same call, wrapped in a route handler</text><text x="318.5" y="635.724" fill="#777" font-size="11" textLength="298.439" font-family="Helvetica">Le même appel, encapsulé dans un gestionnaire de route</text><text x="318.5" y="652.908" fill="#000" font-size="15" textLength="158.958" font-family="Helvetica">A summarize endpoint</text><text x="318.5" y="667.183" fill="#777" font-size="11" textLength="182.15" font-family="Helvetica">Un point de terminaison de résumé</text></g><!--entity KEY--><g class="entity" data-qualified-name="SETUP.KEY" id="ent0002" data-source-line="21"><rect x="334.5" y="122.459" width="460.859" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="344.5" y="146.99" fill="#000" font-size="15" textLength="56.396" font-weight="700" font-family="Helvetica">API key</text><text x="344.5" y="161.265" fill="#777" font-size="11" textLength="38.14" font-family="Helvetica">Clé API</text><text x="344.5" y="178.449" fill="#000" font-size="15" textLength="417.92" font-family="Helvetica">From platform.claude.com (credits purchased beforehand)</text><text x="344.5" y="192.724" fill="#777" font-size="11" textLength="333.964" font-family="Helvetica">Obtenue sur platform.claude.com (crédits achetés au préalable)</text><text x="344.5" y="209.908" fill="#000" font-size="15" textLength="285.806" font-family="Helvetica">In a .env.local file, out of version control</text><text x="344.5" y="224.183" fill="#777" font-size="11" textLength="281.526" font-family="Helvetica">Dans un fichier .env.local, hors du contrôle de version</text><text x="344.5" y="241.367" fill="#000" font-size="15" textLength="405.007" font-family="Helvetica">Hardcoded in source files, keys end up leaked on GitHub</text><text x="344.5" y="255.642" fill="#777" font-size="11" textLength="440.859" font-family="Helvetica">Codées en dur dans les fichiers source, les clés se retrouvent divulguées sur GitHub</text></g><!--entity SDK--><g class="entity" data-qualified-name="SETUP.SDK" id="ent0003" data-source-line="22"><rect x="814" y="160.459" width="250" height="69.608" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="824" y="184.99" fill="#000" font-size="15" textLength="31.934" font-weight="700" font-family="Helvetica">SDK</text><text x="824" y="199.265" fill="#777" font-size="11" textLength="22.387" font-family="Helvetica">SDK</text><text x="824" y="216.449" fill="#000" font-size="15" textLength="212.9" font-family="Helvetica">npm install @anthropic-ai/sdk</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="308,304.459,312,295.459,308,299.459,304,295.459,308,304.459" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-mit
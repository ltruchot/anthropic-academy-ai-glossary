<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2311px;height:526px;background:#FFFFFF;" width="2311px" height="526px" viewBox="0 0 2311 526" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1094.032" y="23.563" fill="#000" font-size="14" textLength="116.437" font-weight="700" font-family="Helvetica">Managed agents</text><text x="1112.406" y="38.564" fill="#777" font-size="12" textLength="79.688" font-weight="700" font-family="Helvetica">Agents gérés</text></g><!--entity MA--><g class="entity" data-qualified-name="MA" id="ent0001" data-source-line="20"><rect x="576" y="64.459" width="425.923" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="586" y="88.99" fill="#000" font-size="15" textLength="124.753" font-weight="700" font-family="Helvetica">Managed agents</text><text x="586" y="103.265" fill="#777" font-size="11" textLength="69.266" font-family="Helvetica">Agents gérés</text><text x="586" y="120.449" fill="#000" font-size="15" textLength="405.923" font-family="Helvetica">A suite of APIs for building and deploying agents at scale</text><text x="586" y="134.724" fill="#777" font-size="11" textLength="350.512" font-family="Helvetica">Une suite d'API pour créer et déployer des agents à grande échelle</text><text x="586" y="151.908" fill="#000" font-size="15" textLength="372.473" font-family="Helvetica">The agent loop, hosted on Anthropic's infrastructure</text><text x="586" y="166.183" fill="#777" font-size="11" textLength="312.904" font-family="Helvetica">La boucle d'agent, hébergée sur l'infrastructure d'Anthropic</text><text x="586" y="183.367" fill="#000" font-size="15" textLength="370.173" font-family="Helvetica">An isolated container: file system, bash, web search</text><text x="586" y="197.642" fill="#777" font-size="11" textLength="325.515" font-family="Helvetica">Un conteneur isolé : système de fichiers, bash, recherche web</text></g><!--entity AGENTS--><g class="entity" data-qualified-name="AGENTS" id="ent0002" data-source-line="22"><rect x="138.5" y="261.959" width="310.515" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="148.5" y="286.49" fill="#000" font-size="15" textLength="52.793" font-weight="700" font-family="Helvetica">Agents</text><text x="148.5" y="300.765" fill="#777" font-size="11" textLength="56.772" font-family="Helvetica">Les agents</text><text x="148.5" y="317.949" fill="#000" font-size="15" textLength="290.515" font-family="Helvetica">Specific tools, personas, and capabilities</text><text x="148.5" y="332.224" fill="#777" font-size="11" textLength="279.512" font-family="Helvetica">Des outils, des personas et des capacités spécifiques</text></g><!--entity ENVS--><g class="entity" data-qualified-name="ENVS" id="ent0003" data-source-line="24"><rect x="577" y="261.959" width="423.967" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="587" y="286.49" fill="#000" font-size="15" textLength="102.642" font-weight="700" font-family="Helvetica">Environments</text><text x="587" y="300.765" fill="#777" font-size="11" textLength="105.392" font-family="Helvetica">Les environnements</text><text x="587" y="317.949" fill="#000" font-size="15" textLength="403.967" font-family="Helvetica">Sandboxes with the right packages and network controls</text><text x="587" y="332.224" fill="#777" font-size="11" textLength="312.775" font-family="Helvetica">Des bacs à sable avec les bons paquets et contrôles réseau</text></g><!--entity SESSIONS--><g class="entity" data-qualified-name="SESSIONS" id="ent0004" data-source-line="26"><rect x="1074" y="246.459" width="430.032" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1084" y="270.99" fill="#000" font-size="15" textLength="67.361" font-weight="700" font-family="Helvetica">Sessions</text><text x="1084" y="285.265" fill="#777" font-size="11" textLength="66.929" font-family="Helvetica">Les sessions</text><text x="1084" y="302.449" fill="#000" font-size="15" textLength="308.152" font-family="Helvetica">Runs you fire off from your own application</text><text x="1084" y="316.724" fill="#777" font-size="11" textLength="251.979" font-family="Helvetica">Des exécutions lancées depuis votre application</text><text x="1084" y="333.908" fill="#000" font-size="15" textLength="410.032" font-family="Helvetica">In parallel, two containers; tool calls streamed in real time</text><text x="1084" y="348.183" fill="#777" font-size="11" textLength="360.39" font-family="Helvetica">En parallèle, deux conteneurs ; appels d'outils diffusés en temps réel</text></g><!--entity TOOLS--><g class="entity" data-qualified-name="TOOLS" id="ent0005" data-source-line="28"><rect x="6" y="411.959" width="466.309" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="436.49" fill="#000" font-size="15" textLength="113.87" font-weight="700" font-family="Helvetica">Tools and MCP</text><text x="16" y="450.765" fill="#777" font-size="11" textLength="90.927" font-family="Helvetica">Les outils et MCP</text><text x="16" y="467.949" fill="#000" font-size="15" textLength="446.309" font-family="Helvetica">Custom tools on your back end; Slack and Asana through MCP</text><text x="16" y="482.224" fill="#777" font-size="11" textLength="341.043" font-family="Helvetica">Outils personnalisés sur votre back-end ; Slack et Asana via MCP</text></g><!--entity OUTCOMES--><g class="entity" data-qualified-name="OUTCOMES" id="ent0006" data-source-line="30"><rect x="490.5" y="396.459" width="592.856" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="500.5" y="420.99" fill="#000" font-size="15" textLength="76.362" font-weight="700" font-family="Helvetica">Outcomes</text><text x="500.5" y="435.265" fill="#777" font-size="11" textLength="115.033" font-family="Helvetica">Les résultats attendus</text><text x="500.5" y="452.449" fill="#000" font-size="15" textLength="263.123" font-family="Helvetica">A rubric defines what done looks like</text><text x="500.5" y="466.724" fill="#777" font-size="11" textLength="306.732" font-family="Helvetica">Une grille d'évaluation définit à quoi ressemble « terminé »</text><text x="500.5" y="483.908" fill="#000" font-size="15" textLength="572.856" font-family="Helvetica">A separate grader, in its own context window, checks the output; Claude iterates</text><text x="500.5" y="498.183" fill="#777" font-size="11" textLength="459.809" font-family="Helvetica">Un évaluateur distinct, dans sa propre fenêtre de contexte, vérifie la sortie ; Claude itère</text></g><!--entity MEMORY--><g class="entity" data-qualified-name="MEMORY" id="ent0007" data-source-line="32"><rect x="1102" y="411.959" width="374.412" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1112" y="436.49" fill="#000" font-size="15" textLength="61.318" font-weight="700" font-family="Helvetica">Memory</text><text x="1112" y="450.765" fill="#777" font-size="11" textLength="60.989" font-family="Helvetica">La mémoire</text><text x="1112" y="467.949" fill="#000" font-size="15" textLength="354.412" font-family="Helvetica">A store read before starting, written to when done</text><text x="1112" y="482.224" fill="#777" font-size="11" textLength="328.244" font-family="Helvetica">Un magasin lu avant de démarrer, où l'on écrit une fois terminé</text></g><!--entity MULTI--><g class="entity" data-qualified-name="MULTI" id="ent0008" data-source-line="34"><rect x="1494" y="411.959" width="519.68" height="82.918" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1504" y="436.49" fill="#000" font-size="15" textLength="185.83" font-weight="700" font-family="Helvetica">Multi-agent coordination</text><text x="1504" y="450.765" fill="#777" font-size="11" textLength="149.365" font-family="Helvetica">La coordination multi-agents</text><text x="1504" y="467.949" fill="#000" font-size="15" textLength="499.68" font-family="Helvetica">A coordinator delegates to specialists, each in its own context window</text><text x="1504" y="482.224" fill="#777" font-size="11" textLength="418.575" font-family="Helvetica">Un coordinateur délègue à des spécialistes, chacun dans sa fenêtre de contexte</text></g><!--entity PERM--><g class="entity" data-qualified-name="PERM" id="ent0009" data-source-line="36"><rect x="2032.5" y="411.959" width="262.915" height="82.918" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2042.5" y="436.49" fill="#000" font-size="15" textLength="141.116" font-weight="700" font-family="Helvetica">Permissions policy</text><text x="2042.5" y="450.765" fill="#777" font-size="11" textLength="134.578" font-family="Helvetica">La politique d'autorisation</text><text x="2042.5" y="467.949" fill="#000" font-size="15" textLength="242.915" font-family="Helvetica">Sensitive actions wait for a human</text><text x="2042.5" y="482.224" fill="#777" font-size="11" textLength="221.225" font-family="Helvetica">Les actions sensibles attendent un humain</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="416.489,261.877,426.29,262.843,421.235,260.304,423.774,255.249,416.489,261.877" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M575.843,209.081 C521.379,227.125 469.398,244.347 421.235,260.304" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk11" data-link-type="dependency"><polygon points="789,261.906,793,252.906,789,256.906,785,252.906,789,261.906" fill="#555" style="stroke:#555
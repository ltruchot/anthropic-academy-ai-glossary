<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1901px;height:467px;background:#FFFFFF;" width="1901px" height="467px" viewBox="0 0 1901 467" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="892.405" y="20.78" fill="#000" font-size="14" textLength="109.689" font-weight="700" font-family="Helvetica">Managed agents</text><text x="909.237" y="33.24" fill="#777" font-size="12" textLength="76.025" font-weight="700" font-family="Helvetica">Agents gérés</text></g><!--entity MA--><g class="entity" data-qualified-name="MA" id="ent0001" data-source-line="20"><rect x="465.5" y="59" width="398.574" height="124" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="475.5" y="80.55" fill="#000" font-size="15" textLength="117.524" font-weight="700" font-family="Helvetica">Managed agents</text><text x="475.5" y="92.47" fill="#777" font-size="11" textLength="64.818" font-family="Helvetica">Agents gérés</text><text x="475.5" y="106.55" fill="#000" font-size="15" textLength="378.574" font-family="Helvetica">A suite of APIs for building and deploying agents at scale</text><text x="475.5" y="118.47" fill="#777" font-size="11" textLength="327.417" font-family="Helvetica">Une suite d'API pour créer et déployer des agents à grande échelle</text><text x="475.5" y="132.55" fill="#000" font-size="15" textLength="343.901" font-family="Helvetica">The agent loop, hosted on Anthropic's infrastructure</text><text x="475.5" y="144.47" fill="#777" font-size="11" textLength="286.978" font-family="Helvetica">La boucle d'agent, hébergée sur l'infrastructure d'Anthropic</text><text x="475.5" y="158.55" fill="#000" font-size="15" textLength="345.176" font-family="Helvetica">An isolated container: file system, bash, web search</text><text x="475.5" y="170.47" fill="#777" font-size="11" textLength="303.263" font-family="Helvetica">Un conteneur isolé : système de fichiers, bash, recherche web</text></g><!--entity AGENTS--><g class="entity" data-qualified-name="AGENTS" id="ent0002" data-source-line="22"><rect x="107" y="232" width="290.154" height="72" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="117" y="253.55" fill="#000" font-size="15" textLength="50.837" font-weight="700" font-family="Helvetica">Agents</text><text x="117" y="265.47" fill="#777" font-size="11" textLength="53.818" font-family="Helvetica">Les agents</text><text x="117" y="279.55" fill="#000" font-size="15" textLength="270.154" font-family="Helvetica">Specific tools, personas, and capabilities</text><text x="117" y="291.47" fill="#777" font-size="11" textLength="261.089" font-family="Helvetica">Des outils, des personas et des capacités spécifiques</text></g><!--entity ENVS--><g class="entity" data-qualified-name="ENVS" id="ent0003" data-source-line="24"><rect x="467.5" y="232" width="395.22" height="72" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="477.5" y="253.55" fill="#000" font-size="15" textLength="100.02" font-weight="700" font-family="Helvetica">Environments</text><text x="477.5" y="265.47" fill="#777" font-size="11" textLength="99.059" font-family="Helvetica">Les environnements</text><text x="477.5" y="279.55" fill="#000" font-size="15" textLength="375.22" font-family="Helvetica">Sandboxes with the right packages and network controls</text><text x="477.5" y="291.47" fill="#777" font-size="11" textLength="293.509" font-family="Helvetica">Des bacs à sable avec les bons paquets et contrôles réseau</text></g><!--entity SESSIONS--><g class="entity" data-qualified-name="SESSIONS" id="ent0004" data-source-line="26"><rect x="983.5" y="219" width="401.006" height="98" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="993.5" y="240.55" fill="#000" font-size="15" textLength="65.867" font-weight="700" font-family="Helvetica">Sessions</text><text x="993.5" y="252.47" fill="#777" font-size="11" textLength="63.588" font-family="Helvetica">Les sessions</text><text x="993.5" y="266.55" fill="#000" font-size="15" textLength="284.304" font-family="Helvetica">Runs you fire off from your own application</text><text x="993.5" y="278.47" fill="#777" font-size="11" textLength="234.808" font-family="Helvetica">Des exécutions lancées depuis votre application</text><text x="993.5" y="292.55" fill="#000" font-size="15" textLength="381.006" font-family="Helvetica">In parallel, two containers; tool calls streamed in real time</text><text x="993.5" y="304.47" fill="#777" font-size="11" textLength="334.743" font-family="Helvetica">En parallèle, deux conteneurs ; appels d'outils diffusés en temps réel</text></g><!--entity TOOLS--><g class="entity" data-qualified-name="TOOLS" id="ent0005" data-source-line="28"><rect x="6" y="366" width="440.227" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="387.55" fill="#000" font-size="15" textLength="108.333" font-weight="700" font-family="Helvetica">Tools and MCP</text><text x="16" y="399.47" fill="#777" font-size="11" textLength="86.201" font-family="Helvetica">Les outils et MCP</text><text x="16" y="413.55" fill="#000" font-size="15" textLength="420.227" font-family="Helvetica">Custom tools on your back end; Slack and Asana through MCP</text><text x="16" y="425.47" fill="#777" font-size="11" textLength="319.757" font-family="Helvetica">Outils personnalisés sur votre back end ; Slack et Asana via MCP</text></g><!--entity OUTCOMES--><g class="entity" data-qualified-name="OUTCOMES" id="ent0006" data-source-line="30"><rect x="464.5" y="353" width="552.793" height="98" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="474.5" y="374.55" fill="#000" font-size="15" textLength="73.352" font-weight="700" font-family="Helvetica">Outcomes</text><text x="474.5" y="386.47" fill="#777" font-size="11" textLength="107.621" font-family="Helvetica">Les résultats attendus</text><text x="474.5" y="400.55" fill="#000" font-size="15" textLength="243.464" font-family="Helvetica">A rubric defines what done looks like</text><text x="474.5" y="412.47" fill="#777" font-size="11" textLength="285.205" font-family="Helvetica">Une grille d'évaluation définit à quoi ressemble « terminé »</text><text x="474.5" y="426.55" fill="#000" font-size="15" textLength="532.793" font-family="Helvetica">A separate grader, in its own context window, checks the output; Claude iterates</text><text x="474.5" y="438.47" fill="#777" font-size="11" textLength="428.012" font-family="Helvetica">Un évaluateur distinct, dans sa propre fenêtre de contexte, vérifie la sortie ; Claude itère</text></g><!--entity MEMORY--><g class="entity" data-qualified-name="MEMORY" id="ent0007" data-source-line="32"><rect x="1035.5" y="366" width="348.521" height="72" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1045.5" y="387.55" fill="#000" font-size="15" textLength="57.517" font-weight="700" font-family="Helvetica">Memory</text><text x="1045.5" y="399.47" fill="#777" font-size="11" textLength="58.078" font-family="Helvetica">La mémoire</text><text x="1045.5" y="413.55" fill="#000" font-size="15" textLength="328.521" font-family="Helvetica">A store read before starting, written to when done</text><text x="1045.5" y="425.47" fill="#777" font-size="11" textLength="306.587" font-family="Helvetica">Un magasin lu avant de démarrer, où l'on écrit une fois terminé</text></g><!--entity MULTI--><g class="entity" data-qualified-name="MULTI" id="ent0008" data-source-line="34"><rect x="1402.5" y="353" width="482.751" height="98" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1412.5" y="374.55" fill="#000" font-size="15" textLength="174.983" font-weight="700" font-family="Helvetica">Multi-agent coordination</text><text x="1412.5" y="386.47" fill="#777" font-size="11" textLength="138.193" font-family="Helvetica">La coordination multi-agents</text><text x="1412.5" y="400.55" fill="#000" font-size="15" textLength="462.751" font-family="Helvetica">A coordinator delegates to specialists, each in its own context window</text><text x="1412.5" y="412.47" fill="#777" font-size="11" textLength="390.752" font-family="Helvetica">Un coordinateur délègue à des spécialistes, chacun dans sa fenêtre de contexte</text><text x="1412.5" y="426.55" fill="#000" font-size="15" textLength="386.001" font-family="Helvetica">The permissions policy: sensitive actions wait for a human</text><text x="1412.5" y="438.47" fill="#777" font-size="11" textLength="337.82" font-family="Helvetica">La politique d'autorisation : les actions sensibles attendent un humain</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="351.855,231.942,361.672,232.735,356.573,230.285,359.022,225.186,351.855,231.942" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M491.048,183.073 C443.541,199.752 398.394,215.602 356.573,230.285" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="665,231.635,669,222.635,665,226.635,661,222.635,665,231.635" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M665,183.073 C665,199.636 665,212.015 665,226.635" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="1011.827,218.898,1004.235,212.623,1007.011,217.552,1002.082,220.328,1011.827,218.898" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M864.546,177.75 C913.116,191.319 
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1732px;height:882px;background:#FFFFFF;" width="1732px" height="882px" viewBox="0 0 1732 882" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="773.677" y="23.563" fill="#000" font-size="14" textLength="177.646" font-weight="700" font-family="Helvetica">The agent loop explained</text><text x="777.48" y="38.564" fill="#777" font-size="12" textLength="170.039" font-weight="700" font-family="Helvetica">La boucle d'agent expliquée</text></g><!--cluster LOOP--><g class="cluster" data-qualified-name="LOOP" id="ent0002" data-source-line="22"><rect x="14" y="229.459" width="596" height="629" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="271.098" y="245.99" fill="#000" font-size="15" textLength="81.804" font-weight="700" font-family="Helvetica">Agent loop</text><text x="270.473" y="260.265" fill="#777" font-size="11" textLength="83.053" font-weight="700" font-family="Helvetica">Boucle d'agent</text></g><!--entity AGENT--><g class="entity" data-qualified-name="AGENT" id="ent0001" data-source-line="20"><rect x="315.5" y="56.459" width="540.745" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="325.5" y="80.99" fill="#000" font-size="15" textLength="44.407" font-weight="700" font-family="Helvetica">Agent</text><text x="325.5" y="95.265" fill="#777" font-size="11" textLength="30.846" font-family="Helvetica">Agent</text><text x="325.5" y="112.449" fill="#000" font-size="15" textLength="415.613" font-family="Helvetica">An autonomous version of Claude, no human in the middle</text><text x="325.5" y="126.724" fill="#777" font-size="11" textLength="322.717" font-family="Helvetica">Une version autonome de Claude, sans humain entre les deux</text><text x="325.5" y="143.908" fill="#000" font-size="15" textLength="322.625" font-family="Helvetica">Claude in a loop: observe, decide, act, repeat</text><text x="325.5" y="158.183" fill="#777" font-size="11" textLength="332.514" font-family="Helvetica">Claude dans une boucle : observer, décider, agir, recommencer</text><text x="325.5" y="175.367" fill="#000" font-size="15" textLength="520.745" font-family="Helvetica">Agentic workflows: act, look at the result, decide what's next, keep going</text><text x="325.5" y="189.642" fill="#777" font-size="11" textLength="429.913" font-family="Helvetica">Flux de travail agentiques : agir, examiner le résultat, décider de la suite, continuer</text></g><!--entity OWN--><g class="entity" data-qualified-name="OWN" id="ent0007" data-source-line="29"><rect x="626" y="407.459" width="541.763" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="636" y="431.99" fill="#000" font-size="15" textLength="118.762" font-weight="700" font-family="Helvetica">Who owns what</text><text x="636" y="446.265" fill="#777" font-size="11" textLength="91.185" font-family="Helvetica">À qui revient quoi</text><text x="636" y="463.449" fill="#000" font-size="15" textLength="423.816" font-family="Helvetica">You own the loop and the tools; Claude owns the reasoning</text><text x="636" y="477.724" fill="#777" font-size="11" textLength="381.638" font-family="Helvetica">La boucle et les outils vous reviennent ; le raisonnement revient à Claude</text><text x="636" y="494.908" fill="#000" font-size="15" textLength="521.763" font-family="Helvetica">Managed agents run this exact loop for you, on Anthropic's infrastructure</text><text x="636" y="509.183" fill="#777" font-size="11" textLength="479.15" font-family="Helvetica">Les agents gérés font tourner cette même boucle pour vous, sur l'infrastructure d'Anthropic</text></g><!--entity PROD--><g class="entity" data-qualified-name="PROD" id="ent0008" data-source-line="31"><rect x="1186" y="407.459" width="537.991" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1196" y="431.99" fill="#000" font-size="15" textLength="99.58" font-weight="700" font-family="Helvetica">In production</text><text x="1196" y="446.265" fill="#777" font-size="11" textLength="72.558" font-family="Helvetica">En production</text><text x="1196" y="463.449" fill="#000" font-size="15" textLength="517.991" font-family="Helvetica">The same loop shape, from a mock weather demo to a compliance agent</text><text x="1196" y="477.724" fill="#777" font-size="11" textLength="439.232" font-family="Helvetica">La même forme de boucle, d'une démo à la météo simulée à un agent de conformité</text><text x="1196" y="494.908" fill="#000" font-size="15" textLength="256.794" font-family="Helvetica">Only the tools and plumbing change</text><text x="1196" y="509.183" fill="#777" font-size="11" textLength="211.122" font-family="Helvetica">Seuls les outils et la plomberie changent</text></g><!--entity SEND--><g class="entity" data-qualified-name="LOOP.SEND" id="ent0003" data-source-line="23"><rect x="54" y="287.459" width="482.085" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="64" y="311.99" fill="#000" font-size="15" textLength="364.211" font-weight="700" font-family="Helvetica">1. Send a message to Claude with tools available</text><text x="64" y="326.265" fill="#777" font-size="11" textLength="326.536" font-family="Helvetica">Envoyer un message à Claude, avec des outils à sa disposition</text><text x="64" y="343.449" fill="#000" font-size="15" textLength="462.085" font-family="Helvetica">Tools array: a name, a description, a JSON schema for the inputs</text><text x="64" y="357.724" fill="#777" font-size="11" textLength="390.049" font-family="Helvetica">Tableau tools : un nom, une description, un schéma JSON pour les entrées</text></g><!--entity RESPOND--><g class="entity" data-qualified-name="LOOP.RESPOND" id="ent0004" data-source-line="24"><rect x="30.5" y="422.959" width="412.858" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40.5" y="447.49" fill="#000" font-size="15" textLength="146.169" font-weight="700" font-family="Helvetica">2. Claude responds</text><text x="40.5" y="461.765" fill="#777" font-size="11" textLength="77.107" font-family="Helvetica">Claude répond</text><text x="40.5" y="478.949" fill="#000" font-size="15" textLength="375.71" font-family="Helvetica">A final answer, or a request to use a tool you defined</text><text x="40.5" y="493.224" fill="#777" font-size="11" textLength="392.858" font-family="Helvetica">Une réponse finale, ou une demande d'utiliser un outil que vous avez défini</text></g><!--entity RUN--><g class="entity" data-qualified-name="LOOP.RUN" id="ent0005" data-source-line="25"><rect x="256" y="759.459" width="301.719" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="266" y="783.99" fill="#000" font-size="15" textLength="234.873" font-weight="700" font-family="Helvetica">3. Your code executes that tool</text><text x="266" y="798.265" fill="#777" font-size="11" textLength="147.061" font-family="Helvetica">Votre code exécute cet outil</text><text x="266" y="815.449" fill="#000" font-size="15" textLength="281.719" font-weight="700" font-family="Helvetica">4. You send the result back to Claude</text><text x="266" y="829.724" fill="#777" font-size="11" textLength="182.247" font-family="Helvetica">Vous renvoyez le résultat à Claude</text></g><!--entity STOP--><g class="entity" data-qualified-name="LOOP.STOP" id="ent0006" data-source-line="26"><rect x="30.5" y="590.459" width="542.869" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40.5" y="614.99" fill="#000" font-size="15" textLength="90.205" font-weight="700" font-family="Helvetica">Stop reason</text><text x="40.5" y="629.265" fill="#777" font-size="11" textLength="72.418" font-family="Helvetica">Raison d'arrêt</text><text x="40.5" y="646.449" fill="#000" font-size="15" textLength="522.869" font-family="Helvetica">tool_use: run each tool, push the response and tool results into messages</text><text x="40.5" y="660.724" fill="#777" font-size="11" textLength="452.348" font-family="Helvetica">tool_use : exécuter chaque outil, ajouter à messages la réponse et les résultats d'outils</text><text x="40.5" y="677.908" fill="#000" font-size="15" textLength="384.983" font-family="Helvetica">end_turn: Claude is done, print the final text and break</text><text x="40.5" y="692.183" fill="#777" font-size="11" textLength="367.512" font-family="Helvetica">end_turn : Claude a terminé, afficher le texte final et sortir de la boucle</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="586,229.107,590,220.107,586,224.107,582,220.107,586,229.107" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M586,202.599 C586,207.916 586,213.344 586,218.815 C586,221.551 586,224.297 586,227.045 C586,227.733 586,223.42 586,224.107" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="254.609,422.929,261.864,416.268,256.601,418.343,254.526,413.08,254.609,422.929" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M277.283,370.739 C270.087,387.302 263.786,401.806 256.601,418.343" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="281.793,590.191,282.516,580.369,280.103,585.486,274.987,583.073,281.793,590.191" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M251.587,506.079 C260.496,530.885 270.325,558.257 280.103,585.486" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="378.694,759.117,376.854,749.441,375.845,755.007,370.279,753.998,378.694,759.117" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M341.098,704.872 C353.576,722.875 364.288,738.331 375.845,755.007" style="stroke:#555;stroke-width:1;" fill="none"/><text x="366" y="737.053" fill="#000" font-size="13" textLength="51.479" font-family="Helvetica">tool_use</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0003" id="lnk13" data-link-type="dependency"><polygon points="395.875,370.561,401.969,378.297,400.297,372.893,405.701,371.221,395.875,370.561" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M523.827,759.45 C547.377,745.729 569.133,727.761 583,704.459 C608.911,660.919 598.487,638.701 583,590.459 C552.426,495.222 528.243,472.204 452,407.459 C435.318,393.292 420.023,383.297 400.297,372.893" style="stroke:#555;stroke-width:1;" fill="none"/><text x="587.868" y="554.053" fill="#000" font-size="13" textLength="142.003" font-family="Helvetica">5. repeat until end_turn</text><text x="578" y="567.845" fill="#777" font-size="11" textLength="161.74" font-family="Helvetica">recommencer jusqu'à end_turn</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="766.201,407.312,759.509,400.086,761.607,405.34,756.353,407.438,766.201,407.312" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M610.106,340.307 C610.421,340.442 610.739,340.578 611.059,340.716 C611.698,340.99 612.349,341.269 613.009,341.553 C615.651,342.687 618.454,343.89 621.405,345.157 C633.209,350.224 647.371,356.303 662.961,362.995 C694.142,376.38 726.442,390.245 761.607,405.34" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" id="lnk15" data-link-type="dependency"><polygon points="1185.788,408.935,1177.584,403.485,1180.859,408.098,1176.246,411.373,1185.788,408.935" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M610.48,332.561 C611.854,332.71 613.28,332.864 614.759,333.024 C617.716,333.345 620.882,333.689 624.248,334.057 C637.712,335.527 654.371,337.372 673.644,339.554 C712.189,343.919 761.187,349.634 815.979,356.409 C925.564,369.959 1058.327,387.749 1177,407.459 C1179.914,407.943 1177.915,407.599 1180.859,408.098" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src VLVRRjj647tNLqpZ1xM6hTHEWgIAOS2MvQH5OWUsqw10W615hgIroLrcBvBjea0_fQ_AR-Z7UcP9wXA9yPD9xixbp9apepPTIPrAswLRCH6qVoii5PdGFkHPXn_slPkCI8oazlkPCKMdm1VwsUNI2oswf0sziQ8OJzGZQIbJcVxIQVrKM37A1MNYmGHFrU5MozqfNGWhSahbK8JCdnljBqGkwQtC9jAhHAoSSMEHcgdI8ngApCcLBzO4dVQCrTBImU7AXnDhpRHdCcDfvqNyMxqb4uGnoYJztI8wDHPvLsVFun_USa3Nwb7ImOlMFwqZvnyoUTnQl_bUQPM7_9DA_PWEd_tA1vzM9rjUUHox6SiICsBCIDu3KwLb-baVELZl7XmU7oNikhlpykNButU21YOak9YsosjyGtqDyvayUXeF7iC5RiB3CfWdkxidV7ftTs7tOCrk_FgTWS_wH9C8tcYJc-1e8grJHfCPKYyJ8PLxNDDno8KcfSaZarobQIORV7pKSc6ZCeiqvCAO4zf5Sp26QAoaJ3eS2FSRWPLNsAk8k7N939oq4rX9PQBOcaZy7WfPIE4RugcCfEms8BOAs8Kj2sFp6Ll3VsAaBDjBJ9vBdKYx2HP3g1AQ6ditpCpKTSiO4DyT2H_niTA1otMGD1qBttReXdkykvEoe941YnlYFS_2FUFbBHfGPILjK7g0rAtYa_SYLynrv67dCtOc_38Dlfq9Sa5v89I0mKg7ZLIUa71qygP_SKCxlVFUwTdPDYf5t1lvTBf6qcqEtbrUVa0x_NR-wlnvR9Or5mSTkeRSeBovT0v6o9kAA3HLw2PlJEOe0Y46cMmCfAydvW6P1xsmDFzlGJanaGb0SGJnKR27JqvGgbnXdF8WwaQLRqg_ree7W4uQaWGpR2Engk0h_FZ7zUK5kMGi8Mr3o0RN7k8Il6i8yuQJ4A5AgylXeZts8Y_NREC3xCvdUUMaCC76Fk6EWGYuRLXVzo_EQEUqT_QiT_ezqeUT6bUGip0wTOrOrkVcCpwtsG0qL5g0bzfDkMMGju1H9gZdyWK7gOiP4iIUXNrDw3R5edI4Mz4kSCQj4X183dTkcwkcN5dUM4A2DvgmMg6qZqnyt5NRCBdgNt-uR8RbMOV-OcWJ0qVoNYR10sG_vaP61eqO_MbOkAfRQ3jSeqJwCheDo7PtdqS_v9ZiIuMWWKZkbfJ_WJTaQcNa-EDQqozPlZNvZ
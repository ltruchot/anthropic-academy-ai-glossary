<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:956px;height:952px;background:#FFFFFF;" width="956px" height="952px" viewBox="0 0 956 952" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="352.448" y="23.563" fill="#000" font-size="14" textLength="244.104" font-weight="700" font-family="Helvetica">The Claude Platform's three layers</text><text x="355.01" y="38.564" fill="#777" font-size="12" textLength="238.98" font-weight="700" font-family="Helvetica">Les trois couches de la Claude Platform</text></g><!--cluster THREE--><g class="cluster" data-qualified-name="THREE" id="ent0002" data-source-line="22"><rect x="234" y="218.459" width="390" height="584" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="381.821" y="234.99" fill="#000" font-size="15" textLength="94.358" font-weight="700" font-family="Helvetica">Three layers</text><text x="390.041" y="249.265" fill="#777" font-size="11" textLength="77.918" font-weight="700" font-family="Helvetica">Trois couches</text></g><!--entity CP--><g class="entity" data-qualified-name="CP" id="ent0001" data-source-line="20"><rect x="6" y="64.459" width="503.845" height="145.836" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="88.99" fill="#000" font-size="15" textLength="121.465" font-weight="700" font-family="Helvetica">Claude Platform</text><text x="16" y="103.265" fill="#777" font-size="11" textLength="84.262" font-family="Helvetica">Claude Platform</text><text x="16" y="120.449" fill="#000" font-size="15" textLength="483.845" font-family="Helvetica">Anthropic's infrastructure for building with Claude programmatically</text><text x="16" y="134.724" fill="#777" font-size="11" textLength="404.078" font-family="Helvetica">L'infrastructure d'Anthropic pour développer avec Claude par programmation</text><text x="16" y="151.908" fill="#000" font-size="15" textLength="230.457" font-family="Helvetica">REST API, SDKs, CLIs, a console</text><text x="16" y="166.183" fill="#777" font-size="11" textLength="170.629" font-family="Helvetica">API REST, SDK, CLI, une console</text><text x="16" y="183.367" fill="#000" font-size="15" textLength="448.367" font-family="Helvetica">From asking Claude questions to making it part of your product</text><text x="16" y="197.642" fill="#777" font-size="11" textLength="387.111" font-family="Helvetica">Des questions posées à Claude à un Claude qui fait partie de votre produit</text></g><!--entity MA--><g class="entity" data-qualified-name="MA" id="ent0006" data-source-line="28"><rect x="640" y="474.459" width="299.836" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="650" y="498.99" fill="#000" font-size="15" textLength="105.747" font-weight="700" font-family="Helvetica">Messages API</text><text x="650" y="513.265" fill="#777" font-size="11" textLength="73.767" font-family="Helvetica">API Messages</text><text x="650" y="530.449" fill="#000" font-size="15" textLength="271.208" font-family="Helvetica">messages.create: model, max_tokens,</text><text x="650" y="548.599" fill="#000" font-size="15" textLength="279.836" font-family="Helvetica">system (the system prompt), messages</text><text x="650" y="562.873" fill="#777" font-size="11" textLength="201.98" font-family="Helvetica">messages.create : model, max_tokens,</text><text x="650" y="576.183" fill="#777" font-size="11" textLength="204.553" font-family="Helvetica">system (le prompt système), messages</text></g><!--entity CON--><g class="entity" data-qualified-name="CON" id="ent0007" data-source-line="30"><rect x="339" y="822.459" width="345.642" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="349" y="846.99" fill="#000" font-size="15" textLength="119.224" font-weight="700" font-family="Helvetica">Claude Console</text><text x="349" y="861.265" fill="#777" font-size="11" textLength="82.962" font-family="Helvetica">Claude Console</text><text x="349" y="878.449" fill="#000" font-size="15" textLength="325.642" font-family="Helvetica">Keys, usage, managed agents, prompt testing</text><text x="349" y="892.724" fill="#777" font-size="11" textLength="241.726" font-family="Helvetica">Clés, utilisation, agents gérés, test de prompts</text><text x="349" y="909.908" fill="#000" font-size="15" textLength="269.29" font-family="Helvetica">Where infrastructure and controls live</text><text x="349" y="924.183" fill="#777" font-size="11" textLength="241.189" font-family="Helvetica">Là où se trouvent l'infrastructure et le pilotage</text></g><!--entity PR--><g class="entity" data-qualified-name="THREE.PR" id="ent0003" data-source-line="23"><rect x="284" y="276.459" width="323.741" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="294" y="300.99" fill="#000" font-size="15" textLength="73.953" font-weight="700" font-family="Helvetica">Primitives</text><text x="294" y="315.265" fill="#777" font-size="11" textLength="50.794" font-family="Helvetica">Primitives</text><text x="294" y="332.449" fill="#000" font-size="15" textLength="300.923" font-family="Helvetica">Build with: the API building blocks you call</text><text x="294" y="346.724" fill="#777" font-size="11" textLength="246.243" font-family="Helvetica">On construit avec : les briques de base de l'API</text><text x="294" y="363.908" fill="#000" font-size="15" textLength="299.883" font-family="Helvetica">Messages API, tool use, files, web search,</text><text x="294" y="382.058" fill="#000" font-size="15" textLength="253.623" font-family="Helvetica">code execution, MCP servers, skills</text><text x="294" y="396.332" fill="#777" font-size="11" textLength="303.741" font-family="Helvetica">API Messages, utilisation d'outils, fichiers, recherche web,</text><text x="294" y="409.642" fill="#777" font-size="11" textLength="209.988" font-family="Helvetica">exécution de code, serveurs MCP, Skills</text></g><!--entity IN--><g class="entity" data-qualified-name="THREE.IN" id="ent0004" data-source-line="24"><rect x="250.5" y="458.459" width="357.434" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="260.5" y="482.99" fill="#000" font-size="15" textLength="103.154" font-weight="700" font-family="Helvetica">Infrastructure</text><text x="260.5" y="497.265" fill="#777" font-size="11" textLength="70.834" font-family="Helvetica">Infrastructure</text><text x="260.5" y="514.449" fill="#000" font-size="15" textLength="306.145" font-family="Helvetica">Scale on: agentic systems past a prototype</text><text x="260.5" y="528.724" fill="#777" font-size="11" textLength="262.571" font-family="Helvetica">On passe à l'échelle : au-delà du simple prototype</text><text x="260.5" y="545.908" fill="#000" font-size="15" textLength="337.434" font-family="Helvetica">Managed agents, retries, queues, observability,</text><text x="260.5" y="564.058" fill="#000" font-size="15" textLength="178.037" font-family="Helvetica">prompt caching, memory</text><text x="260.5" y="578.332" fill="#777" font-size="11" textLength="260.885" font-family="Helvetica">Agents gérés, nouvelles tentatives, files d'attente,</text><text x="260.5" y="591.642" fill="#777" font-size="11" textLength="268.85" font-family="Helvetica">observabilité, mise en cache des prompts, mémoire</text></g><!--entity CO--><g class="entity" data-qualified-name="THREE.CO" id="ent0005" data-source-line="25"><rect x="260.5" y="640.459" width="316.715" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="270.5" y="664.99" fill="#000" font-size="15" textLength="64.16" font-weight="700" font-family="Helvetica">Controls</text><text x="270.5" y="679.265" fill="#777" font-size="11" textLength="42.249" font-family="Helvetica">Pilotage</text><text x="270.5" y="696.449" fill="#000" font-size="15" textLength="261.431" font-family="Helvetica">Run with: in production, once it's live</text><text x="270.5" y="710.724" fill="#777" font-size="11" textLength="128.756" font-family="Helvetica">On pilote : en production</text><text x="270.5" y="727.908" fill="#000" font-size="15" textLength="230.339" font-family="Helvetica">Dashboards, evals, workspaces,</text><text x="270.5" y="746.058" fill="#000" font-size="15" textLength="260.552" font-family="Helvetica">usage and spend limits, request logs</text><text x="270.5" y="760.332" fill="#777" font-size="11" textLength="261.964" font-family="Helvetica">Tableaux de bord, évaluations, espaces de travail,</text><text x="270.5" y="773.642" fill="#777" font-size="11" textLength="296.715" font-family="Helvetica">limites d'utilisation et de dépenses, journaux de requêtes</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-link-type="dependency"><polygon points="258,217.919,262,208.919,258,212.919,254,208.919,258,217.919" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M258,210.729 C258,212.19 258,213.66 258,215.138 C258,215.877 258,216.619 258,217.362 C258,217.547 258,212.733 258,212.919" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="682.748,474.339,676.628,466.622,678.318,472.021,672.919,473.71,682.748,474.339" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M583.936,422.635 C616.834,439.849 647.034,455.651 678.318,472.021" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk12" data-link-type="dependency"><polygon points="576.067,822.097,584.509,817.024,578.938,818.003,577.959,812.431,576.0
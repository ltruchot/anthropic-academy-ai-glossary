<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1152px;height:927px;background:#FFFFFF;" width="1152px" height="927px" viewBox="0 0 1152 927" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="512.778" y="23.563" fill="#000" font-size="14" textLength="119.444" font-weight="700" font-family="Helvetica">What is tool use?</text><text x="465.871" y="38.564" fill="#777" font-size="12" textLength="213.258" font-weight="700" font-family="Helvetica">Qu'est-ce que l'utilisation d'outils ?</text></g><!--cluster FLOW--><g class="cluster" data-qualified-name="FLOW" id="ent0003" data-source-line="24"><rect x="14" y="443.459" width="532" height="460" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="247.583" y="459.99" fill="#000" font-size="15" textLength="64.834" font-weight="700" font-family="Helvetica">Tool use</text><text x="230.331" y="474.265" fill="#777" font-size="11" textLength="99.338" font-weight="700" font-family="Helvetica">Utilisation d'outils</text></g><!--entity TOOL--><g class="entity" data-qualified-name="TOOL" id="ent0001" data-source-line="20"><rect x="293.5" y="56.459" width="456.824" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="303.5" y="80.99" fill="#000" font-size="15" textLength="33.677" font-weight="700" font-family="Helvetica">Tool</text><text x="303.5" y="95.265" fill="#777" font-size="11" textLength="24.208" font-family="Helvetica">Outil</text><text x="303.5" y="112.449" fill="#000" font-size="15" textLength="311.602" font-family="Helvetica">A function you define and expose to Claude</text><text x="303.5" y="126.724" fill="#777" font-size="11" textLength="363.36" font-family="Helvetica">Une fonction que vous définissez et mettez à la disposition de Claude</text><text x="303.5" y="143.908" fill="#000" font-size="15" textLength="350.164" font-family="Helvetica">Gives Claude access to external data and actions</text><text x="303.5" y="158.183" fill="#777" font-size="11" textLength="330.161" font-family="Helvetica">Donne à Claude accès à des données et à des actions externes</text><text x="303.5" y="175.367" fill="#000" font-size="15" textLength="436.824" font-family="Helvetica">In real life: a thin wrapper around a function you already have</text><text x="303.5" y="189.642" fill="#777" font-size="11" textLength="371.379" font-family="Helvetica">En pratique : une fine couche autour d'une fonction que vous avez déjà</text></g><!--entity DEF--><g class="entity" data-qualified-name="DEF" id="ent0002" data-source-line="22"><rect x="306.5" y="239.459" width="430.823" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="316.5" y="263.99" fill="#000" font-size="15" textLength="85.195" font-weight="700" font-family="Helvetica">Tools array</text><text x="316.5" y="278.265" fill="#777" font-size="11" textLength="70.855" font-family="Helvetica">Tableau tools</text><text x="316.5" y="295.449" fill="#000" font-size="15" textLength="352.317" font-family="Helvetica">Each tool: a name, a description, an input schema</text><text x="316.5" y="309.724" fill="#777" font-size="11" textLength="328.555" font-family="Helvetica">Chaque outil : un nom, une description, un schéma des entrées</text><text x="316.5" y="326.908" fill="#000" font-size="15" textLength="122.329" font-weight="700" font-family="Helvetica">Tool description</text><text x="316.5" y="341.183" fill="#777" font-size="11" textLength="110.956" font-family="Helvetica">Description d'un outil</text><text x="316.5" y="358.367" fill="#000" font-size="15" textLength="373.901" font-family="Helvetica">What Claude reads to decide whether to call the tool</text><text x="316.5" y="372.642" fill="#777" font-size="11" textLength="282.584" font-family="Helvetica">Ce que Claude lit pour décider d'appeler ou non l'outil</text><text x="316.5" y="389.826" fill="#000" font-size="15" textLength="410.823" font-family="Helvetica">Vague: the number one reason agents misfire. Be specific</text><text x="316.5" y="404.101" fill="#777" font-size="11" textLength="315.498" font-family="Helvetica">Vague : la première cause de ratés des agents. Soyez précis</text></g><!--entity SPECTRUM--><g class="entity" data-qualified-name="SPECTRUM" id="ent0007" data-source-line="30"><rect x="562" y="621.459" width="582.236" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="572" y="645.99" fill="#000" font-size="15" textLength="285.82" font-weight="700" font-family="Helvetica">You execute, or you delegate the loop</text><text x="572" y="660.265" fill="#777" font-size="11" textLength="319.725" font-family="Helvetica">Soit vous exécutez vous-même, soit vous déléguez la boucle</text><text x="572" y="677.449" fill="#000" font-size="15" textLength="498.801" font-family="Helvetica">Your own loop: while, stop reason switch, tool results pushed by hand</text><text x="572" y="691.724" fill="#777" font-size="11" textLength="469.514" font-family="Helvetica">Votre propre boucle : while, switch sur la raison d'arrêt, résultats d'outils ajoutés à la main</text><text x="572" y="708.908" fill="#000" font-size="15" textLength="562.236" font-family="Helvetica">Tool runner (Claude SDK): schemas built from your functions, the loop handled</text><text x="572" y="723.183" fill="#777" font-size="11" textLength="431.476" font-family="Helvetica">Tool runner (SDK Claude) : schémas tirés de vos fonctions, boucle prise en charge</text><text x="572" y="740.367" fill="#000" font-size="15" textLength="408.149" font-family="Helvetica">Managed agents: the whole agent delegated to Anthropic</text><text x="572" y="754.642" fill="#777" font-size="11" textLength="246.098" font-family="Helvetica">Agents gérés : tout l'agent délégué à Anthropic</text></g><!--entity REQUEST--><g class="entity" data-qualified-name="FLOW.REQUEST" id="ent0004" data-source-line="25"><rect x="198.5" y="501.459" width="261.238" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="208.5" y="525.99" fill="#000" font-size="15" textLength="216.182" font-weight="700" font-family="Helvetica">1. Claude requests a tool call</text><text x="208.5" y="540.265" fill="#777" font-size="11" textLength="172.396" font-family="Helvetica">Claude demande un appel d'outil</text><text x="208.5" y="557.449" fill="#000" font-size="15" textLength="241.238" font-family="Helvetica">stop_reason: tool_use, your signal</text><text x="208.5" y="571.724" fill="#777" font-size="11" textLength="183.509" font-family="Helvetica">stop_reason : tool_use, votre signal</text></g><!--entity EXECUTE--><g class="entity" data-qualified-name="FLOW.EXECUTE" id="ent0005" data-source-line="26"><rect x="38.5" y="652.959" width="320.738" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="48.5" y="677.49" fill="#000" font-size="15" textLength="262.8" font-weight="700" font-family="Helvetica">2. Your code executes the function</text><text x="48.5" y="691.765" fill="#777" font-size="11" textLength="160.386" font-family="Helvetica">Votre code exécute la fonction</text><text x="48.5" y="708.949" fill="#000" font-size="15" textLength="285.586" font-family="Helvetica">Several tools: dispatch on the tool name</text><text x="48.5" y="723.224" fill="#777" font-size="11" textLength="300.738" font-family="Helvetica">Plusieurs outils : répartir les appels selon le nom de l'outil</text></g><!--entity RESULT--><g class="entity" data-qualified-name="FLOW.RESULT" id="ent0006" data-source-line="27"><rect x="30" y="804.459" width="499.766" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40" y="828.99" fill="#000" font-size="15" textLength="252.546" font-weight="700" font-family="Helvetica">3. The result goes back to Claude</text><text x="40" y="843.265" fill="#777" font-size="11" textLength="168.685" font-family="Helvetica">Le résultat est renvoyé à Claude</text><text x="40" y="860.449" fill="#000" font-size="15" textLength="479.766" font-family="Helvetica">A tool result: a user message, a tool_result block tied to the call's id</text><text x="40" y="874.724" fill="#777" font-size="11" textLength="391.445" font-family="Helvetica">Un résultat d'outil : un message user, un bloc tool_result lié à l'id de l'appel</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="522,239.222,526,230.222,522,234.222,518,230.222,522,239.222" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M522,202.513 C522,214.452 522,221.948 522,234.222" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="522,443.272,526,434.272,522,438.272,518,434.272,522,443.272" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M522,416.516 C522,422.053 522,427.66 522,433.275 C522,436.082 522,438.892 522,441.695 C522,442.046 522,442.396 522,442.746 C522,442.922 522,438.097 522,438.272" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="234.255,652.916,243.179,648.749,237.536,649.143,237.142,643.5,234.255,652.916" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M293.477,584.811 C275.059,605.992 255.915,628.007 237.536,649.143" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="258.034,804.416,257.263,794.597,255.652,800.02,250.229,798.408,258.034,804.416" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M221.134,736.311 C232.61,757.492 244.2,778.884 255.652,800.02" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="354.634,584.76,355.201,594.593,356.924,589.205,362.312,590.928,354.634,584.76" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M341.465,804.066 C352.632,793.555 362.719,781.258 369,767.459 C395.884,708.401 384.313,684.515 369,621.459 C365.963,608.952 362.823,600.651 356.924,589.205" style="stroke:#555;stroke-width:1;" fill="none"/><text x="387" y="692.553" fill="#000" font-size="13" textLength="122.599" font-family="Helvetica">Claude keeps going</text><text x="405.776" y="706.345" fill="#777" font-size="11" textLength="85.046" font-family="Helvetica">Claude continue</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="693.196,621.282,686.64,613.932,688.639,619.224,683.347,621.223,693.196,621.282" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M546.21,554.894 C546.807,555.163 547.414,555.437 548.029,555.715 C550.491,556.827 553.102,558.006 555.848,559.247 C566.834,564.209 579.998,570.155 594.588,576.744 C623.768,589.924 654.091,603.619 688.639,619.224" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src VLTTSnCt57tthxWb3ouPnv1G1kfcmYJ-e9s61d02xGmpZB8hUnLaQIjfRP8E_uL7pD_m7-kvsdNin5xoabsjxeVEFVTSkKblfKcbwz2Lc0hQknAESYrCA2QwpIzxmK_75ApLUuMNxHphzBEVo22Cw92nzDA9F9kg6p9IfZ9zs6xyb3indWZIujeMWQhDZOR_f4mkd9XGAaUYq65WJVXBJ2JzBlLK1fM8jJq-4wcTAJEcaT1UhdrnjZ1frpeZ7UqVh7quTixEkbPRHpjFuz-wbKoGnbXB-gz1T68TJbtj7SG_h792GtKZQVzfuqlZq8ThBOyQTorVAQCcnUIzIaD61qyUyyP7rSv6K07RtcSYa
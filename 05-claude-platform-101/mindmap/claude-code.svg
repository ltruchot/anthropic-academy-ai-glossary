<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:708px;height:676px;background:#FFFFFF;" width="708px" height="676px" viewBox="0 0 708 676" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="258.02" y="23.563" fill="#000" font-size="14" textLength="184.96" font-weight="700" font-family="Helvetica">Building with Claude Code</text><text x="258.941" y="38.564" fill="#777" font-size="12" textLength="183.117" font-weight="700" font-family="Helvetica">Développer avec Claude Code</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0001" data-source-line="20"><rect x="170.5" y="64.459" width="338.527" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="180.5" y="88.99" fill="#000" font-size="15" textLength="97.097" font-weight="700" font-family="Helvetica">Claude Code</text><text x="180.5" y="103.265" fill="#777" font-size="11" textLength="67.767" font-family="Helvetica">Claude Code</text><text x="180.5" y="120.449" fill="#000" font-size="15" textLength="316.348" font-family="Helvetica">An agent that edits files and runs commands</text><text x="180.5" y="138.599" fill="#000" font-size="15" textLength="139.841" font-family="Helvetica">inside your terminal</text><text x="180.5" y="152.873" fill="#777" font-size="11" textLength="318.527" font-family="Helvetica">Un agent qui modifie des fichiers et exécute des commandes</text><text x="180.5" y="166.183" fill="#777" font-size="11" textLength="100.493" font-family="Helvetica">dans votre terminal</text></g><!--entity SKILL--><g class="entity" data-qualified-name="SKILL" id="ent0002" data-source-line="22"><rect x="6" y="214.459" width="348.03" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="238.99" fill="#000" font-size="15" textLength="117.312" font-weight="700" font-family="Helvetica">Claude API skill</text><text x="16" y="253.265" fill="#777" font-size="11" textLength="82.468" font-family="Helvetica">Skill Claude API</text><text x="16" y="270.449" fill="#000" font-size="15" textLength="48.069" font-family="Helvetica">Built in</text><text x="16" y="284.724" fill="#777" font-size="11" textLength="36.765" font-family="Helvetica">Intégré</text><text x="16" y="301.908" fill="#000" font-size="15" textLength="328.03" font-family="Helvetica">Automatic when it detects the TypeScript SDK</text><text x="16" y="316.183" fill="#777" font-size="11" textLength="251.12" font-family="Helvetica">Automatique quand il détecte le SDK TypeScript</text><text x="16" y="333.367" fill="#000" font-size="15" textLength="200.581" font-family="Helvetica">Or invoke it with /claude-api</text><text x="16" y="347.642" fill="#777" font-size="11" textLength="154.075" font-family="Helvetica">Ou le lancer avec /claude-api</text></g><!--entity PROMPT--><g class="entity" data-qualified-name="PROMPT" id="ent0003" data-source-line="24"><rect x="372" y="214.459" width="257.817" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="382" y="238.99" fill="#000" font-size="15" textLength="88.572" font-weight="700" font-family="Helvetica">One prompt</text><text x="382" y="253.265" fill="#777" font-size="11" textLength="80.067" font-family="Helvetica">Un seul prompt</text><text x="382" y="270.449" fill="#000" font-size="15" textLength="237.817" font-family="Helvetica">Names the file you want changed</text><text x="382" y="284.724" fill="#777" font-size="11" textLength="144.225" font-family="Helvetica">Nomme le fichier à modifier</text><text x="382" y="301.908" fill="#000" font-size="15" textLength="190.327" font-family="Helvetica">The pattern you want used</text><text x="382" y="316.183" fill="#777" font-size="11" textLength="141.587" font-family="Helvetica">Indique l'approche à suivre</text><text x="382" y="333.367" fill="#000" font-size="15" textLength="180.498" font-family="Helvetica">The end state you expect</text><text x="382" y="347.642" fill="#777" font-size="11" textLength="128.401" font-family="Helvetica">Décrit l'état final attendu</text></g><!--entity WORK--><g class="entity" data-qualified-name="WORK" id="ent0004" data-source-line="26"><rect x="310" y="396.459" width="382.065" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="320" y="420.99" fill="#000" font-size="15" textLength="104.216" font-weight="700" font-family="Helvetica">Working code</text><text x="320" y="435.265" fill="#777" font-size="11" textLength="121.376" font-family="Helvetica">Du code qui fonctionne</text><text x="320" y="452.449" fill="#000" font-size="15" textLength="362.065" font-family="Helvetica">Fills in the stubs, runs the script, reports the output</text><text x="320" y="466.724" fill="#777" font-size="11" textLength="294.411" font-family="Helvetica">Complète le squelette, exécute le script, affiche la sortie</text><text x="320" y="483.908" fill="#000" font-size="15" textLength="163.813" font-family="Helvetica">Patches errors in place</text><text x="320" y="498.183" fill="#777" font-size="11" textLength="239.905" font-family="Helvetica">Corrige les erreurs directement dans le fichier</text></g><!--entity SHAPE--><g class="entity" data-qualified-name="SHAPE" id="ent0005" data-source-line="28"><rect x="315.5" y="546.459" width="370.896" height="114.377" fill="#F9F8F4" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="325.5" y="570.99" fill="#000" font-size="15" textLength="138.955" font-weight="700" font-family="Helvetica">The familiar shape</text><text x="325.5" y="585.265" fill="#777" font-size="11" textLength="116.644" font-family="Helvetica">La structure habituelle</text><text x="325.5" y="602.449" fill="#000" font-size="15" textLength="350.896" font-family="Helvetica">Define a tool, hand it to a runner, return the result</text><text x="325.5" y="616.724" fill="#777" font-size="11" textLength="301.829" font-family="Helvetica">Définir un outil, le confier à un runner, renvoyer le résultat</text><text x="325.5" y="633.908" fill="#000" font-size="15" textLength="239.619" font-family="Helvetica">Stub it, delegate it, review the diff</text><text x="325.5" y="648.183" fill="#777" font-size="11" textLength="234.438" font-family="Helvetica">Écrire le squelette, déléguer, examiner le diff</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="250.424,214.274,259.572,210.626,253.916,210.696,253.846,205.039,250.424,214.274" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M284.937,178.898 C273.818,190.295 265.477,198.845 253.916,210.696" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="430.136,214.274,426.685,205.05,426.633,210.706,420.977,210.654,430.136,214.274" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M395.407,178.898 C406.595,190.295 414.999,198.855 426.633,210.706" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="501,396.199,505,387.199,501,391.199,497,387.199,501,396.199" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M501,360.869 C501,372.711 501,379.822 501,391.199" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="501,546.241,505,537.241,501,541.241,497,537.241,501,546.241" fill="#555" style="stroke:#555;stroke-width:1;strok
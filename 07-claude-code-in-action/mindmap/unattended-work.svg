<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2889px;height:432px;background:#FFFFFF;" width="2889px" height="432px" viewBox="0 0 2889 432" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1356.204" y="23.563" fill="#000" font-size="14" textLength="170.092" font-weight="700" font-family="Helvetica">Handing off repeat work</text><text x="1365.975" y="38.564" fill="#777" font-size="12" textLength="150.551" font-weight="700" font-family="Helvetica">Confier le travail répétitif</text></g><!--entity HO--><g class="entity" data-qualified-name="HO" id="ent0001" data-source-line="20"><rect x="1200" y="64.459" width="479.535" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1210" y="88.99" fill="#000" font-size="15" textLength="182.241" font-weight="700" font-family="Helvetica">Handing off repeat work</text><text x="1210" y="103.265" fill="#777" font-size="11" textLength="129.411" font-family="Helvetica">Confier le travail répétitif</text><text x="1210" y="120.449" fill="#000" font-size="15" textLength="403.799" font-family="Helvetica">Once you trust Claude to do a task, stop doing it by hand</text><text x="1210" y="134.724" fill="#777" font-size="11" textLength="459.535" font-family="Helvetica">Une fois que vous faites confiance à Claude pour une tâche, arrêtez de la faire à la main</text></g><!--entity CST--><g class="entity" data-qualified-name="CST" id="ent0002" data-source-line="21"><rect x="6" y="183.459" width="542.334" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="207.99" fill="#000" font-size="15" textLength="162.708" font-weight="700" font-family="Helvetica">Cloud scheduled task</text><text x="16" y="222.265" fill="#777" font-size="11" textLength="112.481" font-family="Helvetica">Tâche planifiée cloud</text><text x="16" y="239.449" fill="#000" font-size="15" textLength="522.334" font-family="Helvetica">The default for repeat work: on Anthropic's infrastructure, nothing to host</text><text x="16" y="253.724" fill="#777" font-size="11" textLength="473.945" font-family="Helvetica">Le choix par défaut pour le travail répétitif : sur l'infrastructure d'Anthropic, rien à héberger</text><text x="16" y="270.908" fill="#000" font-size="15" textLength="418.33" font-family="Helvetica">Fires on a cron schedule, an HTTP POST or a GitHub event</text><text x="16" y="285.183" fill="#777" font-size="11" textLength="390.908" font-family="Helvetica">Lancée par une planification cron, un HTTP POST ou un événement GitHub</text></g><!--entity HM--><g class="entity" data-qualified-name="HM" id="ent0003" data-source-line="22"><rect x="566.5" y="198.959" width="351.245" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="576.5" y="223.49" fill="#000" font-size="15" textLength="116.118" font-weight="700" font-family="Helvetica">Headless mode</text><text x="576.5" y="237.765" fill="#777" font-size="11" textLength="79.659" font-family="Helvetica">Mode headless</text><text x="576.5" y="254.949" fill="#000" font-size="15" textLength="331.245" font-family="Helvetica">-p: a one-shot command for your own pipeline</text><text x="576.5" y="269.224" fill="#777" font-size="11" textLength="299.03" font-family="Helvetica">-p : une commande ponctuelle pour votre propre pipeline</text></g><!--entity SO--><g class="entity" data-qualified-name="SO" id="ent0004" data-source-line="23"><rect x="399.5" y="333.459" width="332.883" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="409.5" y="357.99" fill="#000" font-size="15" textLength="133.806" font-weight="700" font-family="Helvetica">structured_output</text><text x="409.5" y="372.265" fill="#777" font-size="11" textLength="92.281" font-family="Helvetica">structured_output</text><text x="409.5" y="389.449" fill="#000" font-size="15" textLength="312.883" font-family="Helvetica">The object that matches your JSON schema</text><text x="409.5" y="403.724" fill="#777" font-size="11" textLength="205.192" font-family="Helvetica">L'objet conforme à votre schéma JSON</text></g><!--entity BM--><g class="entity" data-qualified-name="BM" id="ent0005" data-source-line="24"><rect x="750.5" y="333.459" width="333.103" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="760.5" y="357.99" fill="#000" font-size="15" textLength="80.662" font-weight="700" font-family="Helvetica">Bare mode</text><text x="760.5" y="372.265" fill="#777" font-size="11" textLength="56.241" font-family="Helvetica">Mode bare</text><text x="760.5" y="389.449" fill="#000" font-size="15" textLength="313.103" font-family="Helvetica">--bare: the same setup on every CI machine</text><text x="760.5" y="403.724" fill="#777" font-size="11" textLength="298.327" font-family="Helvetica">--bare : la même configuration sur chaque machine de CI</text></g><!--entity SDK--><g class="entity" data-qualified-name="SDK" id="ent0006" data-source-line="25"><rect x="936" y="198.959" width="464.272" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="946" y="223.49" fill="#000" font-size="15" textLength="80.559" font-weight="700" font-family="Helvetica">Agent SDK</text><text x="946" y="237.765" fill="#777" font-size="11" textLength="56.327" font-family="Helvetica">Agent SDK</text><text x="946" y="254.949" fill="#000" font-size="15" textLength="444.272" font-family="Helvetica">Claude Code inside your own product, in TypeScript or Python</text><text x="946" y="269.224" fill="#777" font-size="11" textLength="354.906" font-family="Helvetica">Claude Code dans votre propre produit, en TypeScript ou en Python</text></g><!--entity CR--><g class="entity" data-qualified-name="CR" id="ent0007" data-source-line="26"><rect x="1418.5" y="198.959" width="588.756" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1428.5" y="223.49" fill="#000" font-size="15" textLength="98.269" font-weight="700" font-family="Helvetica">Code Review</text><text x="1428.5" y="237.765" fill="#777" font-size="11" textLength="68.626" font-family="Helvetica">Code Review</text><text x="1428.5" y="254.949" fill="#000" font-size="15" textLength="537.861" font-family="Helvetica">The managed path for PR reviews: inline findings, never approves or blocks</text><text x="1428.5" y="269.224" fill="#777" font-size="11" textLength="568.756" font-family="Helvetica">La voie gérée pour les revues de PR : publie ses constats sur les lignes, n'approuve ni ne bloque jamais la PR</text></g><!--entity GA--><g class="entity" data-qualified-name="GA" id="ent0008" data-source-line="27"><rect x="2025.5" y="198.959" width="378.95" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2035.5" y="223.49" fill="#000" font-size="15" textLength="104.092" font-weight="700" font-family="Helvetica">GitHub Action</text><text x="2035.5" y="237.765" fill="#777" font-size="11" textLength="72.209" font-family="Helvetica">GitHub Action</text><text x="2035.5" y="254.949" fill="#000" font-size="15" textLength="337.917" font-family="Helvetica">The do-it-yourself path, for jobs beyond review</text><text x="2035.5" y="269.224" fill="#777" font-size="11" textLength="358.95" font-family="Helvetica">La voie « faites-le vous-même », pour les tâches au-delà de la revue</text></g><!--entity CA--><g class="entity" data-qualified-name="CA" id="ent0009" data-source-line="28"><rect x="2063.5" y="333.459" width="303.308" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2073.5" y="357.99" fill="#000" font-size="15" textLength="91.106" font-weight="700" font-family="Helvetica">claude_args</text><text x="2073.5" y="372.265" fill="#777" font-size="11" textLength="63.03" font-family="Helvetica">claude_args</text><text x="2073.5" y="389.449" fill="#000" font-size="15" textLength="283.308" font-family="Helvetica">Where the tuning lives, like --max-turns</text><text x="2073.5" y="403.724" fill="#777" font-size="11" textLength="230.27" font-family="Helvetica">Là où se fait le réglage, comme --max-turns</text></g><!--entity UR--><g class="entity" data-qualified-name="UR" id="ent0010" data-source-line="29"><rect x="2422.5" y="183.459" width="451.257" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2432.5" y="207.99" fill="#000" font-size="15" textLength="132.927" font-weight="700" font-family="Helvetica">Unsupervised run</text><text x="2432.5" y="222.265" fill="#777" font-size="11" textLength="144.794" font-family="Helvetica">Exécution sans surveillance</text><text x="2432.5" y="239.449" fill="#000" font-size="15" textLength="302.908" font-family="Helvetica">The less you watched, the more you verify</text><text x="2432.5" y="253.724" fill="#777" font-size="11" textLength="233.138" font-family="Helvetica">Moins vous avez surveillé, plus vous vérifiez</text><text x="2432.5" y="270.908" fill="#000" font-size="15" textLength="431.257" font-family="Helvetica">Start with the diff, not the summary; turn the tests into a gate</text><text x="2432.5" y="285.183" fill="#777" font-size="11" textLength="309.595" font-family="Helvetica">Partir du diff, pas du résumé ; faire de vos tests un contrôle</text></g><!--entity CSO--><g class="entity" data-qualified-name="CSO" id="ent0011" data-source-line="30"><rect x="2439" y="333.459" width="417.727" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2449" y="357.99" fill="#000" font-size="15" textLength="154.109" font-weight="700" font-family="Helvetica">Cold second opinion</text><text x="2449" y="372.265" fill="#777" font-size="11" textLength="100.08" font-family="Helvetica">Second avis à froid</text><text x="2449" y="389.449" fill="#000" font-size="15" textLength="397.727" font-family="Helvetica">A fresh session or sub-agent reviews the changed code</text><text x="2449" y="403.724" fill="#777" font-size="11" textLength="312.603" font-family="Helvetica">Une nouvelle session ou un sous-agent relit le code modifié</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-link-type="dependency"><polygon points="548.121,184.753,557.612,187.387,553.067,184.018,556.436,179.474,548.121,184.753" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1199.795,120.543 C1021.761,132.363 773.493,152.529 557,183.459 C554.055,183.88 556.041,183.576 553.067,184.018" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk13" data-link-type="dependency"><polygon points="866.981,198.935,876.733,200.314,871.789,197.564,874.539,192.621,866.981,198.935" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1199.845,135.39 C1113.329,147.571 1015.297,163.623 927,183.459 C907.437,187.854 891.737,191.877 871.789,197.564" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk14" data-link-type="dependency"><polygon points="620.063,333.258,629.659,331.041,624.057,330.251,624.847,324.65,620.063,333.258" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M687.758,282.295 C666.245,298.491 645.553,314.068 624.057,330.251" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk15" data-link-type="dependency"><polygon points="863.244,333.258,858.484,324.637,859.258,330.24,853.654,331.015,863.244,333.258" fill="#555" style="stroke:#555;stroke-wi
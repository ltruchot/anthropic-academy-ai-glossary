<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2826px;height:526px;background:#FFFFFF;" width="2826px" height="526px" viewBox="0 0 2826 526" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1387.523" y="23.563" fill="#000" font-size="14" textLength="44.454" font-weight="700" font-family="Helvetica">Hooks</text><text x="1379.302" y="38.564" fill="#777" font-size="12" textLength="60.896" font-weight="700" font-family="Helvetica">Les hooks</text></g><!--entity HK--><g class="entity" data-qualified-name="HK" id="ent0001" data-source-line="20"><rect x="1299.5" y="64.459" width="408.206" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1309.5" y="88.99" fill="#000" font-size="15" textLength="39.243" font-weight="700" font-family="Helvetica">Hook</text><text x="1309.5" y="103.265" fill="#777" font-size="11" textLength="27.403" font-family="Helvetica">Hook</text><text x="1309.5" y="120.449" fill="#000" font-size="15" textLength="388.206" font-family="Helvetica">Deterministic code that runs at a fixed point in the loop</text><text x="1309.5" y="134.724" fill="#777" font-size="11" textLength="328.066" font-family="Helvetica">Du code déterministe qui s'exécute à un point fixe de la boucle</text><text x="1309.5" y="151.908" fill="#000" font-size="15" textLength="380.984" font-family="Helvetica">From “Claude usually listens” to “Claude can't skip it”</text><text x="1309.5" y="166.183" fill="#777" font-size="11" textLength="349.809" font-family="Helvetica">De « Claude écoute en général » à « Claude ne peut pas l'ignorer »</text></g><!--entity HE--><g class="entity" data-qualified-name="HE" id="ent0002" data-source-line="21"><rect x="6" y="230.459" width="651.399" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="254.99" fill="#000" font-size="15" textLength="85.496" font-weight="700" font-family="Helvetica">Hook event</text><text x="16" y="269.265" fill="#777" font-size="11" textLength="103.334" font-family="Helvetica">Événement de hook</text><text x="16" y="286.449" fill="#000" font-size="15" textLength="631.399" font-family="Helvetica">About 30 in a session; PreToolUse before a tool call, PostToolUse after a successful one</text><text x="16" y="300.724" fill="#777" font-size="11" textLength="507.456" font-family="Helvetica">Une trentaine par session ; PreToolUse avant un appel d'outil, PostToolUse après un appel réussi</text><text x="16" y="317.908" fill="#000" font-size="15" textLength="602.256" font-family="Helvetica">Stop when Claude wants to end its turn; SessionStart at the start; InstructionsLoaded</text><text x="16" y="332.183" fill="#777" font-size="11" textLength="477.743" font-family="Helvetica">Stop quand Claude veut terminer son tour ; SessionStart au démarrage ; InstructionsLoaded</text></g><!--entity PT--><g class="entity" data-qualified-name="PT" id="ent0003" data-source-line="22"><rect x="675.5" y="230.459" width="609.923" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="685.5" y="254.99" fill="#000" font-size="15" textLength="137.139" font-weight="700" font-family="Helvetica">Pre-tool-use hook</text><text x="685.5" y="269.265" fill="#777" font-size="11" textLength="91.803" font-family="Helvetica">Hook PreToolUse</text><text x="685.5" y="286.449" fill="#000" font-size="15" textLength="489.148" font-family="Helvetica">The enforcement primitive: talks back by printing JSON and exiting 0</text><text x="685.5" y="300.724" fill="#777" font-size="11" textLength="589.923" font-family="Helvetica">Le mécanisme de base pour faire respecter les règles : répond en affichant du JSON et en sortant avec le code 0</text><text x="685.5" y="317.908" fill="#000" font-size="15" textLength="416.008" font-family="Helvetica">permissionDecision: allow, deny, ask; defer only in -p runs</text><text x="685.5" y="332.183" fill="#777" font-size="11" textLength="333.115" font-family="Helvetica">permissionDecision : allow, deny, ask ; defer seulement avec -p</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" id="ent0004" data-source-line="23"><rect x="696" y="396.459" width="569.36" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="706" y="420.99" fill="#000" font-size="15" textLength="99.976" font-weight="700" font-family="Helvetica">updatedInput</text><text x="706" y="435.265" fill="#777" font-size="11" textLength="69.19" font-family="Helvetica">updatedInput</text><text x="706" y="452.449" fill="#000" font-size="15" textLength="549.36" font-family="Helvetica">Rewrites the call instead of blocking it: strips a secret, the command still runs</text><text x="706" y="466.724" fill="#777" font-size="11" textLength="474.488" font-family="Helvetica">Réécrit l'appel au lieu de le bloquer : retire un secret, la commande s'exécute quand même</text><text x="706" y="483.908" fill="#000" font-size="15" textLength="289.849" font-family="Helvetica">Echo back the fields you aren't changing</text><text x="706" y="498.183" fill="#777" font-size="11" textLength="248.499" font-family="Helvetica">Remettez les champs que vous ne modifiez pas</text></g><!--entity EC--><g class="entity" data-qualified-name="EC" id="ent0005" data-source-line="24"><rect x="1304" y="214.459" width="398.999" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1314" y="238.99" fill="#000" font-size="15" textLength="69.207" font-weight="700" font-family="Helvetica">Exit code</text><text x="1314" y="253.265" fill="#777" font-size="11" textLength="76.334" font-family="Helvetica">Code de sortie</text><text x="1314" y="270.449" fill="#000" font-size="15" textLength="315.015" font-family="Helvetica">0: success, standard out parsed if it is JSON</text><text x="1314" y="284.724" fill="#777" font-size="11" textLength="308.36" font-family="Helvetica">0 : succès, la sortie standard est analysée si c'est du JSON</text><text x="1314" y="301.908" fill="#000" font-size="15" textLength="378.999" font-family="Helvetica">2: a blocking error, standard error fed back to Claude</text><text x="1314" y="316.183" fill="#777" font-size="11" textLength="339.12" font-family="Helvetica">2 : une erreur bloquante, l'erreur standard est renvoyée à Claude</text><text x="1314" y="333.367" fill="#000" font-size="15" textLength="363.494" font-family="Helvetica">Anything else: non-blocking, standard error logged</text><text x="1314" y="347.642" fill="#777" font-size="11" textLength="332.986" font-family="Helvetica">Tout autre code : non bloquant, l'erreur standard est journalisée</text></g><!--entity SH--><g class="entity" data-qualified-name="SH" id="ent0006" data-source-line="25"><rect x="1721" y="245.959" width="390.627" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1731" y="270.49" fill="#000" font-size="15" textLength="75.769" font-weight="700" font-family="Helvetica">Stop hook</text><text x="1731" y="284.765" fill="#777" font-size="11" textLength="54.484" font-family="Helvetica">Hook Stop</text><text x="1731" y="301.949" fill="#000" font-size="15" textLength="368.262" font-family="Helvetica">Gates the turn: exit code 2 tells Claude it's not done</text><text x="1731" y="316.224" fill="#777" font-size="11" textLength="370.627" font-family="Helvetica">Contrôle la fin du tour : le code de sortie 2 dit à Claude qu'il n'a pas fini</text></g><!--entity SS--><g class="entity" data-qualified-name="SS" id="ent0007" data-source-line="26"><rect x="2130.5" y="245.959" width="679.905" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2140.5" y="270.49" fill="#000" font-size="15" textLength="136.011" font-weight="700" font-family="Helvetica">SessionStart hook</text><text x="2140.5" y="284.765" fill="#777" font-size="11" textLength="95.912" font-family="Helvetica">Hook SessionStart</text><text x="2140.5" y="301.949" fill="#000" font-size="15" textLength="659.905" font-family="Helvetica">With the compact matcher, the hook to re-inject context after compaction (not PostCompact)</text><text x="2140.5" y="316.224" fill="#777" font-size="11" textLength="533.865" font-family="Helvetica">Avec le matcher compact, le hook pour réinjecter du contexte après la compaction (pas PostCompact)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="578.395,230.415,587.999,232.599,583.3,229.448,586.451,224.75,578.395,230.415" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1299.327,139.024 C1129.367,154.22 881.337,179.659 666.5,214.459 C637.873,219.096 612.906,223.611 583.3,229.448" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="1159.314,230.387,1169.099,231.511,1164.085,228.891,1166.705,223.878,1159.314,230.387" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1324.61,178.554 C1271.217,195.297 1217.474,212.15 1164.085,228.891" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="980.5,396.193,984.5,387.193,980.5,391.193,976.5,387.193,980.5,396.193" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M980.5,344.898 C980.5,361.484 980.5,374.619 980.5,391.193" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="1503.5,214.274,1507.5,205.274,1503.5,209.274,1499.5,205.274,1503.5,214.274" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1503.5,178.898 C1503.5,190.295 1503.5,197.424 1503.5,209.274" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="1814.414,245.921,1807.526,238.882,1809.767,244.076,1804.573,246.317,1814.414,245.921" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1644.765,178.554 C1700.476,200.677 1758.601,223.758 1809.767,244.076" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="2283.86,245.955,2275.856,240.216,2278.964,244.943,2274.237,248.051,2283.86,245.955" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1707.504,149.919 C1828.176,166.886 1983.854,190.035 2121.5,214.459 C2174.343,223.836 2226.553,234.114 2278.964,244.943" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src ZLTDKnj74BthLtJCGJObRC1nEP4fgcn961BiK1QKBxuCkoDfpEpCUZuaH2fLlkO_95KvXkIQcs_MF_4loUlTbH18wuIBfFdeVjsl-_NGf3VIfDB9b2OgZEX42nFENXsto6So22D8YwcDWUuRIo-To4TZTKL6obIc3nuslicT66QBGzMTHiDVA9CB9p9AvK147Gwi2Qz59kbGwh4CAX5BP_n8f7QYp906GdkvjEDiD6d7EYCTxUmkRJntpauwLbj76q-Al-LRCW6CePRqSuFeXNK8i3fxKFnXbG7rrPMadIUDNnfxFaort6_SllbA6PN5xArAaPdTnzjyy55riX5KmB53Qo_yExFdOQgzixk_bx2VziRJfq_tZwMd4U_lFIfMzt4Pnt3tniszpKqsiRcviB5pomPlthd-pdHba2u3E8z4Kc9JIM4a0hbeFE5Jq41TWj7SAXD86UnAqjRcDKwwiJIIpguNXYLzY8fyKrxEhfE8dxC_A9hA99i7iw2TpcrCj5o1UE1iHby-_jRH8k9Wz55eFINDbet_yl5t2dPfFn6cYVAvK3cfWDqwe98-_qtL7U2o34mQ6iwkpUpQ2KsVFp7GcqD6KYvHcRdmf9jgQAn3ANt-T0VmFSB-uO-qqJdelEXsLmaYEPOcrD8q-tKC23B36SxBQ1rhpy-vHHvlCo62lFHUMVECJfmyjLQVUKddSW1us0nOG4wqRj69zM6-BmQWX-_69C7rGTHaZQo1T8RGWmCWeJW9m
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:954px;height:376px;background:#FFFFFF;" width="954px" height="376px" viewBox="0 0 954 376" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="447.612" y="23.563" fill="#000" font-size="14" textLength="51.775" font-weight="700" font-family="Helvetica">Plugins</text><text x="439.161" y="38.564" fill="#777" font-size="12" textLength="68.678" font-weight="700" font-family="Helvetica">Les plugins</text></g><!--entity PG--><g class="entity" data-qualified-name="PG" id="ent0001" data-source-line="20"><rect x="135.5" y="64.459" width="555.247" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="145.5" y="88.99" fill="#000" font-size="15" textLength="47.087" font-weight="700" font-family="Helvetica">Plugin</text><text x="145.5" y="103.265" fill="#777" font-size="11" textLength="32.468" font-family="Helvetica">Plugin</text><text x="145.5" y="120.449" fill="#000" font-size="15" textLength="535.247" font-family="Helvetica">One installable unit: skills, subagents, hooks, MCP server configs and more</text><text x="145.5" y="134.724" fill="#777" font-size="11" textLength="502.584" font-family="Helvetica">Une unité installable : skills, sous-agents, hooks, configurations de serveurs MCP et plus encore</text><text x="145.5" y="151.908" fill="#000" font-size="15" textLength="399.683" font-family="Helvetica">Read before you install: it runs code with your privileges</text><text x="145.5" y="166.183" fill="#777" font-size="11" textLength="322.335" font-family="Helvetica">Lisez avant d'installer : il exécute du code avec vos privilèges</text><text x="145.5" y="183.367" fill="#000" font-size="15" textLength="446.704" font-family="Helvetica">Its components run alongside yours: its hooks stack with yours</text><text x="145.5" y="197.642" fill="#777" font-size="11" textLength="439.667" font-family="Helvetica">Ses composants s'exécutent à côté des vôtres : ses hooks s'additionnent aux vôtres</text></g><!--entity MK--><g class="entity" data-qualified-name="MK" id="ent0002" data-source-line="21"><rect x="6" y="246.459" width="340.061" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="270.99" fill="#000" font-size="15" textLength="93.713" font-weight="700" font-family="Helvetica">Marketplace</text><text x="16" y="285.265" fill="#777" font-size="11" textLength="64.942" font-family="Helvetica">Marketplace</text><text x="16" y="302.449" fill="#000" font-size="15" textLength="320.061" font-family="Helvetica">A shared source that plugins resolve through</text><text x="16" y="316.724" fill="#777" font-size="11" textLength="298.375" font-family="Helvetica">Une source partagée via laquelle les plugins sont résolus</text><text x="16" y="333.908" fill="#000" font-size="15" textLength="221.045" font-family="Helvetica">Listed isn't the same as trusted</text><text x="16" y="348.183" fill="#777" font-size="11" textLength="287.939" font-family="Helvetica">Être référencé ne veut pas dire être digne de confiance</text></g><!--entity MF--><g class="entity" data-qualified-name="MF" id="ent0003" data-source-line="22"><rect x="364" y="246.459" width="574.363" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="374" y="270.99" fill="#000" font-size="15" textLength="65.339" font-weight="700" font-family="Helvetica">Manifest</text><text x="374" y="285.265" fill="#777" font-size="11" textLength="51.579" font-family="Helvetica">Manifeste</text><text x="374" y="302.449" fill="#000" font-size="15" textLength="546.072" font-family="Helvetica">Optional, at .claude-plugin/plugin.json: components are found by convention</text><text x="374" y="316.724" fill="#777" font-size="11" textLength="460.029" font-family="Helvetica">Facultatif, dans .claude-plugin/plugin.json : les composants sont trouvés par convention</text><text x="374" y="333.908" fill="#000" font-size="15" textLength="554.363" font-family="Helvetica">Name, the only required field, namespaces the skills: /plugin-name:skill-name</text><text x="374" y="348.183" fill="#777" font-size="11" textLength="390.672" font-family="Helvetica">Le nom, seul champ obligatoire, préfixe les skills : /plugin-name:skill-name</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-link-type="dependency"><polygon points="257.187,246.279,266.864,244.447,261.299,243.434,262.312,237.868,257.187,246.279" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M308.703,210.63 C291.441,222.576 277.883,231.958 261.299,243.434" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk5" data-link-type="dependency"><polygon points="569.47,246.279,564.329,237.879,565.353,243.442,559.79,244.466,569.47,246.279" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M517.737,210.63 C535.072,222.576 548.699,231.966 565.353,243.442" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src VLNBRjj65DtpAsxZXH93icCNWLl14938KLhKQem4GJVPZ3XNrDJ36MOUzAFe3_GhkgowxX_mntg6b6LPYi8DYPaxvvuvzzpB7drW8zcnf1iL5dIbXGcVffTzyYK7OGHfSMTZeEV6qZidgaMjxiamIvOlZhBlAYUASXsqEfDb_bgPIZXHakIvY3fCh0c_YfBf9zOr1vMBZHY_4DBUA5FGN6ZF6plEHYF7rXbsT7AwiV7QENipjjewEdZLFfkdE0UDGZFzaH6ziGuNNCLEsWUhYT17TSzqyYhxCpltuKxpA7jwSggCAcFvcv9GvlJxbodmU1MP1HKGTgLZeOp_RCuzm8OdfwFpF6KQ7foTdOqksLFLHPmVj-iZ020GvnzJFJiyx60E3zSu9qzmkkqjYC_clM42T11QYnc0eb5XID11Quy2nfaes0HyBgoznciwlYBFheQOkJLpLNWIHb9f7Uz9_CbqgCtoIQAD93RwmLQQ3Ziw4PGr7WxeaaRdMmOSaYQUsEH8l7Ef3omapNYEFOAf7l8EIGLo4NYv1M9hLcmxgfogbUQ2_PuxN2hFzoHg69jaRmK72O2eYM-RPHu3aumTiAWvfzhw5Mxp3u1tEFuS4esoiYPTFD4Y
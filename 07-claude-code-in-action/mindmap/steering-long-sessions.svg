<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:3090px;height:432px;background:#FFFFFF;" width="3090px" height="432px" viewBox="0 0 3090 432" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1462.042" y="23.563" fill="#000" font-size="14" textLength="158.915" font-weight="700" font-family="Helvetica">Steering long sessions</text><text x="1452.733" y="38.564" fill="#777" font-size="12" textLength="177.533" font-weight="700" font-family="Helvetica">Orienter les longues sessions</text></g><!--entity LS--><g class="entity" data-qualified-name="LS" id="ent0001" data-source-line="20"><rect x="1338" y="64.459" width="556.406" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1348" y="88.99" fill="#000" font-size="15" textLength="98.899" font-weight="700" font-family="Helvetica">Long session</text><text x="1348" y="103.265" fill="#777" font-size="11" textLength="81.662" font-family="Helvetica">Longue session</text><text x="1348" y="120.449" fill="#000" font-size="15" textLength="523.813" font-family="Helvetica">Two habits: scope the work before Claude starts, and steer it while it runs</text><text x="1348" y="134.724" fill="#777" font-size="11" textLength="536.406" font-family="Helvetica">Deux habitudes : délimiter le travail avant que Claude ne commence, et l'orienter pendant qu'il travaille</text></g><!--entity PM--><g class="entity" data-qualified-name="PM" id="ent0002" data-source-line="21"><rect x="6" y="183.459" width="432.485" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="207.99" fill="#000" font-size="15" textLength="79.028" font-weight="700" font-family="Helvetica">Plan mode</text><text x="16" y="222.265" fill="#777" font-size="11" textLength="55.505" font-family="Helvetica">Mode Plan</text><text x="16" y="239.449" fill="#000" font-size="15" textLength="409.204" font-family="Helvetica">Claude does its research without editing your source files</text><text x="16" y="253.724" fill="#777" font-size="11" textLength="315.17" font-family="Helvetica">Claude fait ses recherches sans modifier vos fichiers source</text><text x="16" y="270.908" fill="#000" font-size="15" textLength="412.485" font-family="Helvetica">It hands you a plan to review: actually read it, don't skim it</text><text x="16" y="285.183" fill="#777" font-size="11" textLength="367.018" font-family="Helvetica">Il vous remet un plan à examiner : lisez-le vraiment, ne le survolez pas</text></g><!--entity CO--><g class="entity" data-qualified-name="CO" id="ent0003" data-source-line="22"><rect x="456" y="183.459" width="526.082" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="466" y="207.99" fill="#000" font-size="15" textLength="90.352" font-weight="700" font-family="Helvetica">Compaction</text><text x="466" y="222.265" fill="#777" font-size="11" textLength="62.82" font-family="Helvetica">Compaction</text><text x="466" y="239.449" fill="#000" font-size="15" textLength="506.082" font-family="Helvetica">/compact summarizes the conversation, then deletes the old messages</text><text x="466" y="253.724" fill="#777" font-size="11" textLength="371.508" font-family="Helvetica">/compact résume la conversation, puis supprime les anciens messages</text><text x="466" y="270.908" fill="#000" font-size="15" textLength="437.036" font-family="Helvetica">Instructions after the command tell Claude how to summarize</text><text x="466" y="285.183" fill="#777" font-size="11" textLength="371.621" font-family="Helvetica">Des instructions après la commande disent à Claude comment résumer</text></g><!--entity RW--><g class="entity" data-qualified-name="RW" id="ent0004" data-source-line="23"><rect x="1000" y="183.459" width="606.157" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1010" y="207.99" fill="#000" font-size="15" textLength="100.876" font-weight="700" font-family="Helvetica">Rewind menu</text><text x="1010" y="222.265" fill="#777" font-size="11" textLength="117.444" font-family="Helvetica">Menu de rembobinage</text><text x="1010" y="239.449" fill="#000" font-size="15" textLength="586.157" font-family="Helvetica">When Claude heads down the wrong path: double tap Escape on an empty prompt</text><text x="1010" y="253.724" fill="#777" font-size="11" textLength="395.619" font-family="Helvetica">Quand Claude fait fausse route : deux appuis sur Échap, zone de saisie vide</text><text x="1010" y="270.908" fill="#000" font-size="15" textLength="498.149" font-family="Helvetica">Restore code, conversation or both; Summarize from here / up to here</text><text x="1010" y="285.183" fill="#777" font-size="11" textLength="426.395" font-family="Helvetica">Restaurer le code, la conversation ou les deux ; Summarize from here / up to here</text></g><!--entity CP--><g class="entity" data-qualified-name="CP" id="ent0005" data-source-line="24"><rect x="1178" y="333.459" width="250" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1188" y="357.99" fill="#000" font-size="15" textLength="85.642" font-weight="700" font-family="Helvetica">Checkpoint</text><text x="1188" y="372.265" fill="#777" font-size="11" textLength="59.367" font-family="Helvetica">Checkpoint</text><text x="1188" y="389.449" fill="#000" font-size="15" textLength="218.936" font-family="Helvetica">Every user prompt creates one</text><text x="1188" y="403.724" fill="#777" font-size="11" textLength="216.117" font-family="Helvetica">Chaque prompt de l'utilisateur en crée un</text></g><!--entity GO--><g class="entity" data-qualified-name="GO" id="ent0006" data-source-line="25"><rect x="1624" y="183.459" width="610.193" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1634" y="207.99" fill="#000" font-size="15" textLength="116.309" font-weight="700" font-family="Helvetica">/goal command</text><text x="1634" y="222.265" fill="#777" font-size="11" textLength="89.332" font-family="Helvetica">Commande /goal</text><text x="1634" y="239.449" fill="#000" font-size="15" textLength="590.193" font-family="Helvetica">A completion condition: Claude works across turns until a fast evaluator confirms it</text><text x="1634" y="253.724" fill="#777" font-size="11" textLength="565.662" font-family="Helvetica">Une condition d'achèvement : Claude travaille tour après tour jusqu'à ce qu'un évaluateur rapide la confirme</text><text x="1634" y="270.908" fill="#000" font-size="15" textLength="397.383" font-family="Helvetica">For when you can describe “done” better than the steps</text><text x="1634" y="285.183" fill="#777" font-size="11" textLength="311.244" font-family="Helvetica">Quand vous savez mieux décrire « terminé » que les étapes</text></g><!--entity LO--><g class="entity" data-qualified-name="LO" id="ent0007" data-source-line="26"><rect x="2252" y="183.459" width="427.717" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2262" y="207.99" fill="#000" font-size="15" textLength="116.865" font-weight="700" font-family="Helvetica">/loop command</text><text x="2262" y="222.265" fill="#777" font-size="11" textLength="89.74" font-family="Helvetica">Commande /loop</text><text x="2262" y="239.449" fill="#000" font-size="15" textLength="407.717" font-family="Helvetica">A prompt between turns, on a fixed interval or self-paced</text><text x="2262" y="253.724" fill="#777" font-size="11" textLength="344.271" font-family="Helvetica">Un prompt entre les tours, à intervalle fixe ou à son propre rythme</text><text x="2262" y="270.908" fill="#000" font-size="15" textLength="368.679" font-family="Helvetica">Poll a CI run or a deploy, act when its state changes</text><text x="2262" y="285.183" fill="#777" font-size="11" textLength="406.995" font-family="Helvetica">Interroger une exécution de CI ou un déploiement, agir quand son état change</text></g><!--entity WT--><g class="entity" data-qualified-name="WT" id="ent0008" data-source-line="27"><rect x="2698" y="183.459" width="375.781" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2708" y="207.99" fill="#000" font-size="15" textLength="69.448" font-weight="700" font-family="Helvetica">Worktree</text><text x="2708" y="222.265" fill="#777" font-size="11" textLength="48.179" font-family="Helvetica">Worktree</text><text x="2708" y="239.449" fill="#000" font-size="15" textLength="334.775" font-family="Helvetica">Each session gets its own independent file tree</text><text x="2708" y="253.724" fill="#777" font-size="11" textLength="355.781" font-family="Helvetica">Chaque session a sa propre arborescence de fichiers, indépendante</text><text x="2708" y="270.908" fill="#000" font-size="15" textLength="326.455" font-family="Helvetica">A clean one is removed when its session exits</text><text x="2708" y="285.183" fill="#777" font-size="11" textLength="284.518" font-family="Helvetica">Un worktree propre est supprimé à la fin de sa session</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="438.301,184.864,447.837,187.327,443.233,184.04,446.519,179.436,438.301,184.864" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1337.828,111.215 C1100.012,118.176 749.317,136.332 447,183.459 C444.116,183.908 446.147,183.554 443.233,184.04" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="982.031,184.949,991.57,187.4,986.962,184.119,990.242,179.511,982.031,184.949" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1337.629,136.125 C1229.171,148.77 1104.002,164.942 991,183.459 C988.026,183.946 989.966,183.613 986.962,184.119" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="1435.443,183.393,1445.29,183.568,1440.047,181.444,1442.172,176.201,1435.443,183.393" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1519.963,147.614 C1493.277,158.911 1468.424,169.431 1440.047,181.444" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="1303,333.352,1307,324.352,1303,328.352,1299,324.352,1303,333.352" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1303,297.651 C1303,309.642 1303,317.082 1303,328.352" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk13" data-link-type="dependency"><polygon points="1796.557,183.393,1789.828,176.201,1791.953,181.444,1786.71,183.568,1796.557,183.393" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1712.037,147.614 C1738.723,158.911 1763.576,169.431 1791.953,181.444" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="2251.883,185.146,2243.81,179.506,2246.975,184.194,2242.286,187.359,2251.883,185.146" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1894.151,133.364 C2003.373,145.695 2129.524,162.373 2243,183.459 C2245.943,184.006 2243.997,183.617 2246.975,184.194" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-e
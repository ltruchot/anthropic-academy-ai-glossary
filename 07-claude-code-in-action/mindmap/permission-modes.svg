<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2306px;height:589px;background:#FFFFFF;" width="2306px" height="589px" viewBox="0 0 2306 589" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1085.427" y="23.563" fill="#000" font-size="14" textLength="128.146" font-weight="700" font-family="Helvetica">Permission modes</text><text x="1085.34" y="38.564" fill="#777" font-size="12" textLength="128.32" font-weight="700" font-family="Helvetica">Modes de permission</text></g><!--entity PMO--><g class="entity" data-qualified-name="PMO" id="ent0001" data-source-line="20"><rect x="722.5" y="64.459" width="785.214" height="177.295" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="732.5" y="88.99" fill="#000" font-size="15" textLength="137.3" font-weight="700" font-family="Helvetica">Permission modes</text><text x="732.5" y="103.265" fill="#777" font-size="11" textLength="111.783" font-family="Helvetica">Modes de permission</text><text x="732.5" y="120.449" fill="#000" font-size="15" textLength="381.797" font-family="Helvetica">Decide once what Claude may run without asking you</text><text x="732.5" y="134.724" fill="#777" font-size="11" textLength="413.155" font-family="Helvetica">Décider une fois pour toutes ce que Claude peut exécuter sans vous demander</text><text x="732.5" y="151.908" fill="#000" font-size="15" textLength="439.255" font-family="Helvetica">Manual: reads run without a prompt, everything else asks first</text><text x="732.5" y="166.183" fill="#777" font-size="11" textLength="482.292" font-family="Helvetica">Manuel : les lectures s'exécutent sans demande, pour tout le reste Claude demande d'abord</text><text x="732.5" y="183.367" fill="#000" font-size="15" textLength="548.877" font-family="Helvetica">Accept edits: reads, file edits and common file system commands, no prompt</text><text x="732.5" y="197.642" fill="#777" font-size="11" textLength="765.214" font-family="Helvetica">Acceptation automatique des modifications : lectures, modifications de fichiers et commandes courantes sur le système de fichiers, sans demande</text><text x="732.5" y="214.826" fill="#000" font-size="15" textLength="369.434" font-family="Helvetica">Shift-tab cycles manual, accept edits, plan and auto</text><text x="732.5" y="229.101" fill="#777" font-size="11" textLength="441.772" font-family="Helvetica">Maj+Tab fait défiler manuel, acceptation automatique des modifications, Plan et auto</text></g><!--entity PL--><g class="entity" data-qualified-name="PL" id="ent0002" data-source-line="21"><rect x="6" y="292.959" width="443.992" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="317.49" fill="#000" font-size="15" textLength="79.028" font-weight="700" font-family="Helvetica">Plan mode</text><text x="16" y="331.765" fill="#777" font-size="11" textLength="55.505" font-family="Helvetica">Mode Plan</text><text x="16" y="348.949" fill="#000" font-size="15" textLength="423.992" font-family="Helvetica">Researches and proposes changes without editing anything</text><text x="16" y="363.224" fill="#777" font-size="11" textLength="354.127" font-family="Helvetica">Fait des recherches et propose des changements sans rien modifier</text></g><!--entity AU--><g class="entity" data-qualified-name="AU" id="ent0003" data-source-line="22"><rect x="468" y="292.959" width="634.194" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="478" y="317.49" fill="#000" font-size="15" textLength="81.152" font-weight="700" font-family="Helvetica">Auto mode</text><text x="478" y="331.765" fill="#777" font-size="11" textLength="55.65" font-family="Helvetica">Mode auto</text><text x="478" y="348.949" fill="#000" font-size="15" textLength="614.194" font-family="Helvetica">The hands-off mode: a separate classifier model reviews most actions before they run</text><text x="478" y="363.224" fill="#777" font-size="11" textLength="607.691" font-family="Helvetica">Le mode où vous restez en retrait : un modèle classifieur distinct examine la plupart des actions avant leur exécution</text></g><!--entity CL--><g class="entity" data-qualified-name="CL" id="ent0004" data-source-line="23"><rect x="19" y="427.459" width="852.317" height="145.836" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="29" y="451.99" fill="#000" font-size="15" textLength="71.243" font-weight="700" font-family="Helvetica">Classifier</text><text x="29" y="466.265" fill="#777" font-size="11" textLength="55.312" font-family="Helvetica">Classifieur</text><text x="29" y="483.449" fill="#000" font-size="15" textLength="215.413" font-family="Helvetica">Guards intent, not correctness</text><text x="29" y="497.724" fill="#777" font-size="11" textLength="245.287" font-family="Helvetica">Surveille l'intention, pas le bon fonctionnement</text><text x="29" y="514.908" fill="#000" font-size="15" textLength="832.317" font-family="Helvetica">Designed to block moves like production deploys and migrations, force pushing, piping downloaded code into a shell</text><text x="29" y="529.183" fill="#777" font-size="11" textLength="770.935" font-family="Helvetica">Conçu pour bloquer, par exemple, les déploiements et migrations en production, le push forcé, l'exécution directe de code téléchargé dans un shell</text><text x="29" y="546.367" fill="#000" font-size="15" textLength="453.933" font-family="Helvetica">Waves through everyday work, like pushing to your own branch</text><text x="29" y="560.642" fill="#777" font-size="11" textLength="401.538" font-family="Helvetica">Laisse passer le travail quotidien, comme les push vers votre propre branche</text></g><!--entity SH--><g class="entity" data-qualified-name="SH" id="ent0005" data-source-line="24"><rect x="889.5" y="458.959" width="472.864" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="899.5" y="483.49" fill="#000" font-size="15" textLength="75.769" font-weight="700" font-family="Helvetica">Stop hook</text><text x="899.5" y="497.765" fill="#777" font-size="11" textLength="54.484" font-family="Helvetica">Hook Stop</text><text x="899.5" y="514.949" fill="#000" font-size="15" textLength="447.356" font-family="Helvetica">Runs your tests once Claude finishes: guards correctness after</text><text x="899.5" y="529.224" fill="#777" font-size="11" textLength="452.864" font-family="Helvetica">Lance vos tests une fois que Claude a fini : surveille le bon fonctionnement après coup</text></g><!--entity DA--><g class="entity" data-qualified-name="DA" id="ent0006" data-source-line="25"><rect x="1120.5" y="277.459" width="651.184" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1130.5" y="301.99" fill="#000" font-size="15" textLength="70.627" font-weight="700" font-family="Helvetica">Don't ask</text><text x="1130.5" y="316.265" fill="#777" font-size="11" textLength="49.043" font-family="Helvetica">Don't ask</text><text x="1130.5" y="333.449" fill="#000" font-size="15" textLength="612.371" font-family="Helvetica">For unattended runs: file reads in your working directories and pre-approved tools run</text><text x="1130.5" y="347.724" fill="#777" font-size="11" textLength="631.184" font-family="Helvetica">Pour les exécutions sans surveillance : lectures de fichiers dans vos répertoires de travail et outils préapprouvés passent</text><text x="1130.5" y="364.908" fill="#000" font-size="15" textLength="377.776" font-family="Helvetica">Anything that would otherwise prompt is auto-denied</text><text x="1130.5" y="379.183" fill="#777" font-size="11" textLength="387.406" font-family="Helvetica">Tout ce qui déclencherait sinon une demande est refusé automatiquement</text></g><!--entity BP--><g class="entity" data-qualified-name="BP" id="ent0007" data-source-line="26"><rect x="1790" y="292.959" width="500.337" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1800" y="317.49" fill="#000" font-size="15" textLength="149.465" font-weight="700" font-family="Helvetica">Bypass permissions</text><text x="1800" y="331.765" fill="#777" font-size="11" textLength="103.764" font-family="Helvetica">Bypass permissions</text><text x="1800" y="348.949" fill="#000" font-size="15" textLength="399.265" font-family="Helvetica">Skips all checks: only inside an isolated container or VM</text><text x="1800" y="363.224" fill="#777" font-size="11" textLength="480.337" font-family="Helvetica">Passe outre tous les contrôles : seulement dans un conteneur isolé ou une machine virtuelle</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="390.559,292.933,400.235,294.768,395.426,291.789,398.405,286.98,390.559,292.933" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M722.354,224.448 C635.461,241.002 543.972,259.174 459,277.459 C436.812,282.234 418.362,286.397 395.426,291.789" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="859.824,292.759,869.641,291.973,864.216,290.37,865.819,284.945,859.824,292.759" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M953.867,241.606 C920.981,259.493 892.283,275.104 864.216,290.37" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="594.299,427.444,604.143,427.137,598.802,425.272,600.667,419.931,594.299,427.444" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M700.955,375.998 C668.705,391.554 635.357,407.64 598.802,425.272" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="1041.496,458.818,1035.119,451.312,1036.99,456.651,1031.651,458.522,1041.496,458.818" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M869.292,375.998 C921.754,401.229 984.488,431.4 1036.99,456.651" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk12" data-link-type="dependency"><polygon points="1342.695,277.437,1336.69,269.63,1338.299,275.053,1332.876,276.663,1342.695,277.437" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1276.621,241.606 C1299.104,253.798 1317.287,263.658 1338.299,275.053" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="1855.854,292.943,1847.878,287.164,1850.963,291.907,1846.22,294.991,1855.854,292.943" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1507.596,224.764 C1597.529,241.537 1692.655,259.721 1781,277.459 C1805.243,282.327 1825.833,286.583 1850.963,291.907" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src bLTDSzis4BthLw3nGQqh9x6JJ5gDnpEo5CS7k_N4INF91IPN8YeGO06GYjpfxsbqxwLd_R6-1QaFMs8crKKK0Instxvzk-gATsHISfIAcGgPkD7IX0_NLptXSmhIIA7bt9P1V6-iUEjaaLNgNXYYbD8VddQ-AvoSvEjDpPbEnq-LAQIJkKXfB4iTBgm9lyYSn2NfYe9AvDOUdydKpfIPYB7KdhPMd2rDEhJEa1F79riB0-ViR6YrTUBWLVnidw84RamqYJyxGfnRXm2RlHVnWxViqAsw9t7yglDNvzI7kQQppiEJrygelCm_gXJ8dBnupXkVDJixGGLiko6NA--LDIAtAVbFvjJ3Ql_uvEmquIlx1wzVlpwxvZLW8Ohr_jDdSVqC5d401ZTtFpayV6pty71j-VX_MlvaHfGexB0c8J7BP113BKkyoELSkDB4p7Fw94Cu4KXbosMZvO8jEL4Q4cEhl2XiwKJ0OJW1wt-Kj39
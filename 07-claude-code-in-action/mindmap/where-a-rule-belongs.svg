<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2122px;height:614px;background:#FFFFFF;" width="2122px" height="614px" viewBox="0 0 2122 614" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="982.711" y="23.563" fill="#000" font-size="14" textLength="149.577" font-weight="700" font-family="Helvetica">Where a rule belongs</text><text x="996.217" y="38.564" fill="#777" font-size="12" textLength="122.566" font-weight="700" font-family="Helvetica">La place d'une règle</text></g><!--entity RB--><g class="entity" data-qualified-name="RB" id="ent0001" data-source-line="20"><rect x="982" y="64.459" width="641.921" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="992" y="88.99" fill="#000" font-size="15" textLength="160.261" font-weight="700" font-family="Helvetica">Where a rule belongs</text><text x="992" y="103.265" fill="#777" font-size="11" textLength="106.509" font-family="Helvetica">La place d'une règle</text><text x="992" y="120.449" fill="#000" font-size="15" textLength="621.921" font-family="Helvetica">CLAUDE.md and skills are instructions Claude follows; a hook is code that actually runs</text><text x="992" y="134.724" fill="#777" font-size="11" textLength="568.042" font-family="Helvetica">CLAUDE.md et les skills sont des instructions que Claude suit ; un hook est du code qui s'exécute réellement</text></g><!--entity MD--><g class="entity" data-qualified-name="MD" id="ent0002" data-source-line="21"><rect x="432.5" y="199.459" width="601.067" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="442.5" y="223.99" fill="#000" font-size="15" textLength="91.655" font-weight="700" font-family="Helvetica">CLAUDE.md</text><text x="442.5" y="238.265" fill="#777" font-size="11" textLength="64.12" font-family="Helvetica">CLAUDE.md</text><text x="442.5" y="255.449" fill="#000" font-size="15" textLength="246.35" font-family="Helvetica">Conventions that apply all the time</text><text x="442.5" y="269.724" fill="#777" font-size="11" textLength="255.766" font-family="Helvetica">Les conventions qui s'appliquent en permanence</text><text x="442.5" y="286.908" fill="#000" font-size="15" textLength="581.067" font-family="Helvetica">Guidance, not enforced configuration: the leaner the file, the more Claude follows</text><text x="442.5" y="301.183" fill="#777" font-size="11" textLength="522.983" font-family="Helvetica">De la recommandation, pas une configuration appliquée : plus le fichier est court, plus Claude le suit</text></g><!--entity LOC--><g class="entity" data-qualified-name="LOC" id="ent0003" data-source-line="22"><rect x="12" y="380.959" width="505.698" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="22" y="405.49" fill="#000" font-size="15" textLength="164.524" font-weight="700" font-family="Helvetica">CLAUDE.md locations</text><text x="22" y="419.765" fill="#777" font-size="11" textLength="160.295" font-family="Helvetica">Emplacements de CLAUDE.md</text><text x="22" y="436.949" fill="#000" font-size="15" textLength="485.698" font-family="Helvetica">Four, loaded together at launch: managed policy, user, project, local</text><text x="22" y="451.224" fill="#777" font-size="11" textLength="449.303" font-family="Helvetica">Quatre, chargés tous ensemble au lancement : politique gérée, utilisateur, projet, local</text></g><!--entity MP--><g class="entity" data-qualified-name="MP" id="ent0004" data-source-line="23"><rect x="6" y="515.459" width="517.852" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="539.99" fill="#000" font-size="15" textLength="119.641" font-weight="700" font-family="Helvetica">Managed policy</text><text x="16" y="554.265" fill="#777" font-size="11" textLength="78.45" font-family="Helvetica">Politique gérée</text><text x="16" y="571.449" fill="#000" font-size="15" textLength="472.471" font-family="Helvetica">The org-level file your platform team controls: you can't exclude it</text><text x="16" y="585.724" fill="#777" font-size="11" textLength="497.852" font-family="Helvetica">Le fichier de l'organisation que contrôle votre équipe plateforme : vous ne pouvez pas l'exclure</text></g><!--entity IM--><g class="entity" data-qualified-name="IM" id="ent0005" data-source-line="24"><rect x="536" y="380.959" width="431.826" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="546" y="405.49" fill="#000" font-size="15" textLength="48.713" font-weight="700" font-family="Helvetica">Import</text><text x="546" y="419.765" fill="#777" font-size="11" textLength="33.661" font-family="Helvetica">Import</text><text x="546" y="436.949" fill="#000" font-size="15" textLength="411.826" font-family="Helvetica">Splits a long file into pieces; everything still loads up front</text><text x="546" y="451.224" fill="#777" font-size="11" textLength="372.421" font-family="Helvetica">Découpe un long fichier ; tout se charge quand même dès le lancement</text></g><!--entity SK--><g class="entity" data-qualified-name="SK" id="ent0006" data-source-line="25"><rect x="1052" y="183.459" width="501.712" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1062" y="207.99" fill="#000" font-size="15" textLength="32.095" font-weight="700" font-family="Helvetica">Skill</text><text x="1062" y="222.265" fill="#777" font-size="11" textLength="21.817" font-family="Helvetica">Skill</text><text x="1062" y="239.449" fill="#000" font-size="15" textLength="301.597" font-family="Helvetica">Procedures tied to a particular kind of task</text><text x="1062" y="253.724" fill="#777" font-size="11" textLength="263.871" font-family="Helvetica">Les procédures liées à un type de tâche particulier</text><text x="1062" y="270.908" fill="#000" font-size="15" textLength="478.608" font-family="Helvetica">A folder with a SKILL.md; only its description loads until it's needed</text><text x="1062" y="285.183" fill="#777" font-size="11" textLength="481.712" font-family="Helvetica">Un dossier avec un SKILL.md ; seule sa description est chargée tant qu'on n'en a pas besoin</text><text x="1062" y="302.367" fill="#000" font-size="15" textLength="305.94" font-family="Helvetica">A reference.md and scripts carry the depth</text><text x="1062" y="316.642" fill="#777" font-size="11" textLength="270.295" font-family="Helvetica">Un reference.md et des scripts contiennent le détail</text></g><!--entity VS--><g class="entity" data-qualified-name="VS" id="ent0007" data-source-line="26"><rect x="1004" y="365.459" width="598.342" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1014" y="389.99" fill="#000" font-size="15" textLength="121.179" font-weight="700" font-family="Helvetica">Verification skill</text><text x="1014" y="404.265" fill="#777" font-size="11" textLength="99.107" font-family="Helvetica">Skill de vérification</text><text x="1014" y="421.449" fill="#000" font-size="15" textLength="578.342" font-family="Helvetica">The one to build first: runs the tests, reads the diff, checks no test was weakened</text><text x="1014" y="435.724" fill="#777" font-size="11" textLength="444.216" font-family="Helvetica">Le premier à construire : lance les tests, lit le diff, vérifie qu'aucun test n'a été affaibli</text><text x="1014" y="452.908" fill="#000" font-size="15" textLength="337.874" font-family="Helvetica">Reports pass or fail, with the evidence attached</text><text x="1014" y="467.183" fill="#777" font-size="11" textLength="282.595" font-family="Helvetica">Rend son verdict, réussite ou échec, preuves à l'appui</text></g><!--entity HKR--><g class="entity" data-qualified-name="HKR" id="ent0008" data-source-line="27"><rect x="1572" y="199.459" width="534.38" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1582" y="223.99" fill="#000" font-size="15" textLength="39.243" font-weight="700" font-family="Helvetica">Hook</text><text x="1582" y="238.265" fill="#777" font-size="11" textLength="27.403" font-family="Helvetica">Hook</text><text x="1582" y="255.449" fill="#000" font-size="15" textLength="270.681" font-family="Helvetica">A rule Claude must not be able to skip</text><text x="1582" y="269.724" fill="#777" font-size="11" textLength="256.98" font-family="Helvetica">Une règle que Claude ne doit pas pouvoir ignorer</text><text x="1582" y="286.908" fill="#000" font-size="15" textLength="514.38" font-family="Helvetica">Like “never push to main”, in a pre-tool-use hook: it can block the action</text><text x="1582" y="301.183" fill="#777" font-size="11" textLength="470.938" font-family="Helvetica">Comme « ne jamais pousser sur main », dans un hook PreToolUse : il peut bloquer l'action</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="948.124,199.413,957.842,201.015,952.963,198.153,955.825,193.274,948.124,199.413" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1147.245,147.537 C1085.853,163.532 1019.148,180.91 952.963,198.153" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="380.681,380.921,390.497,381.72,385.4,379.268,387.852,374.17,380.681,380.921" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M572.923,313.554 C509.792,335.677 443.379,358.95 385.4,379.268" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="265,515.03,269,506.03,265,510.03,261,506.03,265,515.03" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M265,464.295 C265,480.415 265,493.901 265,510.03" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="747.279,380.707,750.216,371.307,746.703,375.741,742.27,372.227,747.279,380.707" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M739.539,313.898 C742.083,335.858 744.366,355.567 746.703,375.741" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk13" data-link-type="dependency"><polygon points="1303,183.235,1307,174.235,1303,178.235,1299,174.235,1303,183.235" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1303,147.537 C1303,158.615 1303,165.962 1303,178.235" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="1303,365.199,1307,356.199,1303,360.199,1299,356.199,1303,365.199" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1303,329.869 C1303,341.711 1303,348.822 1303,360.199" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk15" data-link-type="dependency"><polygon points="1636.708,199.413,1629.102,193.156,1631.889,198.078,1626.966,200.865,1636.708,199.413" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1449.464,147.537 C1507.194,163.532 1569.652,180.835 1631.889,198.078" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src bLPDKnj74BthLtJCGGabx83ZSY8egcm4DWKa11dxuikmsvB6pCwiPsQ5S
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2356px;height:848px;background:#FFFFFF;" width="2356px" height="848px" viewBox="0 0 2356 848" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1088.275" y="23.563" fill="#000" font-size="14" textLength="172.45" font-weight="700" font-family="Helvetica">How Claude Code works</text><text x="1071.208" y="38.564" fill="#777" font-size="12" textLength="206.584" font-weight="700" font-family="Helvetica">Comment fonctionne Claude Code</text></g><!--cluster LOOP--><g class="cluster" data-qualified-name="LOOP" id="ent0002" data-source-line="21"><rect x="1378" y="260.459" width="572" height="564" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="1616.528" y="276.99" fill="#000" font-size="15" textLength="94.944" font-weight="700" font-family="Helvetica">Agentic loop</text><text x="1615.988" y="291.265" fill="#777" font-size="11" textLength="96.024" font-weight="700" font-family="Helvetica">Boucle agentique</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0001" data-source-line="20"><rect x="630" y="56.459" width="504.402" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="640" y="80.99" fill="#000" font-size="15" textLength="97.097" font-weight="700" font-family="Helvetica">Claude Code</text><text x="640" y="95.265" fill="#777" font-size="11" textLength="67.767" font-family="Helvetica">Claude Code</text><text x="640" y="112.449" fill="#000" font-size="15" textLength="329.055" font-family="Helvetica">An agentic coding tool: it works as an AI agent</text><text x="640" y="126.724" fill="#777" font-size="11" textLength="331.085" font-family="Helvetica">Un outil de codage agentique : il fonctionne comme un agent IA</text><text x="640" y="143.908" fill="#000" font-size="15" textLength="428.181" font-family="Helvetica">Direct access to your files, your terminal and your codebase</text><text x="640" y="158.183" fill="#777" font-size="11" textLength="367.968" font-family="Helvetica">Un accès direct à vos fichiers, à votre terminal et à votre base de code</text><text x="640" y="175.367" fill="#000" font-size="15" textLength="484.402" font-family="Helvetica">It can make mistakes: staying in the loop helps you catch them early</text><text x="640" y="189.642" fill="#777" font-size="11" textLength="373.221" font-family="Helvetica">Il peut faire des erreurs : suivre son travail de près aide à les repérer tôt</text></g><!--entity STEER--><g class="entity" data-qualified-name="STEER" id="ent0007" data-source-line="27"><rect x="1966" y="485.459" width="373.979" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1976" y="509.99" fill="#000" font-size="15" textLength="153.135" font-weight="700" font-family="Helvetica">Throughout the loop</text><text x="1976" y="524.265" fill="#777" font-size="11" textLength="132.736" font-family="Helvetica">Tout au long de la boucle</text><text x="1976" y="541.449" fill="#000" font-size="15" textLength="353.979" font-family="Helvetica">You can add context, interrupt, or steer the model</text><text x="1976" y="555.724" fill="#777" font-size="11" textLength="353.563" font-family="Helvetica">Vous pouvez ajouter du contexte, interrompre ou orienter le modèle</text></g><!--entity CTX--><g class="entity" data-qualified-name="CTX" id="ent0008" data-source-line="28"><rect x="6" y="286.959" width="440.425" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="311.49" fill="#000" font-size="15" textLength="121.099" font-weight="700" font-family="Helvetica">Context window</text><text x="16" y="325.765" fill="#777" font-size="11" textLength="104.715" font-family="Helvetica">Fenêtre de contexte</text><text x="16" y="342.949" fill="#000" font-size="15" textLength="420.425" font-family="Helvetica">Claude's working memory: a lot, but not everything at once</text><text x="16" y="357.224" fill="#777" font-size="11" textLength="392.058" font-family="Helvetica">La mémoire de travail de Claude : beaucoup, mais pas tout en même temps</text><text x="16" y="374.408" fill="#000" font-size="15" textLength="376.831" font-family="Helvetica">At its limit, Claude Code compacts your conversation</text><text x="16" y="388.683" fill="#777" font-size="11" textLength="283.186" font-family="Helvetica">À sa limite, Claude Code compacte votre conversation</text></g><!--entity TOOL--><g class="entity" data-qualified-name="TOOL" id="ent0009" data-source-line="29"><rect x="464" y="270.959" width="378.247" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="474" y="295.49" fill="#000" font-size="15" textLength="33.677" font-weight="700" font-family="Helvetica">Tool</text><text x="474" y="309.765" fill="#777" font-size="11" textLength="24.208" font-family="Helvetica">Outil</text><text x="474" y="326.949" fill="#000" font-size="15" textLength="246.475" font-family="Helvetica">The backbone of how agents work</text><text x="474" y="341.224" fill="#777" font-size="11" textLength="275.419" font-family="Helvetica">La colonne vertébrale du fonctionnement des agents</text><text x="474" y="358.408" fill="#000" font-size="15" textLength="339.243" font-family="Helvetica">A file-reading tool, a web search tool, and more</text><text x="474" y="372.683" fill="#777" font-size="11" textLength="358.247" font-family="Helvetica">Un outil de lecture de fichiers, un outil de recherche web, et d'autres</text><text x="474" y="389.867" fill="#000" font-size="15" textLength="297.539" font-family="Helvetica">Claude Code determines when to call one</text><text x="474" y="404.142" fill="#777" font-size="11" textLength="233.959" font-family="Helvetica">Claude Code détermine quand en appeler un</text></g><!--entity PERM--><g class="entity" data-qualified-name="PERM" id="ent0010" data-source-line="30"><rect x="860" y="239.459" width="502.161" height="208.754" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="870" y="263.99" fill="#000" font-size="15" textLength="137.3" font-weight="700" font-family="Helvetica">Permission modes</text><text x="870" y="278.265" fill="#777" font-size="11" textLength="111.783" font-family="Helvetica">Modes de permission</text><text x="870" y="295.449" fill="#000" font-size="15" textLength="482.161" font-family="Helvetica">Manual mode: asks before editing a file or running a shell command</text><text x="870" y="309.724" fill="#777" font-size="11" textLength="461.463" font-family="Helvetica">Mode manuel : demande avant de modifier un fichier ou d'exécuter une commande shell</text><text x="870" y="326.908" fill="#000" font-size="15" textLength="309.749" font-family="Helvetica">Auto-accept: files are edited without asking</text><text x="870" y="341.183" fill="#777" font-size="11" textLength="352.881" font-family="Helvetica">Acceptation automatique : les fichiers sont modifiés sans demander</text><text x="870" y="358.367" fill="#000" font-size="15" textLength="479.392" font-family="Helvetica">Plan mode: explores, then compiles a plan before starting any work</text><text x="870" y="372.642" fill="#777" font-size="11" textLength="380.526" font-family="Helvetica">Mode Plan : explore, puis établit un plan avant de commencer tout travail</text><text x="870" y="389.826" fill="#000" font-size="15" textLength="445.415" font-family="Helvetica">Auto mode: a classifier checks most actions in the background</text><text x="870" y="404.101" fill="#777" font-size="11" textLength="377.335" font-family="Helvetica">Mode auto : un classifieur examine la plupart des actions en arrière-plan</text><text x="870" y="421.285" fill="#000" font-size="15" textLength="246.702" font-family="Helvetica">Shift + Tab cycles between modes</text><text x="870" y="435.56" fill="#777" font-size="11" textLength="184.229" font-family="Helvetica">Maj+Tab passe d'un mode à l'autre</text></g><!--entity P--><g class="entity" data-qualified-name="LOOP.P" id="ent0003" data-source-line="22"><rect x="1479" y="318.459" width="250" height="51.459" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1489" y="342.99" fill="#000" font-size="15" textLength="159.697" font-weight="700" font-family="Helvetica">1. You enter a prompt</text><text x="1489" y="357.265" fill="#777" font-size="11" textLength="133.439" font-family="Helvetica">Vous saisissez un prompt</text></g><!--entity G--><g class="entity" data-qualified-name="LOOP.G" id="ent0004" data-source-line="23"><rect x="1451.5" y="501.459" width="305.491" height="51.459" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1461.5" y="525.99" fill="#000" font-size="15" textLength="285.491" font-weight="700" font-family="Helvetica">2. Claude gathers the context it needs</text><text x="1461.5" y="540.265" fill="#777" font-size="11" textLength="237.569" font-family="Helvetica">Claude rassemble le contexte dont il a besoin</text></g><!--entity T--><g class="entity" data-qualified-name="LOOP.T" id="ent0005" data-source-line="24"><rect x="1394.5" y="605.459" width="257.004" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1404.5" y="629.99" fill="#000" font-size="15" textLength="123.823" font-weight="700" font-family="Helvetica">3. It takes action</text><text x="1404.5" y="644.265" fill="#777" font-size="11" textLength="28.263" font-family="Helvetica">Il agit</text><text x="1404.5" y="661.449" fill="#000" font-size="15" textLength="237.004" font-family="Helvetica">Editing a file, running a command</text><text x="1404.5" y="675.724" fill="#777" font-size="11" textLength="230.769" font-family="Helvetica">Modifier un fichier, exécuter une commande</text></g><!--entity V--><g class="entity" data-qualified-name="LOOP.V" id="ent0006" data-source-line="25"><rect x="1449" y="725.459" width="365.718" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1459" y="749.99" fill="#000" font-size="15" textLength="173.093" font-weight="700" font-family="Helvetica">4. It verifies the results</text><text x="1459" y="764.265" fill="#777" font-size="11" textLength="108.136" font-family="Helvetica">Il vérifie les résultats</text><text x="1459" y="781.449" fill="#000" font-size="15" textLength="345.718" font-family="Helvetica">Do they achieve what your prompt set out to do?</text><text x="1459" y="795.724" fill="#777" font-size="11" textLength="218.179" font-family="Helvetica">Atteignent-ils ce que votre prompt visait ?</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="1763.206,260.146,1759.932,250.857,1759.772,256.511,1754.118,256.352,1763.206,260.146" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1134.22,140.413 C1349.313,152.882 1638.963,180.312 1738,239.459 C1747.245,244.98 1752.219,248.518 1759.772,256.511" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="1604,501.181,1608,492.181,1604,496.181,1600,492.181,1604,501.181" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1604,369.747 C1604,404.311 1604,461.622 1604,496.181" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="1551.117,604.999,1559.508,599.842,1553.946,600.877,1552.912,595.315,1551.117,604.999" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1587.02,552.696 C1576.628,567.834 1565.905,583.455 1553.946,600.877" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk14" data-link-type="dependency"><polygon points="1594.419,725.275,1591.251,715.95,1591.027,721.602,1585.374,721.378,1594.419,725.275" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1560.512,688.568 C1571.473,700.435 1580.061,709.731 1591.027,721.602" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk15" data-link-type="dependency"><polygon points="1628.388,552.488,1631.283,561.902,1631.672,556.258,1637.315,556.648,1628.388,552.488" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1650.23,725.291 C1662.411,692.379 1674.022,645.143 1661,605.459 C1654.491,585.622 1644.032,570.45 1631.672,556.258" style="stroke:#555;stroke-width:1;" fill="none"/><text x="1668" y="645.053" fill="#000" font-size="13" textLength="242.601" font-family="Helvetica">if they don't: loops back and tries again</text><text x="1713.122" y="658.845" fill="#777" font-size="11" textLength="152.356" font-family="Helvetica">sinon : il reboucle et réessaie</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk16" data-link-type="dependency"><polygon points="2076.372,485.285,2070.298,477.533,2071.955,482.941,2066.547,484.599,2076.372,485.285" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1950.492,418.47 C1950.886,418.679 1951.281,418.888 1951.675,419.098 C1953.254,419.935 1954.836,420.775 1956.421,421.617 C1959.592,423.299 1962.774,424.989 1965.965,426.682 C1978.727,433.456 1991.614,440.297 2004.336,447.049 C2029.78,460.555 2050.148,471.366 2071.955,482.941" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk17" data-link-type="dependency"><polygon points="339.723,286.84,349.571,286.728,344.269,284.757,346.24,279.455,339.723,286.84" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M629.757,187.072 C571.77,202.226 510.775,219.904 455,239.459 C416.71,252.883 380.564,268.131 344.269,284.757" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk18" data-link-type="dependency"><polygon points="730.633,270.919,739.951,267.73,734.298,267.518,734.51,261.866,730.633,270.919" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M804.152,202.698 C780.423,224.717 758.012,245.513 734.298,267.518" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" id="lnk19" data-link-type="dependency"><polygon points="999.266,239.276,995.39,230.222,995.601,235.875,989.948,236.086,999.266,239.276" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M959.848,202.698 C972.555,214.49 982.271,223.505 995.601,235.875" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src ZLTTSnir57tthxZGXq3h19B2j8HEcCH9IcSQqcdTGcTuaNUlRL6jj4XQfox333-5nuPd_e7_6ETAQyUflIsPDjwifVkbSywzsg7dR4lsNDALZbDwPfIDBo-UzYbK79LLPDJSDP6-i8uUUrLFP_eTMUQIoo_tUf_LNasgrQ9sJwyNtcXRAwygAdci6XFFdOq_gOhfHpOpZhfGQsl2L9NkIji9ZPK9lFQDTuqj1yvRzhH_iFR5iVVkQk2CytJds_IpleiBX34nJ7_qY4wSHuBjslFqWxSIq0lzZcd_szwVlKSXpWqVzMxllD1MLqtriovHcOFxNyl2hzgLlQWZbltehcXWL5Co3Hn-NJd_9lng7mMOFjm_E7fKYD_3EmyUF3WQkAfY6sdiR16rivRNjpxwAYqzWWViXOERM3w_UtTjuTsxA_lxj-rt6llL7bjI4pZN1HMkb597vymXwPX39eL_bewVv6KT7bvQmZ5hWrCLCrZQMlszOO8nivvR8UbIqpgc9ySRGPrgoP5KKN0828W08azZRJZqytDaNsch368hynkuvP4At1qXp2tU1ogpySNVD7C1HekfPW-xwKNqV6ERuyrBCTrcjrd49v4A5AbIRvWg7I8-mo7XSou5rPRYbCauLzEKJHqaO6o8nLI-g8YLD_EEk9yOgXaC6Yk4ZG02iVVS-82oXaRFy38uEF1gfdBzQozPAer7H8-I0VRr
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2664px;height:879px;background:#FFFFFF;" width="2664px" height="879px" viewBox="0 0 2664 879" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1242.275" y="23.563" fill="#000" font-size="14" textLength="172.45" font-weight="700" font-family="Helvetica">How Claude Code works</text><text x="1225.208" y="38.564" fill="#777" font-size="12" textLength="206.584" font-weight="700" font-family="Helvetica">Comment fonctionne Claude Code</text></g><!--cluster LOOP--><g class="cluster" data-qualified-name="LOOP" id="ent0002" data-source-line="21"><rect x="1686" y="260.459" width="572" height="595" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="1924.528" y="276.99" fill="#000" font-size="15" textLength="94.944" font-weight="700" font-family="Helvetica">Agentic loop</text><text x="1923.988" y="291.265" fill="#777" font-size="11" textLength="96.024" font-weight="700" font-family="Helvetica">Boucle agentique</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0001" data-source-line="20"><rect x="707" y="56.459" width="504.402" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="717" y="80.99" fill="#000" font-size="15" textLength="97.097" font-weight="700" font-family="Helvetica">Claude Code</text><text x="717" y="95.265" fill="#777" font-size="11" textLength="67.767" font-family="Helvetica">Claude Code</text><text x="717" y="112.449" fill="#000" font-size="15" textLength="329.055" font-family="Helvetica">An agentic coding tool: it works as an AI agent</text><text x="717" y="126.724" fill="#777" font-size="11" textLength="331.085" font-family="Helvetica">Un outil de codage agentique : il fonctionne comme un agent IA</text><text x="717" y="143.908" fill="#000" font-size="15" textLength="428.181" font-family="Helvetica">Direct access to your files, your terminal and your codebase</text><text x="717" y="158.183" fill="#777" font-size="11" textLength="367.968" font-family="Helvetica">Un accès direct à vos fichiers, à votre terminal et à votre base de code</text><text x="717" y="175.367" fill="#000" font-size="15" textLength="484.402" font-family="Helvetica">It can make mistakes: staying in the loop helps you catch them early</text><text x="717" y="189.642" fill="#777" font-size="11" textLength="373.221" font-family="Helvetica">Il peut faire des erreurs : suivre son travail de près aide à les repérer tôt</text></g><!--entity STEER--><g class="entity" data-qualified-name="STEER" id="ent0007" data-source-line="27"><rect x="2274" y="485.459" width="373.979" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2284" y="509.99" fill="#000" font-size="15" textLength="153.135" font-weight="700" font-family="Helvetica">Throughout the loop</text><text x="2284" y="524.265" fill="#777" font-size="11" textLength="132.736" font-family="Helvetica">Tout au long de la boucle</text><text x="2284" y="541.449" fill="#000" font-size="15" textLength="353.979" font-family="Helvetica">You can add context, interrupt, or steer the model</text><text x="2284" y="555.724" fill="#777" font-size="11" textLength="353.563" font-family="Helvetica">Vous pouvez ajouter du contexte, interrompre ou orienter le modèle</text></g><!--entity CTX--><g class="entity" data-qualified-name="CTX" id="ent0008" data-source-line="28"><rect x="6" y="286.959" width="440.425" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="311.49" fill="#000" font-size="15" textLength="121.099" font-weight="700" font-family="Helvetica">Context window</text><text x="16" y="325.765" fill="#777" font-size="11" textLength="104.715" font-family="Helvetica">Fenêtre de contexte</text><text x="16" y="342.949" fill="#000" font-size="15" textLength="420.425" font-family="Helvetica">Claude's working memory: a lot, but not everything at once</text><text x="16" y="357.224" fill="#777" font-size="11" textLength="392.058" font-family="Helvetica">La mémoire de travail de Claude : beaucoup, mais pas tout en même temps</text><text x="16" y="374.408" fill="#000" font-size="15" textLength="376.831" font-family="Helvetica">At its limit, Claude Code compacts your conversation</text><text x="16" y="388.683" fill="#777" font-size="11" textLength="283.186" font-family="Helvetica">À sa limite, Claude Code compacte votre conversation</text></g><!--entity TOOL--><g class="entity" data-qualified-name="TOOL" id="ent0009" data-source-line="29"><rect x="464" y="270.959" width="378.247" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="474" y="295.49" fill="#000" font-size="15" textLength="33.677" font-weight="700" font-family="Helvetica">Tool</text><text x="474" y="309.765" fill="#777" font-size="11" textLength="24.208" font-family="Helvetica">Outil</text><text x="474" y="326.949" fill="#000" font-size="15" textLength="246.475" font-family="Helvetica">The backbone of how agents work</text><text x="474" y="341.224" fill="#777" font-size="11" textLength="275.419" font-family="Helvetica">La colonne vertébrale du fonctionnement des agents</text><text x="474" y="358.408" fill="#000" font-size="15" textLength="339.243" font-family="Helvetica">A file-reading tool, a web search tool, and more</text><text x="474" y="372.683" fill="#777" font-size="11" textLength="358.247" font-family="Helvetica">Un outil de lecture de fichiers, un outil de recherche web, et d'autres</text><text x="474" y="389.867" fill="#000" font-size="15" textLength="297.539" font-family="Helvetica">Claude Code determines when to call one</text><text x="474" y="404.142" fill="#777" font-size="11" textLength="233.959" font-family="Helvetica">Claude Code détermine quand en appeler un</text></g><!--entity PERM--><g class="entity" data-qualified-name="PERM" id="ent0010" data-source-line="30"><rect x="860" y="239.459" width="809.916" height="208.754" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="870" y="263.99" fill="#000" font-size="15" textLength="137.3" font-weight="700" font-family="Helvetica">Permission modes</text><text x="870" y="278.265" fill="#777" font-size="11" textLength="111.783" font-family="Helvetica">Modes de permission</text><text x="870" y="295.449" fill="#000" font-size="15" textLength="482.161" font-family="Helvetica">Manual mode: asks before editing a file or running a shell command</text><text x="870" y="309.724" fill="#777" font-size="11" textLength="461.463" font-family="Helvetica">Mode manuel : demande avant de modifier un fichier ou d'exécuter une commande shell</text><text x="870" y="326.908" fill="#000" font-size="15" textLength="661.208" font-family="Helvetica">Auto-accept: file edits and common filesystem commands (mkdir, mv, rm) run without asking</text><text x="870" y="341.183" fill="#777" font-size="11" textLength="789.916" font-family="Helvetica">Acceptation automatique : les modifications de fichiers et les commandes courantes du système de fichiers (mkdir, mv, rm) s'exécutent sans demander</text><text x="870" y="358.367" fill="#000" font-size="15" textLength="479.392" font-family="Helvetica">Plan mode: explores, then compiles a plan before starting any work</text><text x="870" y="372.642" fill="#777" font-size="11" textLength="415.449" font-family="Helvetica">Mode Plan : explore, puis établit un plan avant de commencer le moindre travail</text><text x="870" y="389.826" fill="#000" font-size="15" textLength="445.415" font-family="Helvetica">Auto mode: a classifier checks most actions in the background</text><text x="870" y="404.101" fill="#777" font-size="11" textLength="377.335" font-family="Helvetica">Mode auto : un classifieur examine la plupart des actions en arrière-plan</text><text x="870" y="421.285" fill="#000" font-size="15" textLength="246.702" font-family="Helvetica">Shift + Tab cycles between modes</text><text x="870" y="435.56" fill="#777" font-size="11" textLength="184.229" font-family="Helvetica">Maj+Tab passe d'un mode à l'autre</text></g><!--entity P--><g class="entity" data-qualified-name="LOOP.P" id="ent0003" data-source-line="22"><rect x="1787" y="318.459" width="250" height="51.459" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1797" y="342.99" fill="#000" font-size="15" textLength="159.697" font-weight="700" font-family="Helvetica">1. You enter a prompt</text><text x="1797" y="357.265" fill="#777" font-size="11" textLength="133.439" font-family="Helvetica">Vous saisissez un prompt</text></g><!--entity G--><g class="entity" data-qualified-name="LOOP.G" id="ent0004" data-source-line="23"><rect x="1759.5" y="501.459" width="305.491" height="51.459" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1769.5" y="525.99" fill="#000" font-size="15" textLength="285.491" font-weight="700" font-family="Helvetica">2. Claude gathers the context it needs</text><text x="1769.5" y="540.265" fill="#777" font-size="11" textLength="237.569" font-family="Helvetica">Claude rassemble le contexte dont il a besoin</text></g><!--entity T--><g class="entity" data-qualified-name="LOOP.T" id="ent0005" data-source-line="24"><rect x="1702.5" y="605.459" width="257.004" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1712.5" y="629.99" fill="#000" font-size="15" textLength="123.823" font-weight="700" font-family="Helvetica">3. It takes action</text><text x="1712.5" y="644.265" fill="#777" font-size="11" textLength="28.263" font-family="Helvetica">Il agit</text><text x="1712.5" y="661.449" fill="#000" font-size="15" textLength="237.004" font-family="Helvetica">Editing a file, running a command</text><text x="1712.5" y="675.724" fill="#777" font-size="11" textLength="230.769" font-family="Helvetica">Modifier un fichier, exécuter une commande</text></g><!--entity V--><g class="entity" data-qualified-name="LOOP.V" id="ent0006" data-source-line="25"><rect x="1744.5" y="725.459" width="418.76" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1754.5" y="749.99" fill="#000" font-size="15" textLength="173.093" font-weight="700" font-family="Helvetica">4. It verifies the results</text><text x="1754.5" y="764.265" fill="#777" font-size="11" textLength="108.136" font-family="Helvetica">Il vérifie les résultats</text><text x="1754.5" y="781.449" fill="#000" font-size="15" textLength="345.718" font-family="Helvetica">Do they achieve what your prompt set out to do?</text><text x="1754.5" y="795.724" fill="#777" font-size="11" textLength="218.179" font-family="Helvetica">Atteignent-ils ce que votre prompt visait ?</text><text x="1754.5" y="812.908" fill="#000" font-size="15" textLength="398.76" font-family="Helvetica">If they do: Claude finishes and waits for the next prompt</text><text x="1754.5" y="827.183" fill="#777" font-size="11" textLength="260.106" font-family="Helvetica">Si oui : Claude termine et attend le prompt suivant</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="2071.704,260.275,2068.422,250.989,2068.267,256.644,2062.612,256.489,2071.704,260.275" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1211.172,132.02 C1487.195,137.831 1908.808,159.992 2046,239.459 C2055.318,244.856 2063.771,251.951 2071.35,259.902 C2071.468,260.026 2068.149,256.519 2068.267,256.644" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk12" data-link-type="dependency"><polygon points="1912,501.181,1916,492.181,1912,496.181,1908,492.181,1912,501.181" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1912,369.747 C1912,404.311 1912,461.622 1912,496.181" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk13" data-link-type="dependency"><polygon points="1859.117,604.999,1867.508,599.842,1861.946,600.877,1860.912,595.315,1859.117,604.999" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1895.02,552.696 C1884.628,567.834 1873.905,583.455 1861.946,600.877" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk14" data-link-type="dependency"><polygon points="1902.166,725.2,1899.009,715.87,1898.778,721.522,1893.125,721.291,1902.166,725.2" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1868.572,688.739 C1879.17,700.241 1887.502,709.284 1898.778,721.522" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk15" data-link-type="dependency"><polygon points="1936.388,552.488,1939.283,561.902,1939.672,556.258,1945.315,556.648,1936.388,552.488" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1969.868,725.451 C1977.171,690.203 1981.717,644.212 1969,605.459 C1962.491,585.622 1952.032,570.45 1939.672,556.258" style="stroke:#555;stroke-width:1;" fill="none"/><text x="1979" y="645.053" fill="#000" font-size="13" textLength="242.601" font-family="Helvetica">if they don't: loops back and tries again</text><text x="1987.545" y="658.845" fill="#777" font-size="11" textLength="225.511" font-family="Helvetica">sinon : il recommence la boucle et réessaie</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk16" data-link-type="dependency"><polygon points="2384.372,485.285,2378.298,477.533,2379.955,482.941,2374.547,484.599,2384.372,485.285" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M2258.492,418.47 C2258.886,418.679 2259.281,418.888 2259.675,419.098 C2261.254,419.935 2262.836,420.775 2264.421,421.617 C2267.592,423.299 2270.774,424.989 2273.965,426.682 C2286.727,433.456 2299.614,440.297 2312.336,447.049 C2337.78,460.555 2358.148,471.366 2379.955,482.941" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk17" data-link-type="dependency"><polygon points="337.386,286.917,347.234,286.782,341.927,284.824,343.885,279.516,337.386,286.917" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M706.893,174.079 C625.516,191.042 535.551,212.878 455,239.459 C415.744,252.413 378.717,267.863 341.927,284.824" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk18" data-link-type="dependency"><polygon points="756.737,270.919,766.411,269.071,760.844,268.068,761.848,262.5,756.737,270.919" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M854.975,202.698 C823.269,224.717 792.532,246.062 760.844,268.068" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" id="lnk19" data-link-type="dependency"><polygon points="1115.696,239.276,1110.585,230.857,1111.589,236.424,1106.022,237.428,1115.696,239.276" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1063.025,202.698 C1080.004,214.49 1093.777,224.054 1111.589,236.424" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src ZLV1SXit4htpAthZWnA7KY8vAMUrBgKaId9SPQrSDkFTLEK2pZH9H1XW0c0eqrkfsa_PevNp_W5_R5y3GuhoSEnLsU9e27G_TBz-tTYZrsnBzbpIhOvpUcMKZJzVlHnIg3WggyYefMiYVMaTFVUgdY_qUxBC9PTV7Gp-KdirgpQBsZs3GRZH
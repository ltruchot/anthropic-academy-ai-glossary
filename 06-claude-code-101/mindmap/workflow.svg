<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1107px;height:948px;background:#FFFFFF;" width="1107px" height="948px" viewBox="0 0 1107 948" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="400.256" y="23.563" fill="#000" font-size="14" textLength="299.988" font-weight="700" font-family="Helvetica">The Explore, Plan, Code, Commit workflow</text><text x="412.722" y="38.564" fill="#777" font-size="12" textLength="275.057" font-weight="700" font-family="Helvetica">Le flux de travail Explore, Plan, Code, Commit</text></g><!--cluster PM--><g class="cluster" data-qualified-name="PM" id="ent0002" data-source-line="21"><rect x="263.5" y="205.459" width="570" height="308" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="340.353" y="221.99" fill="#000" font-size="15" textLength="416.294" font-weight="700" font-family="Helvetica">Plan mode: the fastest way to handle the first two steps</text><text x="352.823" y="236.265" fill="#777" font-size="11" textLength="391.354" font-weight="700" font-family="Helvetica">Mode Plan : la façon la plus rapide de traiter les deux premières étapes</text></g><!--entity WHY--><g class="entity" data-qualified-name="WHY" id="ent0001" data-source-line="20"><rect x="78.5" y="64.459" width="452.056" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="88.5" y="88.99" fill="#000" font-size="15" textLength="288.494" font-weight="700" font-family="Helvetica">Explore, Plan, Code, Commit workflow</text><text x="88.5" y="103.265" fill="#777" font-size="11" textLength="225.425" font-family="Helvetica">Flux de travail Explore, Plan, Code, Commit</text><text x="88.5" y="120.449" fill="#000" font-size="15" textLength="309.478" font-family="Helvetica">The one thing to take away from the course</text><text x="88.5" y="134.724" fill="#777" font-size="11" textLength="189.046" font-family="Helvetica">La seule chose à retenir de ce cours</text><text x="88.5" y="151.908" fill="#000" font-size="15" textLength="432.056" font-family="Helvetica">Without it: straight to code, and more course-correcting later</text><text x="88.5" y="166.183" fill="#777" font-size="11" textLength="402.816" font-family="Helvetica">Sans lui : directement au code, et davantage d'ajustements en cours de route</text></g><!--entity CO--><g class="entity" data-qualified-name="CO" id="ent0005" data-source-line="25"><rect x="322" y="572.459" width="453.254" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="332" y="596.99" fill="#000" font-size="15" textLength="39.756" font-weight="700" font-family="Helvetica">Code</text><text x="332" y="611.265" fill="#777" font-size="11" textLength="27.779" font-family="Helvetica">Code</text><text x="332" y="628.449" fill="#000" font-size="15" textLength="316.216" font-family="Helvetica">The back and forth between you and Claude</text><text x="332" y="642.724" fill="#777" font-size="11" textLength="185.007" font-family="Helvetica">Le va-et-vient entre vous et Claude</text><text x="332" y="659.908" fill="#000" font-size="15" textLength="391.809" font-family="Helvetica">Define a success criteria, add tools, include a test suite</text><text x="332" y="674.183" fill="#777" font-size="11" textLength="433.254" font-family="Helvetica">Définissez des critères de réussite, ajoutez des outils, fournissez une suite de tests</text></g><!--entity CM--><g class="entity" data-qualified-name="CM" id="ent0006" data-source-line="26"><rect x="599.5" y="770.959" width="491.995" height="145.836" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="609.5" y="795.49" fill="#000" font-size="15" textLength="57.583" font-weight="700" font-family="Helvetica">Commit</text><text x="609.5" y="809.765" fill="#777" font-size="11" textLength="40.165" font-family="Helvetica">Commit</text><text x="609.5" y="826.949" fill="#000" font-size="15" textLength="268.953" font-family="Helvetica">Helps you review and push your code</text><text x="609.5" y="841.224" fill="#777" font-size="11" textLength="217.363" font-family="Helvetica">Vous aide à relire et à pousser votre code</text><text x="609.5" y="858.408" fill="#000" font-size="15" textLength="471.995" font-family="Helvetica">First test the changes yourself, then run a subagent code reviewer</text><text x="609.5" y="872.683" fill="#777" font-size="11" textLength="469.439" font-family="Helvetica">D'abord tester vous-même les changements, puis lancer un sous-agent relecteur de code</text><text x="609.5" y="889.867" fill="#000" font-size="15" textLength="422.292" font-family="Helvetica">Then a commit message in your style, generated by Claude</text><text x="609.5" y="904.142" fill="#777" font-size="11" textLength="335.419" font-family="Helvetica">Puis un message de commit dans votre style, généré par Claude</text></g><!--entity REV--><g class="entity" data-qualified-name="REV" id="ent0007" data-source-line="27"><rect x="6" y="755.459" width="574.612" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="779.99" fill="#000" font-size="15" textLength="94.263" font-weight="700" font-family="Helvetica">Code review</text><text x="16" y="794.265" fill="#777" font-size="11" textLength="77.956" font-family="Helvetica">Revue de code</text><text x="16" y="811.449" fill="#000" font-size="15" textLength="430.254" font-family="Helvetica">/diff: read the actual diff before you trust the summary alone</text><text x="16" y="825.724" fill="#777" font-size="11" textLength="290.275" font-family="Helvetica">/diff : lisez le diff réel avant de vous fier au seul résumé</text><text x="16" y="842.908" fill="#000" font-size="15" textLength="554.612" font-family="Helvetica">/code-review: a second reviewer, in a clean context; it reports, it edits nothing</text><text x="16" y="857.183" fill="#777" font-size="11" textLength="463.692" font-family="Helvetica">/code-review : un second relecteur, dans un contexte vierge ; il signale, il ne modifie rien</text><text x="16" y="874.367" fill="#000" font-size="15" textLength="303.406" font-family="Helvetica">Each finding: Fix now, Ask why, or Leave it</text><text x="16" y="888.642" fill="#777" font-size="11" textLength="460.33" font-family="Helvetica">Chaque constat : « Corriger maintenant », « Demander pourquoi » ou « Laisser tel quel »</text><text x="16" y="905.826" fill="#000" font-size="15" textLength="267.305" font-family="Helvetica">/rewind: if the whole change is wrong</text><text x="16" y="920.101" fill="#777" font-size="11" textLength="226.188" font-family="Helvetica">/rewind : si tout le changement est mauvais</text></g><!--entity E--><g class="entity" data-qualified-name="PM.E" id="ent0003" data-source-line="22"><rect x="364.5" y="263.459" width="435.591" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="374.5" y="287.99" fill="#000" font-size="15" textLength="57.188" font-weight="700" font-family="Helvetica">Explore</text><text x="374.5" y="302.265" fill="#777" font-size="11" textLength="39.531" font-family="Helvetica">Explore</text><text x="374.5" y="319.449" fill="#000" font-size="15" textLength="415.591" font-family="Helvetica">Gives Claude the relevant context it needs for your project</text><text x="374.5" y="333.724" fill="#777" font-size="11" textLength="366.62" font-family="Helvetica">Donne à Claude le contexte pertinent dont il a besoin pour votre projet</text></g><!--entity PL--><g class="entity" data-qualified-name="PM.PL" id="ent0004" data-source-line="23"><rect x="279.5" y="383.459" width="538.32" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="289.5" y="407.99" fill="#000" font-size="15" textLength="32.871" font-weight="700" font-family="Helvetica">Plan</text><text x="289.5" y="422.265" fill="#777" font-size="11" textLength="22.73" font-family="Helvetica">Plan</text><text x="289.5" y="439.449" fill="#000" font-size="15" textLength="439.248" font-family="Helvetica">Creates a plan of action that Claude uses to measure success</text><text x="289.5" y="453.724" fill="#777" font-size="11" textLength="340.823" font-family="Helvetica">Crée un plan d'action que Claude utilise pour mesurer sa réussite</text><text x="289.5" y="470.908" fill="#000" font-size="15" textLength="518.32" font-family="Helvetica">Reviewing it: the best place to course-correct, before any code is written</text><text x="289.5" y="485.183" fill="#777" font-size="11" textLength="388.98" font-family="Helvetica">Sa relecture : le meilleur moment pour ajuster, avant que du code soit écrit</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="304.5,205.125,308.5,196.125,304.5,200.125,300.5,196.125,304.5,205.125" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M304.5,178.892 C304.5,183.965 304.5,189.206 304.5,194.536 C304.5,197.202 304.5,199.889 304.5,202.59 C304.5,203.265 304.5,203.941 304.5,204.618 C304.5,204.787 304.5,199.956 304.5,200.125" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="562.828,383.2,568.926,375.465,564.062,378.354,561.173,373.491,562.828,383.2" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M572.114,346.739 C569.185,358.241 567.179,366.116 564.062,378.354" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="548.5,572.392,552.5,563.392,548.5,567.392,544.5,563.392,548.5,572.392" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M548.5,497.565 C548.5,521.233 548.5,543.729 548.5,567.392" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="744.741,770.867,739.749,762.377,740.674,767.957,735.094,768.883,744.741,770.867" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M626.922,686.569 C663.012,712.391 702.202,740.431 740.674,767.957" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0003" id="lnk12" data-link-type="dependency"><polygon points="784.915,346.611,790.473,354.742,789.17,349.237,794.675,347.934,784.915,346.611" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M865.696,770.776 C888.527,672.434 912.283,495.766 826.5,383.459 C815.101,368.536 805.074,359.053 789.17,349.237" style="stroke:#555;stroke-width:1;" fill="none"/><text x="891.163" y="536.053" fill="#000" font-size="13" textLength="99.982" font-family="Helvetica">rinse and repeat</text><text x="886.5" y="549.845" fill="#777" font-size="11" textLength="109.307" font-family="Helvetica">puis on recommence</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk13" data-link-type="dependency"><polygon points="398.773,755.231,408.248,752.543,402.614,752.03,403.126,746.397,398.773,755.231" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M481.168,686.569 C455.936,707.596 430.466,728.821 402.614,752.03" style="stroke:#555;stroke-width:1;" fill="none"/><text x="476.909" y="719.053" fill="#000" font-size="13" textLength="153.588" font-family="Helvetica">before keeping a change</text><text x="461.5" y="732.845" fill="#777" font-size="11" textLength="184.406" 
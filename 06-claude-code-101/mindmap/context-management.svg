<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1874px;height:766px;background:#FFFFFF;" width="1874px" height="766px" viewBox="0 0 1874 766" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="858.742" y="23.563" fill="#000" font-size="14" textLength="149.516" font-weight="700" font-family="Helvetica">Context management</text><text x="865.221" y="38.564" fill="#777" font-size="12" textLength="136.559" font-weight="700" font-family="Helvetica">La gestion du contexte</text></g><!--cluster CMD--><g class="cluster" data-qualified-name="CMD" id="ent0003" data-source-line="22"><rect x="14" y="452.459" width="1852" height="188" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="867.479" y="468.99" fill="#000" font-size="15" textLength="145.042" font-weight="700" font-family="Helvetica">Context commands</text><text x="871.596" y="483.265" fill="#777" font-size="11" textLength="136.807" font-weight="700" font-family="Helvetica">Commandes de contexte</text></g><!--entity CW--><g class="entity" data-qualified-name="CW" id="ent0001" data-source-line="20"><rect x="1147.5" y="64.459" width="612.844" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1157.5" y="88.99" fill="#000" font-size="15" textLength="121.099" font-weight="700" font-family="Helvetica">Context window</text><text x="1157.5" y="103.265" fill="#777" font-size="11" textLength="104.715" font-family="Helvetica">Fenêtre de contexte</text><text x="1157.5" y="120.449" fill="#000" font-size="15" textLength="365.852" font-family="Helvetica">Claude's working memory, a finite amount of space</text><text x="1157.5" y="134.724" fill="#777" font-size="11" textLength="259.811" font-family="Helvetica">La mémoire de travail de Claude, un espace limité</text><text x="1157.5" y="151.908" fill="#000" font-size="15" textLength="592.844" font-family="Helvetica">Every file it reads, every command it runs, every message you send takes up space</text><text x="1157.5" y="166.183" fill="#777" font-size="11" textLength="585.455" font-family="Helvetica">Chaque fichier qu'il lit, chaque commande qu'il exécute, chaque message que vous envoyez occupe de la place</text></g><!--entity CP--><g class="entity" data-qualified-name="CP" id="ent0002" data-source-line="21"><rect x="566.5" y="247.459" width="508.936" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="576.5" y="271.99" fill="#000" font-size="15" textLength="90.352" font-weight="700" font-family="Helvetica">Compaction</text><text x="576.5" y="286.265" fill="#777" font-size="11" textLength="62.82" font-family="Helvetica">Compaction</text><text x="576.5" y="303.449" fill="#000" font-size="15" textLength="277.192" font-family="Helvetica">Automatic when you approach the limit</text><text x="576.5" y="317.724" fill="#777" font-size="11" textLength="248.338" font-family="Helvetica">Automatique quand vous approchez de la limite</text><text x="576.5" y="334.908" fill="#000" font-size="15" textLength="488.936" font-family="Helvetica">Summarizes important details, removes unnecessary tool call results</text><text x="576.5" y="349.183" fill="#777" font-size="11" textLength="407.285" font-family="Helvetica">Résume les détails importants, supprime les résultats d'appels d'outils inutiles</text><text x="576.5" y="366.367" fill="#000" font-size="15" textLength="191.975" font-family="Helvetica">Can potentially lose details</text><text x="576.5" y="380.642" fill="#777" font-size="11" textLength="179.846" font-family="Helvetica">Peut entraîner une perte de détails</text></g><!--entity TIPS--><g class="entity" data-qualified-name="TIPS" id="ent0007" data-source-line="27"><rect x="1184" y="247.459" width="539.69" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1194" y="271.99" fill="#000" font-size="15" textLength="221.682" font-weight="700" font-family="Helvetica">Tips for saving context space</text><text x="1194" y="286.265" fill="#777" font-size="11" textLength="248.053" font-family="Helvetica">Conseils pour économiser l'espace de contexte</text><text x="1194" y="303.449" fill="#000" font-size="15" textLength="445.825" font-family="Helvetica">Be specific: a vague prompt costs more context in the long run</text><text x="1194" y="317.724" fill="#777" font-size="11" textLength="356.404" font-family="Helvetica">Soyez précis : un prompt vague coûte plus de contexte à long terme</text><text x="1194" y="334.908" fill="#000" font-size="15" textLength="519.69" font-family="Helvetica">Manage your MCP servers: turn off those unrelated to the current project</text><text x="1194" y="349.183" fill="#777" font-size="11" textLength="414.482" font-family="Helvetica">Gérez vos serveurs MCP : désactivez ceux sans rapport avec le projet en cours</text><text x="1194" y="366.367" fill="#000" font-size="15" textLength="412.654" font-family="Helvetica">Use subagents: for tasks where you only need the answer</text><text x="1194" y="380.642" fill="#777" font-size="11" textLength="435.048" font-family="Helvetica">Utilisez des sous-agents : pour les tâches où vous n'avez besoin que de la réponse</text></g><!--entity MD--><g class="entity" data-qualified-name="MD" id="ent0008" data-source-line="28"><rect x="1324" y="667.459" width="383.926" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1334" y="691.99" fill="#000" font-size="15" textLength="119.81" font-weight="700" font-family="Helvetica">CLAUDE.md file</text><text x="1334" y="706.265" fill="#777" font-size="11" textLength="102.378" font-family="Helvetica">Fichier CLAUDE.md</text><text x="1334" y="723.449" fill="#000" font-size="15" textLength="363.926" font-family="Helvetica">For what Claude should remember across sessions</text><text x="1334" y="737.724" fill="#777" font-size="11" textLength="283.196" font-family="Helvetica">Pour ce que Claude doit retenir d'une session à l'autre</text></g><!--entity C1--><g class="entity" data-qualified-name="CMD.C1" id="ent0004" data-source-line="23"><rect x="30.5" y="510.459" width="505.295" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40.5" y="534.99" fill="#000" font-size="15" textLength="70.942" font-weight="700" font-family="Helvetica">/compact</text><text x="40.5" y="549.265" fill="#777" font-size="11" textLength="49.274" font-family="Helvetica">/compact</text><text x="40.5" y="566.449" fill="#000" font-size="15" textLength="485.295" font-family="Helvetica">Runs compaction manually; keeps a memory of what you worked on</text><text x="40.5" y="580.724" fill="#777" font-size="11" textLength="473.618" font-family="Helvetica">Lance la compaction manuellement ; garde une mémoire de ce sur quoi vous avez travaillé</text><text x="40.5" y="597.908" fill="#000" font-size="15" textLength="468.918" font-family="Helvetica">Rule of thumb: to continue a specific feature near the context limit</text><text x="40.5" y="612.183" fill="#777" font-size="11" textLength="459.637" font-family="Helvetica">Règle générale : pour poursuivre une fonctionnalité précise près de la limite de contexte</text></g><!--entity C2--><g class="entity" data-qualified-name="CMD.C2" id="ent0005" data-source-line="24"><rect x="1216.5" y="510.459" width="599.478" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1226.5" y="534.99" fill="#000" font-size="15" textLength="43.733" font-weight="700" font-family="Helvetica">/clear</text><text x="1226.5" y="549.265" fill="#777" font-size="11" textLength="30.008" font-family="Helvetica">/clear</text><text x="1226.5" y="566.449" fill="#000" font-size="15" textLength="428.064" font-family="Helvetica">Starts from scratch, with no memory of the previous session</text><text x="1226.5" y="580.724" fill="#777" font-size="11" textLength="331.289" font-family="Helvetica">Repart de zéro, sans aucune mémoire de la session précédente</text><text x="1226.5" y="597.908" fill="#000" font-size="15" textLength="579.478" font-family="Helvetica">Rule of thumb: to start a new feature, with no bias from the previous conversation</text><text x="1226.5" y="612.183" fill="#777" font-size="11" textLength="569.701" font-family="Helvetica">Règle générale : pour commencer une nouvelle fonctionnalité, sans biais venu de la conversation précédente</text></g><!--entity C3--><g class="entity" data-qualified-name="CMD.C3" id="ent0006" data-source-line="25"><rect x="554" y="525.959" width="644.287" height="82.918" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="564" y="550.49" fill="#000" font-size="15" textLength="62.329" font-weight="700" font-family="Helvetica">/context</text><text x="564" y="564.765" fill="#777" font-size="11" textLength="42.958" font-family="Helvetica">/context</text><text x="564" y="581.949" fill="#000" font-size="15" textLength="624.287" font-family="Helvetica">An overview of your context size, the categories taking the most space, a visual graphic</text><text x="564" y="596.224" fill="#777" font-size="11" textLength="516.458" font-family="Helvetica">Un aperçu de la taille de votre contexte, les catégories qui occupent le plus de place, un graphique</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="1052.415,247.439,1062.197,248.584,1057.189,245.953,1059.819,240.945,1052.415,247.439" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1273.878,178.516 C1204.987,199.956 1130.211,223.227 1057.189,245.953" style="stroke:#555;stroke-width:1;" fill="none"/><text x="1224.834" y="211.053" fill="#000" font-size="13" textLength="89.584" font-family="Helvetica">when it fills up</text><text x="1215" y="224.845" fill="#777" font-size="11" textLength="109.253" font-family="Helvetica">quand elle se remplit</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="1828.272,451.667,1830.404,442.052,1827.279,446.767,1822.564,443.641,1828.272,451.667" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1631.15,178.484 C1668.049,196.195 1704.374,218.851 1733,247.459 C1778.744,293.174 1805.306,358.858 1820.723,418.755 C1822.65,426.242 1824.403,433.639 1825.998,440.895 C1826.795,444.523 1826.559,443.215 1827.279,446.767" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="405.99,510.45,415.839,510.361,410.541,508.378,412.523,503.08,405.99,510.45" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M662.855,393.477 C580.858,430.817 486.757,473.67 410.541,508.378" style="stroke:#555;stroke-width:1;" fill="none"/><text x="628.013" y="426.053" fill="#000" font-size="13" textLength="55.821" font-family="Helvetica">manually</text><text x="619" y="439.845" fill="#777" font-size="11" textLength="73.847" font-family="Helvetica">manuellement</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk12" data-link-type="dependency"><polygon points="1454,247.346,1458,238.346,1454,242.346,1450,238.346,1454,247.346" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1454,178.648 C1454,200.028 1454,219.692 1454,242.346" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk13" data-link-type="dependency"><polygon points="1516,667.279,1520,658.279,1516,662.279,1512,658.279,1516,
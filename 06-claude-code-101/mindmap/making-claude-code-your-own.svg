<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2903px;height:376px;background:#FFFFFF;" width="2903px" height="376px" viewBox="0 0 2903 376" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1341.001" y="23.563" fill="#000" font-size="14" textLength="214.498" font-weight="700" font-family="Helvetica">Making Claude Code your own</text><text x="1370.109" y="38.564" fill="#777" font-size="12" textLength="156.281" font-weight="700" font-family="Helvetica">S'approprier Claude Code</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0001" data-source-line="20"><rect x="1054.5" y="64.459" width="444.387" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1064.5" y="88.99" fill="#000" font-size="15" textLength="97.097" font-weight="700" font-family="Helvetica">Claude Code</text><text x="1064.5" y="103.265" fill="#777" font-size="11" textLength="67.767" font-family="Helvetica">Claude Code</text><text x="1064.5" y="120.449" fill="#000" font-size="15" textLength="424.387" font-family="Helvetica">The course's final section: a setup tailored to how you work</text><text x="1064.5" y="134.724" fill="#777" font-size="11" textLength="423.645" font-family="Helvetica">La dernière partie du cours : une configuration adaptée à votre façon de travailler</text></g><!--entity MD--><g class="entity" data-qualified-name="MD" id="ent0002" data-source-line="21"><rect x="6" y="183.459" width="507.068" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="207.99" fill="#000" font-size="15" textLength="119.81" font-weight="700" font-family="Helvetica">CLAUDE.md file</text><text x="16" y="222.265" fill="#777" font-size="11" textLength="102.378" font-family="Helvetica">Fichier CLAUDE.md</text><text x="16" y="239.449" fill="#000" font-size="15" textLength="267.832" font-family="Helvetica">Persistent memory about your project</text><text x="16" y="253.724" fill="#777" font-size="11" textLength="210.144" font-family="Helvetica">Une mémoire persistante de votre projet</text><text x="16" y="270.908" fill="#000" font-size="15" textLength="471.995" font-family="Helvetica">A Markdown file, read automatically every time you start a session</text><text x="16" y="285.183" fill="#777" font-size="11" textLength="361.367" font-family="Helvetica">Un fichier Markdown, lu automatiquement à chaque début de session</text><text x="16" y="302.367" fill="#000" font-size="15" textLength="487.068" font-family="Helvetica">Project-level CLAUDE.md: in the project's root, shared with the team</text><text x="16" y="316.642" fill="#777" font-size="11" textLength="398.97" font-family="Helvetica">CLAUDE.md au niveau du projet : à la racine du projet, partagé avec l'équipe</text><text x="16" y="333.826" fill="#000" font-size="15" textLength="429.888" font-family="Helvetica">User-level CLAUDE.md: just for you, across all your projects</text><text x="16" y="348.101" fill="#777" font-size="11" textLength="396.5" font-family="Helvetica">CLAUDE.md au niveau utilisateur : rien que pour vous, dans tous vos projets</text></g><!--entity SUB--><g class="entity" data-qualified-name="SUB" id="ent0003" data-source-line="22"><rect x="531.5" y="198.959" width="432.375" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="541.5" y="223.49" fill="#000" font-size="15" textLength="71.565" font-weight="700" font-family="Helvetica">Subagent</text><text x="541.5" y="237.765" fill="#777" font-size="11" textLength="60.457" font-family="Helvetica">Sous-agent</text><text x="541.5" y="254.949" fill="#000" font-size="15" textLength="399.507" font-family="Helvetica">Its own isolated context window; returns just a summary</text><text x="541.5" y="269.224" fill="#777" font-size="11" textLength="329.554" font-family="Helvetica">Sa propre fenêtre de contexte isolée ; ne renvoie qu'un résumé</text><text x="541.5" y="286.408" fill="#000" font-size="15" textLength="412.375" font-family="Helvetica">Custom subagent: a Markdown file with YAML frontmatter</text><text x="541.5" y="300.683" fill="#777" font-size="11" textLength="386.858" font-family="Helvetica">Sous-agent personnalisé : un fichier Markdown avec un frontmatter YAML</text><text x="541.5" y="317.867" fill="#000" font-size="15" textLength="358.044" font-family="Helvetica">Built-in subagents: general-purpose, explore, plan</text><text x="541.5" y="332.142" fill="#777" font-size="11" textLength="324.119" font-family="Helvetica">Sous-agents intégrés : à usage général, d'exploration, de plan</text></g><!--entity SK--><g class="entity" data-qualified-name="SK" id="ent0004" data-source-line="23"><rect x="981.5" y="198.959" width="589.758" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="991.5" y="223.49" fill="#000" font-size="15" textLength="32.095" font-weight="700" font-family="Helvetica">Skill</text><text x="991.5" y="237.765" fill="#777" font-size="11" textLength="21.817" font-family="Helvetica">Skill</text><text x="991.5" y="254.949" fill="#000" font-size="15" textLength="463.25" font-family="Helvetica">A markdown file that teaches Claude, once, how to do something</text><text x="991.5" y="269.224" fill="#777" font-size="11" textLength="453.24" font-family="Helvetica">Un fichier Markdown qui apprend à Claude, une fois pour toutes, à faire quelque chose</text><text x="991.5" y="286.408" fill="#000" font-size="15" textLength="452.043" font-family="Helvetica">Loads on demand: only its name and description stay in context</text><text x="991.5" y="300.683" fill="#777" font-size="11" textLength="429.161" font-family="Helvetica">Se charge à la demande : seuls son nom et sa description restent dans le contexte</text><text x="991.5" y="317.867" fill="#000" font-size="15" textLength="569.758" font-family="Helvetica">Personal skills follow you; project skills reach anyone who clones the repository</text><text x="991.5" y="332.142" fill="#777" font-size="11" textLength="452.477" font-family="Helvetica">Les skills personnels vous suivent ; les skills de projet vont à quiconque clone le dépôt</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0005" data-source-line="24"><rect x="1589.5" y="198.959" width="562.454" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1599.5" y="223.49" fill="#000" font-size="15" textLength="35.493" font-weight="700" font-family="Helvetica">MCP</text><text x="1599.5" y="237.765" fill="#777" font-size="11" textLength="24.997" font-family="Helvetica">MCP</text><text x="1599.5" y="254.949" fill="#000" font-size="15" textLength="542.454" font-family="Helvetica">An open standard: connects Claude Code to external tools and data sources</text><text x="1599.5" y="269.224" fill="#777" font-size="11" textLength="467.414" font-family="Helvetica">Un standard ouvert : relie Claude Code à des outils externes et à des sources de données</text><text x="1599.5" y="286.408" fill="#000" font-size="15" textLength="437.38" font-family="Helvetica">MCP server: an HTTP server (remote) or a stdio server (local)</text><text x="1599.5" y="300.683" fill="#777" font-size="11" textLength="352.403" font-family="Helvetica">Serveur MCP : un serveur HTTP (distant) ou un serveur stdio (local)</text><text x="1599.5" y="317.867" fill="#000" font-size="15" textLength="402.737" font-family="Helvetica">MCP server scopes: local, user, project (a .mcp.json file)</text><text x="1599.5" y="332.142" fill="#777" font-size="11" textLength="403.144" font-family="Helvetica">Portées des serveurs MCP : locale, utilisateur, de projet (un fichier .mcp.json)</text></g><!--entity HK--><g class="entity" data-qualified-name="HK" id="ent0006" data-source-line="25"><rect x="2169.5" y="183.459" width="718.103" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2179.5" y="207.99" fill="#000" font-size="15" textLength="39.243" font-weight="700" font-family="Helvetica">Hook</text><text x="2179.5" y="222.265" fill="#777" font-size="11" textLength="27.403" font-family="Helvetica">Hook</text><text x="2179.5" y="239.449" fill="#000" font-size="15" textLength="432.971" font-family="Helvetica">A command run at a specific point in Claude Code's lifecycle</text><text x="2179.5" y="253.724" fill="#777" font-size="11" textLength="408.601" font-family="Helvetica">Une commande exécutée à un moment précis du cycle de vie de Claude Code</text><text x="2179.5" y="270.908" fill="#000" font-size="15" textLength="199.578" font-family="Helvetica">Deterministic: it always runs</text><text x="2179.5" y="285.183" fill="#777" font-size="11" textLength="180.168" font-family="Helvetica">Déterministe : il s'exécute toujours</text><text x="2179.5" y="302.367" fill="#000" font-size="15" textLength="668.416" font-family="Helvetica">Hook event: PreToolUse can block (exit code 2); PostToolUse for auto-formatting and logging</text><text x="2179.5" y="316.642" fill="#777" font-size="11" textLength="698.103" font-family="Helvetica">Événement de hook : PreToolUse peut bloquer (code de sortie 2) ; PostToolUse pour la mise en forme automatique et la journalisation</text><text x="2179.5" y="333.826" fill="#000" font-size="15" textLength="501.313" font-family="Helvetica">Configured in settings.json: an event, an optional matcher, a command</text><text x="2179.5" y="348.101" fill="#777" font-size="11" textLength="433.592" font-family="Helvetica">Configuré dans settings.json : un événement, un matcher facultatif, une commande</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="513.285,185.493,522.947,187.402,518.161,184.386,521.176,179.6,513.285,185.493" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1054.278,116.639 C903.044,126.358 699.076,145.611 522.5,183.459 C519.442,184.115 521.245,183.686 518.161,184.386" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="927.013,198.868,936.834,199.617,931.723,197.191,934.15,192.08,927.013,198.868" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1099.827,147.468 C1057.81,158.188 1013.332,170.437 972.5,183.459 C957.626,188.202 947.026,191.741 931.723,197.191" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="1276.5,198.944,1280.5,189.944,1276.5,193.944,1272.5,189.944,1276.5,198.944" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1276.5,147.498 C1276.5,163.054 1276.5,176.312 1276.5,193.944" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="1634.943,198.886,1627.41,192.542,1630.14,197.497,1625.186,200.227,1634.943,198.886" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1443.72,147.555 C1488.276,158.776 1536.307,171.239 1580.5,183.459 C1598.24,188.365 1611.748,192.175 1630.14,197.497" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="2169.285,184.901,2161.067,179.473,2164.353,184.077,2159.748,187.364,2169.285,184.901" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1498.764,117.122 C1678.20
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2888px;height:376px;background:#FFFFFF;" width="2888px" height="376px" viewBox="0 0 2888 376" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="1333.251" y="23.563" fill="#000" font-size="14" textLength="214.498" font-weight="700" font-family="Helvetica">Making Claude Code your own</text><text x="1362.359" y="38.564" fill="#777" font-size="12" textLength="156.281" font-weight="700" font-family="Helvetica">S'approprier Claude Code</text></g><!--entity CC--><g class="entity" data-qualified-name="CC" id="ent0001" data-source-line="20"><rect x="1059.5" y="64.459" width="444.387" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1069.5" y="88.99" fill="#000" font-size="15" textLength="97.097" font-weight="700" font-family="Helvetica">Claude Code</text><text x="1069.5" y="103.265" fill="#777" font-size="11" textLength="67.767" font-family="Helvetica">Claude Code</text><text x="1069.5" y="120.449" fill="#000" font-size="15" textLength="424.387" font-family="Helvetica">The course's final section: a setup tailored to how you work</text><text x="1069.5" y="134.724" fill="#777" font-size="11" textLength="423.645" font-family="Helvetica">La dernière partie du cours : une configuration adaptée à votre façon de travailler</text></g><!--entity MD--><g class="entity" data-qualified-name="MD" id="ent0002" data-source-line="21"><rect x="6" y="183.459" width="507.068" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="207.99" fill="#000" font-size="15" textLength="119.81" font-weight="700" font-family="Helvetica">CLAUDE.md file</text><text x="16" y="222.265" fill="#777" font-size="11" textLength="102.378" font-family="Helvetica">Fichier CLAUDE.md</text><text x="16" y="239.449" fill="#000" font-size="15" textLength="267.832" font-family="Helvetica">Persistent memory about your project</text><text x="16" y="253.724" fill="#777" font-size="11" textLength="210.144" font-family="Helvetica">Une mémoire persistante de votre projet</text><text x="16" y="270.908" fill="#000" font-size="15" textLength="471.995" font-family="Helvetica">A Markdown file, read automatically every time you start a session</text><text x="16" y="285.183" fill="#777" font-size="11" textLength="361.367" font-family="Helvetica">Un fichier Markdown, lu automatiquement à chaque début de session</text><text x="16" y="302.367" fill="#000" font-size="15" textLength="487.068" font-family="Helvetica">Project-level CLAUDE.md: in the project's root, shared with the team</text><text x="16" y="316.642" fill="#777" font-size="11" textLength="398.97" font-family="Helvetica">CLAUDE.md au niveau du projet : à la racine du projet, partagé avec l'équipe</text><text x="16" y="333.826" fill="#000" font-size="15" textLength="429.888" font-family="Helvetica">User-level CLAUDE.md: just for you, across all your projects</text><text x="16" y="348.101" fill="#777" font-size="11" textLength="396.5" font-family="Helvetica">CLAUDE.md au niveau utilisateur : rien que pour vous, dans tous vos projets</text></g><!--entity SUB--><g class="entity" data-qualified-name="SUB" id="ent0003" data-source-line="22"><rect x="531" y="198.959" width="437.048" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="541" y="223.49" fill="#000" font-size="15" textLength="71.565" font-weight="700" font-family="Helvetica">Subagent</text><text x="541" y="237.765" fill="#777" font-size="11" textLength="60.457" font-family="Helvetica">Sous-agent</text><text x="541" y="254.949" fill="#000" font-size="15" textLength="399.507" font-family="Helvetica">Its own isolated context window; returns just a summary</text><text x="541" y="269.224" fill="#777" font-size="11" textLength="329.554" font-family="Helvetica">Sa propre fenêtre de contexte isolée ; ne renvoie qu'un résumé</text><text x="541" y="286.408" fill="#000" font-size="15" textLength="412.375" font-family="Helvetica">Custom subagent: a Markdown file with YAML frontmatter</text><text x="541" y="300.683" fill="#777" font-size="11" textLength="386.858" font-family="Helvetica">Sous-agent personnalisé : un fichier Markdown avec un frontmatter YAML</text><text x="541" y="317.867" fill="#000" font-size="15" textLength="417.048" font-family="Helvetica">Built-in subagents, such as general-purpose, explore, plan</text><text x="541" y="332.142" fill="#777" font-size="11" textLength="395.173" font-family="Helvetica">Sous-agents intégrés, par exemple : à usage général, d'exploration, de plan</text></g><!--entity SK--><g class="entity" data-qualified-name="SK" id="ent0004" data-source-line="23"><rect x="986.5" y="198.959" width="589.758" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="996.5" y="223.49" fill="#000" font-size="15" textLength="32.095" font-weight="700" font-family="Helvetica">Skill</text><text x="996.5" y="237.765" fill="#777" font-size="11" textLength="21.817" font-family="Helvetica">Skill</text><text x="996.5" y="254.949" fill="#000" font-size="15" textLength="463.66" font-family="Helvetica">A Markdown file that teaches Claude, once, how to do something</text><text x="996.5" y="269.224" fill="#777" font-size="11" textLength="453.24" font-family="Helvetica">Un fichier Markdown qui apprend à Claude, une fois pour toutes, à faire quelque chose</text><text x="996.5" y="286.408" fill="#000" font-size="15" textLength="519.727" font-family="Helvetica">Loads on demand: until then, only its name and description are in context</text><text x="996.5" y="300.683" fill="#777" font-size="11" textLength="455.399" font-family="Helvetica">Se charge à la demande : d'ici là, seuls son nom et sa description sont dans le contexte</text><text x="996.5" y="317.867" fill="#000" font-size="15" textLength="569.758" font-family="Helvetica">Personal skills follow you; project skills reach anyone who clones the repository</text><text x="996.5" y="332.142" fill="#777" font-size="11" textLength="456.436" font-family="Helvetica">Les skills personnels vous suivent ; quiconque clone le dépôt obtient les skills de projet</text></g><!--entity MCP--><g class="entity" data-qualified-name="MCP" id="ent0005" data-source-line="24"><rect x="1594.5" y="198.959" width="562.454" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1604.5" y="223.49" fill="#000" font-size="15" textLength="35.493" font-weight="700" font-family="Helvetica">MCP</text><text x="1604.5" y="237.765" fill="#777" font-size="11" textLength="24.997" font-family="Helvetica">MCP</text><text x="1604.5" y="254.949" fill="#000" font-size="15" textLength="542.454" font-family="Helvetica">An open standard: connects Claude Code to external tools and data sources</text><text x="1604.5" y="269.224" fill="#777" font-size="11" textLength="467.414" font-family="Helvetica">Un standard ouvert : relie Claude Code à des outils externes et à des sources de données</text><text x="1604.5" y="286.408" fill="#000" font-size="15" textLength="432.759" font-family="Helvetica">MCP server: two main types, HTTP (remote) and stdio (local)</text><text x="1604.5" y="300.683" fill="#777" font-size="11" textLength="352.983" font-family="Helvetica">Serveur MCP : deux types principaux, HTTP (distant) et stdio (local)</text><text x="1604.5" y="317.867" fill="#000" font-size="15" textLength="402.737" font-family="Helvetica">MCP server scopes: local, user, project (a .mcp.json file)</text><text x="1604.5" y="332.142" fill="#777" font-size="11" textLength="403.144" font-family="Helvetica">Portées des serveurs MCP : locale, utilisateur, de projet (un fichier .mcp.json)</text></g><!--entity HK--><g class="entity" data-qualified-name="HK" id="ent0006" data-source-line="25"><rect x="2175" y="183.459" width="697.418" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="2185" y="207.99" fill="#000" font-size="15" textLength="39.243" font-weight="700" font-family="Helvetica">Hook</text><text x="2185" y="222.265" fill="#777" font-size="11" textLength="27.403" font-family="Helvetica">Hook</text><text x="2185" y="239.449" fill="#000" font-size="15" textLength="432.971" font-family="Helvetica">A command run at a specific point in Claude Code's lifecycle</text><text x="2185" y="253.724" fill="#777" font-size="11" textLength="408.601" font-family="Helvetica">Une commande exécutée à un moment précis du cycle de vie de Claude Code</text><text x="2185" y="270.908" fill="#000" font-size="15" textLength="199.578" font-family="Helvetica">Deterministic: it always runs</text><text x="2185" y="285.183" fill="#777" font-size="11" textLength="180.168" font-family="Helvetica">Déterministe : il s'exécute toujours</text><text x="2185" y="302.367" fill="#000" font-size="15" textLength="668.416" font-family="Helvetica">Hook event: PreToolUse can block (exit code 2); PostToolUse for auto-formatting and logging</text><text x="2185" y="316.642" fill="#777" font-size="11" textLength="677.418" font-family="Helvetica">Événement de hook : PreToolUse peut bloquer (code de sortie 2) ; PostToolUse pour le formatage automatique et la journalisation</text><text x="2185" y="333.826" fill="#000" font-size="15" textLength="501.313" font-family="Helvetica">Configured in settings.json: an event, an optional matcher, a command</text><text x="2185" y="348.101" fill="#777" font-size="11" textLength="433.592" font-family="Helvetica">Configuré dans settings.json : un événement, un matcher facultatif, une commande</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="513.026,185.328,522.687,187.242,517.903,184.224,520.921,179.439,513.026,185.328" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1059.16,116.321 C906.551,125.912 700.108,145.143 521.5,183.459 C518.687,184.063 520.738,183.582 517.903,184.224" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="931.44,198.915,941.258,199.697,936.156,197.254,938.6,192.152,931.44,198.915" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1105.268,147.497 C1063.133,158.236 1018.491,170.487 977.5,183.459 C962.443,188.224 951.656,191.793 936.156,197.254" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="1281.5,198.944,1285.5,189.944,1281.5,193.944,1277.5,189.944,1281.5,198.944" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1281.5,147.498 C1281.5,163.054 1281.5,176.312 1281.5,193.944" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="1639.943,198.886,1632.41,192.542,1635.14,197.497,1630.186,200.227,1639.943,198.886" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1448.72,147.555 C1493.276,158.776 1541.307,171.239 1585.5,183.459 C1603.24,188.365 1616.748,192.175 1635.14,197.497" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon points="2174.531,184.974,2166.333,179.515,2169.602,184.131,2164.986,187.4,2174.531,184.974" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1503.826,116.741 C1683.304,126.
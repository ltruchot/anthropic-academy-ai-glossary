<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:761px;height:967px;background:#FFFFFF;" width="761px" height="967px" viewBox="0 0 761 967" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="262.338" y="23.563" fill="#000" font-size="14" textLength="229.824" font-weight="700" font-family="Helvetica">Choosing the right Claude model</text><text x="288.873" y="38.564" fill="#777" font-size="12" textLength="176.754" font-weight="700" font-family="Helvetica">Choisir le bon modèle Claude</text></g><!--cluster RANGE--><g class="cluster" data-qualified-name="RANGE" id="ent0002" data-source-line="22"><rect x="14" y="178.459" width="340" height="765" fill="#F9F8F4" style="stroke:#FFF;stroke-width:1;" rx="6" ry="6"/><text x="38.746" y="194.99" fill="#000" font-size="15" textLength="69.609" font-weight="700" font-family="Helvetica">Rate limit</text><text x="108.355" y="194.99" fill="#000" font-size="15" textLength="220.898" font-weight="700" font-family="Helvetica">: from the lightest to the most</text><text x="40.393" y="209.265" fill="#777" font-size="11" textLength="287.214" font-weight="700" font-family="Helvetica">Limite d'utilisation : du plus sobre au plus gourmand</text></g><!--entity CM--><g class="entity" data-qualified-name="CM" id="ent0001" data-source-line="20"><rect x="177.5" y="56.459" width="305.447" height="114.377" fill="#BCD3CB" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="187.5" y="80.99" fill="#000" font-size="15" textLength="112.266" font-weight="700" font-family="Helvetica">Claude models</text><text x="187.5" y="95.265" fill="#777" font-size="11" textLength="101.159" font-family="Helvetica">Modèles de Claude</text><text x="187.5" y="112.449" fill="#000" font-size="15" textLength="225.037" font-family="Helvetica">Different tools for different jobs</text><text x="187.5" y="126.724" fill="#777" font-size="11" textLength="251.872" font-family="Helvetica">Des outils différents pour des tâches différentes</text><text x="187.5" y="143.908" fill="#000" font-size="15" textLength="251.917" font-family="Helvetica">Each uses your rate limit differently</text><text x="187.5" y="158.183" fill="#777" font-size="11" textLength="285.447" font-family="Helvetica">Chacun pèse différemment sur votre limite d'utilisation</text></g><!--entity EF--><g class="entity" data-qualified-name="EF" id="ent0007" data-source-line="29"><rect x="390.5" y="386.459" width="303.363" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="400.5" y="410.99" fill="#000" font-size="15" textLength="98.152" font-weight="700" font-family="Helvetica">Effort setting</text><text x="400.5" y="425.265" fill="#777" font-size="11" textLength="78.246" font-family="Helvetica">Niveau d'effort</text><text x="400.5" y="442.449" fill="#000" font-size="15" textLength="165.674" font-family="Helvetica">The depth of reasoning</text><text x="400.5" y="456.724" fill="#777" font-size="11" textLength="164.291" font-family="Helvetica">La profondeur du raisonnement</text><text x="400.5" y="473.908" fill="#000" font-size="15" textLength="282.502" font-family="Helvetica">Default: the right balance for most work</text><text x="400.5" y="488.183" fill="#777" font-size="11" textLength="283.363" font-family="Helvetica">Par défaut : le bon équilibre pour la plupart des tâches</text><text x="400.5" y="505.367" fill="#000" font-size="15" textLength="231.401" font-family="Helvetica">Lower: quicker, less of your limit</text><text x="400.5" y="519.642" fill="#777" font-size="11" textLength="251.985" font-family="Helvetica">Plus bas : plus rapide, entame moins votre limite</text><text x="400.5" y="536.826" fill="#000" font-size="15" textLength="223.975" font-family="Helvetica">Highest: your hardest problems</text><text x="400.5" y="551.101" fill="#777" font-size="11" textLength="246.893" font-family="Helvetica">Le plus élevé : vos problèmes les plus difficiles</text></g><!--entity TE--><g class="entity" data-qualified-name="TE" id="ent0008" data-source-line="31"><rect x="370.5" y="599.459" width="383.127" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="380.5" y="623.99" fill="#000" font-size="15" textLength="247.163" font-weight="700" font-family="Helvetica">Try the same task on two models</text><text x="380.5" y="638.265" fill="#777" font-size="11" textLength="216.718" font-family="Helvetica">Essayer la même tâche sur deux modèles</text><text x="380.5" y="655.449" fill="#000" font-size="15" textLength="363.127" font-family="Helvetica">Compare where the answers differ, not their length</text><text x="380.5" y="669.724" fill="#777" font-size="11" textLength="336.639" font-family="Helvetica">Comparer les points où les réponses diffèrent, pas leur longueur</text><text x="380.5" y="686.908" fill="#000" font-size="15" textLength="328.088" font-family="Helvetica">Haiku's answer covers all you'd have flagged:</text><text x="380.5" y="705.058" fill="#000" font-size="15" textLength="175.737" font-family="Helvetica">the task is Haiku-shaped</text><text x="380.5" y="719.332" fill="#777" font-size="11" textLength="313.328" font-family="Helvetica">La réponse de Haiku couvre tout ce que vous auriez relevé :</text><text x="380.5" y="732.642" fill="#777" font-size="11" textLength="154.328" font-family="Helvetica">la tâche est taillée pour Haiku</text></g><!--entity TI--><g class="entity" data-qualified-name="TI" id="ent0009" data-source-line="33"><rect x="404" y="812.959" width="316.055" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="414" y="837.49" fill="#000" font-size="15" textLength="204.749" font-weight="700" font-family="Helvetica">Choosing models over time</text><text x="414" y="851.765" fill="#777" font-size="11" textLength="185.501" font-family="Helvetica">Choisir ses modèles au fil du temps</text><text x="414" y="868.949" fill="#000" font-size="15" textLength="276.995" font-family="Helvetica">Each new model: more ambitious tasks</text><text x="414" y="883.224" fill="#777" font-size="11" textLength="296.055" font-family="Helvetica">À chaque nouveau modèle : des tâches plus ambitieuses</text></g><!--entity HA--><g class="entity" data-qualified-name="RANGE.HA" id="ent0003" data-source-line="23"><rect x="36" y="236.459" width="267.688" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="46" y="260.99" fill="#000" font-size="15" textLength="40.305" font-family="Helvetica">Haiku</text><text x="46" y="275.265" fill="#777" font-size="11" textLength="29.557" font-family="Helvetica">Haiku</text><text x="46" y="292.449" fill="#000" font-size="15" textLength="216.812" font-family="Helvetica">Fastest, for everyday requests</text><text x="46" y="306.724" fill="#777" font-size="11" textLength="247.688" font-family="Helvetica">Le plus rapide, pour les demandes du quotidien</text><text x="46" y="323.908" fill="#000" font-size="15" textLength="238.257" font-family="Helvetica">Quick lookups, simple summaries</text><text x="46" y="338.183" fill="#777" font-size="11" textLength="197.774" font-family="Helvetica">Recherches rapides, résumés simples</text></g><!--entity SO--><g class="entity" data-qualified-name="RANGE.SO" id="ent0004" data-source-line="24"><rect x="30.5" y="401.959" width="307.074" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="40.5" y="426.49" fill="#000" font-size="15" textLength="49.995" font-family="Helvetica">Sonnet</text><text x="40.5" y="440.765" fill="#777" font-size="11" textLength="36.663" font-family="Helvetica">Sonnet</text><text x="40.5" y="457.949" fill="#000" font-size="15" textLength="246.614" font-family="Helvetica">The daily driver, a versatile default</text><text x="40.5" y="472.224" fill="#777" font-size="11" textLength="287.074" font-family="Helvetica">Le modèle du quotidien, un choix par défaut polyvalent</text><text x="40.5" y="489.408" fill="#000" font-size="15" textLength="271.165" font-family="Helvetica">Coding, writing, multi-step workflows;</text><text x="40.5" y="507.558" fill="#000" font-size="15" textLength="139.783" font-family="Helvetica">not sure? Start here</text><text x="40.5" y="521.832" fill="#777" font-size="11" textLength="271.681" font-family="Helvetica">Code, rédaction, flux de travail en plusieurs étapes ;</text><text x="40.5" y="535.142" fill="#777" font-size="11" textLength="188.993" font-family="Helvetica">en cas de doute, commencez par lui</text></g><!--entity OP--><g class="entity" data-qualified-name="RANGE.OP" id="ent0005" data-source-line="25"><rect x="35" y="615.459" width="298.013" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="45" y="639.99" fill="#000" font-size="15" textLength="37.441" font-family="Helvetica">Opus</text><text x="45" y="654.265" fill="#777" font-size="11" textLength="27.457" font-family="Helvetica">Opus</text><text x="45" y="671.449" fill="#000" font-size="15" textLength="196.494" font-family="Helvetica">A large reasoning specialist</text><text x="45" y="685.724" fill="#777" font-size="11" textLength="239.046" font-family="Helvetica">Un grand modèle spécialiste du raisonnement</text><text x="45" y="702.908" fill="#000" font-size="15" textLength="278.013" font-family="Helvetica">Deep research; when Sonnet struggled</text><text x="45" y="717.183" fill="#777" font-size="11" textLength="245.497" font-family="Helvetica">Recherche approfondie ; quand Sonnet a peiné</text></g><!--entity FA--><g class="entity" data-qualified-name="RANGE.FA" id="ent0006" data-source-line="26"><rect x="35" y="781.459" width="298.188" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="45" y="805.99" fill="#000" font-size="15" textLength="39.338" font-family="Helvetica">Fable</text><text x="45" y="820.265" fill="#777" font-size="11" textLength="28.848" font-family="Helvetica">Fable</text><text x="45" y="837.449" fill="#000" font-size="15" textLength="278.188" font-family="Helvetica">The most capable: long, complex tasks</text><text x="45" y="851.724" fill="#777" font-size="11" textLength="260.847" font-family="Helvetica">Le plus performant : tâches longues et complexes</text><text x="45" y="868.908" fill="#000" font-size="15" textLength="266.909" font-family="Helvetica">Plans the steps, checks its own work;</text><text x="45" y="887.058" fill="#000" font-size="15" textLength="152.432" font-family="Helvetica">when Opus struggled</text><text x="45" y="901.332" fill="#777" font-size="11" textLength="235.259" font-family="Helvetica">Planifie les étapes, vérifie son propre travail ;</text><text x="45" y="914.642" fill="#777" font-size="11" textLength="104.291" font-family="Helvetica">quand Opus a peiné</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk13" data-link-type="dependency"><polygon points="330,178.297,334,169.297,330,173.297,326,169.297,330,178.297" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M330,170.779 C330,173.249 330,170.758 330,173.297" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="438.457,386.29,434.174,377.421,434.642,383.059,429.004,383.527,438.457,386.29" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M354.173,314.926 C354.28,315.017 354.388,315.108 354.496,315.2 C354.712,315.383 354.929,315.566 355.147,315.751 C362.13,321.663 370.265,328.551 379.158,336.081 C396.945,351.141 413.948,365.537 434.642,383.059" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-
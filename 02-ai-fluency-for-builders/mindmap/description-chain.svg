<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="466px" preserveAspectRatio="none" style="width:977px;height:466px;background:#FFFFFF;" version="1.1" viewBox="0 0 977 466" width="977px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153" x="404.5" y="20.7803">The Description Chain</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="141" x="410.5" y="33.2402">La cha&#238;ne de Description</text><!--cluster CHAIN--><g id="cluster_CHAIN"><rect fill="#FFFFFF" height="210" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="910" x="14" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="727" x="105.5" y="72.5503">From a messy human need to a precise instruction AI can act on: the builder, the translator at every step</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="573" x="182.5" y="84.4702">D'un besoin humain flou &#224; une instruction pr&#233;cise que l'IA peut suivre : le builder, traducteur &#224; chaque &#233;tape</text></g><!--entity FAIL--><g id="elem_FAIL"><rect fill="#F2E4DC" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="288" x="345" y="321"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="129" x="355" y="342.5503">Description failure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="355" y="354.4702">Erreur de Description</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="355" y="368.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="252" x="355" y="383.5503">code that works, a product that doesn't</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="159" x="355" y="395.4702">le code fonctionne, pas le produit</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="268" x="355" y="409.5503">not a bug: usually upstream of the prompt</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="214" x="355" y="421.4702">pas un bug : en g&#233;n&#233;ral en amont du prompt</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="215" x="355" y="435.5503">trace it back to the link that broke</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="176" x="355" y="447.4702">remonter jusqu'au maillon qui a c&#233;d&#233;</text></g><!--entity TESTS--><g id="elem_TESTS"><rect fill="#F9F8F4" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="320" x="651" y="334"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="300" x="661" y="355.5503">Tests, the most precise form of description</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="234" x="661" y="367.4702">Les tests, la forme de description la plus pr&#233;cise</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="661" y="381.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="212" x="661" y="396.5503">a passing test, an unhappy user:</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="210" x="661" y="408.4702">un test qui passe, un utilisateur m&#233;content :</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="661" y="422.5503">you described the wrong intent</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="258" x="661" y="434.4702">vous avez d&#233;crit une intention qui n'&#233;tait pas la bonne</text></g><!--entity INSTR--><g id="elem_INSTR"><rect fill="#E3CFC2" height="165" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="210" x="706" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="111" x="716" y="117.5503">4. AI instruction</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="93" x="716" y="129.4702">Instruction pour l'IA</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="716" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="160" x="716" y="158.5503">specific, with constraints</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144" x="716" y="170.4702">pr&#233;cise, avec des contraintes</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="148" x="716" y="184.5503">edge cases, the stack,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="87" x="716" y="196.4702">cas limites, stack,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="136" x="716" y="210.5503">the shape of the data</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="94" x="716" y="222.4702">forme des donn&#233;es</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="139" x="716" y="236.5503">the test it has to pass</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="75" x="716" y="248.4702">le test &#224; passer</text></g><!--entity SPEC--><g id="elem_SPEC"><rect fill="#E3CFC2" height="165" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="210" x="478" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="120" x="488" y="117.5503">3. Technical spec</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111" x="488" y="129.4702">Sp&#233;cification technique</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="488" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="97" x="488" y="158.5503">implementable:</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="75" x="488" y="170.4702">impl&#233;mentable :</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="139" x="488" y="184.5503">an engineer, or an AI,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="114" x="488" y="196.4702">un ing&#233;nieur, ou une IA,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="121" x="488" y="210.5503">could start building</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="159" x="488" y="222.4702">pourrait commencer &#224; construire</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="105" x="488" y="236.5503">still leaves room</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125" x="488" y="248.4702">laisse encore de la marge</text></g><!--entity REQ--><g id="elem_REQ"><rect fill="#E3CFC2" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="210" x="250" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="161" x="260" y="130.5503">2. Product requirement</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="81" x="260" y="142.4702">Exigence produit</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="260" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="112" x="260" y="171.5503">the need, scoped</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88" x="260" y="183.4702">le besoin, d&#233;limit&#233;,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="174" x="260" y="197.5503">into something measurable</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82" x="260" y="209.4702">rendu mesurable</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="93" x="260" y="223.5503">judgment calls</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="168" x="260" y="235.4702">des choix qui rel&#232;vent du jugement</text></g><!--entity VOICE--><g id="elem_VOICE"><rect fill="#E3CFC2" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="210" x="22" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="90" x="32" y="130.5503">1. User voice</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89" x="32" y="142.4702">Voix de l'utilisateur</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="32" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="156" x="32" y="171.5503">what a real person says</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144" x="32" y="183.4702">ce que dit une vraie personne</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="83" x="32" y="197.5503">raw material,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="106" x="32" y="209.4702">une mati&#232;re premi&#232;re,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="105" x="32" y="223.5503">not yet buildable</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="145" x="32" y="235.4702">pas encore de quoi construire</text></g><polygon fill="#555555" points="249.8575,178.5,240.8575,174.5,244.8575,178.5,240.8575,182.5,249.8575,178.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M232.0938,178.5 C238.015,178.5 237.9363,178.5 243.8575,178.5 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="477.8575,178.5,468.8575,174.5,472.8575,178.5,468.8575,182.5,477.8575,178.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M460.0938,178.5 C466.015,178.5 465.9363,178.5 471.8575,178.5 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="705.8575,178.5,696.8575,174.5,700.8575,178.5,696.8575,182.5,705.8575,178.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M688.0938,178.5 C694.015,178.5 693.9363,178.5 699.8575,178.5 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="180.6118,248.1051,183.7378,257.4447,183.9877,251.7934,189.639,252.0433,180.6118,248.1051" style="stroke:#555555;stroke-width:1.0;"/><path d="M184.6629,252.531 C202.785,272.3301 220.2017,288.1474 243,303 C273.8198,323.0784 309.8563,339.1251 344.6936,351.6766 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="126" x="267.5" y="288.4702">user understanding failure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="173" x="244" y="299.4702">erreur de compr&#233;hension du besoin</text><polygon fill="#555555" points="398.8766,248.2619,400.3458,258.0005,401.5662,252.4769,407.0898,253.6972,398.8766,248.2619" style="stroke:#555555;stroke-width:1.0;"/><path d="M402.1041,253.3199 C416.9881,276.6455 430.3799,297.6327 445.2538,320.9425 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="90" x="432" y="288.4702">requirement failure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="85" x="434.5" y="299.4702">erreur d'exigence</text><polygon fill="#555555" points="546.388,261.2928,539.06,267.8732,544.3452,265.8565,546.3619,271.1416,546.388,261.2928" style="stroke:#555555;stroke-width:1.0;"/><path d="M543.9366,266.7692 C535.1216,286.4624 528.2447,301.8257 519.7293,320.8494 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="56" x="563" y="288.4702">spec failure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="108" x="537" y="299.4702">erreur de sp&#233;cification</text><polygon fill="#555555" points="707.3731,261.1357,697.7905,263.4102,703.3966,264.1667,702.6401,269.7727,707.3731,261.1357" style="stroke:#555555;stroke-width:1.0;"/><path d="M702.6012,264.7729 C699.1089,267.4348 700.4159,266.4252 697,269 C676.4122,284.5188 671.8486,289.3131 650,303 C640.4542,308.9799 630.4598,314.9648 620.3249,320.8381 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="66" x="692" y="288.4702">prompt failure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82" x="684" y="299.4702">erreur de prompt</text><polygon fill="#555555" points="811,261.2928,807,270.2928,811,266.2928,815,270.2928,811,261.2928" style="stroke:#555555;stroke-width:1.0;"/><path d="M811,267.2928 C811,291.5926 811,311.638 811,333.8633 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113" x="812" y="288.4702">handed with the prompt</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111" x="813" y="299.4702">donn&#233;s avec le prompt</text><!--SRC=[bLTDKnj74Btlh-ZO1oMKa0Esox6Aeeh88bOLSHn3d4ESmx0xqWxCpYpp8OnJ_YyvMfVy2Vsnl9uLyeAqL9aBQDJTq_FUwmzwz4wQGheXNOYveDqBuQZMmeHOwG5_s0r-FgD2-jofEYXhTlDIA3EeOK3V-qe6OSIGZALVdAZBkVf4Hif25ZyCikzg9sQL82rkR0oqCiuoVwbCBPoe47SgeWx7reGtefBqMkgv32eNBHjVYi9UApEZgT1UjhvnDffYP9sHZlRsMrySEMUlHrPRHu-Vfv-sbyoHnanB-YSZ-jawF7zbUvn-SCe9dQfFalQUPv-p0nzkj3pCxdh-geogOlMdAa99Uoz_PCCdAyiig02pirBIgw_GqOYX-s0EF48Fz_OF3tA-T_ZunOiNXoU2WEpoFoE1Ijlhu4coEaHmk27srpGU7JjRaQ1AUdz3PQo4IUXJi3YjOQYy96LyS35F6HnDA8UHo0DPCwI01C-Zqe2Wdpu49upN8W0D4KZEfRiX7sIzJdhlJjAlUj7GkVHMcNGzVasrZRJybwAvUtFjbekKpbMKf7kJ8webYoAgkPCq9DtEn8a2RZ8wZWHOs6Uv2AAMzz1uHCBJwFNHvCqjUucR7fqsOcFj-VGoVeKdrY6ITFmov9B89pi5vBc6EZZJ0VnR4E_iF1imRAstxEnqm35flzSYUtxdlOm_G02-1ZDJbVVfMa4ykMK_W1TyH-1RyFeavZBdScIdnaVwZHjaCPFWsKlVNxrTv9VzZjYm8wqg5TYwiTm8c8AKW9-nuW-52A8ZtjIwIgOK2slCSh4blwGqwK55e1BNGwwry5sFrojZI86jfDkcWScRqxDtz7ZyT7Gysi_kK_XqG6SoBmqwYoP6lvF2qvgH1ZT92xYOlI2_BIoggjQoaYQ8Sos77V7OQBcujQBXHXnKepGpXRA5yBdik4Yxk4AreH4k5qQXDc0UKvbDZZOPostK1TFfGbDNyEiI5vGA9GL8gaAYkMogBeaoAhVvT1-KrYXOQD6Z2TkgYpYXG1UUbrkNkff6gn9kjhM8Jz-EHvtyxG_ehRFS4t1-nKanefqaZZ
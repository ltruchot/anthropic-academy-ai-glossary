<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="437px" preserveAspectRatio="none" style="width:1850px;height:437px;background:#FFFFFF;" version="1.1" viewBox="0 0 1850 437" width="1850px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="330" x="752.5" y="20.7803">Generative AI: three pillars that made it possible</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="301" x="767" y="33.2402">L'IA g&#233;n&#233;rative : trois piliers qui l'ont rendue possible</text><!--cluster PILLARS--><g id="cluster_PILLARS"><rect fill="#FFFFFF" height="380" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="947" x="14" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="485.5" y="64.5503">&#160;</text></g><!--cluster COMP--><g id="cluster_COMP"><rect fill="#F9F8F4" height="292" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="305" x="624" y="97.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="91" x="731" y="111.0503">Computation</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="104" x="724.5" y="122.9702">Puissance de calcul</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="774.5" y="137.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="289" x="632" y="152.0503">processing impossible a few years earlier</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="263" x="645" y="163.9702">des calculs impossibles quelques ann&#233;es plus t&#244;t</text></g><!--cluster DATA--><g id="cluster_DATA"><rect fill="#F9F8F4" height="292" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="276" x="340" y="97.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="32" x="462" y="111.0503">Data</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="47" x="454.5" y="122.9702">Donn&#233;es</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="476" y="137.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="260" x="348" y="152.0503">the essential raw material for training</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="195" x="380.5" y="163.9702">la mati&#232;re premi&#232;re de l'entra&#238;nement</text></g><!--cluster ALGO--><g id="cluster_ALGO"><rect fill="#F9F8F4" height="346" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="310" x="22" y="77"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="78" x="138" y="90.5503">Algorithms</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="65" x="144.5" y="102.4702">Algorithmes</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="175" y="116.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="274" x="40" y="131.5503">breakthroughs in how AI systems learn</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="294" x="30" y="143.4702">des avanc&#233;es qui ont chang&#233; la fa&#231;on dont l'IA apprend</text></g><!--entity SCALING--><g id="elem_SCALING"><rect fill="#CFCBDD" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="341" x="969.5" y="302"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="88" x="979.5" y="323.5503">Scaling laws</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="65" x="979.5" y="335.4702">Lois d'&#233;chelle</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="979.5" y="349.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="321" x="979.5" y="364.5503">larger models, more data, more computing power:</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="286" x="979.5" y="376.4702">des mod&#232;les plus grands, plus de donn&#233;es, plus de calcul :</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="275" x="979.5" y="390.5503">performance improves in predictable ways</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="262" x="979.5" y="402.4702">des performances qui progressent de fa&#231;on pr&#233;visible</text></g><!--entity EMERGENT--><g id="elem_EMERGENT"><rect fill="#CFCBDD" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="318" x="1526" y="302"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="151" x="1536" y="323.5503">Emergent capabilities</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110" x="1536" y="335.4702">Capacit&#233;s &#233;mergentes</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="1536" y="349.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="230" x="1536" y="364.5503">no one explicitly programmed them:</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="230" x="1536" y="376.4702">personne ne les a programm&#233;es explicitement :</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="298" x="1536" y="390.5503">reasoning step by step, adapting to new tasks</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="285" x="1536" y="402.4702">raisonner &#233;tape par &#233;tape, s'adapter &#224; de nouvelles t&#226;ches</text></g><!--entity CHIPS--><g id="elem_CHIPS"><rect fill="#BCD3CB" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="650" y="175.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="119" x="660" y="197.0503">GPUs, TPUs, etc.</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="76" x="660" y="208.9702">GPU, TPU, etc.</text></g><!--entity CLUSTERS--><g id="elem_CLUSTERS"><rect fill="#BCD3CB" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="650" y="335.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="126" x="660" y="357.0503">Computing clusters</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="87" x="660" y="368.9702">Clusters de calcul</text></g><!--entity WEB--><g id="elem_WEB"><rect fill="#BCD3CB" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="353" y="175.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="139" x="363" y="197.0503">Articles and websites</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="97" x="363" y="208.9702">Articles et sites web</text></g><!--entity CODE--><g id="elem_CODE"><rect fill="#BCD3CB" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="353" y="335.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="188" x="363" y="357.0503">Code and multimodal content</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="150" x="363" y="368.9702">Code et contenus multimodaux</text></g><!--entity NN--><g id="elem_NN"><rect fill="#BCD3CB" height="87" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="52" y="155"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="107" x="62" y="176.5503">Neural networks</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="108" x="62" y="188.4702">R&#233;seaux de neurones</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="62" y="202.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="126" x="62" y="217.5503">around for decades</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="145" x="62" y="229.4702">connus depuis des d&#233;cennies</text></g><!--entity TRANS--><g id="elem_TRANS"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="52" y="302"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="88" x="62" y="323.5503">Transformers</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="73" x="62" y="335.4702">Transformeurs</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="62" y="349.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="225" x="62" y="364.5503">2017: relationships between words</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="144" x="62" y="376.4702">2017 : les liens entre les mots</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="144" x="62" y="390.5503">across long passages</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111" x="62" y="402.4702">sur de longs passages</text></g><polygon fill="#555555" points="1071.3874,301.9062,1066.9129,293.1325,1067.5026,298.7585,1061.8766,299.3482,1071.3874,301.9062" style="stroke:#555555;stroke-width:1.0;"/><path d="M961.1587,212.5927 C961.5803,212.9343 962.0089,213.2816 962.4443,213.6344 C965.9275,216.4566 969.8447,219.6306 974.1144,223.0902 C982.6538,230.0093 992.6029,238.0706 1003.3083,246.7447 C1024.719,264.0928 1044.4929,280.1147 1066.7256,298.129 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="93" x="1049" y="269.4702">the three combined</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="71" x="1060" y="280.4702">les trois r&#233;unis</text><polygon fill="#555555" points="1525.586,358.5,1516.586,354.5,1520.586,358.5,1516.586,362.5,1525.586,358.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M1310.5727,358.5 C1379.267,358.5 1452.0581,358.5 1519.586,358.5 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="108" x="1364.25" y="340.9702">as models grew larger</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdj
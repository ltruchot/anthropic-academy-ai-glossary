<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="468px" preserveAspectRatio="none" style="width:1082px;height:468px;background:#FFFFFF;" version="1.1" viewBox="0 0 1082 468" width="1082px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="221" x="423" y="20.7803">The Five Lenses of Discernment</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="190" x="438.5" y="33.2402">Les cinq angles du Discernement</text><!--cluster LENSES--><g id="cluster_LENSES"><rect fill="#FFFFFF" height="251" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="1062" x="14" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="328" x="381" y="72.5503">Five questions to ask of anything that AI builds</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="266" x="412" y="84.4702">Cinq questions &#224; poser &#224; tout ce que l'IA construit</text></g><!--entity EASY--><g id="elem_EASY"><rect fill="#F9F8F4" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="301" x="220.5" y="343.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="250" x="230.5" y="365.0503">Lens 1 is easy to test: run it and see</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="231" x="230.5" y="376.9702">L'angle 1 est facile &#224; tester : ex&#233;cutez, et voyez</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="230.5" y="391.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="230.5" y="406.0503">where most code review stops</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="219" x="230.5" y="417.9702">l&#224; o&#249; s'arr&#234;tent la plupart des revues de code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="281" x="230.5" y="432.0503">the biggest problems are almost never here</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="243" x="230.5" y="443.9702">les plus gros probl&#232;mes ne sont presque jamais l&#224;</text></g><!--entity HARD--><g id="elem_HARD"><rect fill="#F2E4DC" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="346" x="666" y="338"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="326" x="676" y="359.5503">By lens 5, judgment calls AI can't make for you</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="223" x="676" y="371.4702">&#192; l'angle 5, des choix qui rel&#232;vent du jugement</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="197" x="676" y="382.4702">et que l'IA ne peut pas faire &#224; votre place</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="676" y="396.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="132" x="676" y="411.5503">builders need all five</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152" x="676" y="423.4702">les builders ont besoin des cinq</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="124" x="676" y="437.5503">taste: a builder skill</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="172" x="676" y="449.4702">le go&#251;t : une comp&#233;tence de builder</text></g><!--entity L5--><g id="elem_L5"><rect fill="#CFCBE0" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="206" x="862" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="154" x="872" y="130.5503">5. Responsible impact</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="96" x="872" y="142.4702">Impact responsable</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="872" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="110" x="872" y="171.5503">Is it responsible?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="872" y="183.4702">Est-ce responsable ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="872" y="197.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="186" x="872" y="212.5503">&#10003; transparent about AI's role</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="139" x="872" y="224.4702">transparent sur le r&#244;le de l'IA</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="130" x="872" y="238.5503">&#10007; generated content</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="91" x="872" y="250.4702">un contenu g&#233;n&#233;r&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="168" x="872" y="264.5503">presented as authoritative</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="156" x="872" y="276.4702">pr&#233;sent&#233; comme faisant autorit&#233;</text></g><!--entity L4--><g id="elem_L4"><rect fill="#E6DFD2" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="194" x="650" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="145" x="660" y="130.5503">4. Experience quality</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110" x="660" y="142.4702">Qualit&#233; de l'exp&#233;rience</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="660" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="67" x="660" y="171.5503">Is it good?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="62" x="660" y="183.4702">Est-ce bon ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="660" y="197.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="104" x="660" y="212.5503">&#10003; the core task,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="90" x="660" y="224.4702">la t&#226;che principale,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="77" x="660" y="238.5503">without help</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="47" x="660" y="250.4702">sans aide</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="137" x="660" y="264.5503">&#10007; generic UI patterns</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="174" x="660" y="276.4702">des solutions d'interface g&#233;n&#233;riques</text></g><!--entity L3--><g id="elem_L3"><rect fill="#E8E8E2" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="442" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="93" x="452" y="130.5503">3. Problem fit</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="452" y="142.4702">Ad&#233;quation au besoin</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="452" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="122" x="452" y="171.5503">Is it the right thing?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="118" x="452" y="183.4702">Est-ce la bonne chose ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="452" y="197.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="158" x="452" y="212.5503">&#10003; the user's actual need</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="132" x="452" y="224.4702">le vrai besoin de l'utilisateur</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="159" x="452" y="238.5503">&#10007; addresses the prompt,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89" x="452" y="250.4702">r&#233;pond au prompt,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="107" x="452" y="264.5503">misses the need</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113" x="452" y="276.4702">passe &#224; c&#244;t&#233; du besoin</text></g><!--entity L2--><g id="elem_L2"><rect fill="#C9D9D3" height="206" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="234" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="166" x="244" y="117.5503">2. Production readiness</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="130" x="244" y="129.4702">Pr&#233;paration &#224; la production</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="244" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="119" x="244" y="158.5503">Does it work well?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="153" x="244" y="170.4702">Est-ce que &#231;a fonctionne bien ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="244" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="130" x="244" y="199.5503">&#10003; concurrent users,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="131" x="244" y="211.4702">des utilisateurs simultan&#233;s,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="119" x="244" y="225.5503">no race conditions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="156" x="244" y="237.4702">sans conditions de concurrence</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="108" x="244" y="251.5503">&#10007; smooth in dev,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="120" x="244" y="263.4702">fluide en d&#233;veloppement,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="117" x="244" y="277.5503">broken under load</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="105" x="244" y="289.4702">cass&#233; sous la charge</text></g><!--entity L1--><g id="elem_L1"><rect fill="#8FAED6" height="206" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="193" x="22.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="152" x="32.5" y="117.5503">1. Functional integrity</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="102" x="32.5" y="129.4702">Int&#233;grit&#233; fonctionnelle</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="32.5" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="90" x="32.5" y="158.5503">Does it work?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="130" x="32.5" y="170.4702">Est-ce que &#231;a fonctionne ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="32.5" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="86" x="32.5" y="199.5503">&#10003; real inputs,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="96" x="32.5" y="211.4702">des entr&#233;es r&#233;elles,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="107" x="32.5" y="225.5503">not just test data</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="173" x="32.5" y="237.4702">pas seulement des donn&#233;es de test</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="128" x="32.5" y="251.5503">&#10007; passes unit tests,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="121" x="32.5" y="263.4702">passe les tests unitaires,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="125" x="32.5" y="277.5503">breaks on real data</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="150" x="32.5" y="289.4702">casse sur des donn&#233;es r&#233;elles</text></g><polygon fill="#555555" points="233.9271,199,224.9271,195,228.9271,199,224.9271,203,233.9271,199" style="stroke:#555555;stroke-width:1.0;"/><path d="M215.7969,199 C221.8403,199 221.8837,199 227.9271,199 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="441.709,199,432.709,195,436.709,199,432.709,203,441.709,199" style="stroke:#555555;stroke-width:1.0;"/><path d="M424.0625,199 C429.9447,199 429.8268,199 435.709,199 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="649.652,199,640.652,195,644.652,199,640.652,203,649.652,199" style="stroke:#555555;stroke-width:1.0;"/><path d="M632.1563,199 C637.9882,199 637.8201,199 643.652,199 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="861.5551,199,852.5551,195,856.5551,199,852.5551,203,861.5551,199" style="stroke:#555555;stroke-width:1.0;"/><path d="M844.0781,199 C849.9038,199 849.7295,199 855.5551,199 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="215.3886,302.0319,219.6272,310.922,219.188,305.2822,224.8277,304.843,215.3886,302.0319" style="stroke:#555555;stroke-width:1.0;"/><path d="M219.9478,305.9323 C223.144,308.6665 221.7924,307.429 225,310 C239.5927,321.6966 255.8452,333.0263 272.0567,343.4614 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555"
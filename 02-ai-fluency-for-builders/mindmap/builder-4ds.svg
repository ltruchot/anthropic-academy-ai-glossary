<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="749px" preserveAspectRatio="none" style="width:1289px;height:749px;background:#FFFFFF;" version="1.1" viewBox="0 0 1289 749" width="1289px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="288" x="493" y="20.7803">AI Fluency for builders: the 4D Framework</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="233" x="520.5" y="33.2402">AI Fluency pour les builders : le cadre 4D</text><!--cluster BUILDER--><g id="cluster_BUILDER"><rect fill="#F9F8F4" height="238" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="266" x="14" y="482"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="51" x="121.5" y="495.5503">Builder</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="38" x="128" y="507.4702">Builder</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="145" y="521.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="116" x="89" y="536.5503">owns the full arc</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128" x="83" y="548.4702">assume tout le parcours</text></g><!--cluster FRAMEWORK--><g id="cluster_FRAMEWORK"><rect fill="#F9F8F4" height="661" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="326" x="491" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="102" x="603" y="72.5503">4D Framework</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="48" x="630" y="84.4702">Cadre 4D</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="652" y="98.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="173" x="567.5" y="113.5503">dynamic, not a sequence</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142" x="583" y="125.4702">dynamique, pas s&#233;quentiel</text></g><!--entity AI--><g id="elem_AI"><rect fill="#CFCBDD" height="87" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="306" x="977" y="656.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="283" x="987" y="678.0503">AI: a capable but very literal collaborator</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="238" x="987" y="689.9702">L'IA : un collaborateur comp&#233;tent mais tr&#232;s litt&#233;ral</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="987" y="704.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="286" x="987" y="719.0503">clear tasks &#183; real context &#183; specific feedback</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="274" x="987" y="730.9702">des t&#226;ches claires &#183; un vrai contexte &#183; des retours pr&#233;cis</text></g><!--entity PROBLEM--><g id="elem_PROBLEM"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="560"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="120" x="32" y="581.5503">Customer problem</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="74" x="32" y="593.4702">Probl&#232;me client</text></g><!--entity SHIPPED--><g id="elem_SHIPPED"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="624"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="107" x="32" y="645.5503">Shipped solution</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="67" x="32" y="657.4702">Solution livr&#233;e</text></g><!--entity DEL--><g id="elem_DEL"><rect fill="#BCD3CB" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="529" y="137.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="75" x="539" y="159.0503">Delegation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="51" x="539" y="170.9702">D&#233;l&#233;gation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="539" y="185.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="156" x="539" y="200.0503">decompose the problem</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="120" x="539" y="211.9702">d&#233;composer le probl&#232;me</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="183" x="539" y="226.0503">implementation: usually safe</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="196" x="539" y="237.9702">l'impl&#233;mentation : en g&#233;n&#233;ral sans risque</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="137" x="539" y="252.0503">judgment: usually not</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="539" y="263.9702">le jugement : en g&#233;n&#233;ral non</text></g><!--entity DES--><g id="elem_DES"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="262" x="523" y="294.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="81" x="533" y="316.0503">Description</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="55" x="533" y="327.9702">Description</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="533" y="342.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="224" x="533" y="357.0503">every input into the implementation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="233" x="533" y="368.9702">chaque information jusque dans l'impl&#233;mentation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="242" x="533" y="383.0503">a missing one cascades downstream</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="179" x="533" y="394.9702">un manque se r&#233;percute en cascade</text></g><!--entity DIS--><g id="elem_DIS"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="529" y="425.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="89" x="539" y="447.0503">Discernment</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="68" x="539" y="458.9702">Discernement</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="539" y="473.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="225" x="539" y="488.0503">does it run well? the right problem?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="183" x="539" y="499.9702">&#231;a s'ex&#233;cute bien ? le bon probl&#232;me ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="171" x="539" y="514.0503">good to use? responsible?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="166" x="539" y="525.9702">agr&#233;able &#224; utiliser ? responsable ?</text></g><!--entity DIL--><g id="elem_DIL"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="310" x="499" y="556.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="65" x="509" y="578.0503">Diligence</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="44" x="509" y="589.9702">Diligence</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="509" y="604.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="290" x="509" y="619.0503">ownership of the outcome, not just the output</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="265" x="509" y="630.9702">la responsabilit&#233; du r&#233;sultat, pas seulement de la sortie</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="209" x="509" y="645.0503">prototype freely, ship selectively</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="197" x="509" y="656.9702">prototyper librement, livrer s&#233;lectivement</text></g><polygon fill="#555555" points="147,623.5,151,614.5,147,618.5,143,614.5,147,623.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M147,617.5 C147,611.6992 147,611.8984 147,606.0977 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="490.0308,700,481.0308,696,485.0308,700,481.0308,704,490.0308,700" style="stroke:#555555;stroke-width:1.0;"/><path d="M280.2891,700 C281.0444,700 281.8016,700 282.5605,700 C294.7042,700 307.3173,700 320.2435,700 C346.096,700 373.2012,700 400.3093,700 C427.4174,700 454.5285,700 480.3927,700 C483.6257,700 480.8392,700 484.0308,700 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="101" x="335" y="685.4702">AI collaboration skills</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="189" x="291" y="696.4702">comp&#233;tences de collaboration avec l'IA</text><polygon fill="#555555" points="976.8527,700,967.8527,696,971.8527,700,967.8527,704,976.8527,700" style="stroke:#555555;stroke-width:1.0;"/><path d="M817.9183,700 C818.8901,700 819.8639,700 820.8393,700 C824.7413,700 828.6717,700 832.6256,700 C848.4412,700 864.6339,700 880.8964,700 C913.4215,700 940.2261,700 970.8527,700 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="128" x="829" y="685.4702">managing that collaborator</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="130" x="828" y="696.4702">bien g&#233;rer ce collaborateur</text><!--SRC=[VLRDRXit4BxlKqpjWrl3ScedWLl1i659LYFKQGmRHGvr3zJkIABD9RSaLuvIv5sANXezGU_T5-l7rR-qQrqaaVF7RsQ-cGEwOvsmRTAZ60jgF0fBcHBQvwaw3dyQtes7rC-bWbJZJUAECrpHjovbBxHeaZRqanNPQ2m_asPEEFdkEFecisAO2b9YOd9FS-58yS2JDsJbSEGfaPPZBusE8lSaTIQiI2dXWSYLxnhjVn4fqpjMO_Oo5cioRYGIyopra0P2ELwxiIRNITjOpPPEJjSkhgmrpssZZANzj-LdNGjX23rKJ7z6H2rZyTIvRBVyu3G4T2y_CvsyZRv4
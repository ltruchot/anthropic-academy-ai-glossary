<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="708px" preserveAspectRatio="none" style="width:1289px;height:708px;background:#FFFFFF;" version="1.1" viewBox="0 0 1289 708" width="1289px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="288" x="493" y="20.7803">AI Fluency for builders: the 4D Framework</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="233" x="520.5" y="33.2402">AI Fluency pour les builders : le cadre 4D</text><!--cluster BUILDER--><g id="cluster_BUILDER"><rect fill="#F9F8F4" height="238" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="266" x="14" y="441"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="51" x="121.5" y="454.5503">Builder</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="38" x="128" y="466.4702">Builder</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="4" x="145" y="480.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="116" x="89" y="495.5503">owns the full arc</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128" x="83" y="507.4702">assume tout le parcours</text></g><!--cluster FRAMEWORK--><g id="cluster_FRAMEWORK"><rect fill="#F9F8F4" height="620" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="326" x="491" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="102" x="603" y="72.5503">4D Framework</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="48" x="630" y="84.4702">Cadre 4D</text></g><!--entity AI--><g id="elem_AI"><rect fill="#CFCBDD" height="87" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="306" x="977" y="615.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="283" x="987" y="637.0503">AI: a capable but very literal collaborator</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="238" x="987" y="648.9702">L'IA : un collaborateur comp&#233;tent mais tr&#232;s litt&#233;ral</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="987" y="663.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="286" x="987" y="678.0503">clear tasks &#183; real context &#183; specific feedback</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="274" x="987" y="689.9702">des t&#226;ches claires &#183; un vrai contexte &#183; des retours pr&#233;cis</text></g><!--entity PROBLEM--><g id="elem_PROBLEM"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="519"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="120" x="32" y="540.5503">Customer problem</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="74" x="32" y="552.4702">Probl&#232;me client</text></g><!--entity SHIPPED--><g id="elem_SHIPPED"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="583"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="107" x="32" y="604.5503">Shipped solution</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="67" x="32" y="616.4702">Solution livr&#233;e</text></g><!--entity DEL--><g id="elem_DEL"><rect fill="#BCD3CB" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="529" y="96.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="75" x="539" y="118.0503">Delegation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="51" x="539" y="129.9702">D&#233;l&#233;gation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="539" y="144.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="156" x="539" y="159.0503">decompose the problem</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="120" x="539" y="170.9702">d&#233;composer le probl&#232;me</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="183" x="539" y="185.0503">implementation: usually safe</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="196" x="539" y="196.9702">l'impl&#233;mentation : en g&#233;n&#233;ral sans risque</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="137" x="539" y="211.0503">judgment: usually not</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="539" y="222.9702">le jugement : en g&#233;n&#233;ral non</text></g><!--entity DES--><g id="elem_DES"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="262" x="523" y="253.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="81" x="533" y="275.0503">Description</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="55" x="533" y="286.9702">Description</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="533" y="301.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="224" x="533" y="316.0503">every input into the implementation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="233" x="533" y="327.9702">chaque information jusque dans l'impl&#233;mentation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="242" x="533" y="342.0503">a missing one cascades downstream</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="179" x="533" y="353.9702">un manque se r&#233;percute en cascade</text></g><!--entity DIS--><g id="elem_DIS"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="529" y="384.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="89" x="539" y="406.0503">Discernment</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="68" x="539" y="417.9702">Discernement</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="539" y="432.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="225" x="539" y="447.0503">does it run well? the right problem?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="186" x="539" y="458.9702">&#231;a fonctionne bien ? le bon probl&#232;me ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="171" x="539" y="473.0503">good to use? responsible?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="166" x="539" y="484.9702">agr&#233;able &#224; utiliser ? responsable ?</text></g><!--entity DIL--><g id="elem_DIL"><rect fill="#BCD3CB" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="310" x="499" y="515.5"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="65" x="509" y="537.0503">Diligence</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="44" x="509" y="548.9702">Diligence</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="509" y="563.0503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="290" x="509" y="578.0503">ownership of the outcome, not just the output</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="265" x="509" y="589.9702">la responsabilit&#233; du r&#233;sultat, pas seulement de la sortie</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="209" x="509" y="604.0503">prototype freely, ship selectively</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="197" x="509" y="615.9702">prototyper librement, livrer s&#233;lectivement</text></g><polygon fill="#555555" points="147,582.5,151,573.5,147,577.5,143,573.5,147,582.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M147,576.5 C147,570.6992 147,570.8984 147,565.0977 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="490.0308,659,481.0308,655,485.0308,659,481.0308,663,490.0308,659" style="stroke:#555555;stroke-width:1.0;"/><path d="M280.2891,659 C281.0444,659 281.8016,659 282.5605,659 C294.7042,659 307.3173,659 320.2435,659 C346.096,659 373.2012,659 400.3093,659 
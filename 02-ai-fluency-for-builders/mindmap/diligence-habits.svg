<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="578px" preserveAspectRatio="none" style="width:1007px;height:578px;background:#FFFFFF;" version="1.1" viewBox="0 0 1007 578" width="1007px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="159" x="420.5" y="20.7803">The habits of Diligence</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="166" x="417" y="33.2402">Les habitudes de la Diligence</text><!--cluster HABITS--><g id="cluster_HABITS"><rect fill="#FFFFFF" height="225" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="812" x="189" y="180"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="87" x="551.5" y="193.5503">Three habits</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="83" x="553.5" y="205.4702">Trois habitudes</text></g><!--entity DILIGENCE--><g id="elem_DILIGENCE"><rect fill="#F9F8F4" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="343" x="33.5" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="260" x="43.5" y="80.5503">Diligence: catch up to your own code</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="264" x="43.5" y="92.4702">Diligence : rattraper votre retard sur votre propre code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="43.5" y="106.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="235" x="43.5" y="121.5503">you own the outcome, not the output</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="187" x="43.5" y="133.4702">vous assumez le r&#233;sultat, pas la sortie</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="323" x="43.5" y="147.5503">&#8220;AI wrote it&#8221; explains nothing and excuses nothing</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="264" x="43.5" y="159.4702">&#171; c'est l'IA qui l'a &#233;crit &#187; n'explique rien et n'excuse rien</text></g><!--entity NETS--><g id="elem_NETS"><rect fill="#F2E4DC" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="398" x="6" y="433"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="200" x="16" y="454.5503">Safety nets: move fast safely</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="216" x="16" y="466.4702">Filets de s&#233;curit&#233; : aller vite en toute s&#233;curit&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="16" y="480.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="235" x="16" y="495.5503">tests on one end: iterate without fear</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="185" x="16" y="507.4702">les tests d'un c&#244;t&#233; : it&#233;rer sans crainte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="378" x="16" y="521.5503">observability on the other: logs, error tracking, dashboards</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="338" x="16" y="533.4702">l'observabilit&#233; de l'autre : journaux, suivi des erreurs, tableaux de bord</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="302" x="16" y="547.5503">feature flags, for when something slips through</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="359" x="16" y="559.4702">les indicateurs de fonctionnalit&#233;, pour ce qui passe entre les mailles du filet</text></g><!--entity H3--><g id="elem_H3"><rect fill="#CFCBE0" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="220" x="773" y="217"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="104" x="783" y="238.5503">Understanding</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="77" x="783" y="250.4702">Compr&#233;hension</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="783" y="264.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="155" x="783" y="279.5503">consciously understand</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="119" x="783" y="291.4702">s'attacher &#224; comprendre</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="131" x="783" y="305.5503">how the code works</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="783" y="317.4702">comment le code fonctionne</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="783" y="331.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="136" x="783" y="346.5503">a separate step now:</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="139" x="783" y="358.4702">une &#233;tape &#224; part d&#233;sormais :</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="114" x="783" y="372.5503">AI can help with it</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="101" x="783" y="384.4702">l'IA peut vous y aider</text></g><!--entity H2--><g id="elem_H2"><rect fill="#E6DFD2" height="154" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="265" x="489.5" y="230"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="96" x="499.5" y="251.5503">Transparency</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="69" x="499.5" y="263.4702">Transparence</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="499.5" y="277.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="134" x="499.5" y="292.5503">tell people AI wrote it</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="141" x="499.5" y="304.4702">dire aux gens que l'IA l'a &#233;crit</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="499.5" y="318.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="201" x="499.5" y="333.5503">as information, not a disclaimer</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="184" x="499.5" y="345.4702">pour informer, pas pour se d&#233;douaner</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="245" x="499.5" y="359.5503">AI makes a different shape of mistake</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="182" x="499.5" y="371.4702">l'IA ne fait pas le m&#234;me type d'erreurs</text></g><!--entity H1--><g id="elem_H1"><rect fill="#8FAED6" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="240" x="231" y="217"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="80" x="241" y="238.5503">Verification</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="53" x="241" y="250.4702">V&#233;rification</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="241" y="264.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="136" x="241" y="279.5503">seek out edge cases</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125" x="241" y="291.4702">rechercher les cas limites</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="97" x="241" y="305.5503">&amp; assumptions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="86" x="241" y="317.4702">et les hypoth&#232;ses</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="241" y="331.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="220" x="241" y="346.5503">&#8220;What assumptions and trade-offs</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="166" x="241" y="358.4702">&#171; Quelles hypoth&#232;ses as-tu faites,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="100" x="241" y="372.5503">did you make?&#8221;</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113" x="241" y="384.4702">et quels compromis ? &#187;</text></g><polygon fill="#555555" points="205,179.7651,209,170.7651,205,174.7651,201,170.7651,205,179.7651" style="stroke:#555555;stroke-width:1.0;"/><path d="M205,172.0758 C205,173.4205 205,174.7779 205,176.1467 C205,176.8312 205,177.5184 205,178.2083 C205,178.5533 205,178.8989 205,179.2452 C205,179.4184 205,173.5917 205,173.7651 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[VLRRRXit47tVhvZ6GDKQaXCx5wU2uS3M9J6G6cZj9Wzr7-Zbh9RnBhaXkLBaea0-f0NwMBUlVUjRz2VvaXvIiYrRsWY2BbnoPZXppfbfqO-i9TiklHDZGPrtmb9L2EthijWAVphUZKSaLQ56h5FkvE9SURTLuJbzuqhsGeikQKClhQZoiReapInPVhkLV5LPCIe55M9gQa-BpKdYBfIkX1KbISv4NVYXqVvOb4olk1YpLwbOskDo8Sr4wH5bed2yzCIQMikUiPejRUyiFJYmranwfZ2MDfx6r_8fJX76g63wDI4wD1QtN-mTnXTMGq0dwf9f-sdoMxBd_BJW_UJkoU-LLcLTlbNIvxJpw57O-72nC_7AOzjfpZJF5vcC-jSvFDDx3iQxsplxUsdmtDtOtTtTVyrklhkM-2KPURizi_Smxjo72no5XzjW7cnktcphKYfycbDTaJU4j5io4qsfaRovUUDt-uxVcyFK9IkyHnsHqB7nbf4iBwmaLrylLDPK-0e6xuLqfiyq74P_7XT7oLDJSXlOyDSBLUqRWXYRsf5mhYxvad0fExjoG8RmRQg42wbmndgrwlJpnzyFZcXYZMTI_lF7FuW_0C1Ak-0u3xWHMc8nhHtVh3L4yUaVIbliF1MjemDwNoly43IxIgtozEa_qgrWNBsl4Q1YJUpZKZ0T5-v5zm0telxHwwENW-FU0FZwRlXy-EHExKvpozSWQGZgr1grX8nrFbuT71wTdbm3ECApHITplWNwkLY0QoY2YqgZj6EsY3iI8E1JSbg08LuPlGK3Tm3sKz08X_yIoMj4Ki-K5GgNitOmiWOVgT4kLIXrCQNwncI3DTS264MQ8xhPdq0SR4Egx2e4SZE9zmkWf8cn5qsPX8sIjG_uYdipezDmNRqEoq0S1yK0hfpd2iYPT1lirfe14W_UX4Xno9C4Veqj1IhNNJ4EmAP2Kyv5HHC5-L1Dj8Wuh1WLYmIPab38sbe8FAQDth1tE7YKt2_UgHNQ8IfmVDfOkwLDwxBXkIWGYAbWSebl3SQaWaQ8-WD1Lnm5kiIBt99fNRuTK9c5d8MIp6L3eF4ue5ALR1jSLK7ZvWVPpiKYBW7Pg84qjT0h2OiLACK5z21uo3As0HReDAWWc50guFA2lrGJL3mJ48KeJapbx6-qBp_5UTbYQxcswucwGnk3P_rXVsUbIc_OgWojBzo-iKflPbUtkzOaqJ5VH8Ap707a0fBNO0c-mQp8hW9vICCzLAdyYi2SwQ_dmbm5dqtcs4Sp-RI2mCx-SclCHAr-cmk_R2wACrgEv8x9CjUiop_KGE1T3x3JyNMi0xlsYZ-fPEY0iT0lq1YQ8mT02pTN68FQqmje_ThgRTF6y-71eFyCpVvk1puH6VifOE5Tbqep3l107t5OBff9DrG53eHUxy2B6iIONQ4B2zmK3HVN8ZGPZtekRrZBJXU4NUCTZiWkgCbHkeAy13naB9eO5B8wDo1RDMQ5sR_pA88lYpWSX85IYvRgLvN1d3ksOpIMGk7wPj7wyO69iZ0ZroQm0RCLIfnY11krIGgNdnjC5QwHNyj64KeOXLgY3kC7nbIGMqDQsXXAr5XHc9KMX6kJ5-S51zt1aNCqjfLmaGPVmq
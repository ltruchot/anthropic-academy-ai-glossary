<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="483px" preserveAspectRatio="none" style="width:1173px;height:483px;background:#FFFFFF;" version="1.1" viewBox="0 0 1173 483" width="1173px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="153" x="506.5" y="20.7803">The four UX principles</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="147" x="509.5" y="33.2402">Les quatre principes d'UX</text><!--cluster PRINCIPLES--><g id="cluster_PRINCIPLES"><rect fill="#FFFFFF" height="251" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="979" x="188" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="419" x="468" y="72.5503">When implementation is fast, experience is the differentiator</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388" x="483.5" y="84.4702">Quand l'impl&#233;mentation est rapide, c'est l'exp&#233;rience qui fait la diff&#233;rence</text></g><!--entity WISH--><g id="elem_WISH"><rect fill="#F9F8F4" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="396" x="6" y="351"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="284" x="16" y="372.5503">&#8220;Make it look good&#8221; is a wish, not a spec</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="271" x="16" y="384.4702">&#171; Rends &#231;a beau &#187; est un souhait, pas une sp&#233;cification</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="16" y="398.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="376" x="16" y="413.5503">describe experience with the same precision as a function</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="297" x="16" y="425.4702">d&#233;crivez l'exp&#233;rience avec la m&#234;me pr&#233;cision qu'une fonction</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="359" x="16" y="439.5503">a critique for a colleague &#8800; a description AI can execute</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="333" x="16" y="451.4702">une critique pour un coll&#232;gue &#8800; une description que l'IA peut ex&#233;cuter</text></g><!--entity LOOP--><g id="elem_LOOP"><rect fill="#F2E4DC" height="139" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="348" x="420" y="338"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="328" x="430" y="359.5503">Description and Discernment working together</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="263" x="430" y="371.4702">La Description et le Discernement travaillent ensemble</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="430" y="385.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="148" x="430" y="400.5503">you describe, AI builds</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="134" x="430" y="412.4702">vous d&#233;crivez, l'IA construit</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="256" x="430" y="426.5503">you evaluate against what you intended</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="230" x="430" y="438.4702">vous &#233;valuez au regard de ce que vous vouliez</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="185" x="430" y="452.5503">you describe the gap, repeat</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="216" x="430" y="464.4702">vous d&#233;crivez l'&#233;cart, et vous recommencez</text></g><!--entity P4--><g id="elem_P4"><rect fill="#CFCBE0" height="206" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="245" x="913.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="83" x="923.5" y="117.5503">4. Feedback</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="49" x="923.5" y="129.4702">Feedback</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="923.5" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="178" x="923.5" y="158.5503">the interface acknowledges</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="200" x="923.5" y="170.4702">l'interface montre qu'elle a pris en compte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="124" x="923.5" y="184.5503">what the user does</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="103" x="923.5" y="196.4702">ce que fait l'utilisateur</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="923.5" y="210.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="225" x="923.5" y="225.5503">&#10003; what happened, what to do next,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="179" x="923.5" y="237.4702">ce qui s'est pass&#233;, quoi faire ensuite,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="98" x="923.5" y="251.5503">how to get help</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="923.5" y="263.4702">comment obtenir de l'aide</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="120" x="923.5" y="277.5503">&#10007; a raw error code</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="102" x="923.5" y="289.4702">un code d'erreur brut</text></g><!--entity P3--><g id="elem_P3"><rect fill="#E6DFD2" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="227" x="668.5" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="105" x="678.5" y="130.5503">3. Accessibility</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60" x="678.5" y="142.4702">Accessibilit&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="678.5" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="189" x="678.5" y="171.5503">a baseline, not a nice to have</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="138" x="678.5" y="183.4702">un pr&#233;requis, pas une option</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="678.5" y="197.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="207" x="678.5" y="212.5503">&#10003; screen reader, color contrast,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="193" x="678.5" y="224.4702">lecteur d'&#233;cran, contraste des couleurs,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="131" x="678.5" y="238.5503">keyboard navigation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="99" x="678.5" y="250.4702">navigation au clavier</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="207" x="678.5" y="264.5503">&#10007; generated for the median user</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="148" x="678.5" y="276.4702">g&#233;n&#233;r&#233; pour l'utilisateur moyen</text></g><!--entity P2--><g id="elem_P2"><rect fill="#E8E8E2" height="206" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="460" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="84" x="470" y="117.5503">2. Hierarchy</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="50" x="470" y="129.4702">Hi&#233;rarchie</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="470" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="144" x="470" y="158.5503">visual weight matches</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="127" x="470" y="170.4702">le poids visuel correspond</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="119" x="470" y="184.5503">information priority</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="128" x="470" y="196.4702">&#224; la priorit&#233; de l'information</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="470" y="210.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="163" x="470" y="225.5503">&#10003; progressive disclosure</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="112" x="470" y="237.4702">divulgation progressive</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="146" x="470" y="251.5503">&#10007; everything crammed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60" x="470" y="263.4702">tout entass&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="95" x="470" y="277.5503">into one space</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="81" x="470" y="289.4702">au m&#234;me endroit</text></g><!--entity P1--><g id="elem_P1"><rect fill="#8FAED6" height="206" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="211" x="230.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="62" x="240.5" y="117.5503">1. Clarity</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="29" x="240.5" y="129.4702">Clart&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="240.5" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="191" x="240.5" y="158.5503">every element communicates</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="142" x="240.5" y="170.4702">chaque &#233;l&#233;ment communique</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="72" x="240.5" y="184.5503">its purpose</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="39" x="240.5" y="196.4702">son r&#244;le</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="240.5" y="210.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="167" x="240.5" y="225.5503">&#10003; people's mental models</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="151" x="240.5" y="237.4702">les mod&#232;les mentaux des gens</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="129" x="240.5" y="251.5503">&#10007; users guess what</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113" x="240.5" y="263.4702">les utilisateurs devinent</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="88" x="240.5" y="277.5503">a button does</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="101" x="240.5" y="289.4702">ce que fait un bouton</text></g><polygon fill="#555555" points="419.6676,407.5,410.6676,403.5,414.6676,407.5,410.6676,411.5,419.6676,407.5" style="stroke:#555555;stroke-width:1.0;"/><path d="M402.0469,407.5 C407.9204,407.5 407.794,407.5 413.6676,407.5 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[ZLTDRnj74htpLrIY0xC69KUo4tiDGu2iZxK0Et7Y3HnWlOVcJ97JKK_tk3z8oOi5SiqvXrmS8BU4csjkUml_YNx9lcgI4YNE22i1WZXTKrqVxxqgzkbhjYNx9_ITcYZQ_avvQeooCTLcHpvinp0PKphVRhosXMuCXvq6X_H9g3aggvwGTVGthvfgej-JPIwv_CjExwF6gt6joAWBbo8jZNkzSAPjexoggUIHIYQUE1k_K3NJSpOJZhfGQpQXKgMRQZkcaJA1rqwyIxOyTDwofzszjOC3xztqq1ddQUkp_BF-5XS8OsoO_jKZUkOyKb_QdkGVF9M0NkltJBkVzVxTUnhYXU7ztiqtNsghwrI_qMMiQFVHfs9uVsdPYph2xEyLqyWbJzzyIzUrUskV1lX-ihkt_xIGYvziFNhqQFy51tgNLFIyiiM3il
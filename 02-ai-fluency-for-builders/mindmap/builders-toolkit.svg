<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="455px" preserveAspectRatio="none" style="width:1329px;height:455px;background:#FFFFFF;" version="1.1" viewBox="0 0 1329 455" width="1329px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="231" x="541.5" y="20.7803">The builder's toolkit: where AI fits</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="240" x="537" y="33.2402">La bo&#238;te &#224; outils du builder : la place de l'IA</text><!--cluster TOOLKIT--><g id="cluster_TOOLKIT"><rect fill="#FFFFFF" height="225" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="1309" x="14" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="462" x="437.5" y="72.5503">AI can help with all six, but it's much stronger at some than others</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="371" x="483" y="84.4702">L'IA peut aider pour les six, mais elle est bien plus forte pour certaines</text></g><!--entity SHAPE--><g id="elem_SHAPE"><rect fill="#F9F8F4" height="113" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="337" x="142.5" y="336"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="317" x="152.5" y="357.5503">Strongest in the middle, weakest at the edges</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="245" x="152.5" y="369.4702">La plus forte au milieu, la plus faible aux extr&#233;mit&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="152.5" y="383.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="279" x="152.5" y="398.5503">the edges are where the human work lives,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="252" x="152.5" y="410.4702">c'est aux extr&#233;mit&#233;s que se trouve le travail humain,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="118" x="152.5" y="424.5503">where the value is</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="53" x="152.5" y="436.4702">et la valeur</text></g><!--entity TESTS--><g id="elem_TESTS"><rect fill="#F9F8F4" height="87" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="231" x="525.5" y="349"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="211" x="535.5" y="370.5503">Acceptance tests, before code</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="183" x="535.5" y="382.4702">Les tests d'acceptation, avant le code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="535.5" y="396.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="170" x="535.5" y="411.5503">a shared definition of done</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="186" x="535.5" y="423.4702">une d&#233;finition commune de &#171; termin&#233; &#187;</text></g><!--entity SHIP--><g id="elem_SHIP"><rect fill="#E8E4D8" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="1125" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="79" x="1135" y="117.5503">6. Shipping</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="44" x="1135" y="129.4702">Livraison</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="1135" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="135" x="1135" y="158.5503">AI moderate (widget)</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="141" x="1135" y="170.4702">apport de l'IA moyen (widget)</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="147" x="1135" y="184.5503">the video: at the edges</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="118" x="1135" y="196.4702">la vid&#233;o : aux extr&#233;mit&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="1135" y="210.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="160" x="1135" y="225.5503">in front of users, iterating</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="1135" y="237.4702">devant les utilisateurs, it&#233;rer</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="141" x="1135" y="251.5503">responsibility is yours</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="141" x="1135" y="263.4702">la responsabilit&#233; vous revient</text></g><!--entity JUDG--><g id="elem_JUDG"><rect fill="#CFCBDD" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="204" x="903" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="86" x="913" y="117.5503">5. Judgment</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="48" x="913" y="129.4702">Jugement</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="913" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="53" x="913" y="158.5503">AI weak</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="91" x="913" y="170.4702">apport de l'IA faible</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="913" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="124" x="913" y="199.5503">right, good enough,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="83" x="913" y="211.4702">juste, assez bon,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="102" x="913" y="225.5503">worth shipping?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88" x="913" y="237.4702">digne d'&#234;tre livr&#233; ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="130" x="913" y="251.5503">AI can't own the call</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="184" x="913" y="263.4702">l'IA ne peut pas trancher &#224; votre place</text></g><!--entity IMPL--><g id="elem_IMPL"><rect fill="#BCD3CB" height="154" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="203" x="681.5" y="109"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="124" x="691.5" y="130.5503">4. Implementation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="73" x="691.5" y="142.4702">Impl&#233;mentation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="691.5" y="156.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="59" x="691.5" y="171.5503">AI strong</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82" x="691.5" y="183.4702">apport de l'IA fort</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="691.5" y="197.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="183" x="691.5" y="212.5503">write, debug, iterate on code</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="168" x="691.5" y="224.4702">&#233;crire, d&#233;boguer, it&#233;rer sur le code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="178" x="691.5" y="238.5503">delegate most aggressively</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="691.5" y="250.4702">&#224; d&#233;l&#233;guer le plus largement</text></g><!--entity ARCH--><g id="elem_ARCH"><rect fill="#E8E4D8" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="191" x="472.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="103" x="482.5" y="117.5503">3. Architecture</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="59" x="482.5" y="129.4702">Architecture</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="482.5" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="79" x="482.5" y="158.5503">AI moderate</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="99" x="482.5" y="170.4702">apport de l'IA moyen</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="482.5" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="122" x="482.5" y="199.5503">AI knows patterns;</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152" x="482.5" y="211.4702">l'IA conna&#238;t les solutions types ;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="171" x="482.5" y="225.5503">your constraints are yours</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="114" x="482.5" y="237.4702">vos contraintes, &#224; vous</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="63" x="482.5" y="251.5503">to specify</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72" x="482.5" y="263.4702">de les pr&#233;ciser</text></g><!--entity DES--><g id="elem_DES"><rect fill="#E8E4D8" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="264" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="65" x="274" y="117.5503">2. Design</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="34" x="274" y="129.4702">Design</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="274" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="79" x="274" y="158.5503">AI moderate</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="99" x="274" y="170.4702">apport de l'IA moyen</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="274" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="138" x="274" y="199.5503">AI generates options;</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="116" x="274" y="211.4702">l'IA g&#233;n&#232;re des options ;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="145" x="274" y="225.5503">which one fits is yours</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="119" x="274" y="237.4702">laquelle convient, &#224; vous</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="51" x="274" y="251.5503">to judge</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="47" x="274" y="263.4702">d'en juger</text></g><!--entity EMP--><g id="elem_EMP"><rect fill="#CFCBDD" height="180" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="190" x="56" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="78" x="66" y="117.5503">1. Empathy</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="45" x="66" y="129.4702">Empathie</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="66" y="143.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="53" x="66" y="158.5503">AI weak</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="91" x="66" y="170.4702">apport de l'IA faible</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="4" x="66" y="184.5503">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="145" x="66" y="199.5503">who you're building for</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="126" x="66" y="211.4702">pour qui vous construisez</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="127" x="66" y="225.5503">AI can surface data</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="106" x="66" y="237.4702">l'IA peut faire ressortir</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="89" x="66" y="251.5503">and personas</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="103" x="66" y="263.4702">donn&#233;es et personas</text></g><polygon fill="#555555" points="142.4501,352.1812,135.7934,344.9226,137.8653,350.1863,132.6015,352.2583,142.4501,352.1812" style="stroke:#555555;stroke-width:1.0;"/><path d="M47,284 C71.6239,314.5251 100.8004,334.0591 136.9483,349.7874 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="94" x="81" y="303.4702">the shape of the list</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="87" x="84.5" y="314.4702">la forme de la liste</text><polygon fill="#555555" points="730.1244,263.1483,721.7056,268.2594,727.2727,267.2552,728.2768,272.8222,730.1244,263.1483" style="stroke:#555555;stroke-width:1.0;"/><path d="M726.7023,268.0766 C706.5948,297.0342 687.8311,324.0567 670.6247,348.8363 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="81" x="708" y="303.4702">before entering it</text><text fill="#7777
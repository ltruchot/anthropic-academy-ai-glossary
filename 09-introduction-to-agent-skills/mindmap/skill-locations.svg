<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1571px;height:495px;background:#FFFFFF;" width="1571px" height="495px" viewBox="0 0 1571 495" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="634.266" y="23.563" fill="#000" font-size="14" textLength="295.969" font-weight="700" font-family="Helvetica">Where skills live, and how they are shared</text><text x="633.507" y="38.564" fill="#777" font-size="12" textLength="297.486" font-weight="700" font-family="Helvetica">Où se trouvent les skills, et comment les partager</text></g><!--entity PR--><g class="entity" data-qualified-name="PR" id="ent0001" data-source-line="20"><rect x="371" y="64.459" width="728.796" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="381" y="88.99" fill="#000" font-size="15" textLength="90.139" font-weight="700" font-family="Helvetica">Skill priority</text><text x="381" y="103.265" fill="#777" font-size="11" textLength="88.757" font-family="Helvetica">Priorité des skills</text><text x="381" y="120.449" fill="#000" font-size="15" textLength="416.199" font-family="Helvetica">When names clash: Enterprise, then Personal, then Project</text><text x="381" y="134.724" fill="#777" font-size="11" textLength="387.476" font-family="Helvetica">Quand des noms entrent en conflit : Entreprise, puis Personnel, puis Projet</text><text x="381" y="151.908" fill="#000" font-size="15" textLength="632.827" font-family="Helvetica">Plugin skills sit outside the order, namespaced: they load beside a skill of the same name</text><text x="381" y="166.183" fill="#777" font-size="11" textLength="708.796" font-family="Helvetica">Les skills de plugin restent en dehors de cet ordre de priorité, dans leur espace de noms : ils se chargent à côté d'un skill du même nom</text></g><!--entity MS--><g class="entity" data-qualified-name="MS" id="ent0002" data-source-line="21"><rect x="6" y="214.459" width="357.084" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="238.99" fill="#000" font-size="15" textLength="133.726" font-weight="700" font-family="Helvetica">Managed settings</text><text x="16" y="253.265" fill="#777" font-size="11" textLength="92.141" font-family="Helvetica">Paramètres gérés</text><text x="16" y="270.449" fill="#000" font-size="15" textLength="329.048" font-family="Helvetica">Administrators deploy skills organization-wide</text><text x="16" y="284.724" fill="#777" font-size="11" textLength="337.084" font-family="Helvetica">Les administrateurs déploient des skills dans toute l'organisation</text><text x="16" y="301.908" fill="#000" font-size="15" textLength="254.202" font-family="Helvetica">Enterprise skills: the highest priority</text><text x="16" y="316.183" fill="#777" font-size="11" textLength="229.926" font-family="Helvetica">Les skills d'entreprise : la plus haute priorité</text><text x="16" y="333.367" fill="#000" font-size="15" textLength="295.569" font-family="Helvetica">For mandatory standards and compliance</text><text x="16" y="347.642" fill="#777" font-size="11" textLength="234.051" font-family="Helvetica">Pour les normes obligatoires et la conformité</text></g><!--entity PE--><g class="entity" data-qualified-name="PE" id="ent0003" data-source-line="22"><rect x="381.5" y="230.459" width="295.537" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="391.5" y="254.99" fill="#000" font-size="15" textLength="109.043" font-weight="700" font-family="Helvetica">Personal skills</text><text x="391.5" y="269.265" fill="#777" font-size="11" textLength="88.655" font-family="Helvetica">Skills personnels</text><text x="391.5" y="286.449" fill="#000" font-size="15" textLength="275.537" font-family="Helvetica">In .claude/skills in your home directory</text><text x="391.5" y="300.724" fill="#777" font-size="11" textLength="269.242" font-family="Helvetica">Dans .claude/skills, dans votre répertoire personnel</text><text x="391.5" y="317.908" fill="#000" font-size="15" textLength="248.459" font-family="Helvetica">Follow you across all your projects</text><text x="391.5" y="332.183" fill="#777" font-size="11" textLength="181.892" font-family="Helvetica">Vous suivent dans tous vos projets</text></g><!--entity PJ--><g class="entity" data-qualified-name="PJ" id="ent0004" data-source-line="23"><rect x="695.5" y="214.459" width="492.434" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="705.5" y="238.99" fill="#000" font-size="15" textLength="96.35" font-weight="700" font-family="Helvetica">Project skills</text><text x="705.5" y="253.265" fill="#777" font-size="11" textLength="77.107" font-family="Helvetica">Skills de projet</text><text x="705.5" y="270.449" fill="#000" font-size="15" textLength="319.014" font-family="Helvetica">In .claude/skills at the root of your repository</text><text x="705.5" y="284.724" fill="#777" font-size="11" textLength="237.612" font-family="Helvetica">Dans .claude/skills, à la racine de votre dépôt</text><text x="705.5" y="301.908" fill="#000" font-size="15" textLength="472.434" font-family="Helvetica">Committed with your code: anyone who clones the repo gets them</text><text x="705.5" y="316.183" fill="#777" font-size="11" textLength="339.136" font-family="Helvetica">Commités avec votre code : quiconque clone le dépôt les obtient</text><text x="705.5" y="333.367" fill="#000" font-size="15" textLength="205.92" font-family="Helvetica">The simplest sharing method</text><text x="705.5" y="347.642" fill="#777" font-size="11" textLength="195.556" font-family="Helvetica">La méthode de partage la plus simple</text></g><!--entity PL--><g class="entity" data-qualified-name="PL" id="ent0005" data-source-line="24"><rect x="1206" y="214.459" width="345.1" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1216" y="238.99" fill="#000" font-size="15" textLength="47.087" font-weight="700" font-family="Helvetica">Plugin</text><text x="1216" y="253.265" fill="#777" font-size="11" textLength="32.468" font-family="Helvetica">Plugin</text><text x="1216" y="270.449" fill="#000" font-size="15" textLength="256.238" font-family="Helvetica">Distributes skills across repositories</text><text x="1216" y="284.724" fill="#777" font-size="11" textLength="167.116" font-family="Helvetica">Distribue des skills entre dépôts</text><text x="1216" y="301.908" fill="#000" font-size="15" textLength="325.1" font-family="Helvetica">Its skills in a skills/ directory at the plugin root</text><text x="1216" y="316.183" fill="#777" font-size="11" textLength="289.378" font-family="Helvetica">Ses skills dans un répertoire skills/ à la racine du plugin</text><text x="1216" y="333.367" fill="#000" font-size="15" textLength="316.318" font-family="Helvetica">Best for skills that aren't too project-specific</text><text x="1216" y="347.642" fill="#777" font-size="11" textLength="292.832" font-family="Helvetica">Convient le mieux aux skills pas trop propres à un projet</text></g><!--entity MK--><g class="entity" data-qualified-name="MK" id="ent0006" data-source-line="25"><rect x="1201.5" y="396.459" width="354.475" height="82.918" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1211.5" y="420.99" fill="#000" font-size="15" textLength="93.713" font-weight="700" font-family="Helvetica">Marketplace</text><text x="1211.5" y="435.265" fill="#777" font-size="11" textLength="64.942" font-family="Helvetica">Marketplace</text><text x="1211.5" y="452.449" fill="#000" font-size="15" textLength="334.475" font-family="Helvetica">Where other users discover and install a plugin</text><text x="1211.5" y="466.724" fill="#777" font-size="11" textLength="311.701" font-family="Helvetica">Là où d'autres utilisateurs découvrent et installent un plugin</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="363.192,217.457,372.99,218.462,367.944,215.903,370.503,210.858,363.192,217.457" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M497.608,178.481 C455.679,189.567 412.628,201.738 372.5,214.459 C369.418,215.436 371.066,214.882 367.944,215.903" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="600.013,230.322,609.546,227.846,603.925,227.208,604.563,221.587,600.013,230.322" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M664.895,178.669 C643.93,195.359 624.884,210.523 603.925,227.208" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="850.965,214.383,846.415,205.648,847.053,211.268,841.433,211.906,850.965,214.383" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M806.105,178.669 C820.548,190.167 832.024,199.304 847.053,211.268" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk10" data-link-type="dependency"><polygon points="1205.845,217.289,1198.436,210.801,1201.07,215.807,1196.064,218.441,1205.845,217.289" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1055.064,178.466 C1102.815,189.072 1151.196,201.095 1196.5,214.459 C1199.596,215.372 1197.938,214.834 1201.07,215.807" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" id="lnk11" data-link-type="dependency"><polygon po
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1998px;height:557px;background:#FFFFFF;" width="1998px" height="557px" viewBox="0 0 1998 557" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="886.146" y="23.563" fill="#000" font-size="14" textLength="218.709" font-weight="700" font-family="Helvetica">Creating and configuring a skill</text><text x="915.095" y="38.564" fill="#777" font-size="12" textLength="160.811" font-weight="700" font-family="Helvetica">Créer et configurer un skill</text></g><!--entity SK--><g class="entity" data-qualified-name="SK" id="ent0001" data-source-line="20"><rect x="701" y="64.459" width="474.607" height="114.377" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="711" y="88.99" fill="#000" font-size="15" textLength="32.095" font-weight="700" font-family="Helvetica">Skill</text><text x="711" y="103.265" fill="#777" font-size="11" textLength="21.817" font-family="Helvetica">Skill</text><text x="711" y="120.449" fill="#000" font-size="15" textLength="454.607" font-family="Helvetica">A markdown file that teaches Claude how to do something once</text><text x="711" y="134.724" fill="#777" font-size="11" textLength="453.24" font-family="Helvetica">Un fichier Markdown qui apprend à Claude, une fois pour toutes, à faire quelque chose</text><text x="711" y="151.908" fill="#000" font-size="15" textLength="438.303" font-family="Helvetica">A directory with a SKILL.md: frontmatter, then the instructions</text><text x="711" y="166.183" fill="#777" font-size="11" textLength="356.189" font-family="Helvetica">Un répertoire avec un SKILL.md : le frontmatter, puis les instructions</text></g><!--entity MF--><g class="entity" data-qualified-name="MF" id="ent0002" data-source-line="21"><rect x="44" y="229.959" width="460.955" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="54" y="254.49" fill="#000" font-size="15" textLength="152.41" font-weight="700" font-family="Helvetica">Skill metadata fields</text><text x="54" y="268.765" fill="#777" font-size="11" textLength="184.529" font-family="Helvetica">Champs de métadonnées des skills</text><text x="54" y="285.949" fill="#000" font-size="15" textLength="438.904" font-family="Helvetica">All optional in Claude Code; only description is recommended</text><text x="54" y="300.224" fill="#777" font-size="11" textLength="363.279" font-family="Helvetica">Tous facultatifs dans Claude Code ; seul description est recommandé</text><text x="54" y="317.408" fill="#000" font-size="15" textLength="440.955" font-family="Helvetica">name, description, allowed-tools, model: a good place to start</text><text x="54" y="331.683" fill="#777" font-size="11" textLength="337.332" font-family="Helvetica">name, description, allowed-tools, model : un bon point de départ</text><text x="54" y="348.867" fill="#000" font-size="15" textLength="424.944" font-family="Helvetica">description: the most important, Claude uses it for matching</text><text x="54" y="363.142" fill="#777" font-size="11" textLength="373.946" font-family="Helvetica">description : le plus important, Claude s'en sert pour la correspondance</text></g><!--entity AT--><g class="entity" data-qualified-name="AT" id="ent0003" data-source-line="22"><rect x="6" y="427.459" width="537.266" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="451.99" fill="#000" font-size="15" textLength="103.821" font-weight="700" font-family="Helvetica">allowed-tools</text><text x="16" y="466.265" fill="#777" font-size="11" textLength="71.667" font-family="Helvetica">allowed-tools</text><text x="16" y="483.449" fill="#000" font-size="15" textLength="517.266" font-family="Helvetica">Pre-approves the listed tools for the rest of the turn that invoked the skill</text><text x="16" y="497.724" fill="#777" font-size="11" textLength="369.461" font-family="Helvetica">Préapprouve les outils listés jusqu'à la fin du tour où le skill a été lancé</text><text x="16" y="514.908" fill="#000" font-size="15" textLength="433.147" font-family="Helvetica">Doesn't limit Claude to them; disallowed-tools removes tools</text><text x="16" y="529.183" fill="#777" font-size="11" textLength="312.608" font-family="Helvetica">Ne limite pas Claude à ces outils ; disallowed-tools en retire</text></g><!--entity PD--><g class="entity" data-qualified-name="PD" id="ent0004" data-source-line="23"><rect x="523.5" y="229.959" width="378.162" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="533.5" y="254.49" fill="#000" font-size="15" textLength="172.126" font-weight="700" font-family="Helvetica">Progressive disclosure</text><text x="533.5" y="268.765" fill="#777" font-size="11" textLength="123.336" font-family="Helvetica">Divulgation progressive</text><text x="533.5" y="285.949" fill="#000" font-size="15" textLength="358.162" font-family="Helvetica">Essential instructions in SKILL.md, under 500 lines</text><text x="533.5" y="300.224" fill="#777" font-size="11" textLength="316.69" font-family="Helvetica">Les instructions essentielles dans SKILL.md, sous 500 lignes</text><text x="533.5" y="317.408" fill="#000" font-size="15" textLength="346.26" font-family="Helvetica">Supporting files Claude reads only when needed</text><text x="533.5" y="331.683" fill="#777" font-size="11" textLength="307.785" font-family="Helvetica">Des fichiers annexes que Claude ne lit qu'en cas de besoin</text><text x="533.5" y="348.867" fill="#000" font-size="15" textLength="331.121" font-family="Helvetica">Scripts run: only their output consumes tokens</text><text x="533.5" y="363.142" fill="#777" font-size="11" textLength="334.163" font-family="Helvetica">Les scripts s'exécutent : seule leur sortie consomme des tokens</text></g><!--entity SM--><g class="entity" data-qualified-name="SM" id="ent0005" data-source-line="24"><rect x="920" y="229.959" width="488.699" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="930" y="254.49" fill="#000" font-size="15" textLength="105.667" font-weight="700" font-family="Helvetica">Skill matching</text><text x="930" y="268.765" fill="#777" font-size="11" textLength="138.585" font-family="Helvetica">Correspondance des skills</text><text x="930" y="285.949" fill="#000" font-size="15" textLength="316.648" font-family="Helvetica">At startup, only names and descriptions load</text><text x="930" y="300.224" fill="#777" font-size="11" textLength="320.815" font-family="Helvetica">Au démarrage, seuls les noms et les descriptions se chargent</text><text x="930" y="317.408" fill="#000" font-size="15" textLength="468.699" font-family="Helvetica">Your request compared to the descriptions, by semantic matching</text><text x="930" y="331.683" fill="#777" font-size="11" textLength="399.615" font-family="Helvetica">Votre demande comparée aux descriptions, par correspondance sémantique</text><text x="930" y="348.867" fill="#000" font-size="15" textLength="353.02" font-family="Helvetica">On a match, Claude reads the complete SKILL.md</text><text x="930" y="363.142" fill="#777" font-size="11" textLength="352.924" font-family="Helvetica">Une fois la correspondance trouvée, Claude lit le SKILL.md complet</text></g><!--entity TS--><g class="entity" data-qualified-name="TS" id="ent0006" data-source-line="25"><rect x="1427" y="214.459" width="554.529" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1437" y="238.99" fill="#000" font-size="15" textLength="166.655" font-weight="700" font-family="Helvetica">Troubleshooting skills</text><text x="1437" y="253.265" fill="#777" font-size="11" textLength="98.624" font-family="Helvetica">Dépanner les skills</text><text x="1437" y="270.449" fill="#000" font-size="15" textLength="318.201" font-family="Helvetica">Not triggering: almost always the description</text><text x="1437" y="284.724" fill="#777" font-size="11" textLength="280.634" font-family="Helvetica">Ne se déclenche pas : presque toujours la description</text><text x="1437" y="301.908" fill="#000" font-size="15" textLength="534.529" font-family="Helvetica">Not loading: SKILL.md in its own directory, the file named exactly SKILL.md</text><text x="1437" y="316.183" fill="#777" font-size="11" textLength="502.455" font-family="Helvetica">Ne se charge pas : SKILL.md dans son propre répertoire, le fichier nommé exactement SKILL.md</text><text x="1437" y="333.367" fill="#000" font-size="15" textLength="292.273" font-family="Helvetica">Wrong skill used: descriptions too similar</text><text x="1437" y="347.642" fill="#777" font-size="11" textLength="247.618" font-family="Helvetica">Le mauvais skill : des descriptions trop proches</text><text x="1437" y="364.826" fill="#000" font-size="15" textLength="415.576" font-family="Helvetica">Runtime errors: dependencies, chmod +x, forward slashes</text><text x="1437" y="379.101" fill="#777" font-size="11" textLength="333.142" font-family="Helvetica">Erreurs à l'exécution : dépendances, chmod +x, barres obliques</text></g><!--entity SV--><g class="entity" data-qualified-name="SV" id="ent0007" data-source-line="26"><rect x="1507.5" y="427.459" width="394.421" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1517.5" y="451.99" fill="#000" font-size="15" textLength="110.691" font-weight="700" font-family="Helvetica">Skills validator</text><text x="1517.5" y="466.265" fill="#777" font-size="11" textLength="145.379" font-family="Helvetica">Outil de validation des skills</text><text x="1517.5" y="483.449" fill="#000" font-size="15" textLength="300.066" font-family="Helvetica">claude plugin validate: the first thing to try</text><text x="1517.5" y="497.724" fill="#777" font-size="11" textLength="270.698" font-family="Helvetica">claude plugin validate : la première chose à essayer</text><text x="1517.5" y="514.908" fill="#000" font-size="15" textLength="374.421" font-family="Helvetica">Catches structural problems before other debugging</text><text x="1517.5" y="529.183" fill="#777" font-size="11" textLength="321.165" font-family="Helvetica">Repère les problèmes de structure avant tout autre débogage</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="464.987,229.86,474.787,230.838,469.735,228.293,472.28,223.241,464.987,229.86" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M700.756,168.093 C639.646,181.446 574.284,197.162 514.5,214.459 C498.311,219.143 486.388,222.797 469.735,228.293" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="274.5,427.378,278.5,418.378,274.5,422.378,270.5,418.378,274.5,427.378" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M274.5,376.193 C274.5,393.241 274.5,406.166 274.5,422.378" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="803.307,229.835,812.843,227.37,807.223,226.726,807.867,221.106,803.307,229.835" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M867.922,178.516 C847.459,194.768 828.74,209.636 807.223,226.726" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="1073.693,229.835,1069.133,221.106,1069.777,226.726,1064.157,227.37,1073.693,229.835" fill="#555" style="stroke:#555;stro
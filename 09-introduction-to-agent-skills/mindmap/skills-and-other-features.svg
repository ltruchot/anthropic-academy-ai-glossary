<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1512px;height:408px;background:#FFFFFF;" width="1512px" height="408px" viewBox="0 0 1512 408" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="622.491" y="23.563" fill="#000" font-size="14" textLength="260.019" font-weight="700" font-family="Helvetica">Skills vs. other Claude Code features</text><text x="580.413" y="38.564" fill="#777" font-size="12" textLength="344.174" font-weight="700" font-family="Helvetica">Les skills face aux autres fonctionnalités de Claude Code</text></g><!--entity SK--><g class="entity" data-qualified-name="SK" id="ent0001" data-source-line="20"><rect x="491.5" y="64.459" width="515.059" height="145.836" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="501.5" y="88.99" fill="#000" font-size="15" textLength="32.095" font-weight="700" font-family="Helvetica">Skill</text><text x="501.5" y="103.265" fill="#777" font-size="11" textLength="21.817" font-family="Helvetica">Skill</text><text x="501.5" y="120.449" fill="#000" font-size="15" textLength="435.513" font-family="Helvetica">Request-driven: loads on demand, for task-specific expertise</text><text x="501.5" y="134.724" fill="#777" font-size="11" textLength="495.059" font-family="Helvetica">Déclenché par vos demandes : se charge à la demande, pour une expertise propre à une tâche</text><text x="501.5" y="151.908" fill="#000" font-size="15" textLength="320.962" font-family="Helvetica">Its instructions join your current conversation</text><text x="501.5" y="166.183" fill="#777" font-size="11" textLength="295.555" font-family="Helvetica">Ses instructions s'ajoutent à votre conversation en cours</text><text x="501.5" y="183.367" fill="#000" font-size="15" textLength="383.071" font-family="Helvetica">Each feature handles its own specialty: combine them</text><text x="501.5" y="197.642" fill="#777" font-size="11" textLength="310.299" font-family="Helvetica">Chaque fonctionnalité a sa propre spécialité : combinez-les</text></g><!--entity CM--><g class="entity" data-qualified-name="CM" id="ent0002" data-source-line="21"><rect x="6" y="262.459" width="292.175" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="286.99" fill="#000" font-size="15" textLength="91.655" font-weight="700" font-family="Helvetica">CLAUDE.md</text><text x="16" y="301.265" fill="#777" font-size="11" textLength="64.12" font-family="Helvetica">CLAUDE.md</text><text x="16" y="318.449" fill="#000" font-size="15" textLength="272.175" font-family="Helvetica">Loads into every conversation, always</text><text x="16" y="332.724" fill="#777" font-size="11" textLength="242.075" font-family="Helvetica">Se charge dans chaque conversation, toujours</text><text x="16" y="349.908" fill="#000" font-size="15" textLength="230.654" font-family="Helvetica">For always-on project standards</text><text x="16" y="364.183" fill="#777" font-size="11" textLength="220" font-family="Helvetica">Pour les normes de projet toujours actives</text></g><!--entity SA--><g class="entity" data-qualified-name="SA" id="ent0003" data-source-line="22"><rect x="316" y="246.459" width="428.384" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="326" y="270.99" fill="#000" font-size="15" textLength="71.565" font-weight="700" font-family="Helvetica">Subagent</text><text x="326" y="285.265" fill="#777" font-size="11" textLength="60.457" font-family="Helvetica">Sous-agent</text><text x="326" y="302.449" fill="#000" font-size="15" textLength="408.384" font-family="Helvetica">Runs in an isolated execution context, for delegated work</text><text x="326" y="316.724" fill="#777" font-size="11" textLength="359.788" font-family="Helvetica">S'exécute dans un contexte d'exécution isolé, pour le travail délégué</text><text x="326" y="333.908" fill="#000" font-size="15" textLength="320.984" font-family="Helvetica">Doesn't see the skills you've already invoked</text><text x="326" y="348.183" fill="#777" font-size="11" textLength="247.709" font-family="Helvetica">Ne voit pas les skills que vous avez déjà lancés</text><text x="326" y="365.367" fill="#000" font-size="15" textLength="366.343" font-family="Helvetica">A custom one can preload the skills in its skills field</text><text x="326" y="379.642" fill="#777" font-size="11" textLength="387.933" font-family="Helvetica">Un sous-agent personnalisé peut précharger les skills de son champ skills</text></g><!--entity HK--><g class="entity" data-qualified-name="HK" id="ent0004" data-source-line="23"><rect x="762" y="277.959" width="413.647" height="82.918" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="772" y="302.49" fill="#000" font-size="15" textLength="39.243" font-weight="700" font-family="Helvetica">Hook</text><text x="772" y="316.765" fill="#777" font-size="11" textLength="27.403" font-family="Helvetica">Hook</text><text x="772" y="333.949" fill="#000" font-size="15" textLength="298.359" font-family="Helvetica">Event-driven: fires on file saves, tool calls</text><text x="772" y="348.224" fill="#777" font-size="11" textLength="393.647" font-family="Helvetica">Déclenché par des événements : enregistrement de fichiers, appels d'outils</text></g><!--entity MC--><g class="entity" data-qualified-name="MC" id="ent0005" data-source-line="24"><rect x="1194" y="262.459" width="301.799" height="114.377" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1204" y="286.99" fill="#000" font-size="15" textLength="87.656" font-weight="700" font-family="Helvetica">MCP server</text><text x="1204" y="301.265" fill="#777" font-size="11" textLength="68.943" font-family="Helvetica">Serveur MCP</text><text x="1204" y="318.449" fill="#000" font-size="15" textLength="281.799" font-family="Helvetica">Provides external tools and integrations</text><text x="1204" y="332.724" fill="#777" font-size="11" textLength="237.87" font-family="Helvetica">Fournit des outils et des intégrations externes</text><text x="1204" y="349.908" fill="#000" font-size="15" textLength="277.581" font-family="Helvetica">A different category entirely from skills</text><text x="1204" y="364.183" fill="#777" font-size="11" textLength="197.098" font-family="Helvetica">Une tout autre catégorie que les skills</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="266.079,262.437,275.926,262.601,270.681,260.483,272.799,255.237,266.079,262.437" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M491.461,192.41 C430.32,207.677 365.796,225.842 307,246.459 C293.56,251.172 284.313,254.694 270.681,260.483" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="617.834,246.267,627.326,243.643,621.696,243.092,622.247,237.462,617.834,246.267" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M661.186,210.635 C646.906,222.372 635.977,231.355 621.696,243.092" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="919.375,277.857,914.942,269.062,915.505,274.69,909.876,275.253,919.375,277.857" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M837.215,210.635 C865.188,233.522 891.249,254.844 915.505,274.69" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="122
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1630px;height:557px;background:#FFFFFF;" width="1630px" height="557px" viewBox="0 0 1630 557" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="704.692" y="23.563" fill="#000" font-size="14" textLength="213.616" font-weight="700" font-family="Helvetica">Designing effective subagents</text><text x="708.579" y="37.596" fill="#777" font-size="11" textLength="205.842" font-weight="700" font-family="Helvetica">Concevoir des sous-agents efficaces</text></g><!--entity SA--><g class="entity" data-qualified-name="SA" id="ent0001" data-source-line="20"><rect x="566.5" y="63.249" width="638.508" height="82.918" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="576.5" y="87.78" fill="#000" font-size="15" textLength="71.565" font-weight="700" font-family="Helvetica">Subagent</text><text x="576.5" y="102.055" fill="#777" font-size="11" textLength="60.457" font-family="Helvetica">Sous-agent</text><text x="576.5" y="119.239" fill="#000" font-size="15" textLength="618.508" font-family="Helvetica">Poorly configured, it wanders, runs too long, or returns output the main agent can't use</text><text x="576.5" y="133.514" fill="#777" font-size="11" textLength="538.227" font-family="Helvetica">Mal configuré, il s'égare, tourne trop longtemps ou renvoie une sortie inexploitable par l'agent principal</text></g><!--entity DE--><g class="entity" data-qualified-name="DE" id="ent0002" data-source-line="21"><rect x="6" y="213.749" width="585.562" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="238.28" fill="#000" font-size="15" textLength="160.217" font-weight="700" font-family="Helvetica">Subagent description</text><text x="16" y="252.555" fill="#777" font-size="11" textLength="147.77" font-family="Helvetica">Description d'un sous-agent</text><text x="16" y="269.739" fill="#000" font-size="15" textLength="436.326" font-family="Helvetica">In the main agent's system prompt, with the subagent's name</text><text x="16" y="284.014" fill="#777" font-size="11" textLength="377.873" font-family="Helvetica">Dans le prompt système de l'agent principal, avec le nom du sous-agent</text><text x="16" y="301.198" fill="#000" font-size="15" textLength="363.047" font-family="Helvetica">Controls when Claude decides to use the subagent</text><text x="16" y="315.473" fill="#777" font-size="11" textLength="290.571" font-family="Helvetica">Détermine quand Claude décide d'utiliser le sous-agent</text><text x="16" y="332.657" fill="#000" font-size="15" textLength="565.562" font-family="Helvetica">One line; "proactively" to delegate without being asked; example conversations</text><text x="16" y="346.932" fill="#777" font-size="11" textLength="542.824" font-family="Helvetica">Une seule ligne ; « proactively » pour déléguer sans qu'on le demande ; des exemples de conversations</text></g><!--entity IP--><g class="entity" data-qualified-name="IP" id="ent0003" data-source-line="22"><rect x="10" y="427.249" width="578.464" height="114.377" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="20" y="451.78" fill="#000" font-size="15" textLength="96.284" font-weight="700" font-family="Helvetica">Input prompt</text><text x="20" y="466.055" fill="#777" font-size="11" textLength="84.337" font-family="Helvetica">Prompt d'entrée</text><text x="20" y="483.239" fill="#000" font-size="15" textLength="318.45" font-family="Helvetica">Written by the main agent to kick off the task</text><text x="20" y="497.514" fill="#777" font-size="11" textLength="265.407" font-family="Helvetica">Rédigé par l'agent principal pour démarrer la tâche</text><text x="20" y="514.698" fill="#000" font-size="15" textLength="558.464" font-family="Helvetica">Shaped by the description, which also controls when the subagent is launched</text><text x="20" y="528.973" fill="#777" font-size="11" textLength="407.451" font-family="Helvetica">Façonné par la description, qui détermine aussi quand le sous-agent est lancé</text></g><!--entity OF--><g class="entity" data-qualified-name="OF" id="ent0004" data-source-line="23"><rect x="610.5" y="198.249" width="550.647" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="620.5" y="222.78" fill="#000" font-size="15" textLength="104.714" font-weight="700" font-family="Helvetica">Output format</text><text x="620.5" y="237.055" fill="#777" font-size="11" textLength="85.196" font-family="Helvetica">Format de sortie</text><text x="620.5" y="254.239" fill="#000" font-size="15" textLength="530.647" font-family="Helvetica">Defining one in the system prompt: the single most important improvement</text><text x="620.5" y="268.514" fill="#777" font-size="11" textLength="370.315" font-family="Helvetica">En définir un dans le prompt système : l'amélioration la plus importante</text><text x="620.5" y="285.698" fill="#000" font-size="15" textLength="419.568" font-family="Helvetica">Natural stopping points: done when each section is filled in</text><text x="620.5" y="299.973" fill="#777" font-size="11" textLength="421.781" font-family="Helvetica">Des points où s'arrêter naturellement : terminé quand chaque section est remplie</text><text x="620.5" y="317.157" fill="#000" font-size="15" textLength="443.665" font-family="Helvetica">Keeps the subagent from running much longer than necessary</text><text x="620.5" y="331.432" fill="#777" font-size="11" textLength="351.082" font-family="Helvetica">Évite que le sous-agent tourne bien plus longtemps que nécessaire</text><text x="620.5" y="348.616" fill="#000" font-size="15" textLength="488.232" font-family="Helvetica">An "Obstacles Encountered" section: workarounds, quirks, problems</text><text x="620.5" y="362.891" fill="#777" font-size="11" textLength="496.832" font-family="Helvetica">Une section « Obstacles Encountered » : solutions de contournement, particularités, problèmes</text></g><!--entity TA--><g class="entity" data-qualified-name="TA" id="ent0005" data-source-line="24"><rect x="1180" y="182.249" width="434.5" height="208.754" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1190" y="206.78" fill="#000" font-size="15" textLength="145.298" font-weight="700" font-family="Helvetica">Limited tool access</text><text x="1190" y="221.055" fill="#777" font-size="11" textLength="116.547" font-family="Helvetica">Accès limité aux outils</text><text x="1190" y="238.239" fill="#000" font-size="15" textLength="303.64" font-family="Helvetica">Only the tools the subagent actually needs</text><text x="1190" y="252.514" fill="#777" font-size="11" textLength="312.313" font-family="Helvetica">Seulement les outils dont le sous-agent a réellement besoin</text><text x="1190" y="269.698" fill="#000" font-size="15" textLength="414.5" font-family="Helvetica">Prevents unintended side effects, makes each role clearer</text><text x="1190" y="283.973" fill="#777" font-size="11" textLength="359.46" font-family="Helvetica">Évite les effets secondaires involontaires, rend chaque rôle plus clair</text><text x="1190" y="301.157" fill="#000" font-size="15" textLength="305.991" font-family="Helvetica">Research / read-only: Glob, Grep and Read</text><text x="1190" y="315.432" fill="#777" font-size="11" textLength="242.118" font-family="Helvetica">Recherche / lecture seule : Glob, Grep et Read</text><text x="1190" y="332.616" fill="#000" font-size="15" textLength="340.188" font-family="Helvetica">Code reviewer: Bash for git diff, no Edit or Write</text><text x="1190" y="346.891" fill="#777" font-size="11" textLength="275.226" font-family="Helvetica">Relecteur de code : Bash pour git diff, ni Edit ni Write</text><text x="1190" y="364.075" fill="#000" font-size="15" textLength="237.524" font-family="Helvetica">Code modification: Edit and Write</text><text x="1190" y="378.35" fill="#777" font-size="11" textLength="182.762" font-family="Helvetica">Modification du code : Edit et Write</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="504.179,213.62,513.982,214.568,508.922,212.039,511.451,206.979,504.179,213.62" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M728.111,146.293 C686.908,157.416 642.659,169.843 602,182.249 C570.232,191.942 541.53,201.167 508.922,212.039" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="299,427.19,303,418.19,299,422.19,295,418.19,299,427.19" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M299,359.991 C299,382.18 299,401.255 299,422.19" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="886,198.031,890,189.031,886,193.031,882,189.031,886,198.031" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M886,146.594 C886,161.945 886,175.049 886,193.031" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="1179.871,185.498,1172.83,178.611,1175.184,183.755,1170.041,186.109,1179.871,185.498" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1055.855,146.346 C1094.108,156.866 1134.25,169.007 1171,182.249 C1173.943,183.31 1172.215,182.65 1175.184,183.755" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src VLTDKnj74BthLtJCGGaHDk2udCWKLHY1GyKO2kpon
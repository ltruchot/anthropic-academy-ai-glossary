<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:684px;height:469px;background:#FFFFFF;" width="684px" height="469px" viewBox="0 0 684 469" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="240.315" y="23.563" fill="#000" font-size="14" textLength="196.369" font-weight="700" font-family="Helvetica">Using subagents effectively</text><text x="260.463" y="37.596" fill="#777" font-size="11" textLength="156.073" font-weight="700" font-family="Helvetica">Bien utiliser les sous-agents</text></g><!--entity IW--><g class="entity" data-qualified-name="IW" id="ent0001" data-source-line="20"><rect x="13" y="63.249" width="647.666" height="177.295" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="23" y="87.78" fill="#000" font-size="15" textLength="135.835" font-weight="700" font-family="Helvetica">Intermediate work</text><text x="23" y="102.055" fill="#777" font-size="11" textLength="106.724" font-family="Helvetica">Travail intermédiaire</text><text x="23" y="119.239" fill="#000" font-size="15" textLength="382.603" font-family="Helvetica">The decision rule: does the intermediate work matter?</text><text x="23" y="133.514" fill="#777" font-size="11" textLength="300.83" font-family="Helvetica">La règle de décision : le travail intermédiaire compte-t-il ?</text><text x="23" y="150.698" fill="#000" font-size="15" textLength="468.245" font-family="Helvetica">No, you just need the final result: delegate the work to a subagent</text><text x="23" y="164.973" fill="#777" font-size="11" textLength="456.323" font-family="Helvetica">Non, vous avez seulement besoin du résultat final : déléguez ce travail à un sous-agent</text><text x="23" y="182.157" fill="#000" font-size="15" textLength="574.995" font-family="Helvetica">Yes, you need to see and react along the way: keep the work in your main thread</text><text x="23" y="196.432" fill="#777" font-size="11" textLength="519.224" font-family="Helvetica">Oui, vous devez voir ce qui se passe en chemin et y réagir : gardez ce travail dans votre fil principal</text><text x="23" y="213.616" fill="#000" font-size="15" textLength="597.737" font-family="Helvetica">Use subagents for research, code reviews, tasks that need a custom system prompt</text><text x="23" y="227.891" fill="#777" font-size="11" textLength="627.666" font-family="Helvetica">Utilisez les sous-agents pour la recherche, la revue de code, les tâches qui demandent un prompt système personnalisé</text></g><!--entity AP--><g class="entity" data-qualified-name="AP" id="ent0002" data-source-line="21"><rect x="6" y="276.249" width="662.349" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="300.78" fill="#000" font-size="15" textLength="173.196" font-weight="700" font-family="Helvetica">Subagent anti-patterns</text><text x="16" y="315.055" fill="#777" font-size="11" textLength="158.533" font-family="Helvetica">Anti-patterns des sous-agents</text><text x="16" y="332.239" fill="#000" font-size="15" textLength="642.349" font-family="Helvetica">The overhead only makes sense when the subagent does something the main thread can't</text><text x="16" y="346.514" fill="#777" font-size="11" textLength="438.937" font-family="Helvetica">Le coût ne se justifie que si le sous-agent fait ce que le fil principal ne peut pas faire</text><text x="16" y="363.698" fill="#000" font-size="15" textLength="553.718" font-family="Helvetica">Expert claims ("you are a Python expert"): Claude already has that knowledge</text><text x="16" y="377.973" fill="#777" font-size="11" textLength="601.133" font-family="Helvetica">Les sous-agents qui se présentent comme experts (« you are a Python expert ») : Claude a déjà ces connaissances</text><text x="16" y="395.157" fill="#000" font-size="15" textLength="634.966" font-family="Helvetica">Sequential pipelines: they fail when each step depends on the previous one's discoveries</text><text x="16" y="409.432" fill="#777" font-size="11" textLength="551.794" font-family="Helvetica">Les pipelines séquentiels : ils échouent quand chaque étape dépend de ce que la précédente a découvert</text><text x="16" y="426.616" fill="#000" font-size="15" textLength="392.065" font-family="Helvetica">Test runners: they tend to hide the full output you need</text><text x="16" y="440.891" fill="#777" font-size="11" textLength="532.141" font-family="Helvetica">Les sous-agents qui lancent les tests : ils tendent à masquer la sortie complète dont vous avez besoin</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="dependency"><polygon points="337,276.032,341,267.032,337,271.032,333,267.032,337,276.032" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M337,240.399 C337,252.175 337,259.256 337,271.032" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src bLRRJXn747tVhwYO1mm16qWieXN2ihaabZ11mSYAv9VoJErEcvxkSNVFRfOe_nBb2PHFy9ltntAgPu7bifQoGYjckhhhd3gdgdUPVXDNIf2InYPLT6BPfREtHsiKQqdic2nFV9legVFqS-2c6faBSYAbb2lFUjyrWOVrJT1iJwyNpurhE71DfGoujUdGktJCjT0lOaUIJC5pCR7Yqe-D6zA0RPIvbU1RL-xvu2JGvjRSmgiG_7ZFMnzewKN-pE-I0Z26LkZF7j5h7q1m5dkOFtYhW4xDXT3cYzvVlPsO9bPsUtTtlZNEr6tztfIepDOF6nhuV1RPIoOXx2mgxDX-vA6u54a60nnXHc8d7znEH8B-vkRkJg7P-qlRszkxhuquQfEn9eAKbKZHjt6zsx_pF4Vk8Wss8iije2UhgszSab1BQJW9ZNquNrrTaEHTu14RIoRlc5vXYmbox_GFxbqb4AWmqNX7eRNIfz83KS9xSpyPrPpmwkM2b4TCONgfI4lyJQzcf_P1aTAZSAZmTPDaFQrZwUK3SCT-ZU0g-jJ6b1sNOGsCOmk58qm5j69bg01rAODCdlX6ZmLGZxrRen6gJZoI2ue2vZN2wQD4RnoLBQXSQGPEiuHzfMIdLyCM6ufRHjE_gNLp2ZvWyRl4ZaR7m2ER4BiI5BX8nDR3FnazJ_fqBjBSSW4Kx0meFFvB5NQK2nZzsfePerAKqiYRe30_jmO9gU68R_YkgAJ6MP9eeXHvYB0-3HaTSeTMoIxYa1Iqu9QQO5nX6hOFw9tXt5lt3z1Ya4Ou5DKQv8KJWeoCZ563nF5SdSKpCPaA2ElH_PEOf4OETSC2VcTTlrpSxnTgj3wMjU
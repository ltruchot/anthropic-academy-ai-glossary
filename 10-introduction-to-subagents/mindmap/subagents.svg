<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1633px;height:683px;background:#FFFFFF;" width="1633px" height="683px" viewBox="0 0 1633 683" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="18"><text x="775.939" y="23.563" fill="#000" font-size="14" textLength="74.621" font-weight="700" font-family="Helvetica">Subagents</text><text x="767.572" y="37.596" fill="#777" font-size="11" textLength="91.357" font-weight="700" font-family="Helvetica">Les sous-agents</text></g><!--entity SA--><g class="entity" data-qualified-name="SA" id="ent0001" data-source-line="20"><rect x="548.5" y="63.249" width="671.218" height="208.754" fill="#CFCBDD" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="558.5" y="87.78" fill="#000" font-size="15" textLength="71.565" font-weight="700" font-family="Helvetica">Subagent</text><text x="558.5" y="102.055" fill="#777" font-size="11" textLength="60.457" font-family="Helvetica">Sous-agent</text><text x="558.5" y="119.239" fill="#000" font-size="15" textLength="414.88" font-family="Helvetica">A specialized assistant Claude Code can delegate tasks to</text><text x="558.5" y="133.514" fill="#777" font-size="11" textLength="364.074" font-family="Helvetica">Un assistant spécialisé auquel Claude Code peut déléguer des tâches</text><text x="558.5" y="150.698" fill="#000" font-size="15" textLength="320.083" font-family="Helvetica">Runs in its own conversation context window</text><text x="558.5" y="164.973" fill="#777" font-size="11" textLength="325.408" font-family="Helvetica">S'exécute dans sa propre fenêtre de contexte de conversation</text><text x="558.5" y="182.157" fill="#000" font-size="15" textLength="651.218" font-family="Helvetica">Starts with a system prompt from its config file and a task description from the parent agent</text><text x="558.5" y="196.432" fill="#777" font-size="11" textLength="646.352" font-family="Helvetica">Démarre avec un prompt système issu de son fichier de configuration et une description de tâche rédigée par l'agent parent</text><text x="558.5" y="213.616" fill="#000" font-size="15" textLength="524.685" font-family="Helvetica">Only a summary comes back; the rest is saved in a separate transcript file</text><text x="558.5" y="227.891" fill="#777" font-size="11" textLength="449.297" font-family="Helvetica">Seul un résumé revient ; le reste est enregistré dans un fichier de transcription distinct</text><text x="558.5" y="245.075" fill="#000" font-size="15" textLength="570.168" font-family="Helvetica">The tradeoff: your main conversation doesn't see how it reached its conclusions</text><text x="558.5" y="259.35" fill="#777" font-size="11" textLength="508.293" font-family="Helvetica">La contrepartie : votre conversation principale ne voit pas comment il est arrivé à ses conclusions</text></g><!--entity MC--><g class="entity" data-qualified-name="MC" id="ent0002" data-source-line="21"><rect x="6" y="323.749" width="627.857" height="145.836" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="16" y="348.28" fill="#000" font-size="15" textLength="159.272" font-weight="700" font-family="Helvetica">Main context window</text><text x="16" y="362.555" fill="#777" font-size="11" textLength="159.151" font-family="Helvetica">Fenêtre de contexte principale</text><text x="16" y="379.739" fill="#000" font-size="15" textLength="401.836" font-family="Helvetica">Every tool call, file read and search result is stored there</text><text x="16" y="394.014" fill="#777" font-size="11" textLength="470.202" font-family="Helvetica">Chaque appel d'outil, chaque lecture de fichier, chaque résultat de recherche y est stocké</text><text x="16" y="411.198" fill="#000" font-size="15" textLength="586.663" font-family="Helvetica">Finite: once it fills up, Claude starts losing track of earlier parts of the conversation</text><text x="16" y="425.473" fill="#777" font-size="11" textLength="607.857" font-family="Helvetica">Limitée : une fois qu'elle est pleine, Claude commence à perdre de vue les parties plus anciennes de la conversation</text><text x="16" y="442.657" fill="#000" font-size="15" textLength="537.246" font-family="Helvetica">With a subagent, it only records your question and the subagent's summary</text><text x="16" y="456.932" fill="#777" font-size="11" textLength="442.702" font-family="Helvetica">Avec un sous-agent, elle n'enregistre que votre question et le résumé du sous-agent</text></g><!--entity BI--><g class="entity" data-qualified-name="BI" id="ent0003" data-source-line="22"><rect x="652" y="308.249" width="463.716" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="662" y="332.78" fill="#000" font-size="15" textLength="136.963" font-weight="700" font-family="Helvetica">Built-in subagents</text><text x="662" y="347.055" fill="#777" font-size="11" textLength="111.638" font-family="Helvetica">Sous-agents intégrés</text><text x="662" y="364.239" fill="#000" font-size="15" textLength="330.19" font-family="Helvetica">Several, ready to use right away, among them:</text><text x="662" y="378.514" fill="#777" font-size="11" textLength="210.251" font-family="Helvetica">Plusieurs, utilisables tout de suite, dont :</text><text x="662" y="395.698" fill="#000" font-size="15" textLength="443.716" font-family="Helvetica">General purpose: multi-step tasks, both exploration and action</text><text x="662" y="409.973" fill="#777" font-size="11" textLength="408.799" font-family="Helvetica">À usage général : les tâches en plusieurs étapes, à la fois exploration et action</text><text x="662" y="427.157" fill="#000" font-size="15" textLength="372.268" font-family="Helvetica">Explore: fast searching and navigation of codebases</text><text x="662" y="441.432" fill="#777" font-size="11" textLength="358.596" font-family="Helvetica">Explore : la recherche rapide et la navigation dans les bases de code</text><text x="662" y="458.616" fill="#000" font-size="15" textLength="419.465" font-family="Helvetica">Plan: research and analysis of your codebase in plan mode</text><text x="662" y="472.891" fill="#777" font-size="11" textLength="307.098" font-family="Helvetica">Plan : étudier et analyser votre base de code en mode Plan</text></g><!--entity CS--><g class="entity" data-qualified-name="CS" id="ent0004" data-source-line="23"><rect x="1134.5" y="308.249" width="482.634" height="177.295" fill="#E8E2D0" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1144.5" y="332.78" fill="#000" font-size="15" textLength="131.675" font-weight="700" font-family="Helvetica">Custom subagent</text><text x="1144.5" y="347.055" fill="#777" font-size="11" textLength="130.33" font-family="Helvetica">Sous-agent personnalisé</text><text x="1144.5" y="364.239" fill="#000" font-size="15" textLength="402.371" font-family="Helvetica">Your own, with a custom system prompt and tool access</text><text x="1144.5" y="378.514" fill="#777" font-size="11" textLength="462.634" font-family="Helvetica">Le vôtre, avec un prompt système personnalisé et l'accès aux outils que vous choisissez</text><text x="1144.5" y="395.698" fill="#000" font-size="15" textLength="297.627" font-family="Helvetica">Easiest: ask Claude to write its file for you</text><text x="1144.5" y="409.973" fill="#777" font-size="11" textLength="342.81" font-family="Helvetica">Le plus simple : demander à Claude d'écrire son fichier pour vous</text><text x="1144.5" y="427.157" fill="#000" font-size="15" textLength="286.172" font-family="Helvetica">.claude/agents/: the current project only</text><text x="1144.5" y="441.432" fill="#777" font-size="11" textLength="246.512" font-family="Helvetica">.claude/agents/ : le projet en cours uniquement</text><text x="1144.5" y="458.616" fill="#000" font-size="15" textLength="399.126" font-family="Helvetica">.claude/agents/ in your home directory: all your projects</text><text x="1144.5" y="472.891" fill="#777" font-size="11" textLength="341.978" font-family="Helvetica">.claude/agents/ dans votre répertoire personnel : tous vos projets</text></g><!--entity CF--><g class="entity" data-qualified-name="CF" id="ent0005" data-source-line="24"><rect x="1140.5" y="521.249" width="471.018" height="145.836" fill="#D9E4D3" style="stroke:#FFF;stroke-width:0.5;" rx="6" ry="6"/><text x="1150.5" y="545.78" fill="#000" font-size="15" textLength="151.56" font-weight="700" font-family="Helvetica">Subagent config file</text><text x="1150.5" y="560.055" fill="#777" font-size="11" textLength="211.97" font-family="Helvetica">Fichier de configuration d'un sous-agent</text><text x="1150.5" y="577.239" fill="#000" font-size="15" textLength="280.239" font-family="Helvetica">A markdown file with YAML frontmatter</text><text x="1150.5" y="591.514" fill="#777" font-size="11" textLength="248.854" font-family="Helvetica">Un fichier Markdown avec un frontmatter YAML</text><text x="1150.5" y="608.698" fill="#000" font-size="15" textLength="451.018" font-family="Helvetica">Fields of a typical config: name, description, tools, model, color</text><text x="1150.5" y="622.973" fill="#777" font-size="11" textLength="379.543" font-family="Helvetica">Champs d'une configuration type : name, description, tools, model, color</text><text x="1150.5" y="640.157" fill="#000" font-size="15" textLength="376.809" font-family="Helvetica">Its body, below the frontmatter, is the system prompt</text><text x="1150.5" y="654.432" fill="#777" font-size="11" textLength="279.984" font-family="Helvetica">Son corps, sous le frontmatter, est le prompt système</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="499.072,323.676,508.915,324.026,503.711,321.809,505.928,316.605,499.072,323.676" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M626.757,272.285 C583.614,289.649 544.33,305.46 503.711,321.809" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="884,307.977,888,298.977,884,302.977,880,298.977,884,307.977" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M884,272.285 C884,284.212 884,291.287 884,302.977" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="1186.136,308.149,1179.64,300.747,1181.596,306.054,1176.288,308.011,1186.136,308.149" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1108.404,272.285 C1134.381,284.27 1156.142,294.31 1181.596,306.054" style="stroke:#555;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="1376,521.007,1380,512.007,1376,516.007,1372,512.007,1376,521.007" fill="#555" style="stroke:#555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1376,485.491 C1376,497.368 1376,504.443 1376,516.007" style="stroke:#555;stroke-width:1;" fill="none"/></g><?plantuml-src ZLVVRnj547xtNp6G1qFafAHG5KmLAN6QKga1HAWg95usTsDxoTxkTNVFhekG-5CGJpNF_0VtZ_7DtlbNx4FDG-BuTcU-cVdccxa-_SGsPyyvpNMSqez6sVZwvjM0Gi5HMKL6BLmLwJFhw8LNvNIctvDbpZd__BJtIUdLf5WVQk_qUk5Usr9vLL3EOrMPUEri_5uLJD-ncN7KcTew4wOgTtDj9pHM9l3M4-ygcu-Sj-pfxF7MWmlltNpaZFDqz2JzRD_Y330cXkdt7j6bymYmFNkTVl2j0BhLxvdEdlJ-w3qBSM7ulBTxyqPRNLJ56vqZCu-__48EFcfFzgAEE7PRtQa9snX-jSy2p0tFpiwVPU9hUFJqwTFpLnmek2gSDAUUFKhFpc46Xs5bu_3Ju-ELiUFZ3cktQqiF3FrgBoYKd6bby6zEAWGTO3ZIoAWgPnev_CgKHJqCJrHaYYhS1ugkmzLhksKabFKosGxrabJrjcApOxXa53-lbwPUJYgKAaVKiVuxctBO0_fJPGDfIpe6SdDBcRCpza55xT8_aTz5SD624LrPwFCxuAaGHAvWB2WglIizqvXj_K
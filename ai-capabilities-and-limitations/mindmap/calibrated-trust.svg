<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="510px" preserveAspectRatio="none" style="width:1276px;height:510px;background:#FFFFFF;" version="1.1" viewBox="0 0 1276 510" width="1276px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="491.5" y="20.7803">Calibrated Trust: a Habit, not an Attitude</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="302" x="479.5" y="33.2402">La confiance calibr&#233;e : une habitude, pas une attitude</text><!--cluster AI--><g id="cluster_AI"><rect fill="#F9F8F4" height="283" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="266" x="14" y="128"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="91" x="101.5" y="141.5503">AI properties</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="90" x="102" y="153.4702">Propri&#233;t&#233;s de l'IA</text></g><!--cluster CHECK--><g id="cluster_CHECK"><rect fill="#F9F8F4" height="363" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="294" x="300" y="125"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="237" x="328.5" y="138.5503">Check, before you hand it to an AI</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201" x="346.5" y="150.4702">V&#233;rifier, avant de confier la t&#226;che &#224; l'IA</text></g><!--cluster ADJUST--><g id="cluster_ADJUST"><rect fill="#F9F8F4" height="429" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="325" x="614" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="82" x="735.5" y="72.5503">Then adjust</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="62" x="745.5" y="84.4702">Puis ajuster</text></g><!--entity CT--><g id="elem_CT"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="303" x="967" y="432"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="109" x="977" y="453.5503">Calibrated trust</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="90" x="977" y="465.4702">Confiance calibr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="283" x="977" y="479.5503">Locate the task, set your habits accordingly</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="267" x="977" y="491.4702">Situer la t&#226;che, adapter ses habitudes en cons&#233;quence</text></g><!--entity NTP--><g id="elem_NTP"><rect fill="#CFCBDD" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="165"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="138" x="32" y="186.5503">Next token prediction</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="131" x="32" y="198.4702">Pr&#233;diction du token suivant</text></g><!--entity KN--><g id="elem_KN"><rect fill="#CFCBDD" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="229"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="72" x="32" y="250.5503">Knowledge</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="76" x="32" y="262.4702">Connaissances</text></g><!--entity WM--><g id="elem_WM"><rect fill="#CFCBDD" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="293"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="111" x="32" y="314.5503">Working memory</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89" x="32" y="326.4702">M&#233;moire de travail</text></g><!--entity ST--><g id="elem_ST"><rect fill="#CFCBDD" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="22" y="357"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="72" x="32" y="378.5503">Steerability</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="47" x="32" y="390.4702">Pilotabilit&#233;</text></g><!--entity Q1--><g id="elem_Q1"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="322" y="162"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="193" x="332" y="183.5503">Well-worn territory or sparse?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="162" x="332" y="195.4702">Terrain connu ou peu fr&#233;quent&#233; ?</text></g><!--entity Q2--><g id="elem_Q2"><rect fill="#EEEEEE" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="322" y="226"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="149" x="332" y="247.5503">Topic recent or stable?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="114" x="332" y="259.4702">Sujet r&#233;cent ou stable ?</text></g><!--entity Q3--><g id="elem_Q3"><rect fill="#EEEEEE" height="57" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="278" x="308" y="290.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="258" x="318" y="312.0503">Material comfortably inside the window?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="318" y="323.9702">Le contenu tient-il largement</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="141" x="318" y="334.9702">dans la fen&#234;tre de contexte ?</text></g><!--entity Q4--><g id="elem_Q4"><rect fill="#EEEEEE" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="322" y="366"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="195" x="332" y="387.5503">Instructions concrete, or room</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="222" x="332" y="402.5503">between my words and my intent?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="170" x="332" y="414.4702">Instructions concr&#232;tes, ou un &#233;cart</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="164" x="332" y="425.4702">entre mes mots et mon intention ?</text></g><!--entity A1--><g id="elem_A1"><rect fill="#E3E9E6" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="651.5" y="96"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="111" x="661.5" y="117.5503">More verification,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="220" x="661.5" y="132.5503">where fabrication can concentrate</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="94" x="661.5" y="144.4702">Plus de v&#233;rification,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="168" x="661.5" y="155.4702">l&#224; o&#249; les inventions se concentrent</text></g><!--entity A2--><g id="elem_A2"><rect fill="#E3E9E6" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="309" x="622" y="186"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="89" x="632" y="207.5503">More context,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="289" x="632" y="222.5503">where the model can't guess what you mean</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="159" x="632" y="234.4702">Plus de contexte, l&#224; o&#249; le mod&#232;le</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="215" x="632" y="245.4702">ne peut pas deviner ce que vous voulez dire</text></g><!--entity A3--><g id="elem_A3"><rect fill="#E3E9E6" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="651.5" y="276"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="120" x="661.5" y="297.5503">More checkpoints,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="230" x="661.5" y="312.5503">when reasoning chains run too long</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="178" x="661.5" y="324.4702">Plus de points de contr&#244;le, quand les</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="199" x="661.5" y="335.4702">cha&#238;nes de raisonnement s'allongent trop</text></g><!--entity A4--><g id="elem_A4"><rect fill="#E3E9E6" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="651.5" y="366"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="134" x="661.5" y="387.5503">Features that extend</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="150" x="661.5" y="402.5503">the models' capabilities</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="154" x="661.5" y="414.4702">Des fonctionnalit&#233;s qui &#233;tendent</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="129" x="661.5" y="425.4702">les capacit&#233;s des mod&#232;les</text></g><polygon fill="#555555" points="321.9803,186.2485,312.9405,182.3393,316.9805,186.2989,313.021,190.3389,321.9803,186.2485" style="stroke:#555555;stroke-width:1.0;"/><path d="M272.221,186.7495 C288.6703,186.5839 299.5346,186.4745 315.9806,186.3089 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="321.9803,250.2485,312.9405,246.3393,316.9805,250.2989,313.021,254.3389,321.9803,250.2485" style="stroke:#555555;stroke-width:1.0;"/><path d="M272.221,250.7495 C288.6703,250.5839 299.5346,250.4745 315.9806,250.3089 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="307.5242,317.6059,298.5649,313.5156,302.5244,317.5556,298.4844,321.5151,307.5242,317.6059" style="stroke:#555555;stroke-width:1.0;"/><path d="M272.221,317.2505 C283.8793,317.3679 289.7461,317.427 301.5245,317.5455 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="321.9803,392.8442,313.2992,388.1924,316.9938,392.4761,312.7102,396.1707,321.9803,392.8442" style="stroke:#555555;stroke-width:1.0;"/><path d="M272.221,389.1707 C288.6703,390.3851 299.5506,391.1883 315.9965,392.4024 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="613.4799,468,604.4799,464,608.4799,468,604.4799,472,613.4799,468" style="stroke:#555555;stroke-width:1.0;"/><path d="M594.515,468 C595.0399,468 595.5652,468 596.0906,468 C597.1415,468 598.1932,468 599.2457,468 C603.4555,468 607.6764,468 611.8971,468 C612.4247,468 606.9523,468 607.4799,468 " fill=
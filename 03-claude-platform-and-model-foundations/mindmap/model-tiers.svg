<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="786px" preserveAspectRatio="none" style="width:528px;height:786px;background:#FFFFFF;" version="1.1" viewBox="0 0 528 786" width="528px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="121" x="200" y="20.7803">Choosing Models</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103" x="209" y="33.2402">Choisir un mod&#232;le</text><!--cluster RANGE--><g id="cluster_RANGE"><rect fill="#F9F8F4" height="463" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="421" x="92" y="165"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="336" x="134.5" y="178.5503">From efficient-and-fast to thorough-and-capable</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="405" x="100" y="190.4702">Des mod&#232;les rapides et &#233;conomiques aux mod&#232;les minutieux et performants</text></g><!--entity MT--><g id="elem_MT"><rect fill="#BCD3CB" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="322" x="6" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="77" x="16" y="80.5503">Model tiers</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="16" y="92.4702">Gammes de mod&#232;les</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="302" x="16" y="106.5503">How well Claude does it, at what cost in speed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="267" x="16" y="118.4702">Avec quelle qualit&#233; Claude le fait, &#224; quel co&#251;t en vitesse</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="160" x="16" y="132.5503">Match the tier to the task</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="138" x="16" y="144.4702">Adapter la gamme &#224; la t&#226;che</text></g><!--entity UC--><g id="elem_UC"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="350" x="172" y="656"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="131" x="182" y="677.5503">On usage and cost</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82" x="182" y="689.4702">Utilisation et co&#251;t</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="259" x="182" y="703.5503">Metered plans and the API: cost per call</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="193" x="182" y="715.4702">Forfaits &#224; l'usage et API : co&#251;t par appel</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="330" x="182" y="729.5503">claude.ai subscription: speed and usage headroom</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="252" x="182" y="741.4702">Abonnement claude.ai : vitesse et marge d'utilisation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="294" x="182" y="755.5503">Same decision logic, whatever tiers you have</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="284" x="182" y="767.4702">M&#234;me logique de d&#233;cision, quelles que soient vos gammes</text></g><!--entity HA--><g id="elem_HA"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="222" y="202"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="38" x="232" y="223.5503">Haiku</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="28" x="232" y="235.4702">Haiku</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="143" x="232" y="249.5503">Fastest, most efficient</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="167" x="232" y="261.4702">Le plus rapide, le plus &#233;conomique</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="227" x="232" y="275.5503">Routine, structured work at volume</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="190" x="232" y="287.4702">Travail routinier et structur&#233;, en volume</text></g><!--entity SO--><g id="elem_SO"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="256" x="219" y="336"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="46" x="229" y="357.5503">Sonnet</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="34" x="229" y="369.4702">Sonnet</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="112" x="229" y="383.5503">The balanced tier</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="100" x="229" y="395.4702">La gamme &#233;quilibr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="221" x="229" y="409.5503">Most drafting, synthesis, analysis:</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="139" x="229" y="424.5503">the right starting point</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="236" x="229" y="436.4702">La plupart des r&#233;dactions, synth&#232;ses, analyses :</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="229" y="447.4702">le bon point de d&#233;part</text></g><!--entity OP--><g id="elem_OP"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="222" y="496"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="36" x="232" y="517.5503">Opus</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="27" x="232" y="529.4702">Opus</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="159" x="232" y="543.5503">Higher capability, slower</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="232" y="555.4702">Plus performant, plus lent</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="208" x="232" y="569.5503">Complex judgment, high stakes,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="114" x="232" y="584.5503">ambiguous inputs</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152" x="232" y="596.4702">Jugement complexe, fort enjeu,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="134" x="232" y="607.4702">donn&#233;es d'entr&#233;e ambigu&#235;s</text></g><polygon fill="#555555" points="167,164.7696,171,155.7696,167,159.7696,163,155.7696,167,164.7696" style="stroke:#555555;stroke-width:1.0;"/><path d="M167,157.1298 C167,158.9548 167,160.802 167,162.6659 C167,163.1319 167,163.5989 167,164.0669 C167,164.30
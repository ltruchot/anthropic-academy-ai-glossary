<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="626px" preserveAspectRatio="none" style="width:799px;height:626px;background:#FFFFFF;" version="1.1" viewBox="0 0 799 626" width="799px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="121" x="331.5" y="20.7803">Choosing Models</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103" x="340.5" y="33.2402">Choisir un mod&#232;le</text><!--cluster RANGE--><g id="cluster_RANGE"><rect fill="#F9F8F4" height="463" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="421" x="14" y="157"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="336" x="56.5" y="170.5503">From efficient-and-fast to thorough-and-capable</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="405" x="22" y="182.4702">Des mod&#232;les rapides et &#233;conomiques aux mod&#232;les minutieux et performants</text></g><!--entity MT--><g id="elem_MT"><rect fill="#BCD3CB" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="322" x="258" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="77" x="268" y="72.5503">Model tiers</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="268" y="84.4702">Gammes de mod&#232;les</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="302" x="268" y="98.5503">How well Claude does it, at what cost in speed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="267" x="268" y="110.4702">Avec quelle qualit&#233; Claude le fait, &#224; quel co&#251;t en vitesse</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="160" x="268" y="124.5503">Match the tier to the task</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="138" x="268" y="136.4702">Adapter la gamme &#224; la t&#226;che</text></g><!--entity UC--><g id="elem_UC"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="350" x="443" y="328"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="131" x="453" y="349.5503">On usage and cost</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="82" x="453" y="361.4702">Utilisation et co&#251;t</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="259" x="453" y="375.5503">Metered plans and the API: cost per call</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="193" x="453" y="387.4702">Forfaits &#224; l'usage et API : co&#251;t par appel</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="330" x="453" y="401.5503">claude.ai subscription: speed and usage headroom</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="252" x="453" y="413.4702">Abonnement claude.ai : vitesse et marge d'utilisation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="294" x="453" y="427.5503">Same decision logic, whatever tiers you have</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="284" x="453" y="439.4702">M&#234;me logique de d&#233;cision, quelles que soient vos gammes</text></g><!--entity HA--><g id="elem_HA"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="84" y="194"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="38" x="94" y="215.5503">Haiku</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="28" x="94" y="227.4702">Haiku</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="143" x="94" y="241.5503">Fastest, most efficient</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="167" x="94" y="253.4702">Le plus rapide, le plus &#233;conomique</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="227" x="94" y="267.5503">Routine, structured work at volume</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="190" x="94" y="279.4702">Travail routinier et structur&#233;, en volume</text></g><!--entity SO--><g id="elem_SO"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="256" x="81" y="328"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="46" x="91" y="349.5503">Sonnet</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="34" x="91" y="361.4702">Sonnet</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="112" x="91" y="375.5503">The balanced tier</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="100" x="91" y="387.4702">La gamme &#233;quilibr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="221" x="91" y="401.5503">Most drafting, synthesis, analysis:</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="139" x="91" y="416.5503">the right starting point</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="236" x="91" y="428.4702">La plupart des r&#233;dactions, synth&#232;ses, analyses :</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="104" x="91" y="439.4702">le bon point de d&#233;part</text></g><!--entity OP--><g id="elem_OP"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="84" y="488"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="36" x="94" y="509.5503">Opus</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="27" x="94" y="521.4702">Opus</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="159" x="94" y="535.5503">Higher capability, slower</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="94" y="547.4702">Plus performant, plus lent</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="208" x="94" y="561.5503">Complex judgment, high stakes,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="114" x="94" y="576.5503">ambiguous inputs</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152" x="94" y="588.4702">Jugement complexe, fort enjeu,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="134" x="94" y="599.4702">donn&#233;es d'entr&#233;e ambigu&#235;s</text></g><polygon fill="#555555" points="419,156.7696,423,147.7696,419,151.7696,415,147.7696,419,156.7696" style="stroke:#555555;stroke-width:1.0;"/><path d="M419,149.1298 C419,150.9548 419,152.802 419,154.6659 C419,155.1319 419,155.5989 419,156.0669 C419,156.3009 419,150.5351 
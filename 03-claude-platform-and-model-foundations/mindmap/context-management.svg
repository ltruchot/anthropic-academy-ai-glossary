<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="950px" preserveAspectRatio="none" style="width:704px;height:950px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 950" width="704px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="146" x="275.5" y="20.7803">Context Management</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="114" x="291.5" y="33.2402">Gestion du contexte</text><!--cluster TR--><g id="cluster_TR"><rect fill="#F9F8F4" height="385" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="340" x="147.5" y="433"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="284" x="175.5" y="446.5503">Three responses when context degrades</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238" x="198.5" y="458.4702">Trois r&#233;ponses quand le contexte se d&#233;grade</text></g><!--entity CM--><g id="elem_CM"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="328" x="176.5" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="149" x="186.5" y="80.5503">Context management</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="98" x="186.5" y="92.4702">Gestion du contexte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="186.5" y="106.5503">How long Claude can do it well</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="308" x="186.5" y="118.4702">Pendant combien de temps Claude peut continuer &#224; bien le faire</text></g><!--entity CW--><g id="elem_CW"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="315" x="6" y="167"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="114" x="16" y="188.5503">Context window</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="98" x="16" y="200.4702">Fen&#234;tre de contexte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="295" x="16" y="214.5503">Fills with messages and uploaded documents</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="246" x="16" y="226.4702">Se remplit de messages et de documents import&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="289" x="16" y="240.5503">Near the limit: earlier messages summarized</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="240" x="16" y="252.4702">Pr&#232;s de la limite : messages pr&#233;c&#233;dents r&#233;sum&#233;s</text></g><!--entity SI--><g id="elem_SI"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="301" x="13" y="301"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="281" x="23" y="322.5503">Signs a conversation needs intervention</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="23" y="334.4702">Signes qu'il faut intervenir</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="242" x="23" y="348.5503">Earlier instructions no longer followed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="227" x="23" y="360.4702">Des instructions suivies plus t&#244;t ne le sont plus</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="277" x="23" y="374.5503">Only the most recent exchange addressed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="207" x="23" y="386.4702">Seul le dernier &#233;change est pris en compte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="104" x="23" y="400.5503">Accuracy drops</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="93" x="23" y="412.4702">L'exactitude baisse</text></g><!--entity MC--><g id="elem_MC"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="291" x="177" y="846"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="118" x="187" y="867.5503">Memory curation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="114" x="187" y="879.4702">Entretien de la m&#233;moire</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="237" x="187" y="893.5503">A working file: review, delete, update</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="271" x="187" y="905.4702">Un document de travail : revoir, supprimer, mettre &#224; jour</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="147" x="187" y="919.5503">Accuracy over volume</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137" x="187" y="931.4702">L'exactitude avant le volume</text></g><!--entity UL--><g id="elem_UL"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="359" x="339" y="167"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="86" x="349" y="188.5503">Usage limits</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89" x="349" y="200.4702">Limites d'utilisation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="192" x="349" y="214.5503">Session and weekly windows</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="190" x="349" y="226.4702">Fen&#234;tres de session et hebdomadaires</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="339" x="349" y="240.5503">Segments, interim progress, restart from a summary</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="257" x="349" y="252.4702">&#201;tapes, r&#233;sultats interm&#233;diaires, repartir d'un r&#233;sum&#233;</text></g><!--entity RS--><g id="elem_RS"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="289" x="190" y="470"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="48" x="200" y="491.5503">Restart</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72" x="200" y="503.4702">Repartir &#224; neuf</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="133" x="200" y="517.5503">A new conversation:</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="269" x="200" y="532.5503">the Project carries forward, not the thread</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="135" x="200" y="544.4702">Une nouvelle conversation :</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="132" x="200" y="555.4702">le projet est repris, pas le fil</text></g><!--entity SU--><g id="elem_SU"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="313" x="166" y="604"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="74" x="176" y="625.5503">Summarize</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="45" x="176" y="637.4702">R&#233;sumer</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="293" x="176" y="651.5503">Decisions, work in progress, open questions,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="214" x="176" y="666.5503">pasted into the new conversation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="245" x="176" y="678.4702">D&#233;cisions, travail en cours, questions en suspens,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="175" x="176" y="689.4702">coll&#233;s dans la nouvelle conversation</text></g><!--entity PE--><g id="elem_PE"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="274" x="185.5" y="738"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="46" x="195.5" y="759.5503">Persist</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="53" x="195.5" y="771.4702">P&#233;renniser</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="254" x="195.5" y="785.5503">Memory or the Project knowledge base</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="247" x="195.5" y="797.4702">La m&#233;moire ou la base de connaissances du projet</text></g><polygon fill="#555555" points="234.9506,166.9626,244.6513,165.2606,239.1,164.1729,240.1878,158.6216,234.9506,166.9626" style="stroke:#555555;stroke-width:1.0;"/><path d="M288.3515,131.0603 C271.6278,142.3039 257.7872,151.6092 239.9299,163.6149 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="163.5,300.7729,167.5,291.7729,163.5,295.7729,159.5,291.7729,163.5,300.7729" style="stroke:#555555;stroke-width:1.0;"/><path d="M163.5,265.2829 C163.5,276.6519 163.5,282.9185 163.5,294.7729 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="163.5,432.8792,167.5,423.8792,163.5,427.8792,159.5,423.8792,163.5,432.8792" style="stroke:#555555;stroke-width:1.0;"/><path d="M163.5,425.3074 C163.5,427.2156 163.5,429.1373 163.5,431.0674 C163.5,431.5499 163.5,432.033 163.5,432.5165 C163.5,432.6374 163.5,426.7583 163.5,426.8792 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="322.5,845.9626,326.5,836.9626,322.5,840.9626,318.5,836.9626,322.5,845.9626" style="stroke:#555555;stroke-width:1.0;"/><path d="M322.5,810.0603 C322.5,821.3039 322.5,827.9568 322.5,839.9626 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="446.6457,166.9626,441.3868,158.6353,442.4891,164.1837,436.9406,165.2859,446.6457,166.9626" style="stroke:#555555;stroke-width:1.0;"/><path d="M392.9431,131.0603 C409.7613,142.3039 423.6995,151.6222 441.6577,163.6279 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[bLRTJXj75BxVfpWD5xJ89e4qIceXf60WYGGfmg1Sb5uCkyVsmEpCCZzsI9K7w5lqilIwR-0NwpUpjldnRfiY8TdZEN_V-SvtPfrEMHTiUtGb9eAwLy9IfOJseLIRyKlNkyc8SgCzV_RTKcWnufArtwnmWxvt9NkSzKWRUcT5DPx8BwIP2ov-sCo-gwmObOAKk3N1q_nobhbhgIjXHKa53qLG_X3-FugIwJsh2NkPYmTtt5WKPYhrY8P2ENxmYpL15trZDLlQsdxmmrjhpRHlbB6qzYhzFRJY76cC5DDl6T6UiQX_VlSm_U4q9ZIGNvYsNcLVintdRnNlPeyjZwMMPIW_oSAFQVlbYtZn-VncvgN7jNwD6nqlSRlGEmv-UrlRkpjv3DfRU_twzUuxTbuQJKLOOCqxpzFlk_090xYyZ_viOsFX-RuZ6njBtrl_q_U5Vc-cf0mWxYiH2gPSuBuXwMdAIhKuFW5rG1LuBIybmu39SrcvXPEAWqyXfGxeqE
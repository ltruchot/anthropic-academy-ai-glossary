<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="950px" preserveAspectRatio="none" style="width:727px;height:950px;background:#FFFFFF;" version="1.1" viewBox="0 0 727 950" width="727px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="146" x="283.25" y="20.7803">Context Management</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="114" x="299.25" y="33.2402">Gestion du contexte</text><!--cluster TR--><g id="cluster_TR"><rect fill="#F9F8F4" height="385" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="340" x="14" y="433"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="284" x="42" y="446.5503">Three responses when context degrades</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238" x="65" y="458.4702">Trois r&#233;ponses quand le contexte se d&#233;grade</text></g><!--entity CM--><g id="elem_CM"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="328" x="174" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="149" x="184" y="80.5503">Context management</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="98" x="184" y="92.4702">Gestion du contexte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="184" y="106.5503">How long Claude can do it well</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="308" x="184" y="118.4702">Pendant combien de temps Claude peut continuer &#224; bien le faire</text></g><!--entity CW--><g id="elem_CW"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="315" x="180.5" y="167"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="114" x="190.5" y="188.5503">Context window</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="98" x="190.5" y="200.4702">Fen&#234;tre de contexte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="295" x="190.5" y="214.5503">Fills with messages and uploaded documents</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="246" x="190.5" y="226.4702">Se remplit de messages et de documents import&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="289" x="190.5" y="240.5503">Near the limit: earlier messages summarized</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="240" x="190.5" y="252.4702">Pr&#232;s de la limite : messages pr&#233;c&#233;dents r&#233;sum&#233;s</text></g><!--entity SI--><g id="elem_SI"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="301" x="187.5" y="301"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="281" x="197.5" y="322.5503">Signs a conversation needs intervention</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="197.5" y="334.4702">Signes qu'il faut intervenir</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="242" x="197.5" y="348.5503">Earlier instructions no longer followed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="227" x="197.5" y="360.4702">Des instructions suivies plus t&#244;t ne le sont plus</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="277" x="197.5" y="374.5503">Only the most recent exchange addressed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="207" x="197.5" y="386.4702">Seul le dernier &#233;change est pris en compte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="104" x="197.5" y="400.5503">Accuracy drops</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="93" x="197.5" y="412.4702">L'exactitude baisse</text></g><!--entity MC--><g id="elem_MC"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="291" x="33.5" y="846"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="118" x="43.5" y="867.5503">Memory curation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="114" x="43.5" y="879.4702">Entretien de la m&#233;moire</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="237" x="43.5" y="893.5503">A working file: review, delete, update</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="271" x="43.5" y="905.4702">Un document de travail : revoir, supprimer, mettre &#224; jour</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="147" x="43.5" y="919.5503">Accuracy over volume</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137" x="43.5" y="931.4702">L'exactitude avant le volume</text></g><!--entity UL--><g id="elem_UL"><rect fill="#E8E2D0" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="359" x="362.5" y="604"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="86" x="372.5" y="625.5503">Usage limits</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="89" x="372.5" y="637.4702">Limites d'utilisation</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="192" x="372.5" y="651.5503">Session and weekly windows</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="190" x="372.5" y="663.4702">Fen&#234;tres de session et hebdomadaires</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="339" x="372.5" y="677.5503">Segments, interim progress, restart from a summary</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="257" x="372.5" y="689.4702">&#201;tapes, r&#233;sultats interm&#233;diaires, repartir d'un r&#233;sum&#233;</text></g><!--entity RS--><g id="elem_RS"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="289" x="22.5" y="470"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="48" x="32.5" y="491.5503">Restart</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72" x="32.5" y="503.4702">Repartir &#224; neuf</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="133" x="32.5" y="517.5503">A new conversation:</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="269" x="32.5" y="532.5503">the Project carries forward, not the thread</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="135" x="32.5" y="544.4702">Une nouvelle conversation :</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="132" x="32.5" y="555.4702">le projet est repris, pas le fil</text></g><!--entity SU--><g id="elem_SU"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="313" x="22.5" y="604"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="74" x="32.5" y="625.5503">Summarize</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="45" x="32.5" y="637.4702">R&#233;sumer</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="293" x="32.5" y="651.5503">Decisions, work in progress, open questions,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="214" x="32.5" y="666.5503">pasted into the new conversation</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="245" x="32.5" y="678.4702">D&#233;cisions, travail en cours, questions en suspens,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="175" x="32.5" y="689.4702">coll&#233;s dans la nouvelle conversation</text></g><!--entity PE--><g id="elem_PE"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="274" x="42" y="738"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="46" x="52" y="759.5503">Persist</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="53" x="52" y="771.4702">P&#233;renniser</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="254" x="52" y="785.5503">Memory or the Project knowledge base</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="247" x="52" y="797.4702">La m&#233;moire ou la base de connaissances du projet</text></g><polygon fill="#555555" points="338,166.9626,342,157.9626,338,161.9626,334,157.9626,338,166.9626" style="stroke:#555555;stroke-width:1.0;"/><path d="M338,131.0603 C338,142.3039 338,148.9568 338,160.9626 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="338,300.7729,342,291.7729,338,295.7729,334,291.7729,338,300.7729" style="stroke:#555555;stroke-width:1.0;"/><path d="M338,265.2829 C338,276.6519 338,282.9185 338,294.7729 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="338,432.8792,342,423.8792,338,427.8792,334,423.8792,338,432.8792" style="stroke:#555555;stroke-width:1.0;"/><path d="M338,425.3074 C338,427.2156 338,429.1373 338,431.0674 C338,431.5499 338,432.033 338,432.5165 C338,432.6374 338,426.7583 338,426.8792 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="179,845.9626,183,836.9626,179,840.9626,175,836.9626,179,845.9626" style="stroke:#555555;stroke-width:1.0;"/><path d="M179,810.0603 C179,821.3039 179,827.9568 179,839.9626 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="467.6705,603.9044,462.2873,595.6569,463.4726,601.1882,457.9413,602.3734,467.6705,603.9044" style="stroke:#555555;stroke-width:1.0;"/><path d="M354.1233,530.4327 C354.5514,530.7097 354.9867,530.9914 355.4291,531.2776 C358.968,533.5675 362.9583,536.1495 367.3173,538.97 C376.0351,544.6109 386.2271,551.2058 397.23,558.3253 C419.2358,572.5643 439.4475,585.6425 462.633,600.6449 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[bLRTJXj75BxVfpWD5xJ89e4qIceXf60WYGGfmg1Sb5uCkyVsmEpCCZzsI9K7w5lqilIwR-0NwpUpjldnRfjQihHUp_dxpdU-C-jqohfWswChCH7KlHAMAYMq3wNQZ3-wtar6b1lj-RFlbaAB4PUi_MQ54_IzAzdZNO-qeNTMLEE9_4AQkU3YXytikygAKIb8YLiJFCqFPvcxbheILfHKy504vG_X_wCecTwpch2NkNXmner5OQPIZsWebEC7_rWJTD4tLhEbhUq7VxorrapxHXbBQw_Ivw4LvqXZf9X-ouZsZ4NzyxE7wOEtCQ61_CAqzIhxckquVwjuDtjiUIorB4FvIHP-JDilNyI3p-SdCoyzZlLhtEXuYTk5td7mszlQtjt9Oz3UsklNhtVViVFIQ2h
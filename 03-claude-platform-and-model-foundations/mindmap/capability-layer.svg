<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="868px" preserveAspectRatio="none" style="width:758px;height:868px;background:#FFFFFF;" version="1.1" viewBox="0 0 758 868" width="758px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111" x="320.25" y="20.7803">Capability Layer</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="163" x="294.25" y="33.2402">La couche de fonctionnalit&#233;s</text><!--cluster FL--><g id="cluster_FL"><rect fill="#F9F8F4" height="545" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="300" x="132.5" y="139"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="119" x="223" y="152.5503">Four-layer model</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132" x="216.5" y="164.4702">Mod&#232;le &#224; quatre couches</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="212" x="176.5" y="178.5503">Independent: any combination</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189" x="188" y="190.4702">Ind&#233;pendantes : toute combinaison</text><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="215" x="175" y="204.5503">A one-off question needs none</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="250" x="157.5" y="216.4702">Une question ponctuelle n'en demande aucune</text></g><!--entity CL--><g id="elem_CL"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="285" x="6" y="59"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="108" x="16" y="80.5503">Capability layer</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125" x="16" y="92.4702">Couche de fonctionnalit&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="265" x="16" y="106.5503">What Claude can do within an entry point</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="249" x="16" y="118.4702">Ce que Claude peut faire au sein d'un point d'entr&#233;e</text></g><!--entity SKD--><g id="elem_SKD"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="272" x="442.5" y="418"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="38" x="452.5" y="439.5503">Skills</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="25" x="452.5" y="451.4702">Skills</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="247" x="452.5" y="465.5503">Built-in or custom, at the account level</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="233" x="452.5" y="477.4702">Int&#233;gr&#233;s ou personnalis&#233;s, au niveau du compte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="236" x="452.5" y="491.5503">Invoked automatically when relevant</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="252" x="452.5" y="503.4702">Invoqu&#233;s automatiquement quand ils sont pertinents</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="244" x="452.5" y="517.5503">Trust evaluation: source, permissions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="206" x="452.5" y="529.4702">&#201;valuer la confiance : source, permissions</text></g><!--entity CED--><g id="elem_CED"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="312" x="440.5" y="578"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="111" x="450.5" y="599.5503">Code Execution</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="90" x="450.5" y="611.4702">Ex&#233;cution de code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="292" x="450.5" y="625.5503">Sandboxed: Claude writes and runs the code</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="188" x="450.5" y="637.4702">Isol&#233;e : Claude &#233;crit et ex&#233;cute le code</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="266" x="450.5" y="651.5503">Numbers used or reported, data to clean,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="176" x="450.5" y="666.5503">a chart, a downloadable file</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="263" x="450.5" y="678.4702">Chiffres utilis&#233;s ou communiqu&#233;s, donn&#233;es &#224; nettoyer,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="187" x="450.5" y="689.4702">un graphique, un fichier t&#233;l&#233;chargeable</text></g><!--entity MED--><g id="elem_MED"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="259" x="162" y="738"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="56" x="172" y="759.5503">Memory</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="42" x="172" y="771.4702">M&#233;moire</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="225" x="172" y="785.5503">Curated: reviewed at least monthly</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="223" x="172" y="797.4702">Entretenue : revue au moins une fois par mois</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="239" x="172" y="811.5503">Project-scoped: separate per Project</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="111" x="172" y="823.4702">Propre &#224; chaque projet</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="234" x="172" y="837.5503">Incognito mode keeps a session out</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="229" x="172" y="849.4702">Le mode incognito en tient une session &#224; l'&#233;cart</text></g><!--entity PR--><g id="elem_PR"><rect fill="#E8E2D0" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="174.5" y="228"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="144" x="184.5" y="249.5503">Projects carry context</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="147" x="184.5" y="261.4702">Les projets portent le contexte</text></g><!--entity SK--><g id="elem_SK"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="174.5" y="310"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="156" x="184.5" y="331.5503">Skills define procedures</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="177" x="184.5" y="343.4702">Les Skills d&#233;finissent les proc&#233;dures</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="157" x="184.5" y="357.5503">Consistently, every time</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="166" x="184.5" y="369.4702">De fa&#231;on constante, &#224; chaque fois</text></g><!--entity CE--><g id="elem_CE"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="266" x="158.5" y="444"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="246" x="168.5" y="465.5503">Code Execution verifies computations</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="183" x="168.5" y="477.4702">L'ex&#233;cution de code v&#233;rifie les calculs</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="186" x="168.5" y="491.5503">Correct, not merely plausible</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="161" x="168.5" y="503.4702">Juste, et pas seulement plausible</text></g><!--entity ME--><g id="elem_ME"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="166.5" y="604"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="175" x="176.5" y="625.5503">Memory persists continuity</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="154" x="176.5" y="637.4702">La m&#233;moire assure la continuit&#233;</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="219" x="176.5" y="651.5503">Across sessions, without re-entry</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="187" x="176.5" y="663.4702">D'une session &#224; l'autre, sans ressaisie</text></g><polygon fill="#555555" points="148.5,138.8592,152.5,129.8592,148.5,133.8592,144.5,129.8592,148.5,138.8592" style="stroke:#555555;stroke-width:1.0;"/><path d="M148.5,131.3307 C148.5,133.4952 148.5,135.7226 148.5,138.002 C148.5,138.2869 148.5,132.5726 148.5,132.8592 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="449.3517,417.8976,442.927,410.4328,444.832,415.7592,439.5056,417.6643,449.3517,417.8976" style="stroke:#555555;stroke-width:1.0;"/><path d="M373.5344,382.027 C396.8619,393.0637 417.9243,403.0287 443.9281,415.3316 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="478.6336,577.9413,472.4821,570.2498,474.1939,575.6414,468.8023,577.3533,478.6336,577.9413" style="stroke:#555555;stroke-width:1.0;"/><path d="M359.1894,516.0653 C394.2892,534.2482 432.8504,554.2241 473.306,575.1815 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="291.5,737.9413,295.5,728.9413,291.5,732.9413,287.5,728.9413,291.5,737.9413" style="stroke:#555555;stroke-width:1.0;"/><path d="M291.5,676.0653 C291.5,694.2482 291.5,710.984 291.5,731.9413 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[ZLRBRjj65DtpAsxZXLj3ScgdGLB1C13BKbzs4CGficYw69DNqiJ36MOUafKY7z2_wAxLT-Z7UYufox8b5lN68ZdtVSwviqzlsHRiU_HHJHLrFofFbL4sfj8SoaCtXkcOSbMfQsrqd7UDchC_hF2TlWubHsLLZwoZ7xog9bFzcInpmSKtXzbNbLVZKX4iN8gqEfnbuKRRIdbLKi4ZbKmSEXjVgvBfHpPJZZfN6sV2H1LkfksOHie4tlZYNR95ttdBdewEDpwyyjxD-iuuJtlFwxzDAywHnjWm_P4HdJcFwbTdX_KVtaf2L_epqz7px4js4kBSy6dsqF9IMrscyhqkueIEdtqh1v-kJcPHHnphhxj65zAr3_Oam6llwFZq99UGlRqNBrwSNYZANSedZ7xGoDayQcUjWjro4KwUrYTFuHkcS7sVnPE3Wuq8zLmE3jOnZXx4wF_V01_i-ucAr3SguN2kB1MEPZfEj2Kyi8r-JfNJDhP5OlgK-Cv1nPZyI6dFf185XfTYFzd60twAl-M27oNnX5IW_WNjdVNFd_NF7XKzTCatCAJI5MnQYxvqnV8Vs2p_Gaeg8eUcpzir_mGEL4846tieSuw3vRMsIXhLuXmcouNOW2mSg4SH8
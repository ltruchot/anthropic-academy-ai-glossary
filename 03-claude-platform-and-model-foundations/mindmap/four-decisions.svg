<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="786px" preserveAspectRatio="none" style="width:634px;height:786px;background:#FFFFFF;" version="1.1" viewBox="0 0 634 786" width="634px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="134" x="242.5" y="20.7803">The Four Decisions</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="119" x="250" y="33.2402">Les quatre d&#233;cisions</text><!--cluster ORDER--><g id="cluster_ORDER"><rect fill="#F9F8F4" height="623" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="342" x="14" y="157"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="55" x="157.5" y="170.5503">In order</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64" x="153" y="182.4702">Dans l'ordre</text></g><!--entity FD--><g id="elem_FD"><rect fill="#BCD3CB" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="269" x="205.5" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="104" x="215.5" y="72.5503">Four decisions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="83" x="215.5" y="84.4702">Quatre d&#233;cisions</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="249" x="215.5" y="98.5503">At the front of every Claude interaction</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="217" x="215.5" y="110.4702">En amont de chaque interaction avec Claude</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="192" x="215.5" y="124.5503">Before writing a single prompt</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="152" x="215.5" y="136.4702">Avant m&#234;me d'&#233;crire un prompt</text></g><!--entity TD--><g id="elem_TD"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="264" x="364" y="328"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="175" x="374" y="349.5503">Together, they determine</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="136" x="374" y="361.4702">Ensemble, elles d&#233;terminent</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="244" x="374" y="375.5503">The quality ceiling for session outputs</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="239" x="374" y="387.4702">Le plafond de qualit&#233; des r&#233;ponses d'une session</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="241" x="374" y="401.5503">Whether sessions build on prior work</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="180" x="374" y="416.5503">or require constant re-setup</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="239" x="374" y="428.4702">Si les sessions s'appuient sur le travail pr&#233;c&#233;dent</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="238" x="374" y="439.4702">ou obligent &#224; tout remettre en place &#224; chaque fois</text></g><!--entity EP--><g id="elem_EP"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="274" x="40" y="194"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="86" x="50" y="215.5503">1. Entry point</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="78" x="50" y="227.4702">1. Point d'entr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="254" x="50" y="241.5503">Entry points determine where you work</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="240" x="50" y="253.4702">Les points d'entr&#233;e d&#233;terminent o&#249; vous travaillez</text><text fill="#000000" font-family="Helvetica" font-size="15" font-style="italic" lengthAdjust="spacing" textLength="152" x="50" y="267.5503">Map: Core Entry Points</text><text fill="#777777" font-family="Helvetica" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="135" x="50" y="279.4702">Sch&#233;ma des points d'entr&#233;e</text></g><!--entity CL--><g id="elem_CL"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="307" x="27.5" y="328"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="116" x="37.5" y="349.5503">2. Capability layer</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137" x="37.5" y="361.4702">2. Couche de fonctionnalit&#233;s</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="287" x="37.5" y="375.5503">The capability layer determines what Claude</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="185" x="37.5" y="390.5503">can do within that entry point</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="262" x="37.5" y="402.4702">La couche de fonctionnalit&#233;s d&#233;termine ce que Claude</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="181" x="37.5" y="413.4702">peut faire au sein de ce point d'entr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" font-style="italic" lengthAdjust="spacing" textLength="141" x="37.5" y="427.5503">Map: Capability Layer</text><text fill="#777777" font-family="Helvetica" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="192" x="37.5" y="439.4702">Sch&#233;ma de la couche de fonctionnalit&#233;s</text></g><!--entity MO--><g id="elem_MO"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="325" x="22.5" y="488"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="55" x="32.5" y="509.5503">3. Model</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="47" x="32.5" y="521.4702">3. Mod&#232;le</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="305" x="32.5" y="535.5503">The model determines how well Claude does it,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="166" x="32.5" y="550.5503">and at what cost in speed</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="248" x="32.5" y="562.4702">Le mod&#232;le d&#233;termine la qualit&#233; du travail de Claude,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="140" x="32.5" y="573.4702">et ce qu'elle co&#251;te en vitesse</text><text fill="#000000" font-family="Helvetica" font-size="15" font-style="italic" lengthAdjust="spacing" textLength="149" x="32.5" y="587.5503">Map: Choosing Models</text><text fill="#777777" font-family="Helvetica" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="165" x="32.5" y="599.4702">Sch&#233;ma des gammes de mod&#232;les</text></g><!--entity CM--><g id="elem_CM"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="315" x="27.5" y="648"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="155" x="37.5" y="669.5503">4. Context management</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110" x="37.5" y="681.4702">4. Gestion du contexte</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="215" x="37.5" y="695.5503">Context management determines</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="157" x="37.5" y="710.5503">how long it can do it well</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="295" x="37.5" y="722.4702">La gestion du contexte d&#233;termine pendant combien de temps</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="143" x="37.5" y="733.4702">il peut continuer &#224; bien le faire</text><text fill="#000000" font-family="Helvetica" font-size="15" font-style="italic" lengthAdjust="spacing" textLength="175" x="37.5" y="747.5503">Map: Context Management</text><text fill="#777777" font-family="Helvetica" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="164" x="37.5" y="759.4702">Sch&#233;ma de la gestion du contexte</text></g><polygon fill="#555555" points="340,156.7696,344,147.7696,340,151.7696,336,147.7696,340,156.7696" style="stroke:#555555;stroke-width:1.0;"/><path d="M340,149.1298 C340,150.9548 340,152.802 340,154.6659 C340,155.1319 340,155.5989 340,156.0669 C340,156.3009 340,150.5351 340,150.7696 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="430.0893,327.7368,426.2204,318.6797,426.427,324.3328,420.7739,324.5393,430.0893,327.7368" style="stroke:#555555;stroke-width:1.0;"/><path d="M356.233,259.0883 C356.3
<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="801px" preserveAspectRatio="none" style="width:1037px;height:801px;background:#FFFFFF;" version="1.1" viewBox="0 0 1037 801" width="1037px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="120" x="455" y="20.7803">Core Entry Points</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="109" x="460.5" y="33.2402">Les points d'entr&#233;e</text><!--cluster FOUR--><g id="cluster_FOUR"><rect fill="#F9F8F4" height="530" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="324" x="103" y="131"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="121" x="204.5" y="144.5503">Four entry points</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119" x="205.5" y="156.4702">Quatre points d'entr&#233;e</text></g><!--cluster HOLDS--><g id="cluster_HOLDS"><rect fill="#F9F8F4" height="383" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="300" x="731" y="412"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="108" x="827" y="425.5503">A Project holds</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="96" x="833" y="437.4702">Un projet contient</text></g><!--entity EP--><g id="elem_EP"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="6" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="86" x="16" y="72.5503">Entry points</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72" x="16" y="84.4702">Points d'entr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="184" x="16" y="98.5503">Choose before starting work</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="140" x="16" y="110.4702">Choisir avant de commencer</text></g><!--entity WB--><g id="elem_WB"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="286" x="435" y="410"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="113" x="445" y="431.5503">Worth building?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="445" y="443.4702">Le projet vaut-il la peine ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="266" x="445" y="457.5503">Two of three: task recurs, stable context,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="112" x="445" y="472.5503">consistent format</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="162" x="445" y="484.4702">Deux sur trois : t&#226;che r&#233;currente,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="156" x="445" y="495.4702">contexte stable, format constant</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="227" x="445" y="509.5503">Setup recovered in 2 or 3 sessions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="201" x="445" y="521.4702">Mise en place amortie en 2 ou 3 sessions</text></g><!--entity CH--><g id="elem_CH"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="169" y="168"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="31" x="179" y="189.5503">Chat</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="23" x="179" y="201.4702">Chat</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="196" x="179" y="215.5503">One-off question or quick task</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="174" x="179" y="227.4702">Question ponctuelle ou t&#226;che rapide</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="196" x="179" y="241.5503">Web search: a per-chat toggle</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="195" x="179" y="253.4702">Recherche web : &#224; activer chat par chat</text></g><!--entity PR--><g id="elem_PR"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="169" y="302"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="54" x="179" y="323.5503">Projects</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="34" x="179" y="335.4702">Projets</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="179" y="349.5503">Recurring work, stable context</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="177" x="179" y="361.4702">T&#226;ches r&#233;currentes, contexte stable</text></g><!--entity AR--><g id="elem_AR"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="289" x="123.5" y="436"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="54" x="133.5" y="457.5503">Artifacts</text><text 
<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="764px" preserveAspectRatio="none" style="width:1035px;height:764px;background:#FFFFFF;" version="1.1" viewBox="0 0 1035 764" width="1035px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="120" x="454" y="20.7803">Core Entry Points</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="109" x="459.5" y="33.2402">Les points d'entr&#233;e</text><!--cluster FOUR--><g id="cluster_FOUR"><rect fill="#F9F8F4" height="498.5" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="324" x="103" y="131"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="121" x="204.5" y="144.5503">Four entry points</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119" x="205.5" y="156.4702">Quatre points d'entr&#233;e</text></g><!--cluster HOLDS--><g id="cluster_HOLDS"><rect fill="#F9F8F4" height="372" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="300" x="435" y="386"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="108" x="531" y="399.5503">A Project holds</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="96" x="537" y="411.4702">Un projet contient</text></g><!--entity EP--><g id="elem_EP"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="6" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="86" x="16" y="72.5503">Entry points</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="72" x="16" y="84.4702">Points d'entr&#233;e</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="184" x="16" y="98.5503">Choose before starting work</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="140" x="16" y="110.4702">Choisir avant de commencer</text></g><!--entity WB--><g id="elem_WB"><rect fill="#E8E2D0" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="286" x="743" y="518"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="113" x="753" y="539.5503">Worth building?</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="123" x="753" y="551.4702">Le projet vaut-il la peine ?</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="266" x="753" y="565.5503">Two of three: task recurs, stable context,</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="112" x="753" y="580.5503">consistent format</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="162" x="753" y="592.4702">Deux sur trois : t&#226;che r&#233;currente,</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="156" x="753" y="603.4702">contexte stable, format constant</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="227" x="753" y="617.5503">Setup recovered in 2 or 3 sessions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="201" x="753" y="629.4702">Mise en place amortie en 2 ou 3 sessions</text></g><!--entity CH--><g id="elem_CH"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="163" y="168"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="31" x="173" y="189.5503">Chat</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="23" x="173" y="201.4702">Chat</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="196" x="173" y="215.5503">One-off question or quick task</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="174" x="173" y="227.4702">Question ponctuelle ou t&#226;che rapide</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="196" x="173" y="241.5503">Web search: a per-chat toggle</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="195" x="173" y="253.4702">Recherche web : &#224; activer chat par chat</text></g><!--entity PR--><g id="elem_PR"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="163" y="302"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="54" x="173" y="323.5503">Projects</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="34" x="173" y="335.4702">Projets</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="173" y="349.5503">Recurring work, stable context</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="177" x="173" y="361.4702">T&#226;ches r&#233;currentes, contexte stable</text></g><!--entity AR--><g id="elem_AR"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="289" x="124.5" y="410"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="54" x="134.5" y="431.5503">Artifacts</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="44" x="134.5" y="443.4702">Artefacts</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="269" x="134.5" y="457.5503">A deliverable, in a separate editable block</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="219" x="134.5" y="469.4702">Un livrable, dans un bloc distinct et modifiable</text></g><!--entity RE--><g id="elem_RE"><rect fill="#CFCBDD" height="83" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="308" x="111" y="538.5"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="64" x="121" y="560.0503">Research</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="48" x="121" y="571.9702">Research</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="288" x="121" y="586.0503">Deep multi-source investigation or synthesis</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="184" x="121" y="597.9702">Investigation ou synth&#232;se approfondie</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="137" x="121" y="608.9702">&#224; partir de multiples sources</text></g><!--entity SI--><g id="elem_SI"><rect fill="#E8E2D0" height="46" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="443" y="423"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="136" x="453" y="444.5503">Standing instructions</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="102" x="453" y="456.4702">Instructions de projet</text></g><!--entity KB--><g id="elem_KB"><rect fill="#E8E2D0" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="443" y="544"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="108" x="453" y="565.5503">Knowledge base</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="117" x="453" y="577.4702">Base de connaissances</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="98" x="453" y="591.5503">Uploaded once</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="113" x="453" y="603.4702">Import&#233;e une seule fois</text></g><!--entity CV--><g id="elem_CV"><rect fill="#E8E2D0" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="443" y="678"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="135" x="453" y="699.5503">Conversation history</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="142" x="453" y="711.4702">Historique des conversations</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="215" x="453" y="725.5503">No context shared between them</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="169" x="453" y="737.4702">Aucun contexte partag&#233; entre elles</text></g><polygon fill="#555555" points="131,130.8892,135,121.8892,131,125.8892,127,121.8892,131,130.8892" style="stroke:#555555;stroke-width:1.0;"/><path d="M131,123.3154 C131,125.0266 131,126.7723 131,128.5459 C131,128.9893 131,129.4345 131,129.8813 C131,130.1046 131,130.3284 131,130.5526 C131,130.6647 131,124.7769 131,124.8892 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="701.7376,385.7836,697.2387,377.0223,697.8441,382.6467,692.2197,383.252,701.7376,385.7836" style="stroke:#555555;stroke-width:1.0;"/><path d="M413.1563,346.2265 C470.0109,350.0691 536.753,355.3907 5
<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="779px" preserveAspectRatio="none" style="width:427px;height:779px;background:#FFFFFF;" version="1.1" viewBox="0 0 427 779" width="427px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="145" x="137.5" y="20.7803">How Claude Behaves</text><text fill="#777777" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="161" x="129.5" y="33.2402">Le comportement de Claude</text><!--cluster FIVE--><g id="cluster_FIVE"><rect fill="#F9F8F4" height="642" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:1.0;" width="306" x="115" y="131"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="105" x="215.5" y="144.5503">Five properties</text><text fill="#777777" font-family="Helvetica" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="82" x="227" y="156.4702">Cinq propri&#233;t&#233;s</text></g><!--entity BP--><g id="elem_BP"><rect fill="#BCD3CB" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="6" y="51"/><text fill="#000000" font-family="Helvetica" font-size="15" font-weight="bold" lengthAdjust="spacing" textLength="151" x="16" y="72.5503">Behavioral properties</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="143" x="16" y="84.4702">Propri&#233;t&#233;s comportementales</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="136" x="16" y="98.5503">Whatever the feature</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="149" x="16" y="110.4702">Quelle que soit la fonctionnalit&#233;</text></g><!--entity RV--><g id="elem_RV"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="256" x="157" y="168"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="108" x="167" y="189.5503">Responses vary</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="103" x="167" y="201.4702">Les r&#233;ponses varient</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="207" x="167" y="215.5503">Probability, not a fixed database</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="236" x="167" y="227.4702">Des probabilit&#233;s, pas une base de donn&#233;es fig&#233;e</text></g><!--entity CT--><g id="elem_CT"><rect fill="#CFCBDD" height="98" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="278" x="135" y="276"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="133" x="145" y="297.5503">Confident tone is not</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="131" x="145" y="312.5503">a signal of accuracy</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="116" x="145" y="324.4702">Un ton assur&#233; n'est pas</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="102" x="145" y="335.4702">un signe d'exactitude</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="258" x="145" y="349.5503">Fluency signals nothing about accuracy</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="167" x="145" y="361.4702">La fluidit&#233; ne dit rien de l'exactitude</text></g><!--entity CB--><g id="elem_CB"><rect fill="#CFCBDD" height="72" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="149" y="410"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="126" x="159" y="431.5503">Context is a budget</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="126" x="159" y="443.4702">Le contexte est un budget</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="152" x="159" y="457.5503">A working-memory limit</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="154" x="159" y="469.4702">Une limite de m&#233;moire de travail</text></g><!--entity KB--><g id="elem_KB"><rect fill="#CFCBDD" height="87" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="250" x="149" y="518"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="100" x="159" y="539.5503">Knowledge has</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="124" x="159" y="554.5503">a training boundary</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="185" x="159" y="566.4702">Les connaissances ont une date limite</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="203" x="159" y="580.5503">A cutoff date: connect a source</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="187" x="159" y="592.4702">Une date limite : connecter une source</text></g><!--entity CP--><g id="elem_CP"><rect fill="#CFCBDD" height="124" rx="6" ry="6" style="stroke:#FFFFFF;stroke-width:0.5;" width="276" x="136" y="641"/><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="174" x="146" y="662.5503">Configured procedures still</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="149" x="146" y="677.5503">produce varied outputs</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="191" x="146" y="689.4702">Les proc&#233;dures configur&#233;es produisent</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="172" x="146" y="700.4702">quand m&#234;me des r&#233;ponses vari&#233;es</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="235" x="146" y="714.5503">A Skill reduces variance, not to zero</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="215" x="146" y="726.4702">Un Skill r&#233;duit la variabilit&#233; sans la supprimer</text><text fill="#000000" font-family="Helvetica" font-size="15" lengthAdjust="spacing" textLength="199" x="146" y="740.5503">Review stays in your workflow</text><text fill="#777777" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="256" x="146" y="752.4702">La v&#233;rification reste une &#233;tape de votre flux de travail</text></g><polygon fill="#555555" points="131,130.7433,135,121.7433,131,125.7433,127,121.7433,131,130.7433" style="stroke:#555555;stroke-width:1.0;"/><path d="M131,123.1287 C131,124.5984 131,126.0911 131,127.6023 C131,128.3578 131,129.1179 131,129.8821 C131,130.0731 131,130.2644 131,130.4559 C131,130.5516 131,124.6475 131,124.7433 " fill="none" style="stroke:#555555;stroke-width:1.0;"/><!--SRC=[ZLPBSjj64DtZ51rhmKGbof5ibnAMYbK65COfAIb5Tkn5c4KJQ11Z3sQW-O2YN3uGSmrUB3qWJL4a88SR4eF-lTUlUzY36r8PcG5yn1gX_n4DL1ALywKy3WzzP-ifJAZ0McY3ibyPNP5nWknnnKRmlIt9eS81A0s_6goAMjo38iee- -4u-guoE2qH9CwrTx0sZYBxIQWA3PQGKOvUkf5MxWyi2TwGhCc95BTiR86PdWarXHobfQqtHdkL9TeeCd1oklNYjJ5wbcYf3HoyQZxRNfHo6LD9y3a2YBLX2jQse-R3fw6Wj-AUuEHLz2KwjsukQHWzzlnTA57wyeF8N06dBtuCXi_Nbf4JZitUw1aa4dr640SMoOxLkUMuWvFJuNaQaWuEpixEXbS4gIuhRHoLf1ppilOxVzvO3Jaokt7WXngU7Hx6czR0GsiE3pT9JXubkMOJ8vOBjrpOH-bGajr9D5OV2dHKCxEk8CW9dJVK4VXFJv8BklK4LWl7_OPSgzG9hHHAmVbseZy3j11Vmq6SNBn8uXrK